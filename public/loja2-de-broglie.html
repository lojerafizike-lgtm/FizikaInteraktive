<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kalimi Kuantik – de Broglie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');

:root {
  --bg: #f0f6ff;
  --bg2: #e4eefa;
  --card: #ffffff;
  --border: #ccd8f0;
  --text: #1a2340;
  --text2: #4a5578;
  --text3: #8090b0;
  --blue: #3a80d8;
  --blueL: #ddeeff;
  --green: #3ab870;
  --greenL: #d6f5e6;
  --red: #e05060;
  --redL: #ffe0e4;
  --purple: #7a60d8;
  --purpleL: #ede8ff;
  --yellow: #e8a020;
  --yellowL: #fff3d0;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0; gap: 6px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(60,80,160,0.08);
}

.logo {
  font-family: 'Baloo 2', sans-serif;
  font-size: 0.95rem; font-weight: 800; color: var(--purple);
}

.stats { display: flex; gap: 6px; flex-wrap: wrap; }

.pill {
  display: flex; align-items: center; gap: 4px;
  border-radius: 20px; padding: 3px 9px;
  font-size: 0.78rem; font-weight: 800;
  white-space: nowrap; border: 1.5px solid;
}
.pill.lives { border-color:#ffb0bb; background:#fff0f2; color:#c03040; }
.pill.ek    { border-color:#b0d0f8; background:#e8f2ff; color:#204080; }
.pill.wl    { border-color:#b0d8b8; background:#e8faf0; color:#205040; }
.pill.sc    { border-color:#e8c080; background:#fff8e8; color:#805010; }

.main {
  display: flex; flex: 1; overflow: hidden; min-height: 0;
}

canvas {
  flex: 1; min-width: 0; touch-action: none; display: block;
  background: var(--bg);
}

.side {
  width: 176px; background: var(--card);
  border-left: 2px solid var(--border);
  overflow-y: auto; flex-shrink: 0;
  display: flex; flex-direction: column;
}
@media(max-width:600px){ .side { display:none; } }

.sec {
  padding: 10px 11px;
  border-bottom: 1.5px solid var(--border);
}

.sec-title {
  font-size: 0.62rem; font-weight: 800;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 7px;
}

.formula {
  background: var(--purpleL); border: 1.5px solid #c0b0e8;
  border-radius: 9px; padding: 8px 10px;
  font-size: 0.72rem; line-height: 2;
  color: var(--purple); font-weight: 700;
}
.formula .big { font-size: 1rem; font-weight: 900; display: block; margin-bottom: 2px; }

.barrier-info {
  display: flex; flex-direction: column; gap: 5px;
}
.bi-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 5px 7px;
  border-radius: 8px; font-size: 0.7rem; font-weight: 700;
  background: var(--bg2); border: 1.5px solid var(--border);
  color: var(--text2);
}
.bi-row.open  { background: var(--greenL); border-color: #90d8a0; color: #1a6040; }
.bi-row.match { background: var(--blueL);  border-color: #90b8e8; color: #204080; }
.bi-val { font-weight: 900; }

.hint { font-size: 0.68rem; color: var(--text3); line-height: 2; font-weight: 600; }
.hk { color: var(--blue); font-weight: 800; }

/* wave visualizer */
.wvis-wrap {
  background: var(--purpleL); border: 1.5px solid #c0b0e8;
  border-radius: 8px; overflow: hidden; height: 44px;
}

/* Mobile controls */
.mob-bar { display: none; }
@media(max-width:600px){
  .mob-bar {
    display: flex; flex-direction: column;
    background: var(--card); border-top: 2px solid var(--border);
    flex-shrink: 0;
  }
  .mob-btns {
    display: flex;
  }
  .mob-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 6px; font-size: 1.4rem;
    border-right: 1.5px solid var(--border);
    cursor: pointer; background: var(--bg2);
    transition: background 0.1s; -webkit-user-select: none;
  }
  .mob-btn:last-child { border-right: none; }
  .mob-btn:active { background: var(--blueL); }
  .mob-label { font-size: 0.6rem; font-weight: 800; color: var(--text3); margin-top: 2px; }
  .mob-info {
    padding: 5px 12px; font-size: 0.7rem; font-weight: 700;
    color: var(--text3); text-align: center;
    border-top: 1px solid var(--border); background: var(--bg);
  }
}

/* Overlay / Quiz */
.ov {
  position: fixed; inset: 0;
  background: rgba(240,246,255,0.93);
  display: none; align-items: center; justify-content: center;
  z-index: 200; backdrop-filter: blur(8px); padding: 14px;
}
.ov.on { display: flex; }

.qbox {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 20px; padding: 22px 20px;
  max-width: 460px; width: 100%;
  box-shadow: 0 8px 32px rgba(60,80,160,0.13);
}
.qtag {
  display: inline-block; background: var(--purpleL); color: var(--purple);
  border-radius: 20px; padding: 3px 11px;
  font-size: 0.68rem; font-weight: 800; margin-bottom: 10px; letter-spacing: 1px;
}
.qq { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.6; margin-bottom: 12px; white-space: pre-line; }
.qopts { display: flex; flex-direction: column; gap: 6px; }
.qopt {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 13px; background: var(--bg2);
  border: 2px solid var(--border); border-radius: 11px;
  cursor: pointer; font-family: 'Nunito', sans-serif;
  font-size: 0.84rem; font-weight: 700; color: var(--text);
  transition: all 0.13s; text-align: left;
}
.qopt:hover { border-color: var(--purple); background: var(--purpleL); }
.qopt.ok  { border-color: var(--green); background: var(--greenL); color: #1a6040; }
.qopt.bad { border-color: var(--red);   background: var(--redL);   color: #801020; }
.qk {
  background: var(--purpleL); color: var(--purple);
  border-radius: 5px; padding: 1px 6px;
  font-size: 0.68rem; font-weight: 800; flex-shrink: 0;
}
.qfb {
  margin-top: 10px; padding: 9px 12px; border-radius: 10px;
  font-size: 0.8rem; font-weight: 700; line-height: 1.5; display: none;
}
.qfb.on  { display: block; }
.qfb.ok  { background: var(--greenL); color: #1a6040; border: 1.5px solid #7ad8a8; }
.qfb.bad { background: var(--redL);   color: #801020; border: 1.5px solid #f0a0a8; }
.qcont {
  margin-top: 10px; padding: 9px 22px;
  background: var(--purple); border: none;
  border-radius: 11px; color: white;
  font-family: 'Baloo 2', sans-serif; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; display: none; transition: opacity 0.2s;
}
.qcont.on { display: block; }
.qcont:hover { opacity: 0.85; }

/* End screen */
.end {
  position: fixed; inset: 0;
  background: rgba(240,246,255,0.97);
  display: none; align-items: center; justify-content: center;
  z-index: 300; flex-direction: column; gap: 13px;
  padding: 20px; text-align: center;
}
.end.on { display: flex; }
.end-em { font-size: 3.5rem; }
.end-title { font-family: 'Baloo 2', sans-serif; font-size: 1.8rem; font-weight: 800; }
.end-title.win  { color: var(--green); }
.end-title.lose { color: var(--red); }
.end-sub { font-size: 0.95rem; color: var(--text2); font-weight: 600; max-width: 380px; line-height: 1.6; }
.rbtn {
  padding: 11px 30px; background: var(--purple); border: none;
  border-radius: 13px; color: white;
  font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 14px rgba(122,96,216,0.3);
  transition: transform 0.15s;
}
.rbtn:hover { transform: scale(1.04); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⚛ Kalimi Kuantik</div>
  <div class="stats">
    <div class="pill lives">❤️ <span id="LV">3</span></div>
    <div class="pill ek">Ek = <span id="EK">1.0</span> eV</div>
    <div class="pill wl">λ = <span id="WL">---</span> nm</div>
    <div class="pill sc">⭐ <span id="SC">0</span></div>
  </div>
</div>

<div class="main">
  <canvas id="c"></canvas>

  <div class="side">
    <div class="sec">
      <div class="sec-title">Formula</div>
      <div class="formula">
        <span class="big">λ = h / √(2mEk)</span>
        h = 6.63×10⁻³⁴ J·s<br>
        m = 9.1×10⁻³¹ kg<br>
        Ek në Joule = Ek(eV)×1.6×10⁻¹⁹
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Barrierat</div>
      <div class="barrier-info" id="BINFO"></div>
    </div>

    <div class="sec">
      <div class="sec-title">Vala Jote</div>
      <div class="wvis-wrap">
        <canvas id="wv" width="152" height="42"></canvas>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Kontrollet</div>
      <div class="hint">
        <span class="hk">← →</span> Lëviz<br>
        <span class="hk">↑ / Z</span> Kërce<br>
        <span class="hk">A–D</span> Kuizi<br>
        <span class="hk">R</span> Rifillo
      </div>
    </div>
  </div>
</div>

<!-- Mobile controls -->
<div class="mob-bar">
  <div class="mob-btns">
    <div class="mob-btn" id="ML" ontouchstart="keys['ArrowLeft']=true" ontouchend="keys['ArrowLeft']=false">
      ◀<div class="mob-label">Majtas</div>
    </div>
    <div class="mob-btn" id="MJ" ontouchstart="doJump()" ontouchend="">
      ⬆<div class="mob-label">Kërce</div>
    </div>
    <div class="mob-btn" id="MR" ontouchstart="keys['ArrowRight']=true" ontouchend="keys['ArrowRight']=false">
      ▶<div class="mob-label">Djathtas</div>
    </div>
  </div>
  <div class="mob-info">λ = <span id="MWL">---</span> nm &nbsp;|&nbsp; Ek = <span id="MEK">1.0</span> eV</div>
</div>

<!-- Quiz -->
<div class="ov" id="QZ">
  <div class="qbox">
    <div class="qtag">⚛ Sfidë de Broglie</div>
    <div class="qq" id="QQ"></div>
    <div class="qopts" id="QOPTS"></div>
    <div class="qfb" id="QFB"></div>
    <button class="qcont" id="QCONT" onclick="closeQ()">▶ Vazhdo lojën</button>
  </div>
</div>

<!-- End -->
<div class="end" id="END">
  <div class="end-em" id="EE"></div>
  <div class="end-title" id="ET"></div>
  <div class="end-sub" id="ES"></div>
  <button class="rbtn" onclick="restart()">↻ Rifillo</button>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const wvc = document.getElementById('wv');
const wvx = wvc.getContext('2d');

const h_P = 6.63e-34, m_e = 9.1e-31, eV_J = 1.6e-19;

function wlNm(ekEv){
  const ek = ekEv * eV_J;
  return (h_P / Math.sqrt(2 * m_e * ek) * 1e9).toFixed(2);
}

const QUIZZES = [
  {
    q: 'Elektroni ka Ek = 2 eV.\nGjej gjatësinë e valës de Broglie.\n(h=6.63×10⁻³⁴, m=9.1×10⁻³¹)',
    opts: ['0.65 nm', '0.75 nm', '0.87 nm', '0.95 nm'],
    ans: 2, exp: 'λ = h/√(2mEk) = 6.63×10⁻³⁴/√(2×9.1×10⁻³¹×3.2×10⁻¹⁹) ≈ 0.87 nm ✓',
    newEk: 2
  },
  {
    q: 'Masa më e madhe → gjatësia e valës...',
    opts: ['Më e madhe', 'Më e vogël', 'Nuk ndryshon', 'Dyfishohet'],
    ans: 1, exp: 'λ = h/mv — masa ↑ → impulsi mv ↑ → λ ↓ (më e vogël) ✓',
    newEk: 4
  },
  {
    q: 'Elektroni ka λ = 0.87 nm.\nSa është Ek?\n(Ek = h²/(2mλ²))',
    opts: ['1 eV', '2 eV', '3 eV', '4 eV'],
    ans: 1, exp: 'Ek = h²/(2mλ²) ≈ 2 eV ✓',
    newEk: 6
  },
];

// State
let playerEk = 1;
let lives = 3, score = 0;
let qIdx = 0, qOpen = false;
let running = true, frame = 0;
let keys = {};
let player = { x: 0, y: 0, vx: 0, vy: 0, w: 22, h: 22, onGround: false };
let platforms = [], barriers = [], stars = [], parts = [], floats = [], goal = null;
let activeBarrier = null;

function resize(){
  cv.width = cv.offsetWidth;
  cv.height = cv.offsetHeight;
  buildLevel();
}

function buildLevel(){
  const W = cv.width, H = cv.height;
  stars = Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2,b:Math.random()}));

  platforms = [
    {x:0,      y:H-28, w:W,    h:28},
    {x:W*.05,  y:H*.68,w:W*.18,h:14},
    {x:W*.28,  y:H*.5, w:W*.16,h:14},
    {x:W*.52,  y:H*.62,w:W*.14,h:14},
    {x:W*.7,   y:H*.44,w:W*.16,h:14},
    {x:W*.55,  y:H*.28,w:W*.18,h:14},
    {x:W*.78,  y:H*.2, w:W*.18,h:14},
  ];

  // Each barrier needs a λ range (nm); player must match by solving quiz
  barriers = [
    {x:W*.27, y:H*.5-90, w:14, h:90+28, reqMin:0.82, reqMax:0.95, open:false, quizIdx:0, col:'#9060d8'},
    {x:W*.52, y:H*.28-120,w:14, h:120, reqMin:0.56, reqMax:0.72, open:false, quizIdx:1, col:'#3a9ad8'},
    {x:W*.76, y:H*.2-100, w:14, h:100, reqMin:0.38, reqMax:0.52, open:false, quizIdx:2, col:'#e05060'},
  ];

  goal = {x:W*.82, y:H*.2-52, w:38, h:52};

  player.x = W*.04 + player.w/2;
  player.y = H - 28 - player.h;
  player.vx = 0; player.vy = 0;

  updateBarrierUI();
}

function updateBarrierUI(){
  const el = document.getElementById('BINFO');
  const wl = parseFloat(wlNm(playerEk));
  el.innerHTML = barriers.map((b,i)=>{
    let cls = 'bi-row';
    if(b.open) cls += ' open';
    else if(wl>=b.reqMin && wl<=b.reqMax) cls += ' match';
    return `<div class="${cls}">
      <span>Barriera ${i+1}</span>
      <span class="bi-val">${b.open?'✅ Hapur':`${b.reqMin}–${b.reqMax} nm`}</span>
    </div>`;
  }).join('');
}

function doJump(){
  if(player.onGround){ player.vy=-10.5; player.onGround=false; }
}

function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:45+Math.random()*20,r:3+Math.random()*3});
  }
}
function addFloat(x,y,t,c){ floats.push({x,y,t,c,life:80}); }

function updateHUD(){
  const wl = wlNm(playerEk);
  document.getElementById('LV').textContent = lives;
  document.getElementById('EK').textContent = playerEk.toFixed(1);
  document.getElementById('WL').textContent = wl;
  document.getElementById('SC').textContent = score;
  document.getElementById('MWL').textContent = wl;
  document.getElementById('MEK').textContent = playerEk.toFixed(1);
  updateBarrierUI();
}

// Quiz
function openQ(bIdx){
  const qi = barriers[bIdx].quizIdx;
  if(qi >= QUIZZES.length || qOpen) return;
  qOpen = true;
  activeBarrier = bIdx;
  const qz = QUIZZES[qi];
  document.getElementById('QQ').textContent = qz.q;
  const el = document.getElementById('QOPTS'); el.innerHTML='';
  qz.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='qopt';
    b.innerHTML=`<span class="qk">${'ABCD'[i]}</span>${o}`;
    b.onclick=()=>ansQ(qi,i);
    el.appendChild(b);
  });
  document.getElementById('QFB').className='qfb';
  document.getElementById('QCONT').className='qcont';
  document.getElementById('QZ').classList.add('on');
}

function ansQ(qi,i){
  const qz=QUIZZES[qi];
  document.querySelectorAll('.qopt').forEach((b,j)=>{
    if(j===qz.ans) b.classList.add('ok');
    else if(j===i&&i!==qz.ans) b.classList.add('bad');
  });
  const fb=document.getElementById('QFB');
  if(i===qz.ans){
    fb.className='qfb on ok'; fb.textContent='✓ Saktë! '+qz.exp;
    playerEk=qz.newEk;
    if(activeBarrier!==null) barriers[activeBarrier].open=true;
    score+=200;
    burst(player.x,player.y,'#3ab870',20);
    addFloat(player.x,player.y-40,'λ ndryshoi! ⚛','#7a60d8');
  } else {
    fb.className='qfb on bad'; fb.textContent='✗ Gabim. '+qz.exp;
  }
  document.getElementById('QCONT').className='qcont on';
  updateHUD();
}

function closeQ(){
  document.getElementById('QZ').classList.remove('on');
  qOpen=false; activeBarrier=null;
}

function endGame(win){
  running=false;
  document.getElementById('EE').textContent=win?'🎉':'💀';
  const t=document.getElementById('ET');
  t.className='end-title '+(win?'win':'lose');
  t.textContent=win?'Kalove!':'Game Over!';
  document.getElementById('ES').textContent=win
    ?`Elektroni kaloi të gjitha barrierat!\nλ finale = ${wlNm(playerEk)} nm\nPikë: ${score}`
    :`Elektroni humbi të gjitha jetët.\nPikë: ${score}`;
  document.getElementById('END').classList.add('on');
}

function restart(){
  lives=3;score=0;qIdx=0;qOpen=false;running=true;frame=0;playerEk=1;
  parts=[];floats=[];activeBarrier=null;
  buildLevel(); updateHUD();
  document.getElementById('END').classList.remove('on');
  document.getElementById('QZ').classList.remove('on');
}

function update(){
  if(!running||qOpen) return;
  frame++;

  const spd=3.2;
  if(keys['ArrowLeft']||keys['a']) player.vx=-spd;
  else if(keys['ArrowRight']||keys['d']) player.vx=spd;
  else player.vx*=0.75;

  if((keys['ArrowUp']||keys['z']||keys[' '])&&player.onGround) doJump();

  player.vy=Math.min(player.vy+0.48, 14);
  player.x+=player.vx;
  player.y+=player.vy;
  player.x=Math.max(player.w/2,Math.min(cv.width-player.w/2,player.x));
  player.onGround=false;

  // Platform collisions
  platforms.forEach(p=>{
    if(player.x>p.x&&player.x<p.x+p.w&&
       player.y+player.h/2>p.y&&player.y+player.h/2<p.y+18&&player.vy>=0){
      player.y=p.y-player.h/2;
      player.vy=0; player.onGround=true;
    }
  });

  // Barrier collisions
  const wl=parseFloat(wlNm(playerEk));
  barriers.forEach((b,bi)=>{
    if(b.open) return;
    const px=player.x-player.w/2, py=player.y-player.h/2;
    if(px<b.x+b.w&&px+player.w>b.x&&py<b.y+b.h&&py+player.h>b.y){
      if(wl>=b.reqMin&&wl<=b.reqMax){
        b.open=true; score+=100;
        burst(b.x+b.w/2,b.y+b.h/2,'#3ab870',25);
        addFloat(b.x,b.y-20,'Kaloi! ⚛','#3ab870');
        updateHUD();
      } else {
        // push back
        player.x-=player.vx*2; player.vx=0;
        openQ(bi);
      }
    }
  });

  // Fell off
  if(player.y>cv.height+60){
    lives--;
    burst(player.x,cv.height/2,'#e05060',18);
    if(lives<=0){ endGame(false); return; }
    player.x=cv.width*.04+player.w/2;
    player.y=cv.height-28-player.h;
    player.vx=0; player.vy=0;
    addFloat(cv.width/2,cv.height/2,'-1 jetë ❤️','#e05060');
    updateHUD();
  }

  // Goal
  if(goal){
    const gx=goal.x,gy=goal.y;
    if(player.x>gx&&player.x<gx+goal.w&&player.y>gy&&player.y<gy+goal.h) endGame(true);
  }

  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life--;});
  parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>{f.y-=0.5;f.life--;});
  floats=floats.filter(f=>f.life>0);
}

function drawWaveVis(){
  wvx.clearRect(0,0,wvc.width,wvc.height);
  const wl=parseFloat(wlNm(playerEk));
  const freq=1/Math.max(0.3,wl*0.2);
  wvx.strokeStyle=`hsl(${260-wl*100},70%,55%)`;
  wvx.lineWidth=2;
  wvx.beginPath();
  for(let x=0;x<wvc.width;x++){
    const y=wvc.height/2+Math.sin(x*freq*0.4+frame*0.08)*14;
    x===0?wvx.moveTo(x,y):wvx.lineTo(x,y);
  }
  wvx.stroke();
}

function draw(){
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);

  // Pastel sky gradient
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#eef3ff'); bg.addColorStop(1,'#f8f4ff');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Soft stars
  stars.forEach(s=>{
    const b=0.3+0.4*Math.sin(frame*.02+s.b*8);
    ctx.fillStyle=`rgba(140,150,200,${b*.5})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // Dot grid
  ctx.fillStyle='rgba(130,150,210,0.13)';
  for(let x=0;x<W;x+=38)for(let y=0;y<H;y+=38){
    ctx.beginPath();ctx.arc(x,y,1.3,0,Math.PI*2);ctx.fill();
  }

  drawPlatforms();
  drawBarriers();
  drawGoal();
  drawPlayer();
  drawParts();
  drawFloats();

  // Info overlay
  ctx.fillStyle='rgba(80,60,150,0.35)';
  ctx.font='bold 10px Nunito'; ctx.textAlign='left';
  ctx.fillText(`λ = ${wlNm(playerEk)} nm`, 8, 16);
  ctx.fillText(`Ek = ${playerEk.toFixed(1)} eV`, 8, 30);

  drawWaveVis();
}

function drawPlatforms(){
  platforms.forEach(p=>{
    // Shadow
    ctx.fillStyle='rgba(100,120,200,0.07)';
    ctx.fillRect(p.x+3,p.y+4,p.w,p.h);
    // Body
    ctx.fillStyle='#d4ddf8';
    ctx.strokeStyle='#9aaddc';
    ctx.lineWidth=1.5;
    rr(ctx,p.x,p.y,p.w,p.h,6);
    ctx.fill(); ctx.stroke();
    // Stripe
    ctx.fillStyle='rgba(154,173,220,0.4)';
    rr(ctx,p.x+4,p.y+3,p.w-8,4,2);
    ctx.fill();
  });
}

function drawBarriers(){
  const wl=parseFloat(wlNm(playerEk));
  barriers.forEach(b=>{
    if(b.open){
      ctx.save();
      ctx.strokeStyle='rgba(58,184,112,0.3)'; ctx.lineWidth=2;
      ctx.setLineDash([5,8]);
      ctx.strokeRect(b.x,b.y,b.w,b.h);
      ctx.setLineDash([]); ctx.restore(); return;
    }
    const match=wl>=b.reqMin&&wl<=b.reqMax;
    const col=match?'#3ab870':b.col;
    const bgc=match?'rgba(58,184,112,0.12)':'rgba(0,0,0,0.06)';

    ctx.save();
    ctx.fillStyle=bgc; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle=col; ctx.lineWidth=2.5;
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    // Wavy pattern
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.globalAlpha=0.4;
    for(let y=b.y;y<b.y+b.h;y+=10){
      ctx.beginPath(); ctx.moveTo(b.x,y); ctx.lineTo(b.x+b.w,y); ctx.stroke();
    }
    ctx.globalAlpha=1;

    // Label
    ctx.save();
    ctx.translate(b.x+b.w/2, b.y-8);
    ctx.fillStyle=col; ctx.font='bold 9px Nunito';
    ctx.textAlign='center';
    ctx.fillText(`${b.reqMin}–`, 0, 0);
    ctx.fillText(`${b.reqMax}nm`, 0, 11);
    ctx.restore();
    ctx.restore();
  });
}

function drawGoal(){
  if(!goal) return;
  const g=goal, p=0.5+0.5*Math.sin(frame*.05);
  ctx.save();
  ctx.shadowColor='#e8a020'; ctx.shadowBlur=18+p*10;
  rr(ctx,g.x,g.y,g.w,g.h,10);
  ctx.fillStyle=`rgba(255,200,80,${0.15+p*.08})`; ctx.fill();
  ctx.strokeStyle='#e8a020'; ctx.lineWidth=2; ctx.stroke();
  ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('⭐',g.x+g.w/2,g.y+g.h/2);
  ctx.restore();
}

function drawPlayer(){
  const px=player.x, py=player.y;
  const wl=parseFloat(wlNm(playerEk));
  const hue=Math.max(200,Math.min(290,290-wl*60));
  const col=`hsl(${hue},75%,55%)`;
  const colL=`hsl(${hue},80%,88%)`;

  ctx.save();
  // Wave aura
  const wr=26+Math.sin(frame*.12)*4;
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.globalAlpha=0.25;
  ctx.beginPath(); ctx.arc(px,py,wr,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;

  // Shadow
  ctx.fillStyle='rgba(100,120,200,0.12)';
  ctx.beginPath(); ctx.ellipse(px,py+player.h/2+4,12,4,0,0,Math.PI*2); ctx.fill();

  // Body
  ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(px,py,player.w/2,0,Math.PI*2);
  ctx.fillStyle=colL; ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();

  // Orbital ring
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.globalAlpha=0.7;
  ctx.beginPath(); ctx.ellipse(px,py,14,5,frame*.04,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;

  // Center
  ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2);
  ctx.fillStyle=col; ctx.fill();
  ctx.restore();
}

function drawParts(){
  parts.forEach(p=>{
    ctx.save(); ctx.globalAlpha=(p.life/65)*.8;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawFloats(){
  floats.forEach(f=>{
    ctx.save(); ctx.globalAlpha=Math.min(1,f.life/80);
    ctx.fillStyle=f.c; ctx.font='bold 13px Nunito';
    ctx.textAlign='center'; ctx.fillText(f.t,f.x,f.y);
    ctx.restore();
  });
}

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r);
  c.closePath();
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='r'||e.key==='R') restart();
  if(qOpen){
    const i='abcdABCD'.indexOf(e.key)%4;
    if(i>=0){
      const opts=document.querySelectorAll('.qopt');
      if(opts[i]&&!opts[0].classList.contains('ok')&&!opts[0].classList.contains('bad')){
        const qi=activeBarrier!==null?barriers[activeBarrier].quizIdx:qIdx;
        ansQ(qi,i);
      }
    }
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

window.addEventListener('resize',resize);
resize(); updateHUD(); loop();
</script>
</body>
