<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --accent: #ffafcc;
    --accent2: #a2d2ff;
    --gold: #ffc8dd;
    --text: #4a4e69;
    --muted: #94a3b8;
    --border: #4a4e69;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 {
    font-family: 'VT323', monospace;
    font-size: 3.5rem;
    color: var(--accent);
    text-shadow: 3px 3px 0px var(--border);
    margin-bottom: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .subtitle { color: var(--text); font-size: 1.1rem; margin-bottom: 24px; font-family: 'VT323', monospace; font-size: 1.5rem; }
  .card {
    background: var(--surface);
    border: 4px solid var(--border);
    border-radius: 0;
    padding: 24px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 8px 8px 0px var(--border);
  }
  .scene {
    background: #e2e8f0;
    border-radius: 0;
    height: 180px;
    position: relative;
    margin-bottom: 16px;
    overflow: hidden;
    border: 4px solid var(--border);
  }
  .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: #a8e6cf;
    border-top: 4px solid var(--border);
  }
  .block {
    position: absolute;
    bottom: 30px;
    width: 60px;
    height: 60px;
    background: var(--accent2);
    border: 4px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: var(--border);
    transition: left 0.1s linear;
    box-shadow: inset -4px -4px 0px rgba(0,0,0,0.1);
  }
  .arrow {
    position: absolute;
    bottom: 55px;
    height: 12px;
    background: var(--accent);
    border: 3px solid var(--border);
    transform-origin: left center;
    transition: width 0.2s;
  }
  .arrow::after {
    content: '';
    position: absolute;
    right: -12px;
    top: -8px;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 10px solid var(--border);
  }
  .arrow::before {
    content: '';
    position: absolute;
    right: -7px;
    top: -5px;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 7px solid var(--accent);
    z-index: 1;
  }
  label { font-size: 1rem; color: var(--text); display: block; margin-bottom: 6px; font-weight: bold; }
  .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 12px;
    border: 2px solid var(--border);
    background: #e2e8f0;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    background: var(--accent);
    border: 3px solid var(--border);
    cursor: pointer;
  }
  .val {
    min-width: 60px;
    text-align: right;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: var(--text);
  }
  .formula-box {
    background: #f8fafc;
    border: 4px solid var(--border);
    padding: 16px;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 16px;
    box-shadow: 4px 4px 0px var(--border);
  }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .result-item {
    background: #f8fafc;
    padding: 12px;
    text-align: center;
    border: 4px solid var(--border);
    box-shadow: 4px 4px 0px var(--border);
  }
  .result-item .rlabel { font-size: 0.85rem; color: var(--text); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
  .result-item .rval {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    color: var(--accent2);
    text-shadow: 1px 1px 0px var(--border);
  }
  .quiz-section { }
  .question {
    font-size: 1.2rem;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.5;
    font-weight: bold;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    background: #ffffff;
    border: 3px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.1s;
    box-shadow: 4px 4px 0px var(--border);
  }
  .opt-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border); }
  .opt-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
  .opt-btn.correct { background: #a8e6cf; }
  .opt-btn.wrong { background: #ffafcc; }
  .feedback {
    margin-top: 14px;
    padding: 12px;
    border: 3px solid var(--border);
    font-size: 1rem;
    font-weight: bold;
    display: none;
    box-shadow: 4px 4px 0px var(--border);
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #a8e6cf; color: var(--text); }
  .feedback.bad { background: #ffafcc; color: var(--text); }
  .next-btn {
    margin-top: 14px;
    background: var(--accent2);
    border: 4px solid var(--border);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    padding: 12px 24px;
    cursor: pointer;
    display: none;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
  }
  .next-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
  .next-btn.show { display: inline-block; }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .score-badge {
    background: #ffffff;
    border: 3px solid var(--border);
    padding: 6px 14px;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: var(--text);
    box-shadow: 3px 3px 0px var(--border);
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: #ffffff;
    border: 3px solid var(--border);
    margin: 0 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-right: 3px solid var(--border);
    transition: width 0.4s;
  }
  .tab-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 24px;
    border: 4px solid var(--border);
    background: #ffffff;
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
  }
  .tab.active {
    background: var(--accent);
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .victory {
    text-align: center;
    padding: 30px;
    display: none;
  }
  .victory.show { display: block; }
  .victory-title {
    font-family: 'VT323', monospace;
    font-size: 3rem;
    color: var(--accent);
    text-shadow: 3px 3px 0px var(--border);
    margin-bottom: 10px;
  }
  .stars { font-size: 3rem; margin: 10px 0; letter-spacing: 10px; }
  .restart-btn {
    margin-top: 16px;
    background: var(--gold);
    border: 4px solid var(--border);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
  }
  .restart-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
</style>
</head>
<body>
<h1><i class="fas fa-bolt"></i> FORCA</h1>
<p class="subtitle">F = m × a &nbsp;|&nbsp; Ligjet e Njutonit</p>

<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim')"><i class="fas fa-microscope"></i> Simulim</button>
  <button class="tab" onclick="switchTab('quiz')"><i class="fas fa-gamepad"></i> Kuiz</button>
</div>

<!-- SIMULATION PANEL -->
<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="scene" id="scene">
      <div class="ground"></div>
      <div class="block" id="block">m</div>
      <div class="arrow" id="arrow" style="left:120px; width:0px;"></div>
      <div style="position:absolute;top:10px;left:12px;font-family:'VT323',monospace;font-size:1.2rem;color:var(--text);background:rgba(255,255,255,0.8);padding:2px 8px;border:2px solid var(--border);">Lëvizja e bllokut sipas F=ma</div>
    </div>
    <div class="formula-box">F = m × a</div>
    <div class="slider-row">
      <label style="min-width:80px">Masa (kg)</label>
      <input type="range" id="massSlider" min="1" max="20" value="5" oninput="updateSim()">
      <span class="val" id="massVal">5 kg</span>
    </div>
    <div class="slider-row">
      <label style="min-width:80px">Forca (N)</label>
      <input type="range" id="forceSlider" min="0" max="100" value="25" oninput="updateSim()">
      <span class="val" id="forceVal">25 N</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">Nxitimi</div><div class="rval" id="accVal">5.0 m/s²</div></div>
      <div class="result-item"><div class="rlabel">Forca Rezultante</div><div class="rval" id="fresVal">25 N</div></div>
    </div>
    <button class="next-btn show" id="animBtn" onclick="toggleAnim()" style="display:inline-block; width:100%;"><i class="fas fa-play"></i> LËVIZ</button>
  </div>
</div>

<!-- QUIZ PANEL -->
<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge"><i class="fas fa-star" style="color:#ffc8dd"></i> <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()" style="width:100%;">PYETJA TJETËR <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-family:'VT323',monospace;font-size:2rem;color:var(--text);margin-bottom:20px;">Pikë: <span id="finalScore" style="color:var(--accent);text-shadow:2px 2px 0px var(--border);"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> RISTART</button>
    </div>
  </div>
</div>

<script>
// ---- SIMULATION ----
let animRunning = false;
let animFrame;
let blockX = 50;
let velocity = 0;
let lastTime = null;

function updateSim() {
  const m = parseFloat(document.getElementById('massSlider').value);
  const F = parseFloat(document.getElementById('forceSlider').value);
  const a = F / m;
  document.getElementById('massVal').textContent = m + ' kg';
  document.getElementById('forceVal').textContent = F + ' N';
  document.getElementById('accVal').textContent = a.toFixed(2) + ' m/s²';
  document.getElementById('fresVal').textContent = F + ' N';
  const arrowW = Math.min(F * 1.5, 200);
  document.getElementById('arrow').style.width = arrowW + 'px';
  document.getElementById('block').textContent = m + 'kg';
}

function toggleAnim() {
  if (animRunning) {
    animRunning = false;
    cancelAnimationFrame(animFrame);
    document.getElementById('animBtn').innerHTML = '<i class="fas fa-play"></i> LËVIZ';
    blockX = 50; velocity = 0; lastTime = null;
    document.getElementById('block').style.left = blockX + 'px';
    document.getElementById('arrow').style.left = (blockX + 70) + 'px';
  } else {
    animRunning = true;
    document.getElementById('animBtn').innerHTML = '<i class="fas fa-stop"></i> NDALO';
    blockX = 50; velocity = 0; lastTime = null;
    animFrame = requestAnimationFrame(animStep);
  }
}

function animStep(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  const m = parseFloat(document.getElementById('massSlider').value);
  const F = parseFloat(document.getElementById('forceSlider').value);
  const a = F / m;
  velocity += a * dt;
  blockX += velocity * dt * 30;
  const scene = document.getElementById('scene');
  const maxX = scene.offsetWidth - 70;
  if (blockX > maxX) { blockX = 50; velocity = 0; }
  document.getElementById('block').style.left = blockX + 'px';
  document.getElementById('arrow').style.left = (blockX + 70) + 'px';
  if (animRunning) animFrame = requestAnimationFrame(animStep);
}

updateSim();

// ---- QUIZ ----
const questions = [
  { q: "Çfarë thotë Ligji i Parë i Njutonit?", opts: ["F=ma", "Nëse Fʀ=0, trupi rri në prehje ose lëviz me L.D.NJ.", "F₁₂ = -F₂₁", "a = F/m"], ans: 1 },
  { q: "Një trup me masë 10 kg ka nxitim 3 m/s². Sa është forca?", opts: ["0.3 N", "13 N", "30 N", "300 N"], ans: 2 },
  { q: "Nëse forca dyfishohet dhe masa mbetet e njëjtë, nxitimi:", opts: ["Mbetet i njëjtë", "Përgjysmohet", "Dyfishohet", "Katërshohet"], ans: 2 },
  { q: "Çfarë thotë Ligji i Tretë i Njutonit?", opts: ["F=ma", "Nxitimi varet nga forca", "Çdo forcë ka forcë të kundërt të barabartë", "Masa ruan inercë"], ans: 2 },
  { q: "Njësia SI e forcës është:", opts: ["kg", "m/s²", "Pa", "N (Newton)"], ans: 3 },
  { q: "Nëse masa trefishohet dhe forca mbetet e njëjtë, nxitimi:", opts: ["Trefishohet", "Mbetet i njëjtë", "Zvogëlohet 3 herë", "Bëhet zero"], ans: 2 },
  { q: "1 Newton është i barabartë me:", opts: ["1 kg/s", "1 kg·m/s²", "1 kg·m/s", "1 J/m²"], ans: 1 }
];

let qi = 0, score = 0;

function loadQ() {
  const q = questions[qi];
  document.getElementById('question').textContent = (qi+1) + '. ' + q.q;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
  document.getElementById('qnum').textContent = qi + 1;
  document.getElementById('progress').style.width = (qi/questions.length*100) + '%';
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = String.fromCharCode(65+i) + '. ' + o;
    btn.onclick = () => checkAns(i, btn);
    opts.appendChild(btn);
  });
}

function checkAns(i, btn) {
  const q = questions[qi];
  document.querySelectorAll('.opt-btn').forEach(b => b.onclick = null);
  const fb = document.getElementById('feedback');
  if (i === q.ans) {
    btn.className = 'opt-btn correct';
    score++;
    document.getElementById('score').textContent = score;
    fb.className = 'feedback ok show';
    fb.innerHTML = '<i class="fas fa-check-circle"></i> Saktë! Bravo!';
  } else {
    btn.className = 'opt-btn wrong';
    document.querySelectorAll('.opt-btn')[q.ans].className = 'opt-btn correct';
    fb.className = 'feedback bad show';
    fb.innerHTML = '<i class="fas fa-times-circle"></i> Jo! Përgjigja e saktë: ' + String.fromCharCode(65+q.ans) + '. ' + q.opts[q.ans];
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQ() {
  qi++;
  if (qi >= questions.length) {
    document.getElementById('quiz-content').style.display = 'none';
    const v = document.getElementById('victory');
    v.className = 'victory show';
    document.getElementById('finalScore').textContent = score;
    const pct = score / questions.length;
    document.getElementById('stars').textContent = pct >= 0.85 ? '⭐⭐⭐' : pct >= 0.6 ? '⭐⭐' : '⭐';
  } else { loadQ(); }
}

function restartQuiz() {
  qi = 0; score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('victory').className = 'victory';
  document.getElementById('quiz-content').style.display = 'block';
  loadQ();
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + t).classList.add('active');
}

loadQ();
</script>
</body>
</html>
