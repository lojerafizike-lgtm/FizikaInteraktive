<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Field Master</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 3.5rem;
            color: var(--accent);
            text-shadow: 3px 3px 0px var(--border);
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #game-container {
            position: relative;
            margin-top: 20px;
            border: 4px solid var(--border);
            background: var(--surface);
            box-shadow: 8px 8px 0px var(--border);
            padding: 10px;
        }

        canvas { 
            display: block; 
            cursor: crosshair; 
            background: #e2e8f0;
            border: 4px solid var(--border);
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
        }

        .ui-panel {
            background: var(--surface);
            padding: 15px 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0px var(--border);
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: 4px solid var(--border);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-pos { background: var(--red); color: var(--border); }
        .btn-neg { background: var(--accent2); color: var(--border); }
        .btn-start { background: var(--green); color: var(--border); }
        .btn-reset { background: var(--muted); color: var(--border); }
        
        .btn:active { 
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }

        .stats { 
            font-family: 'VT323', monospace;
            font-size: 2rem; 
            color: var(--accent); 
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--surface);
            padding: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--text);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-atom"></i> Electric Field Master</h1>

    <div class="ui-panel">
        <div class="stats">Niveli: <span id="lvl">1</span></div>
        <button class="btn btn-pos" onclick="setMode('pos')"><i class="fas fa-plus-circle"></i> Shto Pozitive</button>
        <button class="btn btn-neg" onclick="setMode('neg')"><i class="fas fa-minus-circle"></i> Shto Negative</button>
        <button class="btn btn-start" onclick="startSim()"><i class="fas fa-play"></i> Lësho Protonin!</button>
        <button class="btn btn-reset" onclick="resetLevel()"><i class="fas fa-undo"></i> Reset</button>
    </div>

    <div id="game-container">
        <div id="instructions">Klikoni në fushë për të vendosur ngarkesat.<br>Drejtoni protonin te rrethi i gjelbër!</div>
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 500;

    let level = 1;
    let mode = 'pos';
    let charges = [];
    let particle = { x: 50, y: 250, vx: 0, vy: 0, active: false };
    let target = { x: 750, y: 250, r: 20 };
    let walls = [];
    let animationId;

    const levels = [
        { walls: [], target: {x: 750, y: 250} },
        { walls: [{x: 400, y: 150, w: 20, h: 200}], target: {x: 750, y: 250} },
        { walls: [{x: 300, y: 0, w: 20, h: 300}, {x: 500, y: 200, w: 20, h: 300}], target: {x: 750, y: 50} }
    ];

    function setMode(m) { mode = m; }

    canvas.addEventListener('mousedown', (e) => {
        if (particle.active) return;
        const rect = canvas.getBoundingClientRect();
        // Scale coordinates if canvas is resized by CSS
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        charges.push({
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY,
            type: mode,
            q: mode === 'pos' ? 1 : -1
        });
        draw();
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Vizato Targetin
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.r, 0, Math.PI*2);
        ctx.fillStyle = '#baffc9';
        ctx.fill();
        ctx.strokeStyle = '#4a4e69';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Vizato Muret
        ctx.fillStyle = '#4a4e69';
        walls.forEach(w => {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            ctx.strokeRect(w.x+2, w.y+2, w.w-4, w.h-4);
        });

        // Vizato Ngarkesat e vendosura
        charges.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 12, 0, Math.PI*2);
            ctx.fillStyle = c.type === 'pos' ? '#ffb3ba' : '#a2d2ff';
            ctx.fill();
            ctx.strokeStyle = '#4a4e69';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = "#4a4e69";
            ctx.font = "bold 16px VT323";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(c.type === 'pos' ? "+" : "-", c.x, c.y);
        });

        // Vizato Protonin
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 8, 0, Math.PI*2);
        ctx.fillStyle = '#ffc8dd';
        ctx.fill();
        ctx.strokeStyle = '#4a4e69';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function update() {
        if (!particle.active) return;

        let fx = 0;
        let fy = 0;
        const k = 5000; // Konstanta e lojës

        charges.forEach(c => {
            let dx = particle.x - c.x;
            let dy = particle.y - c.y;
            let distSq = dx*dx + dy*dy;
            let dist = Math.sqrt(distSq);
            if (dist < 15) dist = 15; // Parandalon shpërthimin e forcës

            let force = (k * c.q) / distSq;
            fx += (dx / dist) * force;
            fy += (dy / dist) * force;
        });

        particle.vx += fx;
        particle.vy += fy;
        particle.x += particle.vx;
        particle.y += particle.vy;

        // Kontrolli i përplasjeve
        if (particle.x < 0 || particle.x > canvas.width || particle.y < 0 || particle.y > canvas.height) {
            resetAttempt();
        }

        walls.forEach(w => {
            if (particle.x > w.x && particle.x < w.x + w.w && particle.y > w.y && particle.y < w.y + w.h) {
                resetAttempt();
            }
        });

        // Fitore
        let distToTarget = Math.hypot(particle.x - target.x, particle.y - target.y);
        if (distToTarget < target.r) {
            alert("Bravo! Niveli u kalua.");
            level++;
            loadLevel(level);
            return;
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function startSim() {
        if (particle.active) return;
        particle.active = true;
        update();
    }

    function resetAttempt() {
        cancelAnimationFrame(animationId);
        particle = { x: 50, y: 250, vx: 0, vy: 0, active: false };
        particle.active = false;
        draw();
    }

    function resetLevel() {
        charges = [];
        resetAttempt();
    }

    function loadLevel(n) {
        if (n > levels.length) {
            alert("Ti je një Gjini i Fizikës! I fitove të gjitha.");
            level = 1;
            n = 1;
        }
        document.getElementById('lvl').innerText = n;
        const config = levels[n-1];
        walls = config.walls;
        target.x = config.target.x;
        target.y = config.target.y;
        resetLevel();
    }

    loadLevel(1);
</script>
</body>
</html>
