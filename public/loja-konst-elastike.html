<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Konstanta Elastike</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#14142a;--accent:#b39ddb;--accent2:#ff7043;--gold:#ffd600;--text:#ede7f6;--muted:#9575cd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--accent);text-shadow:0 0 20px var(--accent);margin-bottom:4px;letter-spacing:2px;}
  .subtitle{color:var(--muted);font-size:1.1rem;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid #2a1a5a;border-radius:16px;padding:24px;width:100%;max-width:700px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .formula-box{background:#08080f;border:1px solid var(--accent);border-radius:10px;padding:16px;text-align:center;font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--accent);margin-bottom:16px;}
  label{font-size:1rem;color:var(--muted);display:block;margin-bottom:6px;}
  .slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#2a1a5a;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer;}
  .val{min-width:70px;text-align:right;font-family:'Orbitron',sans-serif;font-size:0.9rem;color:var(--gold);}
  .results{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
  .result-item{background:#08080f;border-radius:10px;padding:12px;text-align:center;border:1px solid #2a1a5a;}
  .rlabel{font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
  .rval{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--gold);}
  .tab-row{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 20px;border-radius:8px;border:1px solid #2a1a5a;background:transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;transition:all 0.2s;}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  .panel{display:none;}.panel.active{display:block;}
  .question{font-size:1.1rem;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{background:#08080f;border:1px solid #2a1a5a;border-radius:10px;color:var(--text);padding:12px 16px;font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;text-align:left;transition:all 0.2s;}
  .opt-btn:hover{border-color:var(--accent);color:var(--accent);}
  .opt-btn.correct{border-color:#4caf50;background:#1a3a1a;color:#81c784;}
  .opt-btn.wrong{border-color:var(--accent2);background:#2a0a0a;color:#ef9a9a;}
  .feedback{margin-top:14px;padding:12px;border-radius:8px;font-size:1rem;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:#1a3a1a;border:1px solid #4caf50;color:#81c784;}
  .feedback.bad{background:#2a0a0a;border:1px solid var(--accent2);color:#ef9a9a;}
  .next-btn{margin-top:14px;background:linear-gradient(135deg,var(--accent),#4a148c);border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 24px;cursor:pointer;display:none;font-weight:bold;}
  .next-btn.show{display:inline-block;}
  .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .score-badge{background:#2a1a5a;border:1px solid var(--accent);border-radius:8px;padding:6px 14px;font-family:'Orbitron',sans-serif;font-size:0.85rem;color:var(--accent);}
  .progress-bar{flex:1;height:6px;background:#2a1a5a;border-radius:3px;margin:0 12px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.4s;}
  .victory{text-align:center;padding:30px;display:none;}
  .victory.show{display:block;}
  .victory-title{font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--gold);text-shadow:0 0 20px var(--gold);margin-bottom:10px;}
  .stars{font-size:2.5rem;margin:10px 0;}
  .restart-btn{margin-top:16px;background:var(--gold);border:none;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 28px;cursor:pointer;font-weight:bold;}
  /* Graph */
  canvas{background:#08080f;border:1px solid #2a1a5a;border-radius:10px;max-width:100%;}
  .graph-label{font-size:0.85rem;color:var(--muted);text-align:center;margin-top:6px;}
  .springs-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .spring-card{background:#08080f;border:1px solid #2a1a5a;border-radius:12px;padding:16px;text-align:center;}
  .spring-name{font-size:0.9rem;color:var(--muted);margin-bottom:8px;}
  .spring-k{font-family:'Orbitron',sans-serif;font-size:1.2rem;color:var(--accent);}
  .spring-bar{height:10px;background:var(--accent);border-radius:5px;margin:8px 0;}
</style>
</head>
<body>
<h1>🔧 KONSTANTA ELASTIKE</h1>
<p class="subtitle">k = F / x &nbsp;|&nbsp; Rezistenca ndaj Shformimit</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)">📊 Grafik F(x)</button>
  <button class="tab" onclick="switchTab('quiz',event)">🧠 Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="formula-box">k = F / x &nbsp;&nbsp;(pjerrësia e grafikut F-x)</div>
    <div class="springs-row">
      <div class="spring-card"><div class="spring-name">🌸 Spirale e butë</div><div class="spring-k" id="sk1">k = 50 N/m</div><div class="spring-bar" id="sb1" style="width:25%"></div></div>
      <div class="spring-card"><div class="spring-name">⚙️ Spirale e ngurtë</div><div class="spring-k" id="sk2">k = 200 N/m</div><div class="spring-bar" id="sb2" style="width:100%;background:var(--accent2)"></div></div>
    </div>
    <canvas id="graphCanvas" width="650" height="240"></canvas>
    <div class="graph-label">Grafiku F(x) — pjerrësia = k (konstanta elastike)</div>
    <div class="slider-row" style="margin-top:14px;">
      <label style="min-width:100px">k spirales (N/m)</label>
      <input type="range" id="kSlider" min="10" max="300" value="100" oninput="updateGraph()">
      <span class="val" id="kVal">100 N/m</span>
    </div>
    <div class="slider-row">
      <label style="min-width:100px">Shformimi x (cm)</label>
      <input type="range" id="xSlider" min="1" max="20" value="10" oninput="updateGraph()">
      <span class="val" id="xVal">10 cm</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">k (N/m)</div><div class="rval" id="r1">100</div></div>
      <div class="result-item"><div class="rlabel">x (m)</div><div class="rval" id="r2">0.10</div></div>
      <div class="result-item"><div class="rlabel">F = kx (N)</div><div class="rval" id="r3">10.0</div></div>
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge">⭐ <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR →</button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.2rem;color:var(--muted);">Pikë: <span id="finalScore" style="color:var(--gold);font-family:'Orbitron',sans-serif;"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()">RISTART</button>
    </div>
  </div>
</div>

<script>
function updateGraph() {
  const k = parseFloat(document.getElementById('kSlider').value);
  const x = parseFloat(document.getElementById('xSlider').value) / 100;
  document.getElementById('kVal').textContent = k + ' N/m';
  document.getElementById('xVal').textContent = (x*100).toFixed(0) + ' cm';
  document.getElementById('r1').textContent = k;
  document.getElementById('r2').textContent = x.toFixed(2);
  document.getElementById('r3').textContent = (k*x).toFixed(1);
  drawGraph(k, x);
}

function drawGraph(k, xMark) {
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = {l:50,r:20,t:20,b:40};
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle = '#08080f';
  ctx.fillRect(0,0,W,H);

  const xMax = 0.25, fMax = k * xMax;
  const sx = x => pad.l + x/xMax*(W-pad.l-pad.r);
  const sy = f => H-pad.b - f/fMax*(H-pad.t-pad.b);

  // grid
  ctx.strokeStyle = '#1a1a3a'; ctx.lineWidth = 1;
  for (let i=0;i<=5;i++) {
    const x = i/5*xMax; ctx.beginPath(); ctx.moveTo(sx(x),pad.t); ctx.lineTo(sx(x),H-pad.b); ctx.stroke();
    const f = i/5*fMax; ctx.beginPath(); ctx.moveTo(pad.l,sy(f)); ctx.lineTo(W-pad.r,sy(f)); ctx.stroke();
  }

  // axes
  ctx.strokeStyle='#4a4a8a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();

  // axis labels
  ctx.fillStyle='#9575cd';ctx.font='12px Rajdhani';ctx.textAlign='center';
  for (let i=0;i<=5;i++) {
    const xv=i/5*xMax; ctx.fillText((xv*100).toFixed(0)+'cm',sx(xv),H-pad.b+16);
    const fv=i/5*fMax; ctx.textAlign='right'; ctx.fillText(fv.toFixed(0)+'N',pad.l-6,sy(fv)+4); ctx.textAlign='center';
  }
  ctx.fillText('x (shformim)',W/2,H-4);
  ctx.save();ctx.translate(14,H/2);ctx.rotate(-Math.PI/2);ctx.fillText('F (N)',0,0);ctx.restore();

  // Line F=kx
  ctx.strokeStyle='#b39ddb';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(sx(0),sy(0));ctx.lineTo(sx(xMax),sy(fMax));ctx.stroke();

  // marked point
  const px = sx(xMark), py = sy(k*xMark);
  ctx.strokeStyle='#ff7043';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(px,H-pad.b);ctx.lineTo(px,py);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad.l,py);ctx.lineTo(px,py);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd600';ctx.font='bold 12px Orbitron';ctx.textAlign='left';
  ctx.fillText('F='+((k*xMark).toFixed(1))+'N',px+8,py-4);

  // slope label
  ctx.fillStyle='#b39ddb';ctx.font='12px Rajdhani';ctx.textAlign='center';
  ctx.fillText('Pjerrësia = k = '+k+' N/m',sx(xMax*0.5),sy(fMax*0.65)-14);
}

updateGraph();

const questions=[
  {q:"Konstanta elastike k tregon:",opts:["Masën e spirales","Rezistencën ndaj shformimit","Gjatësinë e spirales","Nxitimin"],ans:1},
  {q:"Njësia e k është:",opts:["N·m","N/m","kg/m","J"],ans:1},
  {q:"F=200N, x=0.04m. Sa është k?",opts:["8 N/m","50 N/m","5000 N/m","0.0002 N/m"],ans:2},
  {q:"Në grafikun F(x), k është:",opts:["Sipërfaqja nën kurbë","Pjerrësia e drejtëzës","Presja Y","Vija horizontale"],ans:1},
  {q:"Spirale me k=500 N/m krahasuar me k=50 N/m:",opts:["Është më e butë","Është më e ngurtë","Ka të njëjtën ngurtësi","Nuk ka lidhje"],ans:1},
  {q:"Kufiri i elasticitetit është:",opts:["Pika ku spirale thyhet","Pika deri ku trupi kthehet në formë origjinale","k=0","F=0"],ans:1},
  {q:"Dy spirale k1=100 N/m dhe k2=200 N/m shformohen njëlloj. Cila ka Fe më të madhe?",opts:["k1 (100N/m)","k2 (200N/m)","Të dyja njëlloj","Varet nga masa"],ans:1}
];
let qi=0,score=0;
function loadQ(){const q=questions[qi];document.getElementById('question').textContent=(qi+1)+'. '+q.q;document.getElementById('feedback').className='feedback';document.getElementById('nextBtn').className='next-btn';document.getElementById('qnum').textContent=qi+1;document.getElementById('progress').style.width=(qi/questions.length*100)+'%';const opts=document.getElementById('options');opts.innerHTML='';q.opts.forEach((o,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.textContent=String.fromCharCode(65+i)+'. '+o;btn.onclick=()=>checkAns(i,btn);opts.appendChild(btn);});}
function checkAns(i,btn){const q=questions[qi];document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);const fb=document.getElementById('feedback');if(i===q.ans){btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;fb.className='feedback ok show';fb.textContent='✅ Saktë!';}else{btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';fb.className='feedback bad show';fb.textContent='❌ Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];}document.getElementById('nextBtn').className='next-btn show';}
function nextQ(){qi++;if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ();}
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
