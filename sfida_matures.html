<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sfida e Maturës - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-main: #2d3748;
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #4fd1c5;
            --success: #48bb78;
            --danger: #f56565;
            --warning: #ed8936;
            --border-radius: 24px;
            --box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 95%; max-width: 900px; height: 90vh;
            background: white; border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex; flex-direction: column; overflow: hidden;
            position: relative;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
        }

        .header h1 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 2rem; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .stats { display: flex; gap: 20px; font-size: 1.2rem; font-weight: bold; }
        .stat-box { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }

        /* SCREENS */
        .screen { display: none; flex: 1; padding: 30px; overflow-y: auto; flex-direction: column; }
        .screen.active { display: flex; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* START SCREEN */
        .start-content { text-align: center; margin: auto; }
        .start-icon { font-size: 6rem; color: var(--primary); margin-bottom: 20px; text-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .start-title { font-size: 3rem; color: var(--secondary); margin-bottom: 10px; font-family: 'Orbitron'; }
        .start-desc { font-size: 1.3rem; color: #718096; margin-bottom: 40px; }

        /* QUIZ SCREEN */
        .progress-bar { width: 100%; height: 12px; background: #edf2f7; border-radius: 6px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.5s ease; }

        .question-box {
            background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 20px;
            padding: 30px; margin-bottom: 30px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .question-text { font-size: 1.6rem; font-weight: 800; color: var(--secondary); margin: 0; line-height: 1.4; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-btn {
            background: white; border: 2px solid #e2e8f0; border-radius: 16px;
            padding: 20px; font-size: 1.2rem; font-weight: 600; color: var(--text-main);
            cursor: pointer; text-align: left; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .option-btn:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(102, 126, 234, 0.1); }
        .option-btn.selected { border-color: var(--primary); background: #ebf4ff; }
        .option-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .option-btn.wrong { background: var(--danger); color: white; border-color: var(--danger); }

        .option-letter {
            width: 35px; height: 35px; background: #edf2f7; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-weight: bold; color: #718096;
        }
        .option-btn.selected .option-letter { background: var(--primary); color: white; }
        .option-btn.correct .option-letter, .option-btn.wrong .option-letter { background: rgba(255,255,255,0.3); color: white; }

        .controls { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 20px; }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white; border: none; padding: 15px 40px;
            border-radius: 16px; font-size: 1.3rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { background: #cbd5e0; cursor: not-allowed; box-shadow: none; transform: none; }

        /* RESULT SCREEN */
        .result-content { text-align: center; margin: auto; }
        .score-circle {
            width: 200px; height: 200px; border-radius: 50%;
            background: white; border: 10px solid var(--primary);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 30px auto; box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }
        .score-number { font-size: 4rem; font-weight: 800; color: var(--secondary); line-height: 1; }
        .score-label { font-size: 1.2rem; color: #718096; font-weight: 600; }

    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1><i class="fas fa-graduation-cap"></i> Sfida e Maturës</h1>
        <div class="stats">
            <div class="stat-box"><i class="fas fa-clock"></i> <span id="timer">10:00</span></div>
            <div class="stat-box"><i class="fas fa-check-circle"></i> <span id="score-display">0</span>/10</div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <div class="start-content">
            <div class="start-icon"><i class="fas fa-brain"></i></div>
            <h2 class="start-title">Gati Për Provimin?</h2>
            <p class="start-desc">Testo njohuritë e tua në Fizikë me pyetje të nivelit të Maturës Shtetërore. Ke 10 minuta kohë për 10 pyetje.</p>
            <button class="btn" style="margin: 0 auto;" onclick="startGame()">Fillo Testin <i class="fas fa-play"></i></button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        
        <div class="question-box">
            <p class="question-text" id="q-text">Pyetja do të shfaqet këtu...</p>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Opsionet -->
        </div>

        <div class="controls">
            <button class="btn" id="next-btn" onclick="checkAnswer()" disabled>Konfirmo <i class="fas fa-check"></i></button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div class="result-content">
            <h2 style="font-size: 2.5rem; color: var(--secondary); margin-bottom: 30px;" id="res-title">Testi Përfundoi!</h2>
            
            <div class="score-circle">
                <div class="score-number" id="final-score">8</div>
                <div class="score-label">nga 10</div>
            </div>
            
            <p style="font-size: 1.3rem; color: #4a5568; margin-bottom: 40px;" id="res-msg">Rezultat i shkëlqyer!</p>
            
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button class="btn" style="background: white; color: var(--primary); border: 2px solid var(--primary);" onclick="location.reload()"><i class="fas fa-redo"></i> Provo Përsëri</button>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Cila nga madhësitë e mëposhtme është vektoriale?",
            opts: ["Masa", "Koha", "Forca", "Temperatura"],
            ans: 2
        },
        {
            q: "Njësia matëse e punës në sistemin SI është:",
            opts: ["Njuton (N)", "Xhaul (J)", "Vat (W)", "Paskal (Pa)"],
            ans: 1
        },
        {
            q: "Nëse shpejtësia e një trupi dyfishohet, energjia e tij kinetike:",
            opts: ["Dyfishohet", "Përgjysmohet", "Katërfishohet", "Mbetet e njëjtë"],
            ans: 2
        },
        {
            q: "Ligji i dytë i Njutonit shprehet me formulën:",
            opts: ["F = m/a", "F = m*v", "F = m*a", "F = a/m"],
            ans: 2
        },
        {
            q: "Cila është vlera e nxitimit të rënies së lirë (g) mesatarisht në Tokë?",
            opts: ["9.8 m/s²", "10 m/s", "9.8 N/kg", "Të dyja A dhe C"],
            ans: 3
        },
        {
            q: "Sipas parimit të Arkimedit, forca shtytëse është e barabartë me:",
            opts: ["Vëllimin e trupit", "Masën e lëngut të zhvendosur", "Peshën e lëngut të zhvendosur", "Dendësinë e trupit"],
            ans: 2
        },
        {
            q: "Në një qark të mbyllur, rryma elektrike (I) është në përpjesëtim të drejtë me:",
            opts: ["Rezistencën", "Tensionin", "Kohën", "Ngarkesën"],
            ans: 1
        },
        {
            q: "Valët e dritës në zbrazëti përhapen me shpejtësi rreth:",
            opts: ["300,000 km/s", "340 m/s", "3,000 km/s", "30,000 m/s"],
            ans: 0
        },
        {
            q: "Cila pajisje shndërron energjinë mekanike në energji elektrike?",
            opts: ["Motori elektrik", "Gjeneratori", "Transformatori", "Kondensatori"],
            ans: 1
        },
        {
            q: "Izotopet e një elementi kanë të njëjtin numër të:",
            opts: ["Neutroneve", "Protoneve", "Nukleoneve", "Elektroneve në bërthamë"],
            ans: 1
        }
    ];

    let currentQ = 0;
    let score = 0;
    let selectedOpt = null;
    let timerInterval;
    let timeLeft = 600; // 10 minutes

    function startGame() {
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
        startTimer();
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-text').innerText = `${currentQ + 1}. ${q.q}`;
        document.getElementById('progress').style.width = `${(currentQ / questions.length) * 100}%`;
        
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        selectedOpt = null;
        document.getElementById('next-btn').disabled = true;
        document.getElementById('next-btn').innerHTML = 'Konfirmo <i class="fas fa-check"></i>';
        document.getElementById('next-btn').onclick = checkAnswer;

        const letters = ['A', 'B', 'C', 'D'];
        q.opts.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerHTML = `<div class="option-letter">${letters[index]}</div> <span>${opt}</span>`;
            btn.onclick = () => selectOption(index, btn);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(index, btnElement) {
        if(document.querySelector('.correct')) return; // Already answered
        
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        selectedOpt = index;
        document.getElementById('next-btn').disabled = false;
    }

    function checkAnswer() {
        const q = questions[currentQ];
        const btns = document.querySelectorAll('.option-btn');
        
        if (selectedOpt === q.ans) {
            btns[selectedOpt].classList.add('correct');
            score++;
            document.getElementById('score-display').innerText = score;
        } else {
            btns[selectedOpt].classList.add('wrong');
            btns[q.ans].classList.add('correct');
        }

        const nextBtn = document.getElementById('next-btn');
        if (currentQ < questions.length - 1) {
            nextBtn.innerHTML = 'Pyetja e Radhës <i class="fas fa-arrow-right"></i>';
            nextBtn.onclick = () => {
                currentQ++;
                loadQuestion();
            };
        } else {
            nextBtn.innerHTML = 'Përfundo <i class="fas fa-flag-checkered"></i>';
            nextBtn.onclick = endGame;
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
                return;
            }
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }, 1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('final-score').innerText = score;
        
        const msg = document.getElementById('res-msg');
        const title = document.getElementById('res-title');
        
        if(score >= 9) {
            msg.innerText = "Shkëlqyeshëm! Je gati për Maturën Shtetërore.";
            title.style.color = "var(--success)";
        } else if(score >= 6) {
            msg.innerText = "Rezultat i mirë! Me pak përsëritje do jesh perfekt.";
        } else {
            msg.innerText = "Duhet më shumë punë. Rikthehu tek teoria dhe provo sërish.";
            title.style.color = "var(--danger)";
        }
    }
</script>

</body>
</html>
