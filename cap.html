<!DOCTYPE html><html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Capacitor Challenge</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root { --primary-glow: #ffafcc; } body { font-family: "Nunito", sans-serif; background: #f8fafc;} h1, h2, .title, .header { font-family: "Orbitron", sans-serif; } button, .btn { font-family: "Nunito", sans-serif; font-weight: 800; border-radius: 16px; box-shadow: 0 4px 15px rgba(255, 175, 204, 0.2); transition: all 0.3s ease; } button:hover, .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 175, 204, 0.4); } .glass-panel { border-radius: 24px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.08); background: white; }</style></head><body class="flex items-center justify-center min-h-screen text-slate-800"><div class="w-full max-w-2xl p-6 glass-panel border border-slate-200"><div class="flex justify-between items-center mb-8 border-b border-slate-100 pb-4"><h1 class="text-2xl font-bold text-slate-800"><i class="fas fa-bolt text-pink-400"></i> Capacitor Challenge</h1><div class="flex gap-4"><div class="bg-red-50 text-red-500 px-4 py-2 rounded-full font-bold shadow-inner"><i class="fas fa-heart"></i> <span id="lives">3</span></div><div class="bg-yellow-50 text-yellow-600 px-4 py-2 rounded-full font-bold shadow-inner"><i class="fas fa-star"></i> <span id="score">0</span></div></div></div><div id="game-area" class="text-center"><div class="bg-slate-50 rounded-2xl p-8 mb-6 shadow-sm border border-slate-100 min-h-[150px] flex flex-col items-center justify-center relative overflow-hidden"><h2 id="question" class="text-2xl font-bold text-slate-800 leading-tight z-10">Kondensatorët e Plotë! Gati?</h2><p id="feedback" class="h-6 mt-4 font-bold text-lg opacity-0 transition-opacity"></p></div><div id="options" class="grid grid-cols-1 sm:grid-cols-2 gap-4"><button onclick="startGame()" class="col-span-full bg-slate-800 text-white p-4 rounded-xl font-bold text-lg hover:bg-slate-700">Fillo Lojën</button></div></div></div><script>const questions = [{"q":"Kapaciteti elektrik matet me:","options":["Volt","Amper","Farad","Weber"],"a":2},{"q":"Kondensatori shërben për grumbullimin e ngarkesave elektrike.","type":"tf","a":true},{"q":"Si llogaritet kapaciteti i një kondensatori?","options":["C = Q/V","C = V/Q","C = Q*V","C = R*I"],"a":0},{"q":"Nëse vendosim një dielektrik midis pllakave, kapaciteti rritet.","type":"tf","a":true}]; let currentQ = 0, score = 0, lives = 3; function startGame() { currentQ = 0; score = 0; lives = 3; updateUI(); nextQ(); } function updateUI() { document.getElementById("score").innerText = score; document.getElementById("lives").innerText = lives; } function nextQ() { if (lives <= 0 || currentQ >= questions.length) { document.getElementById("question").innerHTML = lives <= 0 ? "<span style="color:red">Lojë e Përfunduar!</span>" : "<span style="color:green">Urime, Fitore!</span>"; document.getElementById("feedback").style.opacity = 0; document.getElementById("options").innerHTML = "<button onclick="startGame()" class="col-span-full bg-pink-400 text-white p-4 rounded-xl font-bold text-lg hover:bg-pink-500">Luaj Përsëri</button>"; return; } const q = questions[currentQ]; document.getElementById("question").innerText = q.q; document.getElementById("feedback").style.opacity = 0; let html = ""; if (q.type === "tf") { html = "<button onclick="check(true)" class="bg-white border-2 border-emerald-400 text-emerald-600 p-6 rounded-2xl font-bold text-xl hover:bg-emerald-50 flex flex-col items-center gap-2"><i class="fas fa-check text-3xl"></i> E Vërtetë</button><button onclick="check(false)" class="bg-white border-2 border-red-400 text-red-600 p-6 rounded-2xl font-bold text-xl hover:bg-red-50 flex flex-col items-center gap-2"><i class="fas fa-times text-3xl"></i> E Gabuar</button>"; } else { q.options.forEach((opt, i) => { html += "<button onclick="check("+i+")" class="w-full bg-white border border-slate-200 text-slate-700 p-4 rounded-xl font-bold hover:border-pink-400 hover:text-pink-500 text-left pl-6">"+opt+"</button>"; }); } document.getElementById("options").innerHTML = html; } function check(ans) { const q = questions[currentQ]; const isCorrect = ans === q.a; const fb = document.getElementById("feedback"); fb.style.opacity = 1; if (isCorrect) { score += 10; fb.innerText = "E Saktë! +10 Pikë"; fb.style.color = "green"; } else { lives--; fb.innerText = "E Pasaktë! -1 Jetë"; fb.style.color = "red"; } updateUI(); currentQ++; const btns = document.getElementById("options").querySelectorAll("button"); btns.forEach(b => b.disabled = true); setTimeout(nextQ, 1000); } </script></body></html>
