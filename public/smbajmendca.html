<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Flux Master - Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #ui {
            width: 350px;
            background: var(--surface);
            border-right: 4px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 8px 0px 0px var(--border);
            z-index: 10;
        }

        h2 {
            font-family: 'VT323', monospace;
            font-size: 3rem;
            color: var(--accent);
            text-shadow: 2px 2px 0px var(--border);
            margin: 0;
            text-transform: uppercase;
        }

        .level-card {
            background: var(--bg);
            padding: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        #lvlNum {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--text);
            font-weight: bold;
        }

        .goal-text { 
            font-family: 'VT323', monospace;
            font-size: 2rem; 
            color: var(--accent2); 
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        .control-panel {
            background: var(--bg);
            padding: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        .control-panel label {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            display: block;
            margin-bottom: 8px;
        }

        input[type=range] { 
            width: 100%; 
            cursor: pointer; 
            -webkit-appearance: none;
            height: 12px;
            border: 2px solid var(--border);
            background: #e2e8f0;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            cursor: pointer;
        }

        #angleVal {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            color: var(--accent2);
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        .flux-display {
            padding: 15px;
            background: var(--bg);
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            color: var(--text);
            text-align: center;
        }
        #currentFlux {
            color: var(--accent);
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        /* FORMULA E SAKTË DHE E PASTER */
        .formula-footer {
            margin-top: auto;
            padding: 20px;
            background: var(--bg);
            border: 4px solid var(--border);
            text-align: center;
            box-shadow: 4px 4px 0px var(--border);
        }

        .math-text {
            font-size: 2rem;
            color: var(--accent);
            font-family: 'VT323', monospace;
            margin: 10px 0;
            text-shadow: 1px 1px 0px var(--border);
        }

        #viewport { flex-grow: 1; position: relative; }
        canvas { width: 100%; height: 100%; }

        .overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--green);
            border: 4px solid var(--border);
            padding: 30px;
            text-align: center;
            display: none;
            border-radius: 0;
            box-shadow: 8px 8px 0px var(--border);
            color: var(--border);
        }

        .overlay h2 {
            font-size: 3rem;
            margin-top: 0;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .overlay p {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--surface);
            color: var(--text);
            border: 4px solid var(--border);
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2><i class="fas fa-satellite-dish"></i> FLUX STATIONS</h2>
        
        <div class="level-card">
            <div id="lvlNum">Niveli 1</div>
            <div style="font-family: 'VT323', monospace; font-size: 1.2rem; color: var(--text); margin-top: 5px;">OBJEKTIVI:</div>
            <div id="targetFlux" class="goal-text">3.00 Wb</div>
        </div>

        <div class="control-panel">
            <label>KONTROLLI I KËNDIT (α)</label>
            <input type="range" id="angleSlider" min="0" max="90" step="1" value="45">
            <div id="angleVal" style="text-align:center; margin-top:5px;">45°</div>
        </div>

        <div class="flux-display">
            Φ Real: <span id="currentFlux">0.00</span> Wb
        </div>

        <div class="formula-footer">
            <span style="font-family: 'VT323', monospace; font-size: 1.5rem; color: var(--text);">Formula:</span>
            <div class="math-text">Φ = B · S · cos(α)</div>
            <p style="font-family: 'VT323', monospace; font-size: 1.2rem; color: var(--text); margin-bottom: 0;">Përshtat këndin për të kapur fluksin e duhur.</p>
        </div>
    </div>

    <div id="viewport">
        <canvas id="mainCanvas"></canvas>
        <div id="winOverlay" class="overlay">
            <h2>STACIONI U AKTIVIZUA!</h2>
            <p>Fluksi magnetik është brenda normës.</p>
            <button class="btn" onclick="nextLevel()">NIVELI TJETËR <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('angleSlider');
    const winOverlay = document.getElementById('winOverlay');

    let width, height;
    let currentLevel = 0;
    
    // Parametrat e fushës
    const B = 1.0; 
    const S = 4.0;

    const levels = [
        { target: 4.00, desc: "Maksimizo kapjen (0°)" },
        { target: 2.83, desc: "Kap gjysmën (45°)" },
        { target: 0.00, desc: "Izolo plotësisht (90°)" }
    ];

    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function nextLevel() {
        currentLevel++;
        if(currentLevel >= levels.length) {
            alert("Urime! Je një Inxhinier i Fluksit!");
            currentLevel = 0;
        }
        document.getElementById('lvlNum').innerText = "Niveli " + (currentLevel + 1);
        document.getElementById('targetFlux').innerText = levels[currentLevel].target.toFixed(2) + " Wb";
        winOverlay.style.display = 'none';
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        const alpha = parseInt(slider.value);
        document.getElementById('angleVal').innerText = alpha + "°";
        
        const rad = alpha * Math.PI / 180;
        const flux = B * S * Math.cos(rad);
        document.getElementById('currentFlux').innerText = flux.toFixed(2);

        // Vizato vijat e fushës B
        ctx.strokeStyle = "#a2d2ff";
        ctx.lineWidth = 4;
        for(let i=0; i<height; i+=60) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(width, i);
            ctx.stroke();
        }

        // Vizato Spirën (Panelin)
        ctx.save();
        ctx.translate(width/2, height/2);
        ctx.rotate(rad);
        
        ctx.fillStyle = "#ffafcc";
        ctx.strokeStyle = "#4a4e69";
        ctx.lineWidth = 6;
        ctx.fillRect(-15, -120, 30, 240);
        ctx.strokeRect(-15, -120, 30, 240);
        
        // Vektori Normal S
        ctx.beginPath();
        ctx.strokeStyle = "#4a4e69";
        ctx.setLineDash([10, 10]);
        ctx.lineWidth = 4;
        ctx.moveTo(0, 0);
        ctx.lineTo(150, 0);
        ctx.stroke();
        
        // Arrow head for Normal vector
        ctx.beginPath();
        ctx.setLineDash([]);
        ctx.moveTo(150, 0);
        ctx.lineTo(130, -10);
        ctx.lineTo(130, 10);
        ctx.closePath();
        ctx.fillStyle = "#4a4e69";
        ctx.fill();
        
        ctx.font = "bold 24px VT323";
        ctx.fillText("S", 160, 8);
        
        ctx.restore();

        // Kontrollo Fitoren
        const diff = Math.abs(flux - levels[currentLevel].target);
        if(diff < 0.05 && winOverlay.style.display !== 'block') {
            winOverlay.style.display = 'block';
        }

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
