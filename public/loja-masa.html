<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja e Masës - Dinamika</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a4e69;
            --accent: #ffafcc;
            --bg: #fcf9ff;
            --text: #4a4e69;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .game-container { background: white; padding: 2rem; border-radius: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: var(--primary); }
        button { background: var(--primary); color: white; padding: 1rem 2rem; border-radius: 1rem; border: none; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Masa (m = d × V)</h1>
        <p>Llogarit masën kur dendësia është 1000 kg/m³ dhe vëllimi 0.5 m³.</p>
        <input type="number" id="answer" placeholder="Përgjigja (kg)">
        <button onclick="check()">Kontrollo</button>
        <p id="result"></p>
    </div>
    <script>
        function check() {
            const ans = document.getElementById('answer').value;
            document.getElementById('result').innerText = ans == 500 ? "Saktë! 🎉" : "Gabim, provo përsëri! ❌";
        }
    </script>
</body>
</html>
