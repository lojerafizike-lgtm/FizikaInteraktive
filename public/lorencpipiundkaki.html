<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Lorentz Force Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 4px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 8px 0px 0px var(--border);
            z-index: 10;
        }

        h2 {
            font-family: 'VT323', monospace;
            font-size: 3.5rem;
            color: var(--accent);
            text-shadow: 2px 2px 0px var(--border);
            margin: 0;
            text-transform: uppercase;
            text-align: center;
        }

        .level-display {
            background: var(--bg);
            padding: 15px;
            text-align: center;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        .level-display div:first-child {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--text);
            text-transform: uppercase;
        }

        #lvlName {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--accent2);
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        .control-group {
            background: var(--bg);
            padding: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        .label {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            display: block;
            margin-bottom: 10px;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            -webkit-appearance: none;
            height: 12px;
            border: 2px solid var(--border);
            background: #e2e8f0;
            outline: none;
            margin-bottom: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            cursor: pointer;
        }

        #bVal {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--accent2);
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        /* FORMULA E SAKTË NË FUND */
        .formula-footer {
            margin-top: auto;
            background: var(--surface);
            padding: 15px;
            text-align: center;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        .formula-footer div:first-child {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 5px;
        }

        .formula-text {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 1px 1px 0px var(--border);
        }

        .formula-footer p {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--text);
            margin-top: 10px;
            margin-bottom: 0;
        }

        #viewport { flex-grow: 1; position: relative; }
        canvas { width: 100%; height: 100%; background: var(--bg); }

        .btn {
            background: var(--green);
            color: var(--border);
            border: 4px solid var(--border);
            padding: 15px;
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
        
        .btn-reset {
            background: var(--red);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>LORENTZ PRO</h2>
        
        <div class="level-display">
            <div>SITUATA</div>
            <div id="lvlName">Niveli 1: Devijimi</div>
        </div>

        <div class="control-group">
            <label class="label">Fusha Magnetike (B)</label>
            <input type="range" id="bRange" min="-5" max="5" step="0.1" value="0">
            <div id="bVal" style="text-align: center;">0.00 T</div>
        </div>

        <button class="btn" onclick="fireParticle()"><i class="fas fa-rocket"></i> LËSHO GRIMCËN</button>
        <button class="btn btn-reset" onclick="resetLevel()"><i class="fas fa-undo"></i> RESET</button>

        <div class="formula-footer">
            <div>FORCA E LORENCIT:</div>
            <div class="formula-text">F = q · v · B · sin(α)</div>
            <p>Gjej fushën B që grimca të godasë cakun!</p>
        </div>
    </div>

    <div id="viewport">
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bRange = document.getElementById('bRange');
    
    let width, height;
    let particle = { x: 50, y: 0, vx: 5, vy: 0, active: false, path: [] };
    let target = { x: 0, y: 0, r: 25 };
    let currentLevel = 0;
    
    const levels = [
        { y: 0.5, ty: 0.2, v: 6 },
        { y: 0.8, ty: 0.3, v: 8 },
        { y: 0.2, ty: 0.8, v: 10 }
    ];

    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
        loadLevel();
    }
    window.addEventListener('resize', resize);

    function loadLevel() {
        const l = levels[currentLevel];
        particle.y = l.y * height;
        particle.vx = l.v;
        target.x = width - 100;
        target.y = l.ty * height;
        resetParticle();
    }

    function resetParticle() {
        particle.x = 50;
        particle.y = levels[currentLevel].y * height;
        particle.vy = 0;
        particle.active = false;
        particle.path = [];
    }

    function fireParticle() {
        resetParticle();
        particle.active = true;
    }

    function resetLevel() { resetParticle(); }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Vizato targetin
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.r, 0, Math.PI*2);
        ctx.strokeStyle = "#4a4e69";
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.fillStyle = "#ffafcc";
        ctx.fill();
        ctx.setLineDash([]);

        // Vizato B field (Crosses or Dots)
        const B = parseFloat(bRange.value);
        document.getElementById('bVal').innerText = B.toFixed(2) + " T";
        
        ctx.fillStyle = "#94a3b8";
        ctx.font = "20px VT323";
        if(B !== 0) {
            for(let i=0; i<width; i+=100) {
                for(let j=0; j<height; j+=100) {
                    ctx.fillText(B > 0 ? "×" : "•", i, j);
                }
            }
        }

        if(particle.active) {
            // Logjika e Fizikës: F = qvB (sin alfa këtu është 1 sepse B është pingul me ekranin)
            // r = mv/qB -> për thjeshtësi, ndryshojmë drejtimin e vy
            const force = particle.vx * B * 0.05;
            particle.vy += force;
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.path.push({x: particle.x, y: particle.y});

            // Vizato rrugëtimin
            ctx.beginPath();
            ctx.strokeStyle = "#a2d2ff";
            ctx.lineWidth = 4;
            particle.path.forEach((p, i) => {
                if(i===0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Kontrolli i goditjes
            let dist = Math.hypot(particle.x - target.x, particle.y - target.y);
            if(dist < target.r) {
                alert("GODITJE E SAKTË!");
                currentLevel = (currentLevel + 1) % levels.length;
                loadLevel();
            }
            
            if(particle.x > width || particle.y < 0 || particle.y > height) {
                particle.active = false;
            }
        }

        // Vizato grimcën
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 10, 0, Math.PI*2);
        ctx.fillStyle = "#ffc8dd";
        ctx.fill();
        ctx.strokeStyle = "#4a4e69";
        ctx.lineWidth = 3;
        ctx.stroke();

        requestAnimationFrame(draw);
    }

    resize();
    draw();
</script>
</body>
</html>
