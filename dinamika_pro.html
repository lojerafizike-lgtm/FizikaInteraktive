<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamika Adventure: Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-main: #2d3748;
            --primary: #4299e1;
            --secondary: #ebf8ff;
            --accent: #3182ce;
            --success: #48bb78;
            --danger: #f56565;
            --warning: #ed8936;
            --border-radius: 24px;
            --box-shadow: 0 10px 25px rgba(66, 153, 225, 0.15);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            width: 95%; max-width: 1200px; height: 90vh;
            background: white; border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex; flex-direction: column; overflow: hidden;
            position: relative;
        }

        /* HEADER */
        .header {
            background: var(--primary); color: white;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
        }

        .header h1 { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 2rem; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .stats { display: flex; gap: 20px; font-size: 1.2rem; font-weight: bold; }
        .stat-box { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }

        /* MAIN CONTENT */
        .main-content { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR / LEVELS */
        .sidebar {
            width: 300px; background: var(--secondary); padding: 20px;
            overflow-y: auto; border-right: 2px solid rgba(66, 153, 225, 0.1);
        }

        .level-card {
            background: white; border-radius: 16px; padding: 15px; margin-bottom: 15px;
            cursor: pointer; border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px;
        }

        .level-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(66, 153, 225, 0.15); }
        .level-card.active { border-color: var(--primary); background: #e6fffa; }
        .level-card.locked { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); }

        .level-icon {
            width: 50px; height: 50px; border-radius: 12px; background: var(--primary); color: white;
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
        }
        .level-card.locked .level-icon { background: #cbd5e0; }

        .level-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--text-main); }
        .level-info p { margin: 0; font-size: 0.9rem; color: #718096; }

        /* PLAY AREA */
        .play-area { flex: 1; padding: 30px; display: flex; flex-direction: column; position: relative; }

        .mission-panel {
            background: white; border-radius: var(--border-radius); padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0;
        }

        .mission-title { font-size: 1.8rem; color: var(--accent); margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .mission-desc { font-size: 1.2rem; color: #4a5568; line-height: 1.5; margin-bottom: 20px; }

        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .data-item { background: var(--secondary); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 1.2rem; color: var(--accent); border: 1px dashed var(--primary); }

        /* INTERACTIVE CANVAS */
        .canvas-wrapper {
            flex: 1; background: #edf2f7; border-radius: var(--border-radius);
            position: relative; overflow: hidden; border: 2px solid #e2e8f0;
            display: flex; justify-content: center; align-items: center;
        }

        /* CONTROLS */
        .controls {
            margin-top: 20px; display: flex; gap: 15px; align-items: center;
            background: white; padding: 20px; border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
        }

        .input-group { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--bg-color); padding: 5px 15px; border-radius: 12px; border: 2px solid transparent; }
        .input-group:focus-within { border-color: var(--primary); background: white; }
        
        .input-group input {
            flex: 1; border: none; background: transparent; padding: 12px 0;
            font-size: 1.2rem; font-family: 'Nunito'; color: var(--text-main); outline: none;
        }
        .input-group span { font-weight: bold; color: #718096; font-size: 1.2rem; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 15px 30px;
            border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(66, 153, 225, 0.3);
        }
        .btn:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(66, 153, 225, 0.4); }
        .btn:active { transform: translateY(0); }

        /* OVERLAYS */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.4s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }

        .overlay-content { text-align: center; transform: translateY(20px); transition: 0.4s; }
        .overlay.active .overlay-content { transform: translateY(0); }

        .overlay-icon { font-size: 5rem; margin-bottom: 20px; }
        .overlay h2 { font-size: 2.5rem; margin: 0 0 15px 0; color: var(--text-main); }
        
        .success-color { color: var(--success); }
        .danger-color { color: var(--danger); }

        /* ANIMATIONS FOR CANVAS */
        .box { width: 60px; height: 60px; background: var(--primary); border-radius: 8px; position: absolute; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .surface { position: absolute; bottom: 20%; left: 10%; right: 10%; height: 10px; background: #a0aec0; border-radius: 5px; }
        .force-arrow { position: absolute; height: 4px; background: var(--danger); }
        .force-arrow::after { content: ''; position: absolute; right: -10px; top: -6px; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid var(--danger); }

    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1><i class="fas fa-rocket"></i> Dinamika Pro</h1>
        <div class="stats">
            <div class="stat-box"><i class="fas fa-star" style="color: #ecc94b;"></i> <span id="score">0</span> XP</div>
            <div class="stat-box"><i class="fas fa-layer-group"></i> <span id="level-display">1/5</span></div>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar" id="level-list">
            <!-- Nivelet gjenerohen ketu -->
        </div>

        <div class="play-area">
            <div class="mission-panel">
                <h2 class="mission-title" id="m-title"><i class="fas fa-tasks"></i> Titulli</h2>
                <p class="mission-desc" id="m-desc">Përshkrimi i misionit...</p>
                <div class="data-grid" id="m-data">
                    <!-- Te dhenat -->
                </div>
            </div>

            <div class="canvas-wrapper" id="sim-area">
                <!-- Simulimi vizual -->
            </div>

            <div class="controls">
                <div class="input-group">
                    <i class="fas fa-keyboard" style="color: #a0aec0; margin-left: 10px;"></i>
                    <input type="number" id="user-ans" placeholder="Shkruaj përgjigjen..." step="any">
                    <span id="unit-display">N</span>
                </div>
                <button class="btn" onclick="checkAnswer()"><i class="fas fa-check-circle"></i> Verifiko</button>
            </div>

            <!-- Overlays -->
            <div class="overlay" id="success-overlay">
                <div class="overlay-content">
                    <div class="overlay-icon success-color"><i class="fas fa-check-circle"></i></div>
                    <h2 class="success-color">E Saktë!</h2>
                    <p style="font-size: 1.2rem; color: #718096; margin-bottom: 20px;">Ke fituar +100 XP</p>
                    <button class="btn" onclick="nextLevel()">Vazhdo <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="overlay" id="fail-overlay">
                <div class="overlay-content">
                    <div class="overlay-icon danger-color"><i class="fas fa-times-circle"></i></div>
                    <h2 class="danger-color">E Gabuar!</h2>
                    <p style="font-size: 1.2rem; color: #718096; margin-bottom: 20px;">Rillogarit dhe provo përsëri.</p>
                    <button class="btn" style="background: var(--danger);" onclick="closeFail()">Provo Përsëri <i class="fas fa-redo"></i></button>
                </div>
            </div>
            
            <div class="overlay" id="end-overlay">
                <div class="overlay-content">
                    <div class="overlay-icon" style="color: #ecc94b;"><i class="fas fa-trophy"></i></div>
                    <h2>Misioni Përfundoi!</h2>
                    <p style="font-size: 1.5rem; color: #4a5568; margin-bottom: 20px;">Pikët Totale: <span id="final-score" style="font-weight: bold; color: var(--primary);"></span> XP</p>
                    <button class="btn" onclick="location.reload()"><i class="fas fa-play"></i> Luaj Përsëri</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const levels = [
        {
            title: "Ligji i Dytë i Njutonit",
            icon: "fa-weight-hanging",
            desc: "Një kuti me masë 10 kg shtyhet me një forcë. Ajo fiton një nxitim prej 2 m/s². Sa është forca e ushtruar?",
            data: { "Masa (m)": "10 kg", "Nxitimi (a)": "2 m/s²" },
            ans: 20, unit: "N",
            sim: "box-push"
        },
        {
            title: "Forca e Fërkimit",
            icon: "fa-road",
            desc: "Një trup 5 kg rrëshqet në një sipërfaqe. Koeficienti i fërkimit është 0.2. Sa është forca e fërkimit? (g = 10 m/s²)",
            data: { "Masa (m)": "5 kg", "Koef. (μ)": "0.2" },
            ans: 10, unit: "N",
            sim: "friction"
        },
        {
            title: "Tensioni i Litarit",
            icon: "fa-link",
            desc: "Një ashensor 500 kg ngrihet lart me nxitim 1 m/s². Sa është tensioni në litar? (g = 10 m/s²)",
            data: { "Masa (m)": "500 kg", "Nxitimi (a)": "1 m/s²" },
            ans: 5500, unit: "N",
            sim: "elevator"
        },
        {
            title: "Plani i Pjerrët",
            icon: "fa-mountain",
            desc: "Një trup 2 kg ndodhet në një plan të pjerrët me kënd 30°. Sa është komponentja e rëndesës paralele me planin? (g=10, sin30=0.5)",
            data: { "Masa (m)": "2 kg", "Këndi (α)": "30°" },
            ans: 10, unit: "N",
            sim: "incline"
        },
        {
            title: "Sistemi i Trupave",
            icon: "fa-cubes",
            desc: "Dy trupa m1=3kg dhe m2=2kg janë lidhur me litar dhe tërhiqen me forcë 20N. Sa është nxitimi i sistemit?",
            data: { "m1": "3 kg", "m2": "2 kg", "Forca (F)": "20 N" },
            ans: 4, unit: "m/s²",
            sim: "system"
        }
    ];

    let currentLevel = 0;
    let score = 0;
    let unlocked = [0];

    function init() {
        renderSidebar();
        loadLevel(0);
    }

    function renderSidebar() {
        const list = document.getElementById('level-list');
        list.innerHTML = '';
        levels.forEach((l, i) => {
            const isLocked = !unlocked.includes(i);
            const isActive = i === currentLevel;
            
            const div = document.createElement('div');
            div.className = `level-card ${isLocked ? 'locked' : ''} ${isActive ? 'active' : ''}`;
            if(!isLocked) div.onclick = () => loadLevel(i);
            
            div.innerHTML = `
                <div class="level-icon"><i class="fas ${l.icon}"></i></div>
                <div class="level-info">
                    <h3>Niveli ${i+1}</h3>
                    <p>${l.title}</p>
                </div>
                ${isLocked ? '<i class="fas fa-lock" style="color:#cbd5e0; margin-left:auto;"></i>' : ''}
            `;
            list.appendChild(div);
        });
    }

    function loadLevel(index) {
        currentLevel = index;
        const l = levels[index];
        
        document.getElementById('level-display').innerText = `${index+1}/${levels.length}`;
        document.getElementById('m-title').innerHTML = `<i class="fas ${l.icon}"></i> ${l.title}`;
        document.getElementById('m-desc').innerText = l.desc;
        document.getElementById('unit-display').innerText = l.unit;
        document.getElementById('user-ans').value = '';
        
        const dataGrid = document.getElementById('m-data');
        dataGrid.innerHTML = '';
        for(let key in l.data) {
            dataGrid.innerHTML += `<div class="data-item">${key}<br><span style="color:var(--text-main); font-size:1rem;">${l.data[key]}</span></div>`;
        }

        renderSidebar();
        drawSimulation(l.sim);
    }

    function drawSimulation(type) {
        const sim = document.getElementById('sim-area');
        sim.innerHTML = '';
        
        if(type === 'box-push') {
            sim.innerHTML = `
                <div class="surface"></div>
                <div class="box" id="anim-box" style="bottom: 20%; left: 20%;">10kg</div>
                <div class="force-arrow" id="anim-arrow" style="bottom: 25%; left: 5%; width: 50px;"></div>
            `;
        } else if(type === 'friction') {
            sim.innerHTML = `
                <div class="surface" style="background: #e2e8f0; border-top: 4px dashed #a0aec0;"></div>
                <div class="box" style="bottom: 20%; left: 40%;">5kg</div>
                <div class="force-arrow" style="bottom: 25%; left: 20%; width: 50px;"></div>
                <div class="force-arrow" style="bottom: 22%; left: 45%; width: 30px; background: #ed8936; transform: rotate(180deg); transform-origin: left;"></div>
            `;
        } else if(type === 'elevator') {
            sim.innerHTML = `
                <div style="position:absolute; top:0; bottom:20%; left:48%; width:4px; background:#718096;"></div>
                <div class="box" style="bottom: 20%; left: calc(50% - 30px); height: 80px; width: 60px;">500</div>
                <div class="force-arrow" style="bottom: 50%; left: 52%; width: 40px; transform: rotate(-90deg); transform-origin: left;"></div>
            `;
        } else if(type === 'incline') {
            sim.innerHTML = `
                <div style="position:absolute; bottom:20%; left:20%; width:60%; height:4px; background:#a0aec0; transform: rotate(-30deg); transform-origin: left;"></div>
                <div class="box" style="bottom: 45%; left: 40%; transform: rotate(-30deg);">2kg</div>
            `;
        } else if(type === 'system') {
            sim.innerHTML = `
                <div class="surface"></div>
                <div class="box" style="bottom: 20%; left: 30%;">3kg</div>
                <div style="position:absolute; bottom:25%; left:calc(30% + 60px); width:40px; height:2px; background:#718096;"></div>
                <div class="box" style="bottom: 20%; left: calc(30% + 100px);">2kg</div>
                <div class="force-arrow" style="bottom: 25%; left: calc(30% + 160px); width: 50px;"></div>
            `;
        }
    }

    function checkAnswer() {
        const user = parseFloat(document.getElementById('user-ans').value);
        const correct = levels[currentLevel].ans;
        
        if(Math.abs(user - correct) < 0.1) {
            score += 100;
            document.getElementById('score').innerText = score;
            
            // Animate box if applicable
            const box = document.getElementById('anim-box');
            if(box) box.style.transform = 'translateX(200px)';
            
            setTimeout(() => {
                document.getElementById('success-overlay').classList.add('active');
            }, 500);
        } else {
            document.getElementById('fail-overlay').classList.add('active');
        }
    }

    function closeFail() {
        document.getElementById('fail-overlay').classList.remove('active');
    }

    function nextLevel() {
        document.getElementById('success-overlay').classList.remove('active');
        if(currentLevel < levels.length - 1) {
            unlocked.push(currentLevel + 1);
            loadLevel(currentLevel + 1);
        } else {
            document.getElementById('final-score').innerText = score;
            document.getElementById('end-overlay').classList.add('active');
        }
    }

    window.onload = init;
</script>

</body>
</html>
