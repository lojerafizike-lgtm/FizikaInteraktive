<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Fisioni Bërthamor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e0f7fa; --card: #ffffff; --primary: #00bcd4; --dark: #006064; --text: #37474f; --success: #4caf50; --error: #ff7043; }
        body { margin: 0; background: var(--bg); font-family: 'Nunito', sans-serif; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        .karta { background: var(--card); padding: 40px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); max-width: 600px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.8); }
        h1 { font-family: 'Fredoka', sans-serif; color: var(--dark); margin: 0 0 10px; font-size: 28px; }
        .formula { background: #e0f7fa; color: var(--dark); padding: 10px 25px; border-radius: 50px; font-weight: 700; font-size: 18px; display: inline-block; margin: 10px 0 30px; }
        .parametrat { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .kutia { background: #f5f5f5; padding: 15px 25px; border-radius: 20px; border-bottom: 4px solid #ddd; }
        .kutia span { display: block; font-size: 12px; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
        .kutia b { font-size: 20px; font-family: 'Fredoka'; color: var(--dark); }
        
        /* Skena e Reaktorit */
        .skena { height: 300px; background: radial-gradient(circle at 50% 50%, #263238 0%, #000000 100%); border-radius: 24px; position: relative; overflow: hidden; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; border: 8px solid #37474f; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        .berthama { width: 80px; height: 80px; background: radial-gradient(circle at 30% 30%, #ffffff, #00bcd4 60%, #006064 100%); border-radius: 50%; position: absolute; z-index: 10; display: flex; justify-content: center; align-items: center; font-family: 'Fredoka'; color: #006064; font-weight: 700; box-shadow: 0 0 30px #00bcd4, 0 0 60px #00bcd4; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .rrethi-orbit { position: absolute; width: 200px; height: 200px; border: 2px solid rgba(0, 188, 212, 0.3); border-radius: 50%; animation: orbit 4s linear infinite; }
        .rrethi-orbit::before { content: ''; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; background: #4caf50; border-radius: 50%; box-shadow: 0 0 10px #4caf50; }
        @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .bateria { position: absolute; right: 30px; width: 40px; height: 160px; background: #cfd8dc; border-radius: 10px; border: 4px solid #546e7a; overflow: hidden; display: flex; flex-direction: column-reverse; }
        .bateria-mbushja { width: 100%; height: 10%; background: var(--error); transition: height 1s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s; }
        .bateria::after { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 15px; height: 8px; background: #546e7a; border-radius: 3px 3px 0 0; }

        .kontrollet { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        input { padding: 15px; border: 2px solid #b2dfdb; border-radius: 16px; font-size: 18px; width: 200px; text-align: center; font-family: 'Nunito'; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.2); }
        button { padding: 15px 30px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Fredoka'; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #004d40; transition: 0.1s; }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #004d40; }
        .btn-reset { background: var(--success); box-shadow: 0 4px 0 #2e7d32; display: none; margin-top: 15px; }
        #mesazhi { margin-top: 20px; font-weight: 700; font-size: 18px; min-height: 25px; }
        
        @keyframes shperthim { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        .grimce { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #00bcd4; pointer-events: none; }
    </style>
</head>
<body>
    <div class="karta">
        <h1>Energjia Bërthamore</h1>
        <div class="formula">E (GJ) = Masa (kg) × Rendimenti (GJ/kg)</div>
        <div class="parametrat">
            <div class="kutia"><span>Elementi</span><b id="nuc-emri">U-235</b></div>
            <div class="kutia"><span>Vlera</span><b id="nuc-vlera">2kg @ 80k</b></div>
        </div>
        <div class="skena">
            <div class="rrethi-orbit"></div>
            <div id="nuc-berthama" class="berthama">U-235</div>
            <div class="bateria"><div id="nuc-mbushja" class="bateria-mbushja"></div></div>
        </div>
        <div class="kontrollet">
            <input type="number" id="nuc-input" placeholder="GJ total">
            <button onclick="nuc_fisioni()">SHKAKTO FISIONIN</button>
        </div>
        <div id="nuc-mesazhi"></div>
        <button class="btn-reset" id="nuc-reset" onclick="nuc_init()">RIFILLO</button>
    </div>

    <script>
        const els = [{e:"U-235",v:80000},{e:"Pu-239",v:85000},{e:"Th-232",v:75000}];
        let m, act, tGJ;
        function nuc_init() {
            act = els[Math.floor(Math.random()*els.length)];
            m = Math.floor(Math.random()*10+1);
            tGJ = m * act.v;
            document.getElementById('nuc-emri').innerText = act.e;
            document.getElementById('nuc-vlera').innerText = m+"kg @ "+(act.v/1000)+"k";
            document.getElementById('nuc-berthama').innerText = act.e;
            document.getElementById('nuc-input').value = "";
            document.getElementById('nuc-mesazhi').innerText = "";
            document.getElementById('nuc-reset').style.display = "none";
            document.getElementById('nuc-mbushja').style.height = "10%";
            document.getElementById('nuc-mbushja').style.background = "var(--error)";
        }
        function nuc_fisioni() {
            let u = parseFloat(document.getElementById('nuc-input').value);
            let msg = document.getElementById('nuc-mesazhi');
            if(isNaN(u)) { msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Shëno vlerën!'; msg.style.color="#fbc02d"; return; }
            if(u === tGJ) {
                document.getElementById('nuc-berthama').style.animation = "pulse 0.2s infinite";
                setTimeout(() => {
                    document.getElementById('nuc-mbushja').style.height = "100%";
                    document.getElementById('nuc-mbushja').style.background = "var(--success)";
                    nuc_shperthe();
                    msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> SAKTË! Prodhove ' + tGJ + ' GJ.';
                    msg.style.color = "var(--success)";
                    document.getElementById('nuc-reset').style.display = "inline-block";
                }, 300);
            } else {
                msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Gabim! Ishte: ' + tGJ + ' GJ.';
                msg.style.color = "var(--error)";
                document.getElementById('nuc-reset').style.display = "inline-block";
            }
        }
        function nuc_shperthe() {
            let s = document.querySelector('.skena');
            for(let i=0; i<30; i++) {
                let p = document.createElement('div');
                p.className = 'grimce';
                let a = Math.random() * Math.PI * 2;
                let d = 120 + Math.random()*80;
                p.style.setProperty('--tx', Math.cos(a)*d + 'px');
                p.style.setProperty('--ty', Math.sin(a)*d + 'px');
                p.style.animation = `shperthim ${0.5 + Math.random()*0.5}s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
                s.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }
        nuc_init();
    </script>
</body>
</html>
