<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shpejtësia Kendore</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --track: #e2e8f0;
            --car: #ff9a9e;
            --info: #a1887f;
            --accent: #fbc2eb;
            --text: #4a5568;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        .game-card {
            background: var(--card); padding: 30px; border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            width: 90%; max-width: 400px; text-align: center;
        }

        .formula-display {
            background: var(--accent); padding: 12px; border-radius: 20px;
            font-size: 1.4rem; margin-bottom: 20px; display: inline-block; width: 100%;
        }

        /* Pista e Garave */
        .track-area {
            width: 200px; height: 200px; background: var(--track);
            border-radius: 50%; margin: 0 auto 25px;
            position: relative; border: 8px solid #cbd5e1;
            display: flex; align-items: center; justify-content: center;
        }

        .car {
            width: 25px; height: 40px; background: var(--car);
            border-radius: 6px; position: absolute;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.6);
            /* Pozicionimi fillestar */
            transform-origin: center 100px;
            top: 0; left: calc(50% - 12.5px);
        }

        .center-point {
            width: 10px; height: 10px; background: #94a3b8; border-radius: 50%;
        }

        .input-group { margin: 20px 0; }

        input[type="number"] {
            width: 100px; padding: 12px; border-radius: 15px;
            border: 2px solid var(--accent); text-align: center; font-size: 1.1rem;
        }

        .btn-check {
            background: var(--accent); color: #444; border: none;
            padding: 15px 40px; border-radius: 20px; font-weight: bold;
            cursor: pointer; width: 100%;
        }

        #modal {
            position: fixed; inset: 0; background: rgba(255,255,255,0.95);
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 100; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="formula-display">
            ω = θ / t
        </div>

        <p style="font-weight: bold;">Llogarit shpejtësinë kendore (ω):</p>

        <div class="track-area">
            <div class="center-point"></div>
            <div class="car" id="car"></div>
        </div>

        <div style="background: #f1f5f9; padding: 10px; border-radius: 15px; margin-bottom: 15px;">
            Zhvendosja: <b>&theta; = <span id="val-theta">3.14</span> rad</b><br>
            Koha e kthesës: <b>t = <span id="val-t">2.0</span> s</b>
        </div>

        <div class="input-group">
            <input type="number" id="user-omega" step="0.01" placeholder="ω = ?">
            <span style="font-weight: bold; margin-left: 5px;">rad/s</span>
        </div>

        <button class="btn-check" onclick="verifiko()">KONTROLLO KTHESËN</button>
    </div>

    <div id="modal">
        <h1 id="mod-titulli"></h1>
        <p id="mod-teksti" style="font-size: 1.1rem;"></p>
        <button class="btn-check" style="width: auto; background: var(--car); color: white;" onclick="vazhdo()">Vazhdo</button>
    </div>

    <script>
        const nivelet = [
            { theta: 3.14, t: 2.0, omega: 1.57 }, // Gjysmë rrethi në 2 sekonda
            { theta: 6.28, t: 4.0, omega: 1.57 }, // Rreth i plotë në 4 sekonda
            { theta: 1.57, t: 0.5, omega: 3.14 }, // Çerek rrethi shumë shpejt
            { theta: 4.71, t: 3.0, omega: 1.57 }  // 270 gradë
        ];

        let idx = 0;
        const car = document.getElementById('car');
        let currentRotation = 0;

        function animo() {
            let omegaAktuale = nivelet[idx].omega;
            // Ndryshimi i këndit: dTheta = omega * dt
            currentRotation += omegaAktuale * (180 / Math.PI) * 0.016; 
            car.style.transform = `rotate(${currentRotation}deg)`;
            requestAnimationFrame(animo);
        }
        animo();

        function verifiko() {
            const userOmega = parseFloat(document.getElementById('user-omega').value);
            const saktOmega = nivelet[idx].omega;
            const diff = Math.abs(userOmega - saktOmega);
            
            const modal = document.getElementById('modal');
            modal.style.display = "flex";

            if (diff < 0.1) {
                document.getElementById('mod-titulli').innerText = "Kthesë e Perkryer!";
                document.getElementById('mod-teksti').innerText = `Saktë! Shpejtësia kendore është ${saktOmega} rad/s. Makina qëndroi në pistë!`;
                window.isCorrect = true;
            } else {
                document.getElementById('mod-titulli').innerText = "Jashtë piste!";
                document.getElementById('mod-teksti').innerText = `Llogaritja jote nuk ishte e saktë. Pjesto këndin me kohën!`;
                window.isCorrect = false;
            }
        }

        function vazhdo() {
            if (window.isCorrect) {
                idx = (idx + 1) % nivelet.length;
                document.getElementById('val-theta').innerText = nivelet[idx].theta.toFixed(2);
                document.getElementById('val-t').innerText = nivelet[idx].t.toFixed(1);
                document.getElementById('user-omega').value = "";
            }
            document.getElementById('modal').style.display = "none";
        }
    </script>
</body>
</html>
