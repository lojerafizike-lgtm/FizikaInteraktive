<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Advanced Photomath Pink</title>
    <style>
        :root {
            --pm-pink: #ff4d94;
            --pm-bg: #ffffff;
            --pm-gray: #f8f9fa;
            --text-main: #2d2d2d;
        }

        #pm-calc {
            width: 100%;
            height: 100%;
            background: var(--pm-bg);
            border-radius: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Handle per levizje - removed as handled by parent */
        #pm-handle {
            display: none;
        }

        #pm-screen {
            padding: 15px 20px;
            text-align: right;
            min-height: 80px;
        }

        #pm-input {
            font-size: 14px;
            color: #9e9e9e;
            min-height: 20px;
            margin-bottom: 5px;
            word-break: break-all;
        }

        #pm-result {
            font-size: 32px;
            font-weight: 700;
            color: var(--pm-pink);
            overflow-x: auto;
        }

        .pm-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background: #f1f1f1;
            border-top: 1px solid #f1f1f1;
        }

        button {
            background: white;
            border: none;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:active { background: var(--pm-gray); transform: scale(0.95); }

        /* Ngjyrat sipas funksionit */
        .sci { color: #ad1457; font-size: 13px; background: #fff9fb; }
        .op { color: var(--pm-pink); font-size: 20px; background: var(--pm-gray); }
        .num { font-size: 19px; }
        .equal { background: var(--pm-pink); color: white; grid-column: span 1; }
        .ac { color: #ff3d3d; }

        /* Rregullim per butonin Ans dhe Pi */
        .spec { font-style: italic; font-family: 'serif'; }

        /* Butoni mbylljes - removed as handled by parent */
        .close-btn {
            display: none;
        }
    </style>
</head>
<body>

<div id="pm-calc">
    <div id="pm-screen">
        <div id="pm-input"></div>
        <div id="pm-result">0</div>
    </div>

    <div class="pm-grid">
        <button class="sci" onclick="addFunc('Math.sin')">sin</button>
        <button class="sci" onclick="addFunc('Math.cos')">cos</button>
        <button class="sci" onclick="addFunc('Math.tan')">tan</button>
        <button class="sci" onclick="addFunc('Math.log10')">log</button>
        <button class="sci" onclick="addFunc('Math.log')">ln</button>

        <button class="sci" onclick="addChar('/')">■/□</button>
        <button class="sci" onclick="addFunc('Math.sqrt')">√</button>
        <button class="sci" onclick="addChar('**2')">x²</button>
        <button class="sci" onclick="addChar('**')">xⁿ</button>
        <button class="op ac" onclick="reset()">AC</button>

        <button class="num" onclick="addChar('7')">7</button>
        <button class="num" onclick="addChar('8')">8</button>
        <button class="num" onclick="addChar('9')">9</button>
        <button class="op" onclick="backspace()">⌫</button>
        <button class="op" onclick="addChar('/')">÷</button>

        <button class="num" onclick="addChar('4')">4</button>
        <button class="num" onclick="addChar('5')">5</button>
        <button class="num" onclick="addChar('6')">6</button>
        <button class="op" onclick="addChar('*')">×</button>
        <button class="op" onclick="addChar('-')">−</button>

        <button class="num" onclick="addChar('1')">1</button>
        <button class="num" onclick="addChar('2')">2</button>
        <button class="num" onclick="addChar('3')">3</button>
        <button class="op" onclick="addChar('+')">+</button>
        <button class="op" onclick="addChar('(')">(</button>

        <button class="num" onclick="addChar('0')">0</button>
        <button class="num" onclick="addChar('.')">.</button>
        <button class="sci spec" onclick="addChar('Math.PI')">π</button>
        <button class="sci" onclick="useAns()">Ans</button>
        <button class="equal" onclick="solve()">=</button>
    </div>
</div>

<script>
    let expr = "";
    let lastAns = "0";
    const inputDisplay = document.getElementById('pm-input');
    const resultDisplay = document.getElementById('pm-result');

    function addChar(char) {
        expr += char;
        render();
    }

    function addFunc(func) {
        expr += func + "(";
        render();
    }

    function render() {
        let visual = expr
            .replace(/Math\.sin/g, 'sin')
            .replace(/Math\.cos/g, 'cos')
            .replace(/Math\.tan/g, 'tan')
            .replace(/Math\.log10/g, 'log')
            .replace(/Math\.log/g, 'ln')
            .replace(/Math\.sqrt/g, '√')
            .replace(/Math\.PI/g, 'π')
            .replace(/\*\*/g, '^')
            .replace(/\*/g, '×')
            .replace(/\//g, '÷');
        inputDisplay.innerText = visual;
    }

    function reset() {
        expr = "";
        inputDisplay.innerText = "";
        resultDisplay.innerText = "0";
    }

    function backspace() {
        expr = expr.slice(0, -1);
        render();
    }

    function useAns() {
        expr += lastAns;
        render();
    }

    function solve() {
        try {
            let evalExpr = expr;
            // Auto-close brackets
            let openB = (evalExpr.match(/\(/g) || []).length;
            let closeB = (evalExpr.match(/\)/g) || []).length;
            evalExpr += ")".repeat(Math.max(0, openB - closeB));

            let result = eval(evalExpr);
            
            resultDisplay.innerText = Number.isInteger(result) ? result : parseFloat(result.toFixed(6));
            lastAns = result.toString();
        } catch (e) {
            resultDisplay.innerText = "Error";
        }
    }
</script>

</body>
</html>
