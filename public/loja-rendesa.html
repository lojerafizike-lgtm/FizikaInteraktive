<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca e Rëndësës</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #f0fdf4;
    --surface: #ffffff;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --accent2: #f97316;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.5px;
  }
  .subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 24px; font-weight: 600; text-align: center; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 32px;
    padding: 32px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: var(--shadow-lg);
  }
  .scene {
    background: #f8fafc;
    border-radius: 24px;
    height: 240px;
    position: relative;
    margin-bottom: 20px;
    border: 2px solid var(--border);
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  /* Space scene */
  .earth {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
    background: radial-gradient(circle at 30% 30%, #3b82f6, #1d4ed8);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
  }
  .earth::after {
    content: '';
    position: absolute;
    top: 25px;
    left: 20px;
    width: 40px;
    height: 25px;
    background: rgba(34, 197, 94, 0.8);
    border-radius: 50%;
    filter: blur(2px);
  }
  .falling-obj { position: absolute; font-size: 2.5rem; transition: top 0.1s linear; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
  .g-arrow { position: absolute; left: 50%; color: var(--accent); font-size: 1.2rem; transform: translateX(-50%); font-weight: bold; }
  .formula-box {
    background: #f0fdf4;
    border: 2px solid #bbf7d0;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    font-size: 1.25rem;
    color: var(--accent-hover);
    margin-bottom: 20px;
    font-weight: 700;
  }
  label { font-size: 1rem; color: var(--muted); display: block; margin-bottom: 8px; font-weight: 700; }
  .slider-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 10px;
    border-radius: 5px;
    background: #e2e8f0;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--accent);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
  .val { min-width: 70px; text-align: right; font-size: 1.1rem; color: var(--text); font-weight: 800; }
  .results { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .result-item {
    background: #f8fafc;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .rlabel { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .rval { font-size: 1.2rem; color: var(--accent); font-weight: 800; }
  .tab-row { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; }
  .tab {
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    background: #e2e8f0;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab:hover { background: #cbd5e1; color: var(--text); }
  .tab.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
  .panel { display: none; animation: fadeIn 0.4s ease-out; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .question { font-size: 1.25rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; font-weight: 800; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt-btn {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    padding: 16px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
  }
  .opt-btn:hover { border-color: var(--accent); background: #f0fdf4; transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .opt-btn.correct { border-color: #22c55e; background: #dcfce7; color: #166534; }
  .opt-btn.wrong { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
  .feedback { margin-top: 20px; padding: 16px; border-radius: 16px; font-size: 1.1rem; font-weight: 700; display: none; text-align: center; }
  .feedback.show { display: block; animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .feedback.ok { background: #dcfce7; color: #166534; }
  .feedback.bad { background: #fee2e2; color: #991b1b; }
  .next-btn {
    margin-top: 20px;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    padding: 14px 32px;
    cursor: pointer;
    display: none;
    font-weight: 800;
    width: 100%;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    transition: all 0.2s;
  }
  .next-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4); }
  .next-btn.show { display: block; }
  .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .score-badge {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-bar { flex: 1; height: 10px; background: #e2e8f0; border-radius: 5px; margin: 0 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  .victory { text-align: center; padding: 40px 20px; display: none; }
  .victory.show { display: block; animation: fadeIn 0.5s ease-out; }
  .victory-title { font-size: 2.5rem; color: var(--accent); margin-bottom: 16px; font-weight: 800; }
  .stars { font-size: 3.5rem; margin: 16px 0; color: #fbbf24; text-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }
  .restart-btn {
    margin-top: 24px;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    padding: 14px 36px;
    cursor: pointer;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4); }
  .drop-btn {
    background: var(--accent2);
    border: none;
    border-radius: 999px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    padding: 12px 24px;
    cursor: pointer;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    transition: all 0.2s;
  }
  .drop-btn:hover { background: #ea580c; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4); }
  .planet-mini { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; justify-content: center; }
  .pm {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 700;
    transition: all 0.2s;
    color: var(--muted);
  }
  .pm.active, .pm:hover { border-color: var(--accent); color: var(--accent); background: #f0fdf4; }
</style>
</head>
<body>
<h1><i class="fas fa-globe-americas"></i> FORCA E RËNDËSËS</h1>
<p class="subtitle">G = m × g &nbsp;|&nbsp; Tërheqja Tokësore</p>

<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)"><i class="fas fa-flask"></i> Simulim</button>
  <button class="tab" onclick="switchTab('quiz',event)"><i class="fas fa-question-circle"></i> Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="planet-mini" id="planetMini">
      <div class="pm active" onclick="setPl(this,9.81,'🌍 Tokë')">🌍 Tokë g=9.81</div>
      <div class="pm" onclick="setPl(this,1.62,'🌕 Hënë')">🌕 Hënë g=1.62</div>
      <div class="pm" onclick="setPl(this,3.72,'🔴 Mars')">🔴 Mars g=3.72</div>
      <div class="pm" onclick="setPl(this,24.8,'🟠 Jupiter')">🟠 Jupiter g=24.8</div>
    </div>
    <div class="scene" id="scene">
      <div class="earth"></div>
      <div class="falling-obj" id="fallingObj" style="top:20px;left:calc(50% - 20px);">🪨</div>
      <div class="g-arrow" id="gArrow" style="top:80px;"><i class="fas fa-arrow-down"></i> G</div>
      <div id="velDisplay" style="position:absolute;top:12px;right:16px;font-size:0.9rem;color:var(--text);font-weight:800;background:rgba(255,255,255,0.8);padding:4px 10px;border-radius:999px;box-shadow:var(--shadow-sm);">v = 0 m/s</div>
    </div>
    <button class="drop-btn" onclick="dropObj()"><i class="fas fa-hand-pointer"></i> HIDH OBJEKTIN</button>
    <div class="formula-box" style="margin-top:20px;">G = m × g</div>
    <div class="slider-row">
      <label style="min-width:80px; margin-bottom:0;">Masa (kg)</label>
      <input type="range" id="massSlider" min="1" max="100" value="10" oninput="updateSim()">
      <span class="val" id="massVal">10 kg</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">Forca G</div><div class="rval" id="r1">98.1 N</div></div>
      <div class="result-item"><div class="rlabel">Nxitimi g</div><div class="rval" id="r2">9.81 m/s²</div></div>
      <div class="result-item"><div class="rlabel">Pas 3s v=</div><div class="rval" id="r3">29.4 m/s</div></div>
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge"><i class="fas fa-star" style="color:#fbbf24;"></i> <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.4rem;color:var(--text);font-weight:700;margin-bottom:24px;">Pikë: <span id="finalScore" style="color:var(--accent);font-size:1.8rem;"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> RISTART</button>
    </div>
  </div>
</div>

<script>
let currentG = 9.81, dropAnim = null, objTop = 20, objVel = 0;

function setPl(el, g, name) {
  document.querySelectorAll('.pm').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentG = g;
  updateSim();
}

function updateSim() {
  const m = parseFloat(document.getElementById('massSlider').value);
  document.getElementById('massVal').textContent = m + ' kg';
  document.getElementById('r1').textContent = (m*currentG).toFixed(1) + ' N';
  document.getElementById('r2').textContent = currentG + ' m/s²';
  document.getElementById('r3').textContent = (currentG*3).toFixed(1) + ' m/s';
}

function dropObj() {
  if (dropAnim) cancelAnimationFrame(dropAnim);
  objTop = 20; objVel = 0;
  let last = null;
  function step(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts-last)/1000, 0.05);
    last = ts;
    objVel += currentG * dt;
    objTop += objVel * dt * 15;
    document.getElementById('fallingObj').style.top = objTop + 'px';
    document.getElementById('velDisplay').textContent = 'v = ' + objVel.toFixed(1) + ' m/s';
    if (objTop < 160) dropAnim = requestAnimationFrame(step);
    else { objTop = 20; objVel = 0; document.getElementById('velDisplay').textContent = 'v = 0 m/s'; }
  }
  dropAnim = requestAnimationFrame(step);
}

updateSim();

const questions = [
  { q: "Formula e forcës së rëndësës është:", opts: ["G = F/m", "G = mg", "G = mv²/r", "G = Fd"], ans: 1 },
  { q: "Sa është nxitimi i rënies së lirë në Tokë?", opts: ["1.62 m/s²", "3.72 m/s²", "9.81 m/s²", "24.8 m/s²"], ans: 2 },
  { q: "Nga kush varet G=mg?", opts: ["Vetëm nga masa", "Vetëm nga g", "Nga masa dhe g", "Nga shpejtësia"], ans: 2 },
  { q: "Nëse masa dyfishohet, forca e rëndësës:", opts: ["Mbetet e njëjtë", "Përgjysmohet", "Dyfishohet", "Katërshohet"], ans: 2 },
  { q: "Forca e rëndësës drejtohet:", opts: ["Lart, drejt qendrës tokës", "Poshtë, drejt qendrës tokës", "Anash", "Horizontalisht"], ans: 1 },
  { q: "Trupi 5 kg në Hënë (g=1.62). Sa është G?", opts: ["8.1 N", "81 N", "5 N", "32.4 N"], ans: 0 },
  { q: "Dy trupa me masa të ndryshme bien lirisht. Nxitimi i tyre:", opts: ["I trandi bie më shpejt", "I lehti bie më shpejt", "Të njëjtin nxitim (pa ajër)", "Varet nga forma"], ans: 2 }
];

let qi=0, score=0;
function loadQ() {
  const q=questions[qi]; document.getElementById('question').textContent=(qi+1)+'. '+q.q; document.getElementById('feedback').className='feedback'; document.getElementById('nextBtn').className='next-btn'; document.getElementById('qnum').textContent=qi+1; document.getElementById('progress').style.width=(qi/questions.length*100)+'%';
  const opts=document.getElementById('options'); opts.innerHTML='';
  q.opts.forEach((o,i)=>{ const btn=document.createElement('button'); btn.className='opt-btn'; btn.textContent=String.fromCharCode(65+i)+'. '+o; btn.onclick=()=>checkAns(i,btn); opts.appendChild(btn); });
}
function checkAns(i,btn) {
  const q=questions[qi]; document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null); const fb=document.getElementById('feedback');
  if(i===q.ans){
    btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;
    fb.className='feedback ok show';fb.innerHTML='<i class="fas fa-check-circle"></i> Saktë!';
  }else{
    btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';
    fb.className='feedback bad show';fb.innerHTML='<i class="fas fa-times-circle"></i> Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];
  }
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQ() { qi++; if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ(); }
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
