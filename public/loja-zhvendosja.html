<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misioni i Zhvendosjes</title>
    <style>
        :root {
            --sea: #2980b9;
            --ship: #e74c3c;
            --port: #f1c40f;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2px;
            background: #bdc3c7;
            border: 5px solid #34495e;
            margin: 15px auto;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
        }

        .cell {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 6vw, 1.8rem);
            position: relative;
        }

        .cell.start { background: #dff9fb; }
        .cell.end { background: #f9ca24; border-radius: 5px; }
        
        .ship-icon { position: absolute; transition: all 0.5s ease; z-index: 10; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        button {
            padding: 12px;
            background: var(--sea);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .level-badge {
            background: var(--text);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <span class="level-badge" id="levelLabel">Niveli 1: Zhvendosja e thjeshtë</span>
    <h2>Anija në Det 🚢</h2>
    <p>Dërgo anijen te Porti i Verdhë duke llogaritur zhvendosjen!</p>

    <div class="grid-container" id="grid">
        </div>

    <div class="controls">
        <div>
            <label>Zhvendosja X (Majtas/Djathtas)</label>
            <input type="number" id="shiftX" placeholder="Psh. 2 ose -1">
        </div>
        <div>
            <label>Zhvendosja Y (Lart/Poshtë)</label>
            <input type="number" id="shiftY" placeholder="Psh. 3 ose -2">
        </div>
        <button onclick="moveShip()" id="moveBtn" style="grid-column: span 2;">LËSHO ANCORËN!</button>
    </div>

    <div id="message"></div>
    <button onclick="initLevel()" style="background:#95a5a6; margin-top:10px; width:100%;">Rinis Nivelin</button>
</div>

<script>
    let shipPos = { x: 0, y: 0 };
    let targetPos = { x: 4, y: 4 };
    let currentLevel = 1;

    function initLevel() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        document.getElementById('message').innerText = '';
        document.getElementById('message').style.color = 'black';

        // Konfigurimi i niveleve
        if(currentLevel === 1) {
            shipPos = { x: 0, y: 4 }; // Poshtë majtas
            targetPos = { x: 2, y: 2 };
            document.getElementById('levelLabel').innerText = "Niveli 1: Mëso lëvizjen";
        } else if(currentLevel === 2) {
            shipPos = { x: 1, y: 1 };
            targetPos = { x: 4, y: 3 };
            document.getElementById('levelLabel').innerText = "Niveli 2: Zhvendosja pozitive";
        } else {
            shipPos = { x: 4, y: 0 };
            targetPos = { x: 0, y: 3 };
            document.getElementById('levelLabel').innerText = "Niveli 3: Zhvendosja negative";
        }

        for (let y = 0; y < 5; y++) {
            for (let x = 0; x < 5; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${x}-${y}`;
                if(x === targetPos.x && y === targetPos.y) cell.classList.add('end', 'emoji');
                if(x === targetPos.x && y === targetPos.y) cell.innerText = '⚓';
                grid.appendChild(cell);
            }
        }
        updateShipUI();
    }

    function updateShipUI() {
        // Hiq anijen e vjetër
        const oldShip = document.querySelector('.ship-icon');
        if(oldShip) oldShip.remove();

        // Vendos anijen e re
        const startCell = document.getElementById(`cell-${shipPos.x}-${shipPos.y}`);
        const ship = document.createElement('span');
        ship.className = 'ship-icon';
        ship.innerText = '🚢';
        startCell.appendChild(ship);
    }

    function moveShip() {
        const dx = parseInt(document.getElementById('shiftX').value) || 0;
        const dy = parseInt(document.getElementById('shiftY').value) || 0;
        
        // Në koordinatat e rrjetit HTML, Y rritet duke zbritur poshtë, 
        // ndaj ne e përmbysim për t'u dukur si matematikë (pozitive = lart)
        let newX = shipPos.x + dx;
        let newY = shipPos.y - dy; 

        if (newX < 0 || newX > 4 || newY < 0 || newY > 4) {
            document.getElementById('message').innerText = "Kujdes! Dole jashtë detit!";
            document.getElementById('message').style.color = "red";
            return;
        }

        shipPos.x = newX;
        shipPos.y = newY;
        updateShipUI();

        if (shipPos.x === targetPos.x && shipPos.y === targetPos.y) {
            document.getElementById('message').innerText = "BRAVO! Porti u arrit!";
            document.getElementById('message').style.color = "green";
            
            if(currentLevel < 3) {
                setTimeout(() => {
                    currentLevel++;
                    alert("Kalove në nivelin tjetër!");
                    initLevel();
                }, 1000);
            } else {
                alert("Urime! Ke përfunduar të gjitha misionet e zhvendosjes!");
            }
        } else {
            document.getElementById('message').innerText = "Anija lëvizi, por porti është ende larg...";
            document.getElementById('message').style.color = "orange";
        }
    }

    initLevel();
</script>

</body>
</html>
