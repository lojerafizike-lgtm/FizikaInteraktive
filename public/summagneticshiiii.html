<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Magnetic Induction Master</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI Moderne */
        #control-panel {
            width: 350px;
            background: var(--surface);
            border-right: 4px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 0px 0px var(--border);
            z-index: 10;
        }

        .header-box {
            border-bottom: 4px dashed var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 { 
            font-family: 'VT323', monospace; 
            font-size: 2.5rem; 
            color: var(--accent); 
            text-shadow: 2px 2px 0px var(--border); 
            margin: 0; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }

        .stat-group {
            background: var(--bg);
            padding: 15px;
            margin-bottom: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
        }

        .label { 
            font-family: 'VT323', monospace;
            font-size: 1.5rem; 
            color: var(--text); 
            text-transform: uppercase; 
        }
        .value { 
            font-family: 'VT323', monospace;
            font-size: 2rem; 
            color: var(--accent2); 
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }

        .btn {
            background: var(--surface);
            color: var(--text);
            border: 4px solid var(--border);
            padding: 12px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 10px;
        }

        .btn:active { 
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
        
        .active { 
            background: var(--accent2); 
            color: var(--border);
        }
        #northBtn.active { background: var(--accent); }

        /* Formula e rregulluar ne fund */
        .formula-container {
            margin-top: auto;
            padding: 20px;
            background: var(--bg);
            border: 4px solid var(--border);
            text-align: center;
            box-shadow: 4px 4px 0px var(--border);
        }

        .math-fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 1px 1px 0px var(--border);
        }

        .frac-top { border-bottom: 2px solid var(--border); padding: 0 5px; }
        .frac-bottom { padding: 0 5px; }

        #game-viewport { flex-grow: 1; position: relative; }
        canvas { width: 100%; height: 100%; cursor: crosshair; }

        .notification {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--green);
            color: var(--border);
            padding: 15px 30px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            font-family: 'VT323', monospace;
            font-size: 2rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="header-box">
            <h1><i class="fas fa-magnet"></i> MAG-INDUCTION</h1>
        </div>

        <div class="stat-group">
            <div class="label">Induksioni (B)</div>
            <div id="b-val" class="value">0.00 T</div>
        </div>

        <div class="stat-group">
            <div class="label">Forca (Fmax)</div>
            <div id="f-val" class="value">0.00 N</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px;">
            <button id="northBtn" class="btn active" onclick="setPole(1)"><i class="fas fa-arrow-up"></i> Shto Polin Veri (N)</button>
            <button id="southBtn" class="btn" onclick="setPole(-1)"><i class="fas fa-arrow-down"></i> Shto Polin Jug (S)</button>
            <button class="btn" onclick="resetField()" style="margin-top: 20px; background: var(--gold);"><i class="fas fa-undo"></i> Reset Fushën</button>
        </div>

        <div class="formula-container">
            <p style="font-family: 'VT323', monospace; font-size: 1.5rem; color: var(--text); margin-top: 0;">Relacioni:</p>
            <div class="math-fraction">
                B = 
                <div style="display: inline-block; vertical-align: middle;">
                    <div class="frac-top">F<sub>max</sub></div>
                    <div class="frac-bottom">I · L</div>
                </div>
            </div>
            <p style="font-family: 'VT323', monospace; font-size: 1.2rem; color: var(--text); margin-bottom: 0; margin-top: 10px;">Vendos magnetët për të devijuar rrymën.</p>
        </div>
    </div>

    <div id="game-viewport">
        <div id="success-msg" class="notification"><i class="fas fa-check-circle"></i> OBJEKTIVI U ARRIT!</div>
        <canvas id="canvas"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let magnets = [];
    let poleType = 1; // 1 for North, -1 for South
    let currentI = 2.5; // Amper
    let lengthL = 0.5; // Metra
    
    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function setPole(type) {
        poleType = type;
        document.getElementById('northBtn').classList.toggle('active', type === 1);
        document.getElementById('southBtn').classList.toggle('active', type === -1);
    }

    function resetField() { magnets = []; }

    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        magnets.push({
            x: e.clientX - rect.left,
            y: e.clientY - rect.top,
            type: poleType
        });
    });

    function calculateB(px, py) {
        let totalB = 0;
        magnets.forEach(m => {
            let d = Math.hypot(px - m.x, py - m.y) + 50;
            totalB += (m.type * 5000) / (d * d);
        });
        return totalB;
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Vizato përcjellësin (Current Wire)
        ctx.strokeStyle = "#4a4e69";
        ctx.lineWidth = 24;
        ctx.beginPath();
        ctx.moveTo(width/2, 0);
        ctx.lineTo(width/2, height);
        ctx.stroke();
        
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(width/2, 0);
        ctx.lineTo(width/2, height);
        ctx.stroke();

        // Llogarit B dhe F në mes të përcjellësit
        let B = calculateB(width/2, height/2);
        let F = Math.abs(B * currentI * lengthL);

        document.getElementById('b-val').innerText = Math.abs(B).toFixed(2) + " T";
        document.getElementById('f-val').innerText = F.toFixed(2) + " N";

        // Vizato grimcat e rrymës (I)
        let offset = (Date.now() % 1000) / 1000 * 50;
        ctx.fillStyle = "#ffafcc";
        ctx.strokeStyle = "#4a4e69";
        ctx.lineWidth = 2;
        for(let i=0; i<height; i+=50) {
            ctx.beginPath();
            ctx.arc(width/2, i + offset, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }

        // Vizato magnetët
        magnets.forEach(m => {
            ctx.fillStyle = m.type === 1 ? "#ffafcc" : "#a2d2ff";
            ctx.fillRect(m.x - 25, m.y - 35, 50, 70);
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 4;
            ctx.strokeRect(m.x - 25, m.y - 35, 50, 70);
            
            ctx.fillStyle = "#4a4e69";
            ctx.font = "bold 24px VT323";
            ctx.textAlign = "center";
            ctx.fillText(m.type === 1 ? "N" : "S", m.x, m.y + 8);
        });

        // Kontrollo fitoren (Duhet forcë > 10N)
        if(F > 10) {
            document.getElementById('success-msg').style.display = 'block';
        } else {
            document.getElementById('success-msg').style.display = 'none';
        }

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
