<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Current Master - Intensitetit i Rrymës</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }
        h1 { 
            font-family: 'VT323', monospace; 
            font-size: 3.5rem; 
            color: var(--accent); 
            text-shadow: 3px 3px 0px var(--border); 
            margin-bottom: 4px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        p {
            color: var(--text); 
            font-size: 1.5rem; 
            margin-bottom: 24px; 
            font-family: 'VT323', monospace;
        }
        #game-container { 
            position: relative; 
            border: 4px solid var(--border); 
            background: var(--surface); 
            padding: 24px; 
            box-shadow: 8px 8px 0px var(--border); 
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        canvas { 
            background: #e2e8f0; 
            border: 4px solid var(--border); 
            display: block;
            width: 100%;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
        }
        .controls { 
            display: flex; 
            gap: 20px; 
            background: var(--surface); 
            padding: 20px; 
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0px var(--border); 
            width: 100%;
            max-width: 600px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-box { 
            text-align: center; 
            min-width: 120px; 
            background: var(--bg);
            border: 4px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
        }
        .stat-box label {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            display: block;
            margin-bottom: 8px;
        }
        .amp-meter { 
            font-family: 'VT323', monospace;
            font-size: 2.5rem; 
            color: var(--accent2); 
            font-weight: bold; 
            text-align: center;
            margin-top: 10px;
            text-shadow: 2px 2px 0px var(--border);
        }
        input[type=range] { 
            cursor: pointer; 
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border: 2px solid var(--border);
            background: #e2e8f0;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            cursor: pointer;
        }
        .target-box { 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 1.8rem; 
            font-family: 'VT323', monospace;
            text-shadow: 2px 2px 0px var(--border);
        }
        #scoreDisplay {
            color: var(--accent2); 
            font-weight: bold; 
            font-size: 1.8rem; 
            font-family: 'VT323', monospace;
            text-shadow: 2px 2px 0px var(--border);
        }
        button { 
            padding: 10px 25px; 
            background: var(--accent); 
            border: 4px solid var(--border); 
            color: var(--text); 
            cursor: pointer; 
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
        }
        button:active { 
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-bolt"></i> Current Master</h1>
    <p>Gjej Intensitetin e duhur (I) për të ndezur pajisjen pa e djegur atë!</p>

    <div id="game-container">
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <div class="target-box" id="targetDisplay">Target: 2.50 A</div>
            <div id="scoreDisplay">Pikët: 0</div>
        </div>
        <canvas id="circuitCanvas" width="500" height="250"></canvas>
        <div class="amp-meter" id="currentDisplay">I = 0.00 A</div>
    </div>

    <div class="controls">
        <div class="stat-box">
            <label>Tensioni (U): <span id="uVal">10</span>V</label>
            <input type="range" id="uInput" min="1" max="50" value="10">
        </div>
        <div class="stat-box">
            <label>Rezistenca (R): <span id="rVal">10</span>Ω</label>
            <input type="range" id="rInput" min="1" max="50" value="10">
        </div>
        <button onclick="checkCircuit()">AKTIVIZO</button>
    </div>

    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        
        let targetI = (Math.random() * 4 + 0.5).toFixed(2);
        let score = 0;
        let particles = [];

        function updateUI() {
            let u = document.getElementById('uInput').value;
            let r = document.getElementById('rInput').value;
            let i = u / r;
            
            document.getElementById('uVal').innerText = u;
            document.getElementById('rVal').innerText = r;
            document.getElementById('currentDisplay').innerText = `I = ${i.toFixed(2)} A`;
            document.getElementById('targetDisplay').innerText = `Target: ${targetI} A`;
            return i;
        }

        function drawCircuit() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 6;

            // Vizatimi i qarkut (katror)
            ctx.strokeRect(100, 50, 300, 150);

            // Bateria (U)
            ctx.fillStyle = "#ffafcc";
            ctx.fillRect(80, 100, 40, 50);
            ctx.strokeRect(80, 100, 40, 50);
            ctx.fillStyle = "#4a4e69";
            ctx.font = "20px VT323";
            ctx.fillText("U", 95, 130);

            // Rezistenca (R)
            ctx.fillStyle = "#a2d2ff";
            ctx.fillRect(225, 40, 50, 20);
            ctx.strokeRect(225, 40, 50, 20);
            ctx.fillStyle = "#4a4e69";
            ctx.fillText("R", 245, 55);

            // Animacioni i rrymës (elektronet)
            let i = updateUI();
            if (particles.length < i * 20) {
                particles.push({pos: 0, speed: i * 2});
            }
            if (particles.length > i * 20) particles.pop();

            ctx.fillStyle = "#ffc8dd";
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 2;
            particles.forEach(p => {
                p.pos += p.speed;
                if (p.pos > 900) p.pos = 0;

                let x, y;
                if (p.pos < 300) { x = 100 + p.pos; y = 50; }
                else if (p.pos < 450) { x = 400; y = 50 + (p.pos-300); }
                else if (p.pos < 750) { x = 400 - (p.pos-450); y = 200; }
                else { x = 100; y = 200 - (p.pos-750); }
                
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
            });

            requestAnimationFrame(drawCircuit);
        }

        function checkCircuit() {
            let currentI = updateUI();
            let diff = Math.abs(currentI - targetI);

            if (diff < 0.1) {
                alert("SUKSES! Intensiteti është perfekt.");
                score++;
                targetI = (Math.random() * 4 + 0.5).toFixed(2);
                document.getElementById('scoreDisplay').innerText = `Pikët: ${score}`;
            } else if (currentI > targetI) {
                alert("BOOM! Rryma është shumë e lartë, dogje pajisjen!");
                score = 0;
                document.getElementById('scoreDisplay').innerText = `Pikët: ${score}`;
            } else {
                alert("Shumë dobët... Pajisja nuk ndizet.");
            }
        }

        drawCircuit();
    </script>
</body>
</html>
