<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermo Battle: Nxehtësia Specifike</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle, #27272a 0%, #000 100%);
        }
        #game-board {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: url('data:image/svg+xml;utf8,<svg fill="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23451a03"/><path d="M0 70 L100 70 L100 100 L0 100 Z" fill="%23fcd34d"/><path d="M0 70 L20 60 L40 70 L60 60 L80 70 L100 60 L100 70 Z" fill="%23b45309"/></svg>') center/cover no-repeat;
            border: 4px solid #b45309;
            position: relative;
            box-shadow: 0 0 50px rgba(180, 83, 9, 0.5);
            image-rendering: pixelated;
        }
        
        /* Health Bars */
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            position: absolute;
            top: 0;
            width: calc(100% - 40px);
            z-index: 10;
        }
        .player-info { width: 40%; }
        .name { font-size: 14px; margin-bottom: 5px; text-shadow: 2px 2px #000; }
        .health-bar-bg { background: #ef4444; height: 20px; border: 4px solid #fff; position: relative; }
        .health-bar { background: #22c55e; height: 100%; width: 100%; transition: width 0.3s; }
        #p1-info .health-bar-bg { border-color: #fca5a5; }
        #p2-info .health-bar-bg { border-color: #93c5fd; }
        
        .timer {
            font-size: 24px;
            color: #facc15;
            text-shadow: 3px 3px #000;
            align-self: center;
        }

        /* Characters */
        .fighter {
            position: absolute;
            bottom: 60px;
            font-size: 80px;
            transition: all 0.2s;
            filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.5));
        }
        #p1 { left: 10%; transform: scaleX(-1); } /* face right */
        #p2 { right: 10%; } /* face left */
        
        .attack-fx {
            position: absolute;
            font-size: 40px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 5;
        }
        
        /* Dashboard UI */
        .dashboard {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 140px;
            background: rgba(0,0,0,0.85);
            border-top: 4px solid #facc15;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }
        .formula-box {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .question {
            color: #facc15;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.5;
        }
        .input-area {
            display: flex;
            gap: 15px;
        }
        input {
            font-family: inherit;
            background: #1e1b4b;
            color: #10b981;
            border: 2px solid #6366f1;
            padding: 10px;
            font-size: 18px;
            width: 150px;
            text-align: center;
            outline: none;
        }
        button {
            font-family: inherit;
            background: #dc2626;
            color: white;
            border: 4px solid #7f1d1d;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        button:active {
            transform: scale(0.95);
        }
        
        /* Animations */
        @keyframes p1Attack {
            0% { left: 10%; }
            50% { left: 60%; transform: scaleX(-1) rotate(-15deg); }
            100% { left: 10%; transform: scaleX(-1) rotate(0deg); }
        }
        @keyframes p2Attack {
            0% { right: 10%; transform: scaleX(1); }
            50% { right: 60%; transform: scaleX(1) rotate(15deg); }
            100% { right: 10%; transform: scaleX(1); }
        }
        @keyframes hitShake {
            0% { transform: translateX(0); filter: brightness(1); }
            25% { transform: translateX(-10px); filter: brightness(2) contrast(2) sepia(1) hue-rotate(300deg); } /* flash red */
            50% { transform: translateX(10px); filter: brightness(1); }
            75% { transform: translateX(-10px); filter: brightness(2) contrast(2) sepia(1) hue-rotate(300deg); }
            100% { transform: translateX(0); filter: brightness(1); }
        }
        @keyframes fireFX {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(2) translateY(-50px); }
        }
        @keyframes blockFX {
            0% { opacity: 1; transform: scale(1); filter: brightness(2); }
            100% { opacity: 0; transform: scale(1.5); }
        }
        
        /* Screen messages */
        .big-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #ef4444;
            text-shadow: 4px 4px #000;
            z-index: 20;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-board">
    <div class="hud">
        <div class="player-info" id="p1-info">
            <div class="name" style="color: #fca5a5;">FIRE BOY (TI)</div>
            <div class="health-bar-bg">
                <div class="health-bar" id="p1-hp"></div>
            </div>
        </div>
        <div class="timer">VS</div>
        <div class="player-info" id="p2-info">
            <div class="name" style="text-align:right; color: #93c5fd;">ICE GOLEM (CPU)</div>
            <div class="health-bar-bg" style="display:flex; justify-content:flex-end;">
                <div class="health-bar" id="p2-hp"></div>
            </div>
        </div>
    </div>
    
    <div id="p1" class="fighter">🔥</div>
    <div id="p2" class="fighter">⛄</div>
    <div id="fx" class="attack-fx">💥</div>

    <div class="big-msg" id="msg-overlay">KO!</div>

    <div class="dashboard">
        <div class="formula-box">Nxehtësia: Q = c · m · Δt</div>
        <div class="question" id="q-text">Masa: 2kg, c: 500J/kgK, Δt: 10K. Q = ?</div>
        <div class="input-area">
            <input type="number" id="ans" placeholder="J">
            <button onclick="strike()">SULMO!</button>
        </div>
    </div>
</div>

<script>
    const qEl = document.getElementById('q-text');
    const ansEl = document.getElementById('ans');
    const p1HpLine = document.getElementById('p1-hp');
    const p2HpLine = document.getElementById('p2-hp');
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    const fx = document.getElementById('fx');
    const msgOverlay = document.getElementById('msg-overlay');
    
    let p1Hp = 100;
    let p2Hp = 100;
    let currentQ = 0;
    let isGameOver = false;

    function generate() {
        if(isGameOver) return;
        ansEl.value = '';
        
        let m = Math.floor(Math.random() * 5) + 1;
        let c = (Math.floor(Math.random() * 5) + 1) * 100; // 100 to 500
        let dt = (Math.floor(Math.random() * 5) + 1) * 10; // 10 to 50
        
        currentQ = m * c * dt;
        
        qEl.innerHTML = \`Masa <b>\${m}kg</b>, c <b>\${c} J/kg·K</b>, Δt <b>\${dt} K</b>. Përgjigju shpejt!\`;
    }

    function strike() {
        if(isGameOver) return;
        let val = parseInt(ansEl.value);
        if(isNaN(val)) return;

        if(val === currentQ) {
            // Player attacks!
            p1.style.animation = 'p1Attack 0.6s ease';
            setTimeout(() => {
                // fx hit
                fx.innerText = '🔥';
                fx.style.right = '10%';
                fx.style.left = 'auto';
                fx.style.bottom = '80px';
                fx.style.animation = 'fireFX 0.4s ease forwards';
                
                // p2 takes damage
                p2.style.animation = 'hitShake 0.4s';
                p2Hp -= 25;
                if(p2Hp < 0) p2Hp = 0;
                p2HpLine.style.width = p2Hp + '%';
                
                checkWin();
            }, 300);
            
            setTimeout(() => {
                p1.style.animation = '';
                p2.style.animation = '';
                fx.style.animation = '';
                generate();
            }, 800);
            
        } else {
            // Player missed, CPU attacks!
            qEl.innerText = "GABIM! Enemy counterattack!";
            p2.style.animation = 'p2Attack 0.6s ease';
            setTimeout(() => {
                fx.innerText = '❄️';
                fx.style.left = '10%';
                fx.style.right = 'auto';
                fx.style.bottom = '80px';
                fx.style.animation = 'blockFX 0.4s ease forwards';
                
                p1.style.animation = 'hitShake 0.4s';
                p1Hp -= 25;
                if(p1Hp < 0) p1Hp = 0;
                p1HpLine.style.width = p1Hp + '%';
                
                checkWin();
            }, 300);
            
            setTimeout(() => {
                p1.style.animation = '';
                p2.style.animation = '';
                fx.style.animation = '';
                generate();
            }, 1200);
        }
    }

    function checkWin() {
        if(p2Hp <= 0) {
            isGameOver = true;
            msgOverlay.innerText = "YOU WIN!";
            msgOverlay.style.color = "#22c55e";
            msgOverlay.style.display = "block";
            p2.innerText = "💀";
        } else if(p1Hp <= 0) {
            isGameOver = true;
            msgOverlay.innerText = "GAME OVER";
            msgOverlay.style.color = "#ef4444";
            msgOverlay.style.display = "block";
            p1.innerText = "💀";
        }
    }

    ansEl.addEventListener('keypress', e => {
        if(e.key === 'Enter') strike();
    });

    generate();
</script>
</body>
</html>
