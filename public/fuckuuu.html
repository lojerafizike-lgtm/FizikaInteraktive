<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">

    <style>
        :root { --bg: #f0f9ff; --card: #ffffff; --primary: #7dd3fc; --text: #0f172a; --timer: #4ade80; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: var(--card); width: 95%; max-width: 650px; padding: 30px; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; border: 5px solid var(--primary); }
        .timer-wrap { width: 100%; height: 10px; background: #e2e8f0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--timer); transition: width 0.1s linear; }
        .avatar { font-size: 70px; height: 90px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .question { font-size: 1.3rem; font-weight: 700; margin: 20px 0; min-height: 70px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn { background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px; border-radius: 18px; cursor: pointer; font-size: 1rem; transition: 0.2s; font-weight: 500; }
        .opt-btn:hover { background: var(--primary); transform: translateY(-2px); }
        .correct { background: #bbf7d0 !important; border-color: #22c55e; }
        .wrong { background: #fecaca !important; border-color: #ef4444; }
        .stats { display: flex; justify-content: space-between; margin-top: 25px; font-weight: bold; opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-card">

        <div style="font-size: 0.9rem;">Progresi: <span id="q-num">1</span>/100</div>
        <div class="timer-wrap"><div id="timer-bar"></div></div>
        <div class="question" id="q-text">Duke ngarkuar...</div>
        <div class="options" id="opt-container"></div>
        <div class="stats">
            <span>Pikët: <span id="score">0</span></span>
            <span>Koha: <span id="time">10</span>s</span>
        </div>
    </div>
    <div id="end-ui" class="hidden">

        <h2>Misioni u mbyll!</h2>
        <p id="final-stats"></p>
        <button class="opt-btn" style="width:100%; background: var(--primary);" onclick="location.reload()">Luaj Përsëri</button>
    </div>
</div>

    let idx = 0, score = 0, time = 10, timer;

    function startTimer() {
        clearInterval(timer); time = 10;
        timer = setInterval(() => {
            time -= 0.1;
            document.getElementById('timer-bar').style.width = (time/10)*100 + "%";
            document.getElementById('time').innerText = Math.ceil(time);
            if(time <= 0) { clearInterval(timer); next(false); }
        }, 100);
    }

    function load() {
        if(idx >= data.length) return end();
        const q = data[idx];
        document.getElementById('avatar').innerText = q.e;
        document.getElementById('q-num').innerText = idx + 1;
        document.getElementById('q-text').innerText = q.q;
        const cont = document.getElementById('opt-container'); cont.innerHTML = '';
        q.a.forEach((opt, i) => {
            const b = document.createElement('button'); b.className = 'opt-btn';
            b.innerText = opt; b.onclick = () => check(i, b); cont.appendChild(b);
        });
        startTimer();
    }

    function check(i, b) {
        clearInterval(timer);
        const correct = data[idx].c;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(btn => btn.style.pointerEvents = 'none');
        if(i === correct) { b.classList.add('correct'); score += 10; }
        else { b.classList.add('wrong'); btns[correct].classList.add('correct'); }
        setTimeout(() => next(true), 1200);
    }

    function next(click) {
        idx++; load();
        document.getElementById('score').innerText = score;
    }

    function end() {
        document.getElementById('quiz-ui').classList.add('hidden');
        document.getElementById('end-ui').classList.remove('hidden');
        document.getElementById('final-stats').innerText = `Ke mbledhur ${score} pikë nga 1000 të mundshme!`;
    }

    load();
