<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Train · Puna në TD</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#FFAFC5;--rosedk:#D4517A;
  --sky:#B8DCFF;--skydk:#4A8FD4;
  --mint:#B8F0DC;--mintdk:#2E9E70;
  --lav:#D5C8FF;--lavdk:#7A60D4;
  --sun:#FFE8A3;--sundk:#C08820;
  --peach:#FFD4B8;--peachdk:#C07040;
  --cream:#FFF8F2;--ink:#2A1A3E;--soft:#8A7AAA;
  --white:#FFFFFF;
}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 80% 80% at 20% 10%,#EDD5FF 0%,#C8E8FF 45%,#C8FFE8 100%);
  display:flex;justify-content:center;align-items:center;
  font-family:'M PLUS Rounded 1c',sans-serif;
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.28;animation:orbf ease-in-out infinite alternate}
@keyframes orbf{from{transform:translate(0,0)}to{transform:translate(18px,-28px)}}

.card{
  width:min(680px,96vw);
  background:var(--white);
  border-radius:28px;
  box-shadow:0 4px 0 var(--rosedk),0 12px 60px rgba(42,26,62,.13),inset 0 1px 0 #fff;
  overflow:hidden;
}

.stripe{height:8px;background:linear-gradient(90deg,var(--rose) 0 16.6%,var(--sun) 16.6% 33%,var(--mint) 33% 49.8%,var(--sky) 49.8% 66.4%,var(--lav) 66.4% 83%,var(--peach) 83% 100%)}

.header{
  background:linear-gradient(135deg,#FFF2FA 0%,#F2F0FF 100%);
  padding:16px 24px;border-bottom:1.5px solid #EEE8F8;
  display:flex;align-items:center;justify-content:space-between;
}
.title{font-family:'DotGothic16',monospace;font-size:17px;color:var(--ink);letter-spacing:1px}
.title em{color:var(--rosedk);font-style:normal}
.badge{background:var(--sun);border:1.5px solid var(--sundk);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:800;color:var(--sundk)}

/* Scene */
.scene{
  height:176px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#C0E8FF 0%,#DFF4FF 48%,#BAEFD8 48%,#98DDB8 78%,#80CC9E 100%);
}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;opacity:.5}
.cloud{position:absolute;top:12px;font-size:24px;opacity:.7;animation:cloudmove linear infinite}
@keyframes cloudmove{from{transform:translateX(-80px)}to{transform:translateX(720px)}}

.track-bg{position:absolute;bottom:0;width:100%;height:38px}
.rail-line{position:absolute;bottom:15px;width:200%;height:4px;background:var(--lavdk);border-radius:2px}
.sleepers{
  position:absolute;bottom:10px;width:200%;height:11px;
  background:repeating-linear-gradient(90deg,var(--peachdk) 0,var(--peachdk) 7px,transparent 7px,transparent 40px);
  animation:sleepanim 1.1s linear infinite;animation-play-state:paused;
}
@keyframes sleepanim{from{transform:translateX(0)}to{transform:translateX(-47px)}}

.train{
  position:absolute;bottom:26px;left:62px;font-size:52px;
  transform:scaleX(-1);
  transition:left .95s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.14));z-index:4;
}
.puff{
  position:absolute;border-radius:50%;background:rgba(213,200,255,.9);
  width:9px;height:9px;bottom:66px;left:76px;opacity:0;z-index:3;
}
@keyframes puffgo{
  0%{opacity:.9;transform:scale(1) translate(0,0)}
  100%{opacity:0;transform:scale(4.5) translate(26px,-26px)}
}
.vflag{position:absolute;bottom:26px;z-index:5;display:flex;flex-direction:column;align-items:center}
.vflag .pole{width:2px;height:52px;background:var(--sundk);opacity:.8}
.vflag .label{
  font-family:'DotGothic16',monospace;font-size:9px;font-weight:700;color:var(--sundk);
  background:var(--sun);border:1.5px solid var(--sundk);padding:2px 7px;border-radius:4px;
  white-space:nowrap;box-shadow:0 2px 0 var(--sundk);
}

/* Panel */
.panel{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid #EEE8F8}

.data-pane{
  padding:20px 22px;
  background:linear-gradient(160deg,#FFF8FF 0%,#F8F2FF 100%);
  border-right:1.5px solid #EEE8F8;
}
.pane-title{font-family:'DotGothic16',monospace;font-size:9px;letter-spacing:2px;color:var(--soft);text-transform:uppercase;margin-bottom:14px}
.drow{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
.dkey{font-size:12px;color:var(--soft);font-weight:700;flex-shrink:0}
.dval{font-family:'DotGothic16',monospace;font-size:17px;color:var(--lavdk)}
.dunit{font-size:10px;color:var(--soft)}

.input-pane{
  padding:20px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
}
.ilabel{font-size:10px;font-weight:800;color:var(--soft);letter-spacing:1px;text-transform:uppercase}

input[type=number]{
  font-family:'DotGothic16',monospace;font-size:19px;text-align:center;
  width:100%;max-width:176px;padding:10px 12px;
  background:#FFF8FF;border:2px solid var(--lav);border-radius:14px;
  color:var(--lavdk);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input[type=number]:focus{border-color:var(--lavdk);box-shadow:0 0 0 4px rgba(213,200,255,.3)}
input::placeholder{color:#C8B8E8}

.btn{
  font-family:'DotGothic16',monospace;font-size:12px;letter-spacing:1px;
  padding:11px 20px;width:176px;
  background:var(--rosedk);color:#fff;border:none;border-radius:14px;cursor:pointer;
  box-shadow:0 4px 0 #A03060,0 6px 18px rgba(212,81,122,.28);
  transition:all .12s;
}
.btn:hover{background:#E05585;transform:translateY(-1px);box-shadow:0 5px 0 #A03060,0 8px 22px rgba(212,81,122,.34)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A03060}

.statusbar{
  padding:10px 22px;background:#FFF8FF;border-top:1.5px solid #EEE8F8;
  display:flex;align-items:center;justify-content:space-between;
}
.msgtxt{font-family:'DotGothic16',monospace;font-size:10px;color:var(--soft);letter-spacing:.5px;transition:color .2s}
.chips{display:flex;gap:7px}
.chip{padding:4px 11px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:.5px}
.chip-ok{background:var(--mint);color:var(--mintdk)}
.chip-err{background:var(--rose);color:var(--rosedk)}

.popfx{
  position:absolute;pointer-events:none;font-size:18px;z-index:10;
  animation:popfly .65s ease-out forwards;
}
@keyframes popfly{
  0%{opacity:1;transform:scale(.3) translateY(0) rotate(0)}
  60%{opacity:1;transform:scale(1.4) translateY(-28px) rotate(15deg)}
  100%{opacity:0;transform:scale(.9) translateY(-55px) rotate(-5deg)}
}
</style>
</head>
<body>
<div class="orb" style="width:320px;height:320px;background:#D5C8FF;top:-100px;left:-80px;animation-duration:9s"></div>
<div class="orb" style="width:220px;height:220px;background:#FFAFC5;bottom:-60px;right:-50px;animation-duration:7s;animation-delay:-3s"></div>
<div class="orb" style="width:180px;height:180px;background:#B8F0DC;bottom:8%;left:8%;animation-duration:11s;animation-delay:-5s"></div>

<div class="card">
  <div class="stripe"></div>
  <div class="header">
    <div class="title">🚂 PUNA <em>TD</em></div>
    <div class="badge">A = p · (V₂ − V₁)</div>
  </div>

  <div class="scene">
    <div class="hill" style="width:240px;height:85px;background:#98DDB8;right:0;bottom:0"></div>
    <div class="hill" style="width:160px;height:62px;background:#AAE8C4;left:80px;bottom:0"></div>
    <div class="cloud" style="animation-duration:17s">☁️</div>
    <div class="cloud" style="animation-duration:24s;animation-delay:-9s;font-size:18px;top:24px">⛅</div>

    <div class="track-bg">
      <div class="rail-line"></div>
      <div class="sleepers" id="sleepers"></div>
    </div>

    <div class="vflag" id="flag1" style="left:62px">
      <div class="label">V₁</div><div class="pole"></div>
    </div>
    <div class="vflag" id="flag2" style="left:310px">
      <div class="label" id="v2lbl">V₂</div><div class="pole"></div>
    </div>

    <div class="train" id="train">🚂</div>
    <div class="puff" id="pf1"></div>
    <div class="puff" id="pf2" style="left:90px"></div>
  </div>

  <div class="panel">
    <div class="data-pane">
      <div class="pane-title">📊 Të Dhënat</div>
      <div class="drow"><span class="dkey">Shtypja p</span><span class="dval" id="pv">—</span><span class="dunit">Pa</span></div>
      <div class="drow"><span class="dkey">V₁</span><span class="dval" id="v1v">—</span><span class="dunit">m³</span></div>
      <div class="drow"><span class="dkey">V₂</span><span class="dval" id="v2v">—</span><span class="dunit">m³</span></div>
    </div>
    <div class="input-pane">
      <div class="ilabel">🎯 Llogarit Punën</div>
      <input type="number" id="ans" placeholder="? Xhaul" autocomplete="off">
      <button class="btn" onclick="check()">NDIZ MOTORIN ▶</button>
    </div>
  </div>

  <div class="statusbar">
    <div class="msgtxt" id="msg">Gati! Llogarit A në Joule.</div>
    <div class="chips">
      <div class="chip chip-ok">✓ <span id="sc">0</span></div>
      <div class="chip chip-err">✗ <span id="sw">0</span></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let work=0,sc=0,sw=0;

function fx(emoji){
  const d=document.createElement('div');
  d.className='popfx';d.textContent=emoji;
  d.style.cssText=`left:${110+Math.random()*340}px;top:${80+Math.random()*70}px`;
  document.querySelector('.card').appendChild(d);
  setTimeout(()=>d.remove(),700);
}
function setMsg(t,c){$('msg').textContent=t;$('msg').style.color=c}

function generate(){
  const train=$('train'),sl=$('sleepers'),f2=$('flag2');
  train.style.left='62px'; train.style.transform='scaleX(-1)';
  sl.style.animationPlayState='paused';
  $('pf1').style.animation=$('pf2').style.animation='none';
  setMsg('Gati! Llogarit A në Xhaul.','var(--soft)');
  $('ans').value=''; $('ans').focus();

  const p=(Math.floor(Math.random()*5)+1)*10;
  const v1=Math.floor(Math.random()*3)+1;
  const v2=v1+Math.floor(Math.random()*4)+1;
  work=p*(v2-v1);
  $('pv').textContent=p; $('v1v').textContent=v1; $('v2v').textContent=v2;
  f2.style.left=(62+(v2-v1)*54)+'px';
}

function check(){
  const val=parseInt($('ans').value); if(isNaN(val))return;
  if(val===work){
    sc++; $('sc').textContent=sc;
    setMsg('✨ Saktë! Treni u nis!','var(--mintdk)');
    const sl=$('sleepers'),tr=$('train');
    sl.style.animationPlayState='running';
    $('pf1').style.animation='puffgo .75s steps(3) infinite';
    $('pf2').style.animation='puffgo .75s steps(3) infinite .38s';
    ['⭐','🌸','✨','💫','🎀'].forEach((e,i)=>setTimeout(()=>fx(e),i*65));
    tr.style.left=(parseInt($('flag2').style.left)-12)+'px';
    setTimeout(()=>{
      sl.style.animationPlayState='paused';
      $('pf1').style.animation=$('pf2').style.animation='none';
      setTimeout(generate,1300);
    },1050);
  } else {
    sw++; $('sw').textContent=sw;
    setMsg('💥 Gabim! Kontrollo llogaritjen.','var(--rosedk)');
    const tr=$('train');
    tr.style.transform='scaleX(-1) translateX(11px)';
    setTimeout(()=>tr.style.transform='scaleX(-1) translateX(-8px)',85);
    setTimeout(()=>tr.style.transform='scaleX(-1) translateX(6px)',165);
    setTimeout(()=>tr.style.transform='scaleX(-1)',245);
  }
}
$('ans').addEventListener('keypress',e=>{if(e.key==='Enter')check()});
generate();
</script>
</body>
</html>
