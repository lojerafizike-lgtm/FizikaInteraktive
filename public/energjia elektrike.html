<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Energjia Elektrike</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #e3f2fd; --card: #ffffff; --primary: #29b6f6; --dark: #0288d1; --text: #01579b; --success: #66bb6a; --error: #ff7043; }
        body { margin: 0; background: var(--bg); font-family: 'Nunito', sans-serif; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        .karta { background: var(--card); padding: 40px; border-radius: 32px; box-shadow: 0 15px 35px rgba(41, 182, 246, 0.2); max-width: 600px; width: 100%; text-align: center; }
        h1 { font-family: 'Fredoka', sans-serif; color: var(--dark); margin: 0 0 10px; font-size: 28px; }
        .formula { background: #e1f5fe; color: var(--dark); padding: 10px 25px; border-radius: 50px; font-weight: 700; font-size: 18px; display: inline-block; margin: 10px 0 30px; }
        p { margin: 0 0 20px; opacity: 0.7; }
        .parametrat { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .kutia { background: #f1f8e9; padding: 15px 25px; border-radius: 20px; border-bottom: 4px solid #dcedc8; }
        .kutia span { display: block; font-size: 12px; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
        .kutia b { font-size: 20px; font-family: 'Fredoka'; color: var(--dark); }

        .skena { height: 320px; background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%); border-radius: 24px; position: relative; overflow: hidden; margin-bottom: 30px; border: 4px solid #fff59d; display: flex; justify-content: center; align-items: center; }
        
        /* Bateria e bukur pastel */
        .bateria { width: 80px; height: 140px; background: linear-gradient(90deg, #fafafa, #e0e0e0); border-radius: 12px; position: relative; z-index: 2; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0; border: 3px solid #bdbdbd; }
        .bateria::before { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 30px; height: 12px; background: #bdbdbd; border-radius: 4px 4px 0 0; }
        .bateria .plus { color: #ef5350; font-weight: 900; font-size: 24px; text-align: center; }
        .bateria .minus { color: #42a5f5; font-weight: 900; font-size: 24px; text-align: center; }

        /* Llamba e qelqit e bukur */
        .llamba-container { position: relative; width: 100px; height: 150px; z-index: 2; }
        .llamba-glass { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.5); border-radius: 50% 50% 40% 40%; border: 3px solid #b0bec5; position: absolute; top: 0; left: 10px; transition: all 0.3s; box-shadow: inset 0 0 20px rgba(176, 190, 197, 0.3); backdrop-filter: blur(2px); }
        .llamba-base { width: 40px; height: 40px; background: linear-gradient(90deg, #b0bec5 0%, #eceff1 50%, #b0bec5 100%); position: absolute; bottom: 10px; left: 30px; border-radius: 4px; }
        .llamba-base::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 8px); }
        .filament { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; border: 3px solid #b0bec5; border-bottom: none; border-radius: 50% 50% 0 0; opacity: 0.5; transition: all 0.3s; clip-path: polygon(0 100%, 10% 0, 30% 80%, 50% 0, 70% 80%, 90% 0, 100% 100%); }

        .llamba-container.ndezur .llamba-glass { background: radial-gradient(circle at 30% 30%, #ffffff, #fff176 60%, #ffd54f 100%); border-color: #fff; box-shadow: 0 0 40px 10px #fff176, 0 0 80px 20px #ffd54f; }
        .llamba-container.ndezur .filament { border-color: #fff; opacity: 1; box-shadow: 0 0 15px #fff; }

        /* Telat */
        .wire { position: absolute; height: 6px; background: #78909c; border-radius: 3px; z-index: 1; }
        .wire::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #29b6f6, transparent); background-size: 20px 100%; opacity: 0; border-radius: 3px; }
        .wire.aktiv::after { opacity: 1; animation: flow 0.5s linear infinite; }
        @keyframes flow { from { background-position: 0 0; } to { background-position: 20px 0; } }
        .w1 { width: 150px; top: 45%; left: 15%; transform: rotate(15deg); }
        .w2 { width: 150px; top: 55%; right: 15%; transform: rotate(-15deg); }

        input { padding: 15px; border: 2px solid #b3e5fc; border-radius: 16px; font-size: 18px; width: 200px; text-align: center; font-family: 'Nunito'; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(41, 182, 246, 0.2); }
        button { padding: 15px 30px; background: var(--primary); color: white; border: none; border-radius: 16px; font-family: 'Fredoka'; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); transition: 0.1s; }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--dark); }
        .btn-reset { background: var(--success); box-shadow: 0 4px 0 #2e7d32; display: none; margin-top: 15px; }
        #mesazhi { margin-top: 20px; font-weight: 700; font-size: 18px; min-height: 25px; }
    </style>
</head>
<body>
    <div class="karta">
        <h1>Laboratori i Energjisë Elektrike</h1>
        <div class="formula">E = U · I · t</div>
        <p>Llogarit energjinë totale të konsumuar në <b>Joule (J)</b></p>
        <div class="parametrat">
            <div class="kutia"><span>Tensioni (U)</span><b id="el-u">0 V</b></div>
            <div class="kutia"><span>Rryma (I)</span><b id="el-i">0 A</b></div>
            <div class="kutia"><span>Koha (t)</span><b id="el-t">0 s</b></div>
        </div>
        <div class="skena">
            <div class="wire w1" id="el-w1"></div>
            <div class="wire w2" id="el-w2"></div>
            <div class="bateria">
                <div class="plus">+</div>
                <div style="writing-mode: vertical-rl; color: #757575; font-weight: bold; letter-spacing: 5px; font-size: 12px;">BATERIA</div>
                <div class="minus">-</div>
            </div>
            <div class="llamba-container" id="el-llamba-cont">
                <div class="llamba-glass"></div>
                <div class="filament"></div>
                <div class="llamba-base"></div>
            </div>
        </div>
        <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
            <input type="number" id="el-input" placeholder="Energjia (J)">
            <button onclick="el_ndiz()">NDIZ QARKUN</button>
        </div>
        <div id="el-mesazhi"></div>
        <button class="btn-reset" id="el-reset" onclick="el_init()">EKSPERIMENT I RI</button>
    </div>

    <script>
        let u, i, t, tE;
        function el_init() {
            u = Math.floor(Math.random()*12)+12; i = parseFloat((Math.random()*2+0.5).toFixed(1)); t = Math.floor(Math.random()*50)+10;
            tE = Math.round(u*i*t);
            document.getElementById('el-u').innerText = u + " V"; document.getElementById('el-i').innerText = i + " A"; document.getElementById('el-t').innerText = t + " s";
            document.getElementById('el-input').value = ""; document.getElementById('el-mesazhi').innerText = ""; document.getElementById('el-reset').style.display = "none";
            document.getElementById('el-llamba-cont').classList.remove('ndezur'); document.getElementById('el-w1').classList.remove('aktiv'); document.getElementById('el-w2').classList.remove('aktiv');
        }
        function el_ndiz() {
            let v = parseFloat(document.getElementById('el-input').value); let msg = document.getElementById('el-mesazhi');
            if(isNaN(v)) { msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Plotëso fushën!'; msg.style.color="#fbc02d"; return; }
            if(Math.abs(v - tE) <= 2) {
                document.getElementById('el-llamba-cont').classList.add('ndezur'); document.getElementById('el-w1').classList.add('aktiv'); document.getElementById('el-w2').classList.add('aktiv');
                msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> SAKTË! Qarku u mbyll.'; msg.style.color = "var(--success)"; document.getElementById('el-reset').style.display = "inline-block";
            } else {
                msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> GABIM! Duheshin ' + tE + ' J.'; msg.style.color = "var(--error)"; document.getElementById('el-reset').style.display = "inline-block";
            }
        }
        el_init();
    </script>
</body>
</html>
