<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Energjia Termike</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff3e0; --card: #ffffff; --primary: #ff9800; --dark: #e65100; --text: #5d4037; --success: #66bb6a; --error: #ef5350; }
        body { margin: 0; background: var(--bg); font-family: 'Nunito', sans-serif; display: flex; justify-content: center; padding: 40px 20px; color: var(--text); }
        .karta { background: var(--card); padding: 40px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); max-width: 600px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.8); }
        h1 { font-family: 'Fredoka', sans-serif; color: var(--dark); margin: 0 0 10px; font-size: 28px; }
        .formula { background: #fff3e0; color: var(--dark); padding: 10px 25px; border-radius: 50px; font-weight: 700; font-size: 18px; display: inline-block; margin: 10px 0 20px; }
        p { margin: 0 0 20px; opacity: 0.7; }
        .parametrat { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .kutia { background: #fafafa; padding: 15px 25px; border-radius: 20px; border-bottom: 4px solid #eee; min-width: 120px; }
        .kutia span { display: block; font-size: 12px; text-transform: uppercase; opacity: 0.6; font-weight: 700; }
        .kutia b { font-size: 20px; font-family: 'Fredoka'; color: var(--dark); }
        
        .skena { height: 300px; background: linear-gradient(to bottom, #fffde7, #fff9c4); border-radius: 24px; position: relative; overflow: hidden; margin-bottom: 30px; border: 4px solid #ffe082; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 30px; }
        .ene { width: 140px; height: 200px; background: rgba(255,255,255,0.5); border: 4px solid var(--dark); border-top: 0; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; position: relative; overflow: hidden; z-index: 2; clip-path: polygon(-10% 0, 110% 0, 110% 110%, 50% 100%, -10% 110%); }
        .uji { width: 100%; height: 70%; background: linear-gradient(to bottom, #4fc3f7, #0288d1); position: absolute; bottom: 0; transition: height 1s cubic-bezier(0.4, 0, 0.2, 1), background 1s; }
        /* Vala e ujit */
        .uji::before { content: ''; position: absolute; top: -10px; left: 0; width: 200%; height: 20px; background: radial-gradient(circle, #4fc3f7 20%, transparent 21%) repeat-x; background-size: 20px 20px; animation: vale 1s linear infinite; }
        @keyframes vale { from { transform: translateX(0); } to { transform: translateX(-20px); } }
        
        .bulla { position: absolute; width: 8px; height: 8px; background: rgba(255,255,255,0.6); border-radius: 50%; bottom: 0; animation: ngrije 2s infinite ease-in; }
        @keyframes ngrije { 0% { bottom: 0; opacity: 1; } 80% { opacity: 0.5; } 100% { bottom: 90%; opacity: 0; } }
        
        .flaka { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 80px; background: radial-gradient(circle at 50% 70%, #ffeb3b 20%, #ff9800 50%, transparent 70%); border-radius: 50% 50% 20% 20%; display: none; animation: dridhje 0.1s infinite alternate; z-index: 1; }
        @keyframes dridhje { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.1) skewX(5deg); } }

        input { padding: 15px; border: 2px solid #ffe0b2; border-radius: 16px; font-size: 18px; width: 200px; text-align: center; font-family: 'Nunito'; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.2); }
        button { padding: 15px 30px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Fredoka'; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #bf360c; transition: 0.1s; }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #bf360c; }
        .btn-reset { background: var(--success); box-shadow: 0 4px 0 #2e7d32; display: none; margin-top: 15px; }
        #mesazhi { margin-top: 20px; font-weight: 700; font-size: 18px; min-height: 25px; }
    </style>
</head>
<body>
    <div class="karta">
        <h1>Energjia e Brendshme</h1>
        <div class="formula">Q = m · c · ΔT</div>
        <p>Nxehtësia specifike e ujit: c = 4184 J/(kg·°C)</p>
        <div class="parametrat">
            <div class="kutia"><span>Masa (m)</span><b id="th-m">0 kg</b></div>
            <div class="kutia"><span>Temp. Init.</span><b id="th-ti">20°C</b></div>
            <div class="kutia"><span>Temp. Synuar</span><b id="th-tf">0°C</b></div>
        </div>
        <div class="skena">
            <div class="ene">
                <div id="th-uji" class="uji"></div>
            </div>
            <div id="th-flaka" class="flaka"></div>
        </div>
        <div style="display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
            <input type="number" id="th-input" placeholder="Joule (J)">
            <button onclick="th_ngroh()">FURNIZO NXEHTËSI</button>
        </div>
        <div id="th-mesazhi"></div>
        <button class="btn-reset" id="th-reset" onclick="th_init()">RIFILLO</button>
    </div>

    <script>
        let m, Ti=20, Tf, c=4184, tQ;
        function th_init() {
            m = parseFloat((Math.random()*0.4+0.1).toFixed(2));
            Tf = Math.floor(Math.random()*40)+45;
            tQ = Math.round(m*c*(Tf-Ti));
            document.getElementById('th-m').innerText = m + " kg";
            document.getElementById('th-tf').innerText = Tf + "°C";
            document.getElementById('th-input').value = "";
            document.getElementById('th-mesazhi').innerText = "";
            document.getElementById('th-reset').style.display = "none";
            document.getElementById('th-flaka').style.display = "none";
            let uji = document.getElementById('th-uji');
            uji.style.height = "70%"; 
            uji.style.background = "linear-gradient(to bottom, #4fc3f7, #0288d1)";
            // Fshij bullat
            document.querySelectorAll('.bulla').forEach(b => b.remove());
        }
        function th_ngroh() {
            let u = parseFloat(document.getElementById('th-input').value);
            let msg = document.getElementById('th-mesazhi');
            if(isNaN(u)) { msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Plotëso fushën!'; msg.style.color="#fbc02d"; return; }
            
            if(Math.abs(u - tQ) <= 50) {
                document.getElementById('th-flaka').style.display = "block";
                
                // Shto bulla
                let ene = document.querySelector('.ene');
                let intervali = setInterval(() => {
                    let bulla = document.createElement('div');
                    bulla.className = 'bulla';
                    bulla.style.left = (Math.random()*80 + 10) + "%";
                    ene.appendChild(bulla);
                    setTimeout(() => bulla.remove(), 2000);
                }, 100);

                setTimeout(() => {
                    clearInterval(intervali);
                    let uji = document.getElementById('th-uji');
                    uji.style.height = "60%";
                    uji.style.background = "linear-gradient(to bottom, #ffcc80, #e65100)";
                    msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> SAKTË! Temperatura arriti ' + Tf + '°C.';
                    msg.style.color = "var(--success)";
                    document.getElementById('th-flaka').style.display = "none";
                    document.getElementById('th-reset').style.display = "inline-block";
                }, 2000);
            } else {
                msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> GABIM! Duheshin ' + tQ + ' Joule.';
                msg.style.color = "var(--error)";
                document.getElementById('th-reset').style.display = "inline-block";
            }
        }
        th_init();
    </script>
</body>
</html>
