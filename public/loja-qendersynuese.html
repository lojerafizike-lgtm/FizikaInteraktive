<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca Qendërsynuese</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#00050f;--surface:#000d1a;--accent:#40c4ff;--accent2:#ff4081;--gold:#ffd600;--text:#e1f5fe;--muted:#4fc3f7;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--accent);text-shadow:0 0 20px var(--accent);margin-bottom:4px;letter-spacing:2px;}
  .subtitle{color:var(--muted);font-size:1.1rem;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid #001a2a;border-radius:16px;padding:24px;width:100%;max-width:700px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .scene{background:#00020a;border-radius:12px;height:260px;position:relative;margin-bottom:16px;border:1px solid #001a2a;overflow:hidden;}
  .formula-box{background:#00020a;border:1px solid var(--accent);border-radius:10px;padding:16px;text-align:center;font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--accent);margin-bottom:16px;}
  label{font-size:1rem;color:var(--muted);display:block;margin-bottom:6px;}
  .slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#001a2a;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer;}
  .val{min-width:70px;text-align:right;font-family:'Orbitron',sans-serif;font-size:0.9rem;color:var(--gold);}
  .results{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
  .result-item{background:#00020a;border-radius:10px;padding:12px;text-align:center;border:1px solid #001a2a;}
  .rlabel{font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
  .rval{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--gold);}
  .tab-row{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 20px;border-radius:8px;border:1px solid #001a2a;background:transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;transition:all 0.2s;}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  .panel{display:none;}.panel.active{display:block;}
  .question{font-size:1.1rem;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{background:#00020a;border:1px solid #001a2a;border-radius:10px;color:var(--text);padding:12px 16px;font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;text-align:left;transition:all 0.2s;}
  .opt-btn:hover{border-color:var(--accent);color:var(--accent);}
  .opt-btn.correct{border-color:#4caf50;background:#1a3a1a;color:#81c784;}
  .opt-btn.wrong{border-color:var(--accent2);background:#2a0a0a;color:#ef9a9a;}
  .feedback{margin-top:14px;padding:12px;border-radius:8px;font-size:1rem;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:#1a3a1a;border:1px solid #4caf50;color:#81c784;}
  .feedback.bad{background:#2a0a0a;border:1px solid var(--accent2);color:#ef9a9a;}
  .next-btn{margin-top:14px;background:linear-gradient(135deg,var(--accent),#01579b);border:none;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 24px;cursor:pointer;display:none;font-weight:bold;}
  .next-btn.show{display:inline-block;}
  .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .score-badge{background:#001a2a;border:1px solid var(--accent);border-radius:8px;padding:6px 14px;font-family:'Orbitron',sans-serif;font-size:0.85rem;color:var(--accent);}
  .progress-bar{flex:1;height:6px;background:#001a2a;border-radius:3px;margin:0 12px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.4s;}
  .victory{text-align:center;padding:30px;display:none;}
  .victory.show{display:block;}
  .victory-title{font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--gold);text-shadow:0 0 20px var(--gold);margin-bottom:10px;}
  .stars{font-size:2.5rem;margin:10px 0;}
  .restart-btn{margin-top:16px;background:var(--gold);border:none;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 28px;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>
<h1>🌀 FORCA QENDËRSYNUESE</h1>
<p class="subtitle">F_c = mv²/r &nbsp;|&nbsp; Lëvizja Rrethore</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)">🔬 Simulim</button>
  <button class="tab" onclick="switchTab('quiz',event)">🧠 Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="scene">
      <canvas id="orbitCanvas" width="650" height="256" style="width:100%;height:100%;"></canvas>
    </div>
    <div class="formula-box">F_c = m × v² / r</div>
    <div class="slider-row">
      <label style="min-width:80px">Masa m (kg)</label>
      <input type="range" id="massSlider" min="1" max="20" value="5" oninput="updateSim()">
      <span class="val" id="massVal">5 kg</span>
    </div>
    <div class="slider-row">
      <label style="min-width:80px">Shpejtësia v (m/s)</label>
      <input type="range" id="velSlider" min="1" max="20" value="8" oninput="updateSim()">
      <span class="val" id="velVal">8 m/s</span>
    </div>
    <div class="slider-row">
      <label style="min-width:80px">Rrezja r (m)</label>
      <input type="range" id="radSlider" min="1" max="20" value="5" oninput="updateSim()">
      <span class="val" id="radVal">5 m</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">F_c (N)</div><div class="rval" id="r1">64 N</div></div>
      <div class="result-item"><div class="rlabel">Nxitimi (m/s²)</div><div class="rval" id="r2">12.8</div></div>
      <div class="result-item"><div class="rlabel">Perioda T (s)</div><div class="rval" id="r3">3.9 s</div></div>
    </div>
    <div style="background:#00020a;border:1px solid #001a2a;border-radius:10px;padding:12px;font-size:0.95rem;color:var(--muted);line-height:1.6;">
      💡 <strong style="color:var(--accent)">Kujdes:</strong> Fc nuk është forcë e re — rolin e Fc mund ta luajë forca e gravitetit (orbita), fërkimi (makina), ose tendosja (litari)!
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge">⭐ <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR →</button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.2rem;color:var(--muted);">Pikë: <span id="finalScore" style="color:var(--gold);font-family:'Orbitron',sans-serif;"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()">RISTART</button>
    </div>
  </div>
</div>

<script>
let angle=0, animID=null;

function drawOrbit() {
  const canvas = document.getElementById('orbitCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2;
  const r = parseFloat(document.getElementById('radSlider').value);
  const v = parseFloat(document.getElementById('velSlider').value);
  const m = parseFloat(document.getElementById('massSlider').value);
  const scaledR = Math.min(r*8, H/2-20);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#00020a'; ctx.fillRect(0,0,W,H);

  // orbit path
  ctx.strokeStyle='rgba(64,196,255,0.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,scaledR,0,Math.PI*2); ctx.stroke();

  // center dot
  ctx.fillStyle='#40c4ff'; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(64,196,255,0.2)'; ctx.beginPath(); ctx.arc(cx,cy,scaledR,0,Math.PI*2); ctx.fill();

  // moving object
  const ox = cx + scaledR*Math.cos(angle);
  const oy = cy + scaledR*Math.sin(angle);

  // centripetal arrow (toward center)
  const Fc = m*v*v/r;
  const arrowLen = Math.min(Fc*0.8, 60);
  const dx = cx-ox, dy = cy-oy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const nx = dx/dist, ny = dy/dist;
  ctx.strokeStyle='#ff4081'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+nx*arrowLen,oy+ny*arrowLen); ctx.stroke();
  // arrowhead
  const ax=ox+nx*arrowLen, ay=oy+ny*arrowLen;
  const perp1x=-ny*8, perp1y=nx*8;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-nx*10+perp1x,ay-ny*10+perp1y); ctx.lineTo(ax-nx*10-perp1x,ay-ny*10-perp1y); ctx.closePath(); ctx.fillStyle='#ff4081'; ctx.fill();

  // velocity arrow (tangential)
  const tvx=-Math.sin(angle)*30, tvy=Math.cos(angle)*30;
  ctx.strokeStyle='#69f0ae'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+tvx,oy+tvy); ctx.stroke();

  // object
  ctx.fillStyle='linear-gradient'; ctx.beginPath(); ctx.arc(ox,oy,10,0,Math.PI*2);
  const grad = ctx.createRadialGradient(ox,oy,2,ox,oy,10);
  grad.addColorStop(0,'#80d8ff'); grad.addColorStop(1,'#0277bd');
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='#40c4ff'; ctx.lineWidth=2; ctx.stroke();

  // labels
  ctx.fillStyle='#ff4081'; ctx.font='11px Orbitron'; ctx.textAlign='left';
  ctx.fillText('Fc='+Fc.toFixed(1)+'N',ax+nx*5+8,ay+ny*5);
  ctx.fillStyle='#69f0ae'; ctx.fillText('v='+v+'m/s',ox+tvx+5,oy+tvy-5);

  // angular velocity
  const omega = v / (r); // rad/s
  angle += omega * 0.016;
  animID = requestAnimationFrame(drawOrbit);
}

function updateSim() {
  const m = parseFloat(document.getElementById('massSlider').value);
  const v = parseFloat(document.getElementById('velSlider').value);
  const r = parseFloat(document.getElementById('radSlider').value);
  document.getElementById('massVal').textContent = m + ' kg';
  document.getElementById('velVal').textContent = v + ' m/s';
  document.getElementById('radVal').textContent = r + ' m';
  const Fc = m*v*v/r;
  const ac = v*v/r;
  const T = 2*Math.PI*r/v;
  document.getElementById('r1').textContent = Fc.toFixed(1) + ' N';
  document.getElementById('r2').textContent = ac.toFixed(2);
  document.getElementById('r3').textContent = T.toFixed(1) + ' s';
}

cancelAnimationFrame(animID);
drawOrbit();
updateSim();

const questions=[
  {q:"Formula e forcës qendërsynuese është:",opts:["Fc=mv/r","Fc=mv²/r","Fc=m²v/r","Fc=mgr"],ans:1},
  {q:"Drejtimi i Fc është gjithmonë:",opts:["Tangencial (përgjatë orbitës)","Drejt qendrës (radial)","Lart","Poshtë"],ans:1},
  {q:"Nëse shpejtësia dyfishohet, Fc:",opts:["Dyfishohet","Katërshohet","Mbetet e njëjtë","Përgjysmohet"],ans:1},
  {q:"Nëse rrezja dyfishohet (v,m të njëjta), Fc:",opts:["Dyfishohet","Katërshohet","Përgjysmohet","Mbetet e njëjtë"],ans:2},
  {q:"Cila forcë luan rolin e Fc për planetin që orbikon Diellin?",opts:["Forca e fërkimit","Forca elastike","Forca gravitacionale","Forca normale"],ans:2},
  {q:"m=2kg, v=10m/s, r=5m. Sa është Fc?",opts:["4 N","20 N","40 N","100 N"],ans:2},
  {q:"Fc nuk është forcë e re sepse:",opts:["Nuk ka drejtim","Rolin e saj e luan një forcë ekzistuese","Varet nga masa","Është zero"],ans:1}
];
let qi=0,score=0;
function loadQ(){const q=questions[qi];document.getElementById('question').textContent=(qi+1)+'. '+q.q;document.getElementById('feedback').className='feedback';document.getElementById('nextBtn').className='next-btn';document.getElementById('qnum').textContent=qi+1;document.getElementById('progress').style.width=(qi/questions.length*100)+'%';const opts=document.getElementById('options');opts.innerHTML='';q.opts.forEach((o,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.textContent=String.fromCharCode(65+i)+'. '+o;btn.onclick=()=>checkAns(i,btn);opts.appendChild(btn);});}
function checkAns(i,btn){const q=questions[qi];document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);const fb=document.getElementById('feedback');if(i===q.ans){btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;fb.className='feedback ok show';fb.textContent='✅ Saktë!';}else{btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';fb.className='feedback bad show';fb.textContent='❌ Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];}document.getElementById('nextBtn').className='next-btn show';}
function nextQ(){qi++;if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ();}
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
