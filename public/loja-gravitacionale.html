<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca Gravitacionale</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent2: #f97316;
    --gold: #f59e0b;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  h1 {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 800;
    text-align: center;
  }
  .subtitle { color: var(--muted); font-size: 1.2rem; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .scene {
    background: #f8fafc;
    border-radius: 16px;
    height: 220px;
    position: relative;
    margin-bottom: 24px;
    border: 2px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow-inner);
  }
  .formula-box {
    background: #f8fafc;
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    font-size: 1.3rem;
    color: var(--accent);
    margin-bottom: 24px;
    font-weight: 800;
    box-shadow: var(--shadow-inner);
    line-height: 1.6;
  }
  label { font-size: 1rem; color: var(--text); display: block; margin-bottom: 8px; font-weight: 600; }
  .slider-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #e2e8f0;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
  .val {
    min-width: 90px;
    text-align: right;
    font-size: 1.1rem;
    color: var(--accent);
    font-weight: 800;
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 12px;
  }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .result-item {
    background: #f8fafc;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .rlabel { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .rval { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
  .tab-row { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; }
  .tab {
    padding: 12px 24px;
    border-radius: 16px;
    border: none;
    background: #e2e8f0;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { background: #cbd5e1; color: var(--text); }
  .tab.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }
  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .question { font-size: 1.2rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; font-weight: 800; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt-btn {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    padding: 16px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .opt-btn:hover { border-color: var(--accent); background: #f5f3ff; }
  .opt-btn.correct { border-color: #10b981; background: #ecfdf5; color: #047857; }
  .opt-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
  .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; display: none; text-align: center; }
  .feedback.show { display: block; animation: fadeIn 0.3s ease; }
  .feedback.ok { background: #ecfdf5; color: #047857; border: 1px solid #10b981; }
  .feedback.bad { background: #fef2f2; color: #b91c1c; border: 1px solid #ef4444; }
  .next-btn {
    margin-top: 20px;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    padding: 16px 32px;
    cursor: pointer;
    display: none;
    font-weight: 800;
    width: 100%;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }
  .next-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
  .next-btn.show { display: inline-block; }
  .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .score-badge {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
  }
  .progress-bar { flex: 1; height: 12px; background: #e2e8f0; border-radius: 6px; margin: 0 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.4s ease; }
  .victory { text-align: center; padding: 40px 20px; display: none; }
  .victory.show { display: block; animation: fadeIn 0.5s ease; }
  .victory-title { font-size: 2.5rem; color: var(--gold); margin-bottom: 16px; font-weight: 800; }
  .stars { font-size: 3.5rem; margin: 16px 0; color: var(--gold); }
  .restart-btn {
    margin-top: 24px;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    padding: 16px 36px;
    cursor: pointer;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
</style>
</head>
<body>
<h1><i class="fas fa-globe"></i> FORCA GRAVITACIONALE</h1>
<p class="subtitle">F = γm₁m₂/r² &nbsp;|&nbsp; Ligji i Njutonit</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)"><i class="fas fa-microscope"></i> Simulim</button>
  <button class="tab" onclick="switchTab('quiz',event)"><i class="fas fa-gamepad"></i> Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="scene">
      <canvas id="gravCanvas" width="650" height="220" style="width:100%;height:100%;"></canvas>
    </div>
    <div class="formula-box">F = γ × m₁ × m₂ / r²<br><span style="font-size:1rem;color:var(--muted);font-weight:600;">γ = 6.674 × 10⁻¹¹ N·m²/kg²</span></div>
    <div class="slider-row">
      <label style="min-width:120px">Masa m₁ (×10²⁴kg)</label>
      <input type="range" id="m1Slider" min="1" max="20" value="6" oninput="updateSim()">
      <span class="val" id="m1Val">6×10²⁴</span>
    </div>
    <div class="slider-row">
      <label style="min-width:120px">Masa m₂ (×10²⁴kg)</label>
      <input type="range" id="m2Slider" min="1" max="20" value="7" oninput="updateSim()">
      <span class="val" id="m2Val">7×10²⁴</span>
    </div>
    <div class="slider-row">
      <label style="min-width:120px">Distanca r (×10⁸m)</label>
      <input type="range" id="rSlider" min="1" max="20" value="4" oninput="updateSim()">
      <span class="val" id="rVal">4×10⁸</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">Forca Gravitacionale F</div><div class="rval" id="r1">—</div></div>
      <div class="result-item"><div class="rlabel">F × 10^N</div><div class="rval" id="r2">—</div></div>
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge"><i class="fas fa-star" style="color:var(--gold)"></i> <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.4rem;color:var(--muted);font-weight:800;">Pikë: <span id="finalScore" style="color:var(--accent);"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> RISTART</button>
    </div>
  </div>
</div>

<script>
const G = 6.674e-11;

function updateSim() {
  const m1 = parseFloat(document.getElementById('m1Slider').value)*1e24;
  const m2 = parseFloat(document.getElementById('m2Slider').value)*1e24;
  const r = parseFloat(document.getElementById('rSlider').value)*1e8;
  document.getElementById('m1Val').textContent = (m1/1e24).toFixed(0)+'×10²⁴';
  document.getElementById('m2Val').textContent = (m2/1e24).toFixed(0)+'×10²⁴';
  document.getElementById('rVal').textContent = (r/1e8).toFixed(0)+'×10⁸';
  const F = G*m1*m2/(r*r);
  const exp = Math.floor(Math.log10(F));
  const coef = F/Math.pow(10,exp);
  document.getElementById('r1').textContent = coef.toFixed(3)+'×10^'+exp+' N';
  document.getElementById('r2').textContent = F.toExponential(3);
  drawGrav(m1, m2, r, F);
}

function drawGrav(m1, m2, r, F) {
  const canvas = document.getElementById('gravCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,W,H);

  // grid background instead of stars
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1;
  for(let i=0; i<W; i+=20) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for(let i=0; i<H; i+=20) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

  const s1 = Math.min(20 + m1/1e24*2, 50);
  const s2 = Math.min(20 + m2/1e24*2, 50);
  const x1=120, x2=530, cy=H/2;

  // attraction arrows
  const arrowLen = Math.min(F/1e30*200, 80);
  ctx.strokeStyle='#8b5cf6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x1+s1,cy); ctx.lineTo(x1+s1+arrowLen,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2-s2,cy); ctx.lineTo(x2-s2-arrowLen,cy); ctx.stroke();

  // distance line
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(x1,cy+s1+15); ctx.lineTo(x2,cy+s1+15); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#64748b'; ctx.font='600 12px Nunito'; ctx.textAlign='center';
  ctx.fillText('r = '+(r/1e8).toFixed(0)+'×10⁸ m', (x1+x2)/2, cy+s1+30);

  // masses
  const g1=ctx.createRadialGradient(x1,cy,5,x1,cy,s1);
  g1.addColorStop(0,'#60a5fa'); g1.addColorStop(1,'#2563eb');
  ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(x1,cy,s1,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=2; ctx.stroke();
  const g2=ctx.createRadialGradient(x2,cy,5,x2,cy,s2);
  g2.addColorStop(0,'#c084fc'); g2.addColorStop(1,'#9333ea');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x2,cy,s2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7e22ce'; ctx.lineWidth=2; ctx.stroke();

  ctx.fillStyle='#ffffff'; ctx.font='800 14px Nunito'; ctx.textAlign='center';
  ctx.fillText('m₁',x1,cy+5); ctx.fillText('m₂',x2,cy+5);
}

updateSim();

const questions=[
  {q:"Formula e forcës gravitacionale është:",opts:["F=mg","F=mv²/r","F=γm₁m₂/r²","F=kx"],ans:2},
  {q:"Konstantja universale γ ≈",opts:["9.81 N/kg","6.674×10⁻¹¹ N·m²/kg²","3×10⁸ m/s","1.6×10⁻¹⁹ C"],ans:1},
  {q:"Nëse distanca r dyfishohet, F gravitacionale:",opts:["Dyfishohet","Përgjysmohet","Zvogëlohet 4 herë","Mbetet e njëjtë"],ans:2},
  {q:"Forca gravitacionale është gjithmonë:",opts:["Tërheqëse","Zmbrapsëse","Mund të jetë si njëra","Zero"],ans:0},
  {q:"Nëse masa m₁ trefishohet (tjerat konstantë), F:",opts:["Mbetet e njëjtë","Trefishohet","Rritet 9 herë","Përgjysmohet"],ans:1},
  {q:"Midis çfarë trupave vepron Fg?",opts:["Vetëm planetëve","Vetëm trupave me masë të madhe","Çdo dy trupave me masë","Vetëm trupave me ngarkesë"],ans:2},
  {q:"Pse g=9.81 m/s² në Tokë? Sepse g=γM_tokë/R²:",opts:["Masa e Tokës dhe rrezja determinojnë g","g varet nga masa jonë","g ndryshon shumë sipas qytetit","g = konstante universale"],ans:0}
];
let qi=0,score=0;
function loadQ() {
  const q=questions[qi];
  document.getElementById('question').textContent=(qi+1)+'. '+q.q;
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('qnum').textContent=qi+1;
  document.getElementById('progress').style.width=(qi/questions.length*100)+'%';
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=String.fromCharCode(65+i)+'. '+o;
    btn.onclick=()=>checkAns(i,btn);
    opts.appendChild(btn);
  });
}
function checkAns(i,btn) {
  const q=questions[qi];
  document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
  const fb=document.getElementById('feedback');
  if(i===q.ans){
    btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;
    fb.className='feedback ok show';fb.innerHTML='<i class="fas fa-check-circle"></i> Saktë!';
  }else{
    btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';
    fb.className='feedback bad show';fb.innerHTML='<i class="fas fa-times-circle"></i> Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];
  }
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQ() { qi++; if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ(); }
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
