<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Power Grid Master - Fuqia Elektrike</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }
        h1 { 
            font-family: 'VT323', monospace; 
            font-size: 3.5rem; 
            color: var(--accent); 
            text-shadow: 3px 3px 0px var(--border); 
            margin-bottom: 4px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        p {
            color: var(--text); 
            font-size: 1.5rem; 
            margin-bottom: 24px; 
            font-family: 'VT323', monospace;
        }
        #game-board { 
            background: var(--surface); 
            border: 4px solid var(--border); 
            padding: 24px; 
            box-shadow: 8px 8px 0px var(--border); 
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
        }
        canvas { 
            background: #e2e8f0; 
            border: 4px solid var(--border); 
            display: block;
            width: 100%;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .ui-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        .stat-card { 
            background: var(--bg);
            border: 4px solid var(--border);
            padding: 15px; 
            text-align: center; 
            box-shadow: 4px 4px 0px var(--border);
        }
        .stat-card div:first-child {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 8px;
        }
        .power-value { 
            font-family: 'VT323', monospace;
            font-size: 2.5rem; 
            color: var(--accent2); 
            font-weight: bold; 
            text-shadow: 2px 2px 0px var(--border);
        }
        .slider-group { 
            margin: 15px 0; 
            background: var(--bg);
            border: 4px solid var(--border);
            padding: 15px;
            box-shadow: 4px 4px 0px var(--border);
        }
        .slider-group label {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            display: block;
            margin-bottom: 8px;
        }
        input[type=range] { 
            cursor: pointer; 
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border: 2px solid var(--border);
            background: #e2e8f0;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            cursor: pointer;
        }
        button { 
            grid-column: span 2; 
            padding: 15px; 
            background: var(--accent); 
            border: 4px solid var(--border); 
            color: var(--text); 
            cursor: pointer; 
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
        }
        button:active { 
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }
        .alert { 
            color: var(--red); 
            font-weight: bold; 
            margin-top: 10px; 
            display: none; 
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            text-align: center;
        }
        .top-info {
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 15px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
        }
        .max-p {
            color: var(--green);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-city"></i> Power Grid Master</h1>
    <p>Rregullo Tensionin (U) dhe Rrymën (I) për të plotësuar nevojat e qytetit!</p>

    <div id="game-board">
        <div class="top-info">
            <div>Niveli: <span id="level">1</span></div>
            <div class="max-p">Maksimumi i Sigurt: <span id="maxP">3000</span> W</div>
        </div>

        <canvas id="powerCanvas" width="600" height="150"></canvas>

        <div class="ui-grid">
            <div class="stat-card">
                <div>Kërkesa e Qytetit</div>
                <div class="power-value" id="targetP">1500 W</div>
            </div>
            <div class="stat-card">
                <div>Fuqia Juaj (P)</div>
                <div class="power-value" id="currentP">0 W</div>
            </div>
            
            <div class="slider-group">
                <label>Tensioni (U): <span id="uVal">120</span> V</label>
                <input type="range" id="uInput" min="10" max="240" value="120" oninput="calculatePower()">
            </div>
            <div class="slider-group">
                <label>Intensiteti (I): <span id="iVal">10</span> A</label>
                <input type="range" id="iInput" min="1" max="50" value="10" oninput="calculatePower()">
            </div>

            <button onclick="supplyPower()">DËRGO ENERGJINË</button>
        </div>
        <div id="alertMsg" class="alert"><i class="fas fa-exclamation-triangle"></i> KUJDES: Mbingarkesë! Sistemi do të digjet!</div>
    </div>

    <script>
        const canvas = document.getElementById('powerCanvas');
        const ctx = canvas.getContext('2d');
        
        let targetPower = 1500;
        let maxPower = 3000;
        let level = 1;

        function calculatePower() {
            const u = document.getElementById('uInput').value;
            const i = document.getElementById('iInput').value;
            const p = u * i;

            document.getElementById('uVal').innerText = u;
            document.getElementById('iVal').innerText = i;
            document.getElementById('currentP').innerText = p + " W";

            if (p > maxPower) {
                document.getElementById('alertMsg').style.display = "block";
            } else {
                document.getElementById('alertMsg').style.display = "none";
            }
            drawGlow(p);
        }

        function drawGlow(p) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const intensity = Math.min(p / maxPower, 1);
            
            // Vizatimi i "telave" të qytetit
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(50, 75);
            ctx.lineTo(550, 75);
            ctx.stroke();

            if (p > 0) {
                ctx.strokeStyle = p > maxPower ? "#ffb3ba" : "#a2d2ff";
                ctx.lineWidth = 4 + (intensity * 6);
                ctx.beginPath();
                ctx.moveTo(50, 75);
                ctx.lineTo(550, 75);
                ctx.stroke();
            }

            // Qyteti
            ctx.fillStyle = "#4a4e69";
            ctx.fillRect(450, 30, 80, 90);
            ctx.fillRect(420, 50, 40, 70);
            ctx.fillRect(520, 40, 50, 80);

            // Dritaret
            ctx.fillStyle = p >= targetPower && p <= maxPower ? "#baffc9" : (p > maxPower ? "#ffb3ba" : "#e2e8f0");
            for(let x=460; x<520; x+=20) {
                for(let y=40; y<110; y+=20) {
                    ctx.fillRect(x, y, 10, 10);
                }
            }
        }

        function supplyPower() {
            const u = document.getElementById('uInput').value;
            const i = document.getElementById('iInput').value;
            const p = u * i;

            if (p > maxPower) {
                alert("Sistemi u dogj! Keni tejkaluar maksimumin e sigurt.");
                level = 1;
            } else if (Math.abs(p - targetPower) <= 100) {
                alert("Shkëlqyeshëm! Qyteti ka energji të mjaftueshme.");
                level++;
                targetPower = Math.floor(Math.random() * 2000) + 1000;
                maxPower = targetPower + 1000;
                document.getElementById('level').innerText = level;
                document.getElementById('targetP').innerText = targetPower + " W";
                document.getElementById('maxP').innerText = maxPower;
            } else if (p < targetPower) {
                alert("Energjia nuk mjafton. Qyteti është në errësirë.");
            } else {
                alert("Keni dërguar shumë energji, por jo aq sa të digjet sistemi. Mundohuni të jeni më afër kërkesës.");
            }
            calculatePower();
        }

        calculatePower();
    </script>
</body>
</html>
