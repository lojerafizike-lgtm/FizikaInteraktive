<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca Gravitacionale</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#020008;--surface:#08001a;--accent:#ea80fc;--accent2:#ff6e40;--gold:#ffd600;--text:#f3e5f5;--muted:#ce93d8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{font-family:'Orbitron',sans-serif;font-size:1.8rem;color:var(--accent);text-shadow:0 0 20px var(--accent);margin-bottom:4px;letter-spacing:2px;}
  .subtitle{color:var(--muted);font-size:1.1rem;margin-bottom:24px;}
  .card{background:var(--surface);border:1px solid #1a0030;border-radius:16px;padding:24px;width:100%;max-width:700px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .scene{background:#010003;border-radius:12px;height:220px;position:relative;margin-bottom:16px;border:1px solid #1a0030;overflow:hidden;}
  .formula-box{background:#010003;border:1px solid var(--accent);border-radius:10px;padding:16px;text-align:center;font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--accent);margin-bottom:16px;line-height:1.6;}
  label{font-size:1rem;color:var(--muted);display:block;margin-bottom:6px;}
  .slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#1a0030;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);cursor:pointer;}
  .val{min-width:70px;text-align:right;font-family:'Orbitron',sans-serif;font-size:0.9rem;color:var(--gold);}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .result-item{background:#010003;border-radius:10px;padding:12px;text-align:center;border:1px solid #1a0030;}
  .rlabel{font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
  .rval{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:var(--gold);}
  .tab-row{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 20px;border-radius:8px;border:1px solid #1a0030;background:transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;transition:all 0.2s;}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  .panel{display:none;}.panel.active{display:block;}
  .question{font-size:1.1rem;color:var(--text);margin-bottom:14px;line-height:1.5;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{background:#010003;border:1px solid #1a0030;border-radius:10px;color:var(--text);padding:12px 16px;font-family:'Rajdhani',sans-serif;font-size:1rem;cursor:pointer;text-align:left;transition:all 0.2s;}
  .opt-btn:hover{border-color:var(--accent);color:var(--accent);}
  .opt-btn.correct{border-color:#4caf50;background:#1a3a1a;color:#81c784;}
  .opt-btn.wrong{border-color:var(--accent2);background:#2a0a0a;color:#ef9a9a;}
  .feedback{margin-top:14px;padding:12px;border-radius:8px;font-size:1rem;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:#1a3a1a;border:1px solid #4caf50;color:#81c784;}
  .feedback.bad{background:#2a0a0a;border:1px solid var(--accent2);color:#ef9a9a;}
  .next-btn{margin-top:14px;background:linear-gradient(135deg,var(--accent),#6a0080);border:none;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 24px;cursor:pointer;display:none;font-weight:bold;}
  .next-btn.show{display:inline-block;}
  .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .score-badge{background:#1a0030;border:1px solid var(--accent);border-radius:8px;padding:6px 14px;font-family:'Orbitron',sans-serif;font-size:0.85rem;color:var(--accent);}
  .progress-bar{flex:1;height:6px;background:#1a0030;border-radius:3px;margin:0 12px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.4s;}
  .victory{text-align:center;padding:30px;display:none;}
  .victory.show{display:block;}
  .victory-title{font-family:'Orbitron',sans-serif;font-size:2rem;color:var(--gold);text-shadow:0 0 20px var(--gold);margin-bottom:10px;}
  .stars{font-size:2.5rem;margin:10px 0;}
  .restart-btn{margin-top:16px;background:var(--gold);border:none;border-radius:10px;color:#000;font-family:'Orbitron',sans-serif;font-size:0.9rem;padding:12px 28px;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>
<h1>🌌 FORCA GRAVITACIONALE</h1>
<p class="subtitle">F = γm₁m₂/r² &nbsp;|&nbsp; Ligji i Njutonit</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)">🔬 Simulim</button>
  <button class="tab" onclick="switchTab('quiz',event)">🧠 Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="scene">
      <canvas id="gravCanvas" width="650" height="220" style="width:100%;height:100%;"></canvas>
    </div>
    <div class="formula-box">F = γ × m₁ × m₂ / r²<br><span style="font-size:0.8rem;color:var(--muted)">γ = 6.674 × 10⁻¹¹ N·m²/kg²</span></div>
    <div class="slider-row">
      <label style="min-width:90px">Masa m₁ (×10²⁴kg)</label>
      <input type="range" id="m1Slider" min="1" max="20" value="6" oninput="updateSim()">
      <span class="val" id="m1Val">6×10²⁴</span>
    </div>
    <div class="slider-row">
      <label style="min-width:90px">Masa m₂ (×10²⁴kg)</label>
      <input type="range" id="m2Slider" min="1" max="20" value="7" oninput="updateSim()">
      <span class="val" id="m2Val">7×10²⁴</span>
    </div>
    <div class="slider-row">
      <label style="min-width:90px">Distanca r (×10⁸m)</label>
      <input type="range" id="rSlider" min="1" max="20" value="4" oninput="updateSim()">
      <span class="val" id="rVal">4×10⁸</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">Forca Gravitacionale F</div><div class="rval" id="r1">—</div></div>
      <div class="result-item"><div class="rlabel">F × 10^N</div><div class="rval" id="r2">—</div></div>
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge">⭐ <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR →</button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.2rem;color:var(--muted);">Pikë: <span id="finalScore" style="color:var(--gold);font-family:'Orbitron',sans-serif;"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()">RISTART</button>
    </div>
  </div>
</div>

<script>
const G = 6.674e-11;

function updateSim() {
  const m1 = parseFloat(document.getElementById('m1Slider').value)*1e24;
  const m2 = parseFloat(document.getElementById('m2Slider').value)*1e24;
  const r = parseFloat(document.getElementById('rSlider').value)*1e8;
  document.getElementById('m1Val').textContent = (m1/1e24).toFixed(0)+'×10²⁴';
  document.getElementById('m2Val').textContent = (m2/1e24).toFixed(0)+'×10²⁴';
  document.getElementById('rVal').textContent = (r/1e8).toFixed(0)+'×10⁸';
  const F = G*m1*m2/(r*r);
  const exp = Math.floor(Math.log10(F));
  const coef = F/Math.pow(10,exp);
  document.getElementById('r1').textContent = coef.toFixed(3)+'×10^'+exp+' N';
  document.getElementById('r2').textContent = F.toExponential(3);
  drawGrav(m1, m2, r, F);
}

function drawGrav(m1, m2, r, F) {
  const canvas = document.getElementById('gravCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#010003'; ctx.fillRect(0,0,W,H);

  // stars
  for (let i=0;i<60;i++) {
    const sx=((i*173)%W), sy=((i*97+23)%H);
    ctx.fillStyle='rgba(255,255,255,'+((i%3+1)*0.2)+')'; ctx.beginPath(); ctx.arc(sx,sy,1,0,Math.PI*2); ctx.fill();
  }

  const s1 = Math.min(20 + m1/1e24*2, 50);
  const s2 = Math.min(20 + m2/1e24*2, 50);
  const x1=120, x2=530, cy=H/2;

  // attraction arrows
  const arrowLen = Math.min(F/1e30*200, 80);
  ctx.strokeStyle='#ea80fc'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(x1+s1,cy); ctx.lineTo(x1+s1+arrowLen,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2-s2,cy); ctx.lineTo(x2-s2-arrowLen,cy); ctx.stroke();

  // distance line
  ctx.strokeStyle='rgba(200,150,220,0.4)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(x1,cy+s1+15); ctx.lineTo(x2,cy+s1+15); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ce93d8'; ctx.font='11px Rajdhani'; ctx.textAlign='center';
  ctx.fillText('r = '+(r/1e8).toFixed(0)+'×10⁸ m', (x1+x2)/2, cy+s1+30);

  // masses
  const g1=ctx.createRadialGradient(x1,cy,5,x1,cy,s1);
  g1.addColorStop(0,'#3949ab'); g1.addColorStop(1,'#1a237e');
  ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(x1,cy,s1,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#7986cb'; ctx.lineWidth=2; ctx.stroke();
  const g2=ctx.createRadialGradient(x2,cy,5,x2,cy,s2);
  g2.addColorStop(0,'#6a1b9a'); g2.addColorStop(1,'#38006b');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x2,cy,s2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ea80fc'; ctx.lineWidth=2; ctx.stroke();

  ctx.fillStyle='#e3f2fd'; ctx.font='bold 11px Orbitron'; ctx.textAlign='center';
  ctx.fillText('m₁',x1,cy+5); ctx.fillText('m₂',x2,cy+5);
}

updateSim();

const questions=[
  {q:"Formula e forcës gravitacionale është:",opts:["F=mg","F=mv²/r","F=γm₁m₂/r²","F=kx"],ans:2},
  {q:"Konstantja universale γ ≈",opts:["9.81 N/kg","6.674×10⁻¹¹ N·m²/kg²","3×10⁸ m/s","1.6×10⁻¹⁹ C"],ans:1},
  {q:"Nëse distanca r dyfishohet, F gravitacionale:",opts:["Dyfishohet","Përgjysmohet","Zvogëlohet 4 herë","Mbetet e njëjtë"],ans:2},
  {q:"Forca gravitacionale është gjithmonë:",opts:["Tërheqëse","Zmbrapsëse","Mund të jetë si njëra","Zero"],ans:0},
  {q:"Nëse masa m₁ trefishohet (tjerat konstantë), F:",opts:["Mbetet e njëjtë","Trefishohet","Rritet 9 herë","Përgjysmohet"],ans:1},
  {q:"Midis çfarë trupave vepron Fg?",opts:["Vetëm planetëve","Vetëm trupave me masë të madhe","Çdo dy trupave me masë","Vetëm trupave me ngarkesë"],ans:2},
  {q:"Pse g=9.81 m/s² në Tokë? Sepse g=γM_tokë/R²:",opts:["Masa e Tokës dhe rrezja determinojnë g","g varet nga masa jonë","g ndryshon shumë sipas qytetit","g = konstante universale"],ans:0}
];
let qi=0,score=0;
function loadQ(){const q=questions[qi];document.getElementById('question').textContent=(qi+1)+'. '+q.q;document.getElementById('feedback').className='feedback';document.getElementById('nextBtn').className='next-btn';document.getElementById('qnum').textContent=qi+1;document.getElementById('progress').style.width=(qi/questions.length*100)+'%';const opts=document.getElementById('options');opts.innerHTML='';q.opts.forEach((o,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.textContent=String.fromCharCode(65+i)+'. '+o;btn.onclick=()=>checkAns(i,btn);opts.appendChild(btn);});}
function checkAns(i,btn){const q=questions[qi];document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);const fb=document.getElementById('feedback');if(i===q.ans){btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;fb.className='feedback ok show';fb.textContent='✅ Saktë!';}else{btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';fb.className='feedback bad show';fb.textContent='❌ Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];}document.getElementById('nextBtn').className='next-btn show';}
function nextQ(){qi++;if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ();}
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
