<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendari i Fizikës - Cute Edition</title>
    <style>
        :root {
            --pastel-pink: #ffd6e0;
            --baby-blue: #cff0ff;
            --hot-pink: #ff7494;
            --text-dark: #594146;
            --white-glass: rgba(255, 255, 255, 0.85);
        }

        /* Sfondi pastel rozë/baby blue dhe pa padding në header (sipas rregullave të tua) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--pastel-pink) 0%, var(--baby-blue) 100%);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Elementet fizike fluturuese rreth e rrotull */
        .floating-icon {
            position: absolute;
            font-size: 3rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        .icon-1 { top: 10%; left: 10%; animation-delay: 0s; } /* Atom */
        .icon-2 { bottom: 15%; right: 10%; animation-delay: 2s; font-size: 4rem;} /* Magnet */
        .icon-3 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem;} /* Molla */
        .icon-4 { bottom: 20%; left: 15%; animation-delay: 3s; font-size: 2rem;} /* Ylli */

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Containeri Kryesor */
        .main-container {
            display: flex;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 116, 148, 0.2);
            z-index: 10;
            position: relative;
            border: 3px solid white;
        }

        /* Seksioni i Datave */
        .calendar-section {
            flex: 1.2;
            padding: 30px;
            overflow-y: auto;
            border-right: 2px dashed var(--pastel-pink);
        }

        .calendar-section::-webkit-scrollbar { width: 8px; }
        .calendar-section::-webkit-scrollbar-thumb { background: var(--hot-pink); border-radius: 10px; }

        .month-header {
            color: var(--hot-pink);
            font-size: 1.5rem;
            margin: 20px 0 10px 0;
            text-align: center;
            font-weight: bold;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-node {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .day-node:hover {
            transform: scale(1.15) rotate(-5deg);
            border-color: var(--hot-pink);
            color: var(--hot-pink);
        }

        /* Dita e sotme */
        .is-today {
            background: var(--hot-pink);
            color: white !important;
            box-shadow: 0 0 15px var(--hot-pink);
            transform: scale(1.1);
        }

        /* Seksioni i fletës që shkëputet */
        .fact-section {
            flex: 1;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            position: relative;
            perspective: 1000px;
        }

        /* Dizajni i Fletës së Bllokut me vrima majtas */
        .notebook-page {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px 40px 40px 60px;
            border-radius: 5px 15px 15px 5px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.08);
            position: relative;
            border-left: 2px solid #eee;
        }

        /* Vrimat e telit (Spiralja) */
        .notebook-page::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 20px;
            bottom: 20px;
            width: 15px;
            background-image: radial-gradient(circle, #333 40%, transparent 45%);
            background-size: 100% 30px;
        }

        /* Vijat e fletoreve */
        .notebook-page::after {
            content: '';
            position: absolute;
            top: 0; left: 45px; right: 0; bottom: 0;
            background-image: linear-gradient(#f9f9f9 1px, transparent 1px);
            background-size: 100% 2rem;
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        .date-badge {
            display: inline-block;
            background: var(--baby-blue);
            color: var(--text-dark);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 20px;
            transform: rotate(-2deg);
            border: 2px dashed #fff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .fact-desc {
            font-size: 1.25rem;
            line-height: 2rem;
            font-weight: 500;
        }

        /* Animimi i grisjes / shkëputjes së fletës */
        @keyframes tearOff {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(150px) rotate(-15deg); opacity: 0; }
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .tearing {
            animation: tearOff 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        .dropping {
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

    </style>
</head>

    const calendarBody = document.getElementById('calendarBody');
    const today = new Date();
    const tDay = today.getDate();
    const tMonth = today.getMonth() + 1;

    months.forEach((month, mIndex) => {
        const title = document.createElement('h3');
        title.className = 'month-header';
        title.innerText = month;
        calendarBody.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'days-grid';

        for (let d = 1; d <= daysInMonth[mIndex]; d++) {
            const dayNode = document.createElement('div');
            dayNode.className = 'day-node';
            dayNode.innerText = d;
            dayNode.id = `node-${mIndex + 1}-${d}`;

            // Gjej ditën e sotme (p.sh. 16 Mars)
            if (d === tDay && (mIndex + 1) === tMonth) {
                dayNode.classList.add('is-today');
            }

            dayNode.onclick = () => showFact(mIndex + 1, d, month);
            grid.appendChild(dayNode);
        }
        calendarBody.appendChild(grid);
    });

    // Funksioni që bën efektin "grisje flete" dhe ndryshon tekstin
    function showFact(m, d, monthName) {
        const key = `${m}-${d}`;
        const fact = physicsData[key] || "Asnjë e dhënë për këtë datë në arkivën tonë shkencore.";
        
        const page = document.getElementById('factPage');
        const badge = document.getElementById('dateBadge');
        const desc = document.getElementById('factDesc');

        // Bëj animacionin e grisjes
        page.classList.remove('dropping');
        page.classList.add('tearing');

        setTimeout(() => {
            // Pas gjysmë sekondi (kur fleta ka rënë), ndrysho tekstin
            badge.innerText = `${d} ${monthName}`;
            desc.innerText = fact;

            // Fshij klasën e grisjes dhe shto klasën e shfaqjes së fletës së re
            page.classList.remove('tearing');
            page.classList.add('dropping');
            
            // Ndrysho ngjyrat te data e zgjedhur në kalendar
            document.querySelectorAll('.day-node').forEach(n => {
                if(!n.classList.contains('is-today')) {
                    n.style.background = "";
                    n.style.color = "";
                    n.style.borderColor = "transparent";
                }
            });
            const selectedNode = document.getElementById(`node-${m}-${d}`);
            if(!selectedNode.classList.contains('is-today')) {
                selectedNode.style.background = "var(--pastel-pink)";
                selectedNode.style.color = "var(--text-dark)";
                selectedNode.style.borderColor = "var(--hot-pink)";
            }
        }, 500); // 500ms zgjat animacioni i rënies
    }

    // Ekzekutohet automatikisht kur hapet faqja
    window.onload = () => {
        const todayNode = document.getElementById(`node-${tMonth}-${tDay}`);
        if (todayNode) {
            // Të ulet scrolli automatikisht aty ku duhet
            todayNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Shfaq të dhënën e sotme menjëherë, pa efektin e grisjes për herën e parë
            document.getElementById('dateBadge').innerText = `${tDay} ${months[tMonth-1]}`;
            document.getElementById('factDesc').innerText = physicsData[`${tMonth}-${tDay}`] || "Zbulime fantastike ndodhin çdo ditë!";
        }
    };
