<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbrojtja e Kështjellës - Pixel Edition</title>
<style>
:root{
  --cream:#FFF8F0;--warm:#FFFCF7;--beige:#F5EDE3;--beige-dk:#E8DDD0;
  --sage:#7BAE7F;--sage-lt:#A8D4AB;--sage-dk:#5A8E5E;
  --blue:#89B4C8;--pink:#D4A0A0;--peach:#F0C8A0;
  --gold:#E8C07A;--gold-lt:#F0D68A;--gold-dk:#C89830;
  --txt:#3D3226;--txt-m:#9E9585;--card:#FFFFFF;
  --sh:rgba(61,50,38,.08);
  --r:16px;--r-lg:24px;--ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.175,.885,.32,1.275);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:8px}

/* === PIXEL ART RENDERING === */
.pixel-canvas{
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;
  -ms-interpolation-mode:nearest-neighbor;
}

/* === BG === */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-grad{position:absolute;inset:0;background:linear-gradient(160deg,var(--cream) 0%,#d4ebd6 40%,var(--blue) 100%);opacity:.2}
.pixel-dot{position:absolute;width:4px;height:4px;background:var(--sage-lt);opacity:0;animation:pdot 4s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:0;transform:scale(0)}50%{opacity:.35;transform:scale(1)}}

/* === TOP BAR === */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(255,248,240,.9);backdrop-filter:blur(12px);border-bottom:3px solid var(--beige-dk);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res-item{display:flex;align-items:center;gap:4px;font-weight:800;font-size:.85rem}
.res-xp{color:var(--gold-dk)}.res-coins{color:var(--gold-dk)}.res-streak{color:var(--pink)}
.res-streak.pop{animation:spop .35s var(--bounce)}
@keyframes spop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.xp-wrap{position:sticky;top:50px;z-index:99;background:rgba(255,248,240,.7);backdrop-filter:blur(8px);padding:0 20px 6px}
.xp-outer{height:8px;background:var(--beige);border-radius:0;overflow:hidden;border:2px solid var(--beige-dk)}
.xp-inner{height:100%;background:var(--sage);border-radius:0;transition:width .8s var(--ease);width:0%}
.xp-lbl{font-size:.65rem;color:var(--txt-m);text-align:right;margin-top:2px}

/* === SCREENS === */
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 60px}
.scr{display:none;opacity:0;transform:translateY(20px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.scr.on{display:block;opacity:1;transform:translateY(0)}

/* === PIXEL-STYLE CARDS === */
.px-card{background:var(--card);border:3px solid var(--beige-dk);box-shadow:4px 4px 0 var(--beige-dk);border-radius:0;padding:0;overflow:hidden}
.px-card-inner{padding:24px}
.px-title{font-size:1.8rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,var(--sage-dk),#4A7A4E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.px-sub{color:var(--txt-m);font-size:.9rem;margin-top:4px}
.px-formula{display:inline-block;background:var(--beige);border:3px solid var(--beige-dk);padding:10px 24px;font-weight:800;font-size:1rem;margin:16px 0;font-family:monospace;letter-spacing:.5px}
.px-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:3px solid var(--beige-dk);margin:16px 0}
.px-stat{padding:14px;text-align:center;border-right:3px solid var(--beige-dk)}
.px-stat:last-child{border-right:none}
.px-stat small{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--txt-m);font-weight:800}
.px-stat b{display:block;font-size:1.3rem;margin-top:4px}
.px-btn{padding:14px 40px;background:var(--sage);color:#fff;font-weight:800;font-size:1rem;border:3px solid var(--sage-dk);box-shadow:4px 4px 0 var(--sage-dk);transition:all .15s;letter-spacing:.5px;text-transform:uppercase}
.px-btn:hover{background:var(--sage-dk);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--sage-dk)}
.px-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sage-dk)}

/* === GAME === */
.g-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.g-title{font-size:1.1rem;font-weight:900;flex:1;letter-spacing:.5px;text-transform:uppercase}
.g-stats{display:flex;gap:12px;align-items:center}
.g-stat{display:flex;align-items:center;gap:4px;font-size:.85rem;font-weight:800}
.lives-row{display:flex;gap:2px}
.lives-row svg{width:18px;height:18px;transition:all .3s var(--ease)}
.lives-row svg.lost{opacity:.15;transform:scale(.7)}
.params-row{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:3px solid var(--beige-dk);margin-bottom:14px}
.p-box{padding:12px;text-align:center;border-right:3px solid var(--beige-dk);background:var(--warm)}
.p-box:last-child{border-right:none}
.p-lbl{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--txt-m)}
.p-val{font-size:1.2rem;font-weight:900;margin-top:4px;display:block}
.round-badge{display:inline-block;background:var(--sage);color:#fff;font-weight:900;font-size:.7rem;padding:3px 14px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}

/* === PIXEL ARENA === */
.arena{border:3px solid var(--beige-dk);box-shadow:4px 4px 0 var(--beige-dk);margin-bottom:14px;position:relative;overflow:hidden;height:280px}
.arena canvas{width:100%;height:100%;display:block}

/* === CONTROLS === */
.g-ctrl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.g-inp{padding:12px 16px;border:3px solid var(--beige-dk);font-size:1.1rem;width:200px;text-align:center;background:var(--card);font-weight:700;transition:border-color .2s}
.g-inp:focus{border-color:var(--sage)}
.fire-btn{padding:12px 32px;background:var(--sage);color:#fff;font-weight:800;font-size:.95rem;border:3px solid var(--sage-dk);box-shadow:3px 3px 0 var(--sage-dk);transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.fire-btn:hover{background:var(--sage-dk);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sage-dk)}
.fire-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sage-dk)}
.g-msg{text-align:center;font-weight:800;font-size:.95rem;min-height:26px;transition:color .3s}
.g-msg.ok{color:var(--sage-dk)}.g-msg.err{color:var(--pink)}.g-msg.inf{color:var(--txt-m)}
.hint-t{font-size:.75rem;color:var(--txt-m);text-align:center;margin-top:4px}
.nxt-btn{padding:8px 20px;background:var(--beige);border:3px solid var(--beige-dk);box-shadow:3px 3px 0 var(--beige-dk);font-weight:800;font-size:.8rem;display:none;margin:8px auto 0;text-transform:uppercase;letter-spacing:.5px;transition:all .15s}
.nxt-btn:hover{background:var(--beige-dk);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--beige-dk)}

/* === OVERLAY === */
.ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(61,50,38,.5);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.ov.show{opacity:1;pointer-events:all}
.ov-card{background:var(--card);border:4px solid var(--beige-dk);box-shadow:6px 6px 0 var(--beige-dk);padding:32px;text-align:center;max-width:380px;width:90%;transform:scale(.9);transition:transform .4s var(--bounce)}
.ov.show .ov-card{transform:scale(1)}
.ov-title{font-size:1.3rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.ov-desc{color:var(--txt-m);font-size:.9rem;margin:16px 0 20px;line-height:1.5}
.ov-btn{padding:10px 28px;background:var(--sage);color:#fff;font-weight:800;border:3px solid var(--sage-dk);box-shadow:3px 3px 0 var(--sage-dk);transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.ov-btn:hover{background:var(--sage-dk);transform:translate(-1px,-1px);box:1px 1px 0 var(--sage-dk)}.ov-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sage-dk)}
.stars-row{display:flex;justify-content:center;gap:6px;margin:12px 0}
.xpf{position:fixed;z-index:150;pointer-events:none;font-weight:900;font-size:1.1rem;animation:xfA 1.2s var(--ease) forwards}
@keyframes xfA{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.8)}}
#confetti{position:fixed;inset:0;z-index:180;pointer-events:none}
@media(max-width:640px){.px-title{font-size:1.4rem}.g-ctrl{flex-direction:column}.g-inp{width:100%}.arena{height:220px}.params-row{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg-layer" aria-hidden="true"><div class="bg-grad"></div></div>
<header class="top-bar" role="banner">
  <span style="font-weight:900;font-size:.85rem;color:var(--sage-dk);letter-spacing:1px;text-transform:uppercase" id="rankBadge">Fillimtar</span>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="res-item res-xp" id="xpD"></span>
    <span class="res-item res-coins" id="coinD"></span>
    <span class="res-item res-streak" id="strD"></span>
  </div>
</header>
<div class="xp-wrap"><div class="xp-outer"><div class="xp-inner" id="xpBar"></div></div><div class="xp-lbl" id="xpLbl"></div></div>
<main class="wrap">
  <section id="sStart" class="scr on">
    <div class="px-card"><div class="px-card-inner" style="text-align:center;padding:40px 24px">
      <canvas id="heroCvs" width="192" height="128" class="pixel-canvas" style="width:288px;height:192px;margin:0 auto 20px;display:block"></canvas>
      <div class="px-title">Mbrojtja e Kështjellës</div>
      <p class="px-sub">Sfida Kinetike - Pixel Edition</p>
      <div class="px-formula">E<sub>k</sub> = 1/2 * m * v^2</div>
      <div class="px-stats">
        <div class="px-stat"><small>Raunde</small><b id="sR">0</b></div>
        <div class="px-stat"><small>Rekord</small><b id="sB">0</b></div>
        <div class="px-stat"><small>Radhë</small><b id="sS">0</b></div>
      </div>
      <button class="px-btn" onclick="startGame()">Fillo Lojen</button>
    </div></div>
  </section>
  <section id="sGame" class="scr">
    <div class="round-badge" id="rBadge">Raundi 1</div>
    <div class="g-head">
      <span class="g-title">Mbrojtja e Kështjellës</span>
      <div class="g-stats">
        <span class="g-stat" id="gSc"></span>
        <span class="g-stat" id="gSt"></span>
        <div class="lives-row" id="gLives"></div>
      </div>
    </div>
    <div class="params-row">
      <div class="p-box"><span class="p-lbl">Masa (m)</span><span class="p-val" id="pM">-</span></div>
      <div class="p-box"><span class="p-lbl">Shpejtësia (v)</span><span class="p-val" id="pV">-</span></div>
    </div>
    <div class="arena"><canvas id="gameCvs" width="256" height="180" class="pixel-canvas"></canvas></div>
    <div class="g-ctrl">
      <input type="number" class="g-inp" id="uInp" placeholder="Energjia (J)">
      <button class="fire-btn" onclick="fire()">Zjarr</button>
    </div>
    <div class="g-msg inf" id="gMsg">Perbindeshi po afrohet...</div>
    <p class="hint-t">Shpejtesia ne katror (v x v)!</p>
    <div style="text-align:center"><button class="nxt-btn" id="nxtB" onclick="initRound()">Raundi Tjetër</button></div>
  </section>
</main>
<div class="ov" id="ovOver" role="dialog"><div class="ov-card">
  <canvas id="overCvs" width="96" height="96" class="pixel-canvas" style="width:96px;height:96px;margin:0 auto 12px;display:block"></canvas>
  <div class="ov-title" id="ovOT">Kështjella Ra</div>
  <div class="stars-row" id="ovSt"></div>
  <div class="ov-desc" id="ovOD"></div>
  <button class="ov-btn" onclick="closeOv('ovOver');goStart()">Provo Perseri</button>
</div></div>
<div class="ov" id="ovLvl" role="dialog"><div class="ov-card">
  <div class="ov-title" id="ovLT">Nivel i Ri!</div>
  <div class="ov-desc" id="ovLD"></div>
  <button class="ov-btn" onclick="closeOv('ovLvl')">Vazhdo</button>
</div></div>
<canvas id="confetti"></canvas>
<script>

/* ===== RESOURCES ===== */
const SVG={
  heart:(f)=>`<svg viewBox="0 0 16 16" width="18" height="18"><path d="M8 14l-1-1C3 9.5 1 7.5 1 5.5 1 4 2.5 2.5 4 2.5c1 0 2 .5 2.5 1.2h1C8 2.9 9 2.5 10 2.5 11.5 2.5 13 4 13 5.5c0 2-2 4-6 7.5L8 14z" fill="${f?'#D4A0A0':'#E8DDD0'}"/></svg>`,
  star:(f)=>`<svg viewBox="0 0 20 20" width="24" height="24"><polygon points="10,1 12.5,7 19,7.5 14,11.5 15.5,18 10,14.5 4.5,18 6,11.5 1,7.5 7.5,7" fill="${f?'#E8C07A':'#E8DDD0'}" stroke="${f?'#C89830':'#D4C8B0'}" stroke-width=".8"/></svg>`,
  coin:()=>`<svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="7" fill="#F0D68A" stroke="#C89830" stroke-width="1"/><text x="8" y="11" text-anchor="middle" font-size="9" font-weight="bold" fill="#8B6914">C</text></svg>`,
  xp:()=>`<svg viewBox="0 0 16 16" width="16" height="16"><polygon points="8,1 10,6 15,6.5 11.5,10 12.5,15 8,12.5 3.5,15 4.5,10 1,6.5 6,6" fill="#E8C07A"/></svg>`,
  fire:()=>`<svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1C5.5 5 3 7 3 10a5 5 0 0010 0c0-3-2.5-5-5-9z" fill="#E8C07A"/><path d="M8 6.5c-1.5 2-2.5 3-2.5 4.5a2.5 2.5 0 005 0C10.5 9.5 9.5 8.5 8 6.5z" fill="#D4A0A0"/></svg>`,
  lvlUp:()=>`<svg viewBox="0 0 20 20" width="48" height="48"><polygon points="10,1 12.5,7 19,7.5 14,11.5 15.5,18 10,14.5 4.5,18 6,11.5 1,7.5 7.5,7" fill="#E8C07A" stroke="#C89830" stroke-width="1"/><path d="M7 10l3 3 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
};

/* ===== STATE ===== */
const RANKS=['Fillimtar','Nxenes','Elemin','Ekspert','Mjeshter','Gjeni','Legjende'];
const LXP=[0,60,140,260,420,640,940,1340,1860,2500,3400];
let G={xp:0,coins:0,level:1,streak:0,maxStreak:0,combo:1,best:0,total:0,first:true,lives:3,score:0,round:0,m:0,v:0,ans:0,projX:-4,projTarget:-4,monsterState:'idle',animFrame:null};
function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}

/* ===== SCREEN NAV ===== */
function showScr(id){const c=document.querySelector('.scr.on');if(c){c.style.opacity='0';c.style.transform='translateY(20px)';setTimeout(()=>{c.classList.remove('on');c.style.display='none'},300)}const n=document.getElementById(id);n.style.display='block';n.style.opacity='0';n.style.transform='translateY(20px)';requestAnimationFrame(()=>requestAnimationFrame(()=>{n.classList.add('on');n.style.opacity='1';n.style.transform='translateY(0)'}))}
function goStart(){if(G.animFrame)cancelAnimationFrame(G.animFrame);showScr('sStart');updStart()}

/* ===== XP/LEVEL ===== */
function addXP(a,el){const ol=G.level;G.xp+=a;G.coins+=Math.floor(a/4);let lv=1;for(let i=LXP.length-1;i>=0;i--){if(G.xp>=LXP[i]){lv=i+1;break;}}G.level=lv;updHUD();if(el){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='xpf';d.style.left=r.left+r.width/2+'px';d.style.top=r.top+'px';d.style.color='var(--gold-dk)';d.textContent='+'+a+' XP';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}if(lv>ol)showLvlUp(lv)}
function updHUD(){document.getElementById('xpD').innerHTML=SVG.xp()+' '+fmt(G.xp);document.getElementById('coinD').innerHTML=SVG.coin()+' '+fmt(G.coins);document.getElementById('strD').innerHTML=SVG.fire()+' '+G.streak;document.getElementById('rankBadge').textContent=RANKS[Math.min(G.level-1,RANKS.length-1)];const c=LXP[G.level-1]||0,nx=LXP[G.level]||(LXP[LXP.length-1]+800);document.getElementById('xpBar').style.width=Math.min(100,((G.xp-c)/(nx-c))*100)+'%';document.getElementById('xpLbl').textContent=fmt(G.xp-c)+' / '+fmt(nx-c)+' XP'}
function addStrk(){G.streak++;G.combo=Math.min(3,1+Math.floor(G.streak/3));if(G.streak>G.maxStreak)G.maxStreak=G.streak;const e=document.getElementById('strD');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function rstStrk(){G.streak=0;G.combo=1;updHUD()}

/* ===== HERO CANVAS ===== */
function drawHeroScene(){
  const c=document.getElementById('heroCvs');if(!c)return;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  /* Qielli */
  ctx.fillStyle='#B5D4E3';ctx.fillRect(0,0,192,128);
  /* Dekorime */
  PX.draw(ctx,0,0,PX.heroScene,PX.hColors,1);
}

/* ===== START ===== */
function updStart(){document.getElementById('sR').textContent=G.total;document.getElementById('sB').textContent=G.best;document.getElementById('sS').textContent=G.maxStreak}
function startGame(){G.lives=3;G.score=0;G.round=0;G.first=true;G.streak=0;G.combo=1;showScr('sGame');initRound()}

/* ===== GAME CANVAS ===== */
function initRound(){
  G.m=(Math.floor(Math.random()*5)+1)*2;G.v=Math.floor(Math.random()*5)+2;
  G.ans=0.5*G.m*(G.v*G.v);G.first=true;G.projX=-4;G.projTarget=-4;G.monsterState='idle';
  document.getElementById('pM').textContent=G.m+' kg';document.getElementById('pV').textContent=G.v+' m/s';
  document.getElementById('uInp').value='';document.getElementById('gMsg').textContent='Perbindeshi po afrohet...';document.getElementById('gMsg').className='g-msg inf';
  document.getElementById('nxtB').style.display='none';document.getElementById('rBadge').textContent='Raundi '+(G.round+1);
  updStats();if(G.animFrame)cancelAnimationFrame(G.animFrame);gameLoop();
}
function updStats(){document.getElementById('gSc').innerHTML=SVG.xp()+' '+G.score;document.getElementById('gSt').innerHTML=SVG.fire()+' '+G.streak;const lv=document.getElementById('gLives');lv.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('span');s.innerHTML=SVG.heart(i<G.lives);if(i>=G.lives)s.classList.add('lost');lv.appendChild(s)}}

/* ===== GAME RENDER LOOP ===== */
let lastTime=0;
function gameLoop(ts){
  const dt=ts?(ts-lastTime)/1000:0.016;lastTime=ts||0;
  const c=document.getElementById('gameCvs');if(!c){G.animFrame=requestAnimationFrame(gameLoop);return}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,256,180);
  /* Qielli */
  ctx.fillStyle='#B5D4E3';ctx.fillRect(0,0,256,105);
  /* Re pixel */
  const cloudOff=(ts||0)*0.008;
  PX.draw(ctx,Math.floor((cloudOff%80)-20),8,[['..SSSS..'],['.SSSSSS.'],['SSSSSSSS'],['.SSSSSS.']],[{S:'#fff'}],1);
  PX.draw(ctx,Math.floor((cloudOff*0.7+120)%300)-20,20,[['.SSSS.'],['SSSSSS'],['.SSSS.']],[{S:'#ddd'}],1);
  /* Toka */
  ctx.fillStyle='#7BAE7F';ctx.fillRect(0,105,256,75);
  ctx.fillStyle='#5A8E5E';ctx.fillRect(0,105,256,8);
  /* Kështjellë */
  PX.draw(ctx,4,55,PX.castle,PX.colors,1);
  /* Përbindësh */
  const mSprites={idle:PX.monster,hit:PX.monsterHit,laugh:PX.monsterLaugh};
  PX.draw(ctx,220,75,mSprites[G.monsterState]||PX.monster,PX.mColors,1);
  /* Bombë - animacion lëvizjeje */
  G.projX+=(G.projTarget-G.projX)*0.06;
  PX.draw(ctx,Math.round(G.projX),100,PX.bomb,PX.bColors,1);
  /* Flakë në bombë kur lëviz */
  if(Math.abs(G.projX-G.projTarget)>2){
    ctx.fillStyle=ts%200<100?'#E8C07A':'#D4A0A0';
    ctx.fillRect(Math.round(G.projX)*1+4,98,2,2);
  }
  G.animFrame=requestAnimationFrame(gameLoop);
}

/* ===== FIRE ===== */
function fire(){
  const val=parseFloat(document.getElementById('uInp').value);if(isNaN(val))return;
  const msg=document.getElementById('gMsg');
  if(val===G.ans){
    G.projTarget=210;
    setTimeout(()=>{
      G.monsterState='hit';
      msg.textContent='Goditje perfekte!';msg.className='g-msg ok';
      G.score+=10*G.combo;G.round++;G.total++;
      if(G.first)addStrk();else{rstStrk();G.first=true}
      addXP(20*G.combo,document.getElementById('gameCvs'));updStats();
      document.getElementById('nxtB').style.display='inline-block';
      if(G.round%3===0)confetti();
    },1000);
  } else {
    G.projTarget=val>G.ans?270:50;
    setTimeout(()=>{
      G.monsterState='laugh';
      msg.textContent=val>G.ans?'Tepert i forte!':'Tepert i dobet!';msg.className='g-msg err';
      G.lives--;G.first=false;rstStrk();updStats();
      if(G.lives<=0){msg.textContent='Keshtjella ra!';setTimeout(gameOver,1200)}
    },800);
  }
}
function nextRound(){initRound()}

/* ===== GAME OVER ===== */
function gameOver(){
  if(G.animFrame)cancelAnimationFrame(G.animFrame);
  if(G.score>G.best)G.best=G.score;
  const oc=document.getElementById('overCvs');const ctx=oc.getContext('2d');ctx.clearRect(0,0,96,96);
  PX.draw(ctx,32,20,PX.skull,PX.skColors,1);
  document.getElementById('ovOT').textContent='Keshtjella Ra';
  const s=G.round>=8?3:G.round>=4?2:G.round>=1?1:0;
  document.getElementById('ovSt').innerHTML=[1,2,3].map(i=>SVG.star(i<=s)).join('');
  document.getElementById('ovOD').innerHTML='Fitove <b>'+G.round+'</b> raunde<br>Pike: <b>'+G.score+'</b><br>Radhe: <b>'+G.maxStreak+'</b>';
  document.getElementById('ovOver').classList.add('show');if(s>=2)confetti();
}
function showLvlUp(lv){document.getElementById('ovLT').textContent='Nivel '+lv+'!';document.getElementById('ovLD').textContent='Ti tani je: '+RANKS[Math.min(lv-1,RANKS.length-1)];document.getElementById('ovLvl').classList.add('show');confetti()}
function closeOv(id){document.getElementById(id).classList.remove('show')}

/* ===== CONFETTI ===== */
function confetti(){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#7BAE7F','#89B4C8','#B8A9C9','#D4A0A0','#E8C07A','#A0D4C8','#F0D68A'];const ps=[];for(let i=0;i<80;i++)ps.push({x:Math.random()*c.width,y:-10-Math.random()*200,w:5+Math.random()*5,h:3+Math.random()*4,vx:(Math.random()-.5)*5,vy:2+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*360,rs:(Math.random()-.5)*12});let f;function dr(){x.clearRect(0,0,c.width,c.height);let a=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.r+=p.rs;if(p.y<c.height+30){a=true;x.save();x.translate(p.x,p.y);x.rotate(p.r*Math.PI/180);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}});if(a)f=requestAnimationFrame(dr);else x.clearRect(0,0,c.width,c.height)}dr()}

/* ===== BG ===== */
function initBg(){const l=document.querySelector('.bg-layer');for(let i=0;i<15;i++){const s=document.createElement('div');s.className='pixel-dot';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(3+Math.random()*3)+'s';l.appendChild(s)}}

/* ===== ENTER ===== */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('sGame').classList.contains('on'))fire()});
window.addEventListener('resize',()=>{const c=document.getElementById('confetti');if(c.width!==innerWidth){c.width=innerWidth;c.height=innerHeight}});

/* ===== INIT ===== */
(function(){initBg();drawHeroScene();updHUD();updStart()})();
</script>
</body>
</html>
