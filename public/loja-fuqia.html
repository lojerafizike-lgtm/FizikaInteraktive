<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratori i Fizikës: Fuqia Mekanike</title>
    <style>
        :root {
            --primare: #6c5ce7;
            --sekondare: #a29bfe;
            --sukses: #00b894;
            --gabim: #d63031;
            --sfondi: #f1f2f6;
            --teksti: #2d3436;
        }

        body {
            margin: 0;
            background-color: var(--sfondi);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--teksti);
        }

        .karta {
            background: white;
            width: 800px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 { margin-top: 0; color: var(--primare); }
        
        .shfaqja-formules {
            background: var(--sekondare);
            color: white;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .parametrat {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .kutia-param {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 16px;
            border-bottom: 4px solid var(--primare);
        }

        .kutia-param span { font-size: 0.8rem; color: #636e72; text-transform: uppercase; }
        .kutia-param b { font-size: 1.4rem; display: block; margin-top: 5px; }

        /* Skena e Ashensorit */
        .pusi {
            height: 320px;
            background: linear-gradient(to bottom, #74b9ff, #ffffff);
            border-radius: 20px;
            position: relative;
            margin-bottom: 30px;
            border: 4px solid #dfe6e9;
            overflow: hidden;
        }

        #kablli {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 40px;
            background: #2d3436;
            transform: translateX(-50%);
            z-index: 1;
        }

        #ashensori {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            z-index: 2;
            transition: bottom 0s linear, height 0s linear;
        }

        .dyshemeja {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 10px;
            background: #b2bec3;
        }

        /* Kontrollet */
        .kontrollet {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        input {
            padding: 15px;
            border: 2px solid #ced4da;
            border-radius: 12px;
            font-size: 1.1rem;
            width: 220px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primare); }

        button {
            padding: 15px 35px;
            background-color: var(--primare);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover { background-color: #5649c0; transform: translateY(-2px); }
        
        #mesazhi { margin-top: 20px; font-weight: bold; font-size: 1.2rem; min-height: 30px; }
        .butoni-reset { background: var(--sukses); display: none; margin: 10px auto; }
    </style>
</head>
<body>

<div class="karta">
    <h1>Laboratori i Fuqisë Mekanike</h1>
    <div class="shfaqja-formules">P = (m · g · h) / t</div>

    <div class="parametrat">
        <div class="kutia-param">
            <span>Masa (m)</span>
            <b>10 kg</b>
        </div>
        <div class="kutia-param">
            <span>Lartësia (h)</span>
            <b id="h-vlera">0 m</b>
        </div>
        <div class="kutia-param">
            <span>Koha (t)</span>
            <b id="t-vlera">0 s</b>
        </div>
    </div>

    <div class="pusi">
        <div id="kablli"></div>
        <div id="ashensori">📦</div>
        <div class="dyshemeja"></div>
    </div>

    <div class="kontrollet">
        <input type="number" id="inputP" placeholder="Llogarit Fuqinë (W)">
        <button onclick="nisMisionin()">AKTIVIZO ⚡</button>
    </div>

    <div id="mesazhi"></div>
    <button id="reset" class="butoni-reset" onclick="init()">PROVO NJË TJETËR</button>
</div>

<script>
    let m = 10, g = 10, h, t, targetP;

    function init() {
        // Gjenerojmë të dhëna të reja
        h = Math.floor(Math.random() * 7) + 3; // Lartësia nga 3 deri në 10m
        const kohet = [2, 4, 5, 10]; // Kohë që japin rezultate të plota
        t = kohet[Math.floor(Math.random() * kohet.length)];
        
        // Puna = m * g * h -> Fuqia = Puna / t
        targetP = (m * g * h) / t;

        document.getElementById('h-vlera').innerText = h + " m";
        document.getElementById('t-vlera').innerText = t + " s";
        document.getElementById('inputP').value = "";
        document.getElementById('mesazhi').innerText = "";
        document.getElementById('reset').style.display = "none";

        const ashensori = document.getElementById('ashensori');
        const kablli = document.getElementById('kablli');
        
        // Resetojmë pozicionin
        ashensori.style.transition = "none";
        kablli.style.transition = "none";
        ashensori.style.bottom = "10px";
        kablli.style.height = "260px";
        ashensori.innerText = "📦";
    }

    function nisMisionin() {
        const vleraUser = parseFloat(document.getElementById('inputP').value);
        const ashensori = document.getElementById('ashensori');
        const kablli = document.getElementById('kablli');
        const mesazhi = document.getElementById('mesazhi');

        if(isNaN(vleraUser)) return;

        if(vleraUser === targetP) {
            // Animacion me shpejtësi reale sipas kohës 't'
            ashensori.style.transition = `bottom ${t}s linear`;
            kablli.style.transition = `height ${t}s linear`;
            
            // Lëvizja vizuale
            let udhetimi = (h * 25); 
            ashensori.style.bottom = (10 + udhetimi) + "px";
            kablli.style.height = (260 - udhetimi) + "px";

            mesazhi.innerText = "✅ SAKTË! Motori po punon me fuqinë e duhur.";
            mesazhi.style.color = "var(--sukses)";
            
            setTimeout(() => {
                ashensori.innerText = "✨";
                document.getElementById('reset').style.display = "block";
            }, t * 1000);
        } else {
            // Gabim
            ashensori.innerText = "🔥";
            mesazhi.innerText = "❌ GABIM! Fuqia e gabuar mbingarkoi motorin. Duheshin " + targetP + " W.";
            mesazhi.style.color = "var(--gabim)";
            document.getElementById('reset').style.display = "block";
        }
    }

    // Nisja e parë
    init();
</script>

</body>
</html>
