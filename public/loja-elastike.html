<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forca Elastike (F = kx)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Nunito',sans-serif;background:#f5f0fb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:1rem;}
        .card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(80,60,140,.12);max-width:420px;width:100%;padding:2rem;text-align:center;}
        .icon{font-size:2.5rem;margin-bottom:.5rem;}
        h1{font-size:1.3rem;font-weight:900;color:#3a3058;margin-bottom:.3rem;}
        .formula{background:#f0edf8;border-radius:12px;padding:.6rem 1rem;font-size:1rem;font-weight:700;color:#6c5ce7;margin:.8rem 0 1.2rem;}
        p{color:#7a6ea0;font-size:.9rem;line-height:1.5;margin-bottom:1.2rem;}
        .input-row{display:flex;gap:.5rem;margin-bottom:1rem;}
        input{flex:1;border:2px solid #ddd8ee;border-radius:12px;padding:.7rem 1rem;font-size:1rem;font-family:'Nunito',sans-serif;outline:none;transition:.2s;}
        input:focus{border-color:#9b7fe8;}
        .unit{display:flex;align-items:center;background:#f0edf8;border-radius:12px;padding:0 .9rem;font-weight:700;color:#9b7fe8;font-size:.9rem;white-space:nowrap;}
        button{width:100%;background:#9b7fe8;color:#fff;border:none;border-radius:12px;padding:.8rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:.2s;}
        button:hover{background:#7c5ce7;transform:translateY(-1px);}
        #result{margin-top:1rem;font-weight:800;font-size:1rem;min-height:1.4rem;}
        .ok{color:#00b894;}
        .err{color:#d63031;}
        .hint{margin-top:.8rem;font-size:.8rem;color:#b0a8d0;cursor:pointer;}
        .hint-text{display:none;margin-top:.5rem;background:#ffeaa7;border-radius:10px;padding:.5rem .8rem;font-size:.82rem;color:#6c5ce7;font-weight:700;}
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🧪</div>
    <h1>Forca Elastike (F = kx)</h1>
    <div class="formula">F = k · x</div>
    <p>Konstanta elastike k = 200 N/m dhe zgjatimi x = 0.05 m. Sa është forca elastike?</p>
    <div class="input-row">
        <input type="number" id="ans" placeholder="Shkruaj përgjigjen..." step="any">
        <div class="unit">N</div>
    </div>
    <button onclick="check()">Kontrollo ✓</button>
    <div id="result"></div>
    <div class="hint" onclick="toggleHint()">💡 Shfaq ndihmë</div>
    <div class="hint-text" id="hint">Shumo: F = 200 × 0.05 = 10 N</div>
</div>
<script>
    const correct = 10;
    function check(){
        const v = parseFloat(document.getElementById('ans').value);
        const r = document.getElementById('result');
        if(isNaN(v)){r.className='err';r.innerText='Shkruaj një numër!';return;}
        if(Math.abs(v - correct) < correct*0.01 + 0.01){
            r.className='ok';r.innerText='Saktë! 🎉 Bravo!';
        } else {
            r.className='err';r.innerText='Gabim, provo përsëri! ❌';
        }
    }
    document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    function toggleHint(){
        const h=document.getElementById('hint');
        h.style.display=h.style.display==='block'?'none':'block';
    }
</script>
</body>
</html>
