<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Nxehtësia Specifike e lëndës </title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#FFAFC5;--rosedk:#D44070;
  --sky:#B8DCFF;--skydk:#3A80C8;
  --mint:#B8F4DC;--mintdk:#28A068;
  --sun:#FFE8A0;--sundk:#B87820;
  --lav:#D4C4FF;--lavdk:#7858CC;
  --peach:#FFD0B0;--peachdk:#C06030;
  --ink:#2A1838;--soft:#7A6898;--white:#FFFFFF;
}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse 90% 90% at 50% 30%,#FFE8F4 0%,#E8D8FF 35%,#D8EEFF 70%,#D8FFF0 100%);
  display:flex;justify-content:center;align-items:center;
  font-family:'M PLUS Rounded 1c',sans-serif;
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.28;animation:ob ease-in-out infinite alternate}
@keyframes ob{from{transform:translate(0,0)}to{transform:translate(20px,-25px)}}

.card{
  width:min(740px,96vw);
  background:var(--white);
  border-radius:28px;
  box-shadow:0 4px 0 var(--rosedk),0 12px 60px rgba(42,24,56,.13),inset 0 1px 0 #fff;
  overflow:hidden;
}
.stripe{height:8px;background:linear-gradient(90deg,var(--rose) 0 20%,var(--sun) 20% 40%,var(--mint) 40% 60%,var(--sky) 60% 80%,var(--lav) 80% 100%)}
.header{
  background:linear-gradient(135deg,#FFF2FA 0%,#F4F0FF 100%);
  padding:14px 24px;border-bottom:1.5px solid #EEE0F4;
  display:flex;align-items:center;justify-content:space-between;
}
.title{font-family:'DotGothic16',monospace;font-size:17px;color:var(--ink);letter-spacing:1px}
.title em{color:var(--rosedk);font-style:normal}
.badge{background:var(--sun);border:1.5px solid var(--sundk);border-radius:20px;padding:5px 13px;font-size:11px;font-weight:800;color:var(--sundk)}

/* HUD */
.hud{
  padding:14px 24px 10px;
  background:linear-gradient(135deg,#FFF8FC 0%,#F8F4FF 100%);
  border-bottom:1.5px solid #EEE0F4;
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
}
.pname{font-family:'DotGothic16',monospace;font-size:9px;letter-spacing:1px;margin-bottom:6px}
.p1name{color:var(--rosedk)}
.p2name{color:var(--skydk);text-align:right}
.hpbg{height:14px;border-radius:7px;background:#F0E8F8;border:1.5px solid #DDD0EE;overflow:hidden}
.hpfill{height:100%;border-radius:7px;transition:width .35s}
.hpfill1{background:linear-gradient(90deg,var(--rosedk),#FF80A8)}
.hpfill2{background:linear-gradient(90deg,var(--skydk),#80C0FF)}
.hpnum{font-family:'DotGothic16',monospace;font-size:9px;margin-top:4px}
.vsbadge{
  font-family:'DotGothic16',monospace;font-size:20px;color:var(--sundk);
  text-shadow:0 2px 0 var(--sun);text-align:center;white-space:nowrap;
}

/* Arena */
.arena{
  height:188px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#FFE8F4 0%,#FFF4FA 40%,#E8FFE8 40%,#C8F0D0 70%,#A8E0B8 100%);
  border-bottom:1.5px solid #EEE0F4;
}
.arena-cloud{position:absolute;top:10px;font-size:22px;opacity:.6;animation:acloud linear infinite}
@keyframes acloud{from{transform:translateX(-80px)}to{transform:translateX(780px)}}
.arena-flower{
  position:absolute;bottom:8px;font-size:16px;
  animation:fbob 3s ease-in-out infinite alternate;
}
@keyframes fbob{from{transform:translateY(0)}to{transform:translateY(-4px)}}

.fighter{
  position:absolute;bottom:32px;font-size:72px;
  filter:drop-shadow(2px 4px 0 rgba(0,0,0,.12));
  transition:all .22s;
}
#p1{left:8%;transform:scaleX(-1)}
#p2{right:8%}

.fxicon{position:absolute;font-size:36px;opacity:0;z-index:5;pointer-events:none}

.bigmsg{
  position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);
  font-family:'DotGothic16',monospace;font-size:22px;z-index:20;
  display:none;text-align:center;padding:10px 24px;
  border-radius:14px;border:2px solid currentColor;
  background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
  box-shadow:0 4px 0 currentColor;
}

/* Dashboard */
.dash{
  background:linear-gradient(135deg,#FFF8FF 0%,#F8F4FF 100%);
  padding:14px 24px 16px;
  display:flex;flex-direction:column;align-items:center;gap:11px;
  border-top:1.5px solid #EEE0F4;
}
.formula-pill{
  background:var(--lav);border:1.5px solid var(--lavdk);border-radius:20px;
  padding:6px 18px;font-family:'DotGothic16',monospace;font-size:11px;color:var(--lavdk);
  letter-spacing:1px;box-shadow:0 3px 0 var(--lavdk);
}
.qbox{
  background:#fff;border:1.5px solid var(--sun);border-radius:14px;
  padding:11px 18px;font-size:13px;font-weight:700;color:var(--ink);
  text-align:center;line-height:1.7;width:100%;
  box-shadow:0 3px 0 var(--sundk);
}
.qbox b{color:var(--rosedk)}
.input-row{display:flex;gap:12px;align-items:center}
input[type=number]{
  font-family:'DotGothic16',monospace;font-size:18px;text-align:center;
  width:170px;padding:10px 12px;
  background:#FFF8FF;border:2px solid var(--lav);border-radius:12px;
  color:var(--lavdk);outline:none;transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--lavdk);box-shadow:0 0 0 4px rgba(212,196,255,.3)}
input::placeholder{color:#C0B0E0}
.btn{
  font-family:'DotGothic16',monospace;font-size:12px;letter-spacing:1px;
  padding:11px 20px;background:var(--rosedk);color:#fff;border:none;border-radius:12px;
  cursor:pointer;box-shadow:0 4px 0 #A02850,0 6px 18px rgba(212,64,112,.28);
  transition:all .12s;white-space:nowrap;
}
.btn:hover{background:#E8507A;transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A02850}
.msgtxt{font-family:'DotGothic16',monospace;font-size:10px;color:var(--soft);letter-spacing:.5px}

/* Animations */
@keyframes p1lunge{
  0%{left:8%;transform:scaleX(-1)}
  45%{left:50%;transform:scaleX(-1) scale(1.12)}
  100%{left:8%;transform:scaleX(-1)}
}
@keyframes p2lunge{
  0%{right:8%;transform:scaleX(1)}
  45%{right:50%;transform:scale(1.12)}
  100%{right:8%;transform:scaleX(1)}
}
@keyframes hitshake{
  0%,100%{filter:brightness(1)}
  25%{filter:brightness(2.5) saturate(3) hue-rotate(280deg);transform:translateX(-9px) scaleX(-1)}
  65%{filter:brightness(1);transform:translateX(9px) scaleX(-1)}
}
@keyframes hitshake2{
  0%,100%{filter:brightness(1)}
  25%{filter:brightness(2.5) saturate(3) hue-rotate(200deg);transform:translateX(9px)}
  65%{filter:brightness(1);transform:translateX(-9px)}
}
@keyframes fxboom{
  0%{opacity:1;transform:scale(.3) rotate(0)}
  55%{opacity:1;transform:scale(1.5) rotate(80deg)}
  100%{opacity:0;transform:scale(2.5) rotate(160deg) translateY(-40px)}
}
@keyframes fxice{
  0%{opacity:1;transform:scale(.3)}
  65%{opacity:1;transform:scale(1.6)}
  100%{opacity:0;transform:scale(2.2) translateY(-30px)}
}
</style>
</head>
<body>
<div class="orb" style="width:300px;height:300px;background:#FFB8C8;top:-80px;right:-60px;animation-duration:7s"></div>
<div class="orb" style="width:240px;height:240px;background:#B8DCFF;bottom:-60px;left:-50px;animation-duration:9s;animation-delay:-3s"></div>

<div class="card">
  <div class="stripe"></div>
  <div class="header">
    <div class="title">⚔️ BETEJA <em>E NXEHTËSISË</em></div>
    <div class="badge">Q = c · m · Δt</div>
  </div>

  <div class="hud">
    <div>
      <div class="pname p1name">🔥 ZJARR (TI)</div>
      <div class="hpbg"><div class="hpfill hpfill1" id="hp1fill"></div></div>
      <div class="hpnum" style="color:var(--rosedk)"><span id="hp1n">100</span> HP</div>
    </div>
    <div class="vsbadge">VS</div>
    <div style="text-align:right">
      <div class="pname p2name">AKULL (CPU) ⛄</div>
      <div class="hpbg" style="direction:rtl"><div class="hpfill hpfill2" id="hp2fill"></div></div>
      <div class="hpnum" style="color:var(--skydk);text-align:right"><span id="hp2n">100</span> HP</div>
    </div>
  </div>

  <div class="arena">
    <div class="arena-cloud" style="animation-duration:15s">☁️</div>
    <div class="arena-cloud" style="animation-duration:21s;animation-delay:-7s;font-size:16px;top:22px">⛅</div>
    <!-- flowers -->
    <div class="arena-flower" style="left:5%">🌸</div>
    <div class="arena-flower" style="left:22%;animation-delay:-.8s">🌺</div>
    <div class="arena-flower" style="left:40%;animation-delay:-.4s">🌼</div>
    <div class="arena-flower" style="right:22%;animation-delay:-1.2s">🌸</div>
    <div class="arena-flower" style="right:5%;animation-delay:-.6s">🌷</div>

    <div class="fighter" id="p1">🔥</div>
    <div class="fighter" id="p2">⛄</div>
    <div class="fxicon" id="fx">💥</div>
    <div class="bigmsg" id="bigmsg">KO!</div>
  </div>

  <div class="dash">
    <div class="formula-pill">⚡ Q = c · m · Δt ⚡</div>
    <div class="qbox" id="qbox">Duke ngarkuar pyetjen…</div>
    <div class="input-row">
      <input type="number" id="ans" placeholder="? Joule" autocomplete="off">
      <button class="btn" onclick="strike()">SULMO ⚔️</button>
    </div>
    <div class="msgtxt" id="msg">Jep përgjigjen e saktë për të sulmuar!</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let p1hp=100,p2hp=100,cq=0,gone=false;

function updHp(){
  $('hp1fill').style.width=p1hp+'%'; $('hp2fill').style.width=p2hp+'%';
  $('hp1n').textContent=p1hp; $('hp2n').textContent=p2hp;
  if(p1hp<30){$('hp1fill').style.background='linear-gradient(90deg,#CC2244,#FF6688)'}
  if(p2hp<30){$('hp2fill').style.background='linear-gradient(90deg,#CC2244,#FF6688)'}
}
function setMsg(t,c){$('msg').textContent=t;$('msg').style.color=c}

function gen(){
  if(gone)return;
  $('ans').value=''; $('ans').focus();
  const m=Math.floor(Math.random()*5)+1;
  const c=(Math.floor(Math.random()*5)+1)*100;
  const dt=(Math.floor(Math.random()*5)+1)*10;
  cq=m*c*dt;
  $('qbox').innerHTML=`Masa <b>${m} kg</b> &nbsp;·&nbsp; c = <b>${c} J/kg·K</b> &nbsp;·&nbsp; Δt = <b>${dt} K</b><br>Sa është Q (Xhaul)?`;
  setMsg('Jep përgjigjen e saktë për të sulmuar!','var(--soft)');
}

function strike(){
  if(gone)return;
  const val=parseInt($('ans').value); if(isNaN(val))return;
  const p1=$('p1'),p2=$('p2'),fx=$('fx');
  if(val===cq){
    p1.style.animation='p1lunge .6s ease';
    setTimeout(()=>{
      fx.textContent='🔥'; fx.style.right='12%'; fx.style.left='auto'; fx.style.bottom='60px';
      fx.style.animation='fxboom .5s ease forwards';
      p2.style.animation='hitshake2 .4s';
      p2hp-=25; if(p2hp<0)p2hp=0; updHp(); chkWin();
    },280);
    setTimeout(()=>{p1.style.animation='';p2.style.animation='';fx.style.animation='';if(!gone)gen();},900);
    setMsg('✨ Goditje!','var(--mintdk)');
  } else {
    setMsg('💥 Gabim!','var(--rosedk)');
    p2.style.animation='p2lunge .6s ease';
    setTimeout(()=>{
      fx.textContent='❄️'; fx.style.left='12%'; fx.style.right='auto'; fx.style.bottom='60px';
      fx.style.animation='fxice .5s ease forwards';
      p1.style.animation='hitshake .4s';
      p1hp-=25; if(p1hp<0)p1hp=0; updHp(); chkWin();
    },280);
    setTimeout(()=>{p1.style.animation='';p2.style.animation='';fx.style.animation='';if(!gone)gen();},1100);
  }
}

function chkWin(){
  if(p2hp<=0){
    gone=true;
    const m=$('bigmsg'); m.textContent='🏆 FITOVE!'; m.style.color='var(--mintdk)'; m.style.display='block';
    $('p2').textContent='💀';
  } else if(p1hp<=0){
    gone=true;
    const m=$('bigmsg'); m.textContent='💀 HUMBE'; m.style.color='var(--rosedk)'; m.style.display='block';
    $('p1').textContent='💀';
  }
}
$('ans').addEventListener('keypress',e=>{if(e.key==='Enter')strike()});
gen();
</script>
</body>
</html>
