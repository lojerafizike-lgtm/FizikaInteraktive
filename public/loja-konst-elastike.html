<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Konstanta Elastike</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent2: #f97316;
    --gold: #f59e0b;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }
  h1 {
    font-size: 2.5rem;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 800;
    text-align: center;
  }
  .subtitle { color: var(--muted); font-size: 1.2rem; margin-bottom: 30px; font-weight: 600; text-align: center; }
  .card {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .formula-box {
    background: #f8fafc;
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    font-size: 1.3rem;
    color: var(--accent);
    margin-bottom: 24px;
    font-weight: 800;
    box-shadow: var(--shadow-inner);
  }
  label { font-size: 1rem; color: var(--text); display: block; margin-bottom: 8px; font-weight: 600; }
  .slider-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #e2e8f0;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
  .val {
    min-width: 80px;
    text-align: right;
    font-size: 1.1rem;
    color: var(--accent);
    font-weight: 800;
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 12px;
  }
  .results { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .result-item {
    background: #f8fafc;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .rlabel { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .rval { font-size: 1.3rem; color: var(--gold); font-weight: 800; }
  .tab-row { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; }
  .tab {
    padding: 12px 24px;
    border-radius: 16px;
    border: none;
    background: #e2e8f0;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { background: #cbd5e1; color: var(--text); }
  .tab.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }
  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .question { font-size: 1.2rem; color: var(--text); margin-bottom: 20px; line-height: 1.5; font-weight: 800; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt-btn {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    padding: 16px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .opt-btn:hover { border-color: var(--accent); background: #f5f3ff; }
  .opt-btn.correct { border-color: #10b981; background: #ecfdf5; color: #047857; }
  .opt-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
  .feedback { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; display: none; text-align: center; }
  .feedback.show { display: block; animation: fadeIn 0.3s ease; }
  .feedback.ok { background: #ecfdf5; color: #047857; border: 1px solid #10b981; }
  .feedback.bad { background: #fef2f2; color: #b91c1c; border: 1px solid #ef4444; }
  .next-btn {
    margin-top: 20px;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    padding: 16px 32px;
    cursor: pointer;
    display: none;
    font-weight: 800;
    width: 100%;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }
  .next-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
  .next-btn.show { display: inline-block; }
  .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .score-badge {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
  }
  .progress-bar { flex: 1; height: 12px; background: #e2e8f0; border-radius: 6px; margin: 0 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.4s ease; }
  .victory { text-align: center; padding: 40px 20px; display: none; }
  .victory.show { display: block; animation: fadeIn 0.5s ease; }
  .victory-title { font-size: 2.5rem; color: var(--gold); margin-bottom: 16px; font-weight: 800; }
  .stars { font-size: 3.5rem; margin: 16px 0; color: var(--gold); }
  .restart-btn {
    margin-top: 24px;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    padding: 16px 36px;
    cursor: pointer;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    transition: all 0.2s;
  }
  .restart-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
  
  /* Graph specific */
  canvas { background: #ffffff; border: 2px solid var(--border); border-radius: 16px; max-width: 100%; box-shadow: var(--shadow-inner); }
  .graph-label { font-size: 0.95rem; color: var(--muted); text-align: center; margin-top: 12px; font-weight: 600; }
  .springs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .spring-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
  .spring-name { font-size: 1rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .spring-k { font-size: 1.3rem; color: var(--accent); font-weight: 800; }
  .spring-bar { height: 12px; background: var(--accent); border-radius: 6px; margin: 12px 0 4px 0; }
</style>
</head>
<body>
<h1><i class="fas fa-wrench"></i> KONSTANTA ELASTIKE</h1>
<p class="subtitle">k = F / x &nbsp;|&nbsp; Rezistenca ndaj Shformimit</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)"><i class="fas fa-chart-line"></i> Grafik F(x)</button>
  <button class="tab" onclick="switchTab('quiz',event)"><i class="fas fa-question-circle"></i> Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="formula-box">k = F / x &nbsp;&nbsp;(pjerrësia e grafikut F-x)</div>
    <div class="springs-row">
      <div class="spring-card"><div class="spring-name"><i class="fas fa-leaf" style="color:#10b981"></i> Spirale e butë</div><div class="spring-k" id="sk1">k = 50 N/m</div><div class="spring-bar" id="sb1" style="width:25%"></div></div>
      <div class="spring-card"><div class="spring-name"><i class="fas fa-cog" style="color:var(--accent2)"></i> Spirale e ngurtë</div><div class="spring-k" id="sk2">k = 200 N/m</div><div class="spring-bar" id="sb2" style="width:100%;background:var(--accent2)"></div></div>
    </div>
    <canvas id="graphCanvas" width="650" height="240"></canvas>
    <div class="graph-label">Grafiku F(x) — pjerrësia = k (konstanta elastike)</div>
    <div class="slider-row" style="margin-top:24px;">
      <label style="min-width:100px">k spirales (N/m)</label>
      <input type="range" id="kSlider" min="10" max="300" value="100" oninput="updateGraph()">
      <span class="val" id="kVal">100 N/m</span>
    </div>
    <div class="slider-row">
      <label style="min-width:100px">Shformimi x (cm)</label>
      <input type="range" id="xSlider" min="1" max="20" value="10" oninput="updateGraph()">
      <span class="val" id="xVal">10 cm</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">k (N/m)</div><div class="rval" id="r1">100</div></div>
      <div class="result-item"><div class="rlabel">x (m)</div><div class="rval" id="r2">0.10</div></div>
      <div class="result-item"><div class="rlabel">F = kx (N)</div><div class="rval" id="r3">10.0</div></div>
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge"><i class="fas fa-star" style="color:var(--gold)"></i> <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-size:1.4rem;color:var(--muted);font-weight:800;">Pikë: <span id="finalScore" style="color:var(--accent);"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> RISTART</button>
    </div>
  </div>
</div>

<script>
function updateGraph() {
  const k = parseFloat(document.getElementById('kSlider').value);
  const x = parseFloat(document.getElementById('xSlider').value) / 100;
  document.getElementById('kVal').textContent = k + ' N/m';
  document.getElementById('xVal').textContent = (x*100).toFixed(0) + ' cm';
  document.getElementById('r1').textContent = k;
  document.getElementById('r2').textContent = x.toFixed(2);
  document.getElementById('r3').textContent = (k*x).toFixed(1);
  drawGraph(k, x);
}

function drawGraph(k, xMark) {
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = {l:50,r:20,t:20,b:40};
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  const xMax = 0.25, fMax = k * xMax;
  const sx = x => pad.l + x/xMax*(W-pad.l-pad.r);
  const sy = f => H-pad.b - f/fMax*(H-pad.t-pad.b);

  // grid
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  for (let i=0;i<=5;i++) {
    const x = i/5*xMax; ctx.beginPath(); ctx.moveTo(sx(x),pad.t); ctx.lineTo(sx(x),H-pad.b); ctx.stroke();
    const f = i/5*fMax; ctx.beginPath(); ctx.moveTo(pad.l,sy(f)); ctx.lineTo(W-pad.r,sy(f)); ctx.stroke();
  }

  // axes
  ctx.strokeStyle='#64748b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();

  // axis labels
  ctx.fillStyle='#64748b';ctx.font='600 12px Nunito';ctx.textAlign='center';
  for (let i=0;i<=5;i++) {
    const xv=i/5*xMax; ctx.fillText((xv*100).toFixed(0)+'cm',sx(xv),H-pad.b+16);
    const fv=i/5*fMax; ctx.textAlign='right'; ctx.fillText(fv.toFixed(0)+'N',pad.l-6,sy(fv)+4); ctx.textAlign='center';
  }
  ctx.fillText('x (shformim)',W/2,H-4);
  ctx.save();ctx.translate(14,H/2);ctx.rotate(-Math.PI/2);ctx.fillText('F (N)',0,0);ctx.restore();

  // Line F=kx
  ctx.strokeStyle='#8b5cf6';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(sx(0),sy(0));ctx.lineTo(sx(xMax),sy(fMax));ctx.stroke();

  // marked point
  const px = sx(xMark), py = sy(k*xMark);
  ctx.strokeStyle='#f97316';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(px,H-pad.b);ctx.lineTo(px,py);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad.l,py);ctx.lineTo(px,py);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f59e0b';ctx.font='800 14px Nunito';ctx.textAlign='left';
  ctx.fillText('F='+((k*xMark).toFixed(1))+'N',px+8,py-6);

  // slope label
  ctx.fillStyle='#8b5cf6';ctx.font='800 14px Nunito';ctx.textAlign='center';
  ctx.fillText('Pjerrësia = k = '+k+' N/m',sx(xMax*0.5),sy(fMax*0.65)-14);
}

updateGraph();

const questions=[
  {q:"Konstanta elastike k tregon:",opts:["Masën e spirales","Rezistencën ndaj shformimit","Gjatësinë e spirales","Nxitimin"],ans:1},
  {q:"Njësia e k është:",opts:["N·m","N/m","kg/m","J"],ans:1},
  {q:"F=200N, x=0.04m. Sa është k?",opts:["8 N/m","50 N/m","5000 N/m","0.0002 N/m"],ans:2},
  {q:"Në grafikun F(x), k është:",opts:["Sipërfaqja nën kurbë","Pjerrësia e drejtëzës","Presja Y","Vija horizontale"],ans:1},
  {q:"Spirale me k=500 N/m krahasuar me k=50 N/m:",opts:["Është më e butë","Është më e ngurtë","Ka të njëjtën ngurtësi","Nuk ka lidhje"],ans:1},
  {q:"Kufiri i elasticitetit është:",opts:["Pika ku spirale thyhet","Pika deri ku trupi kthehet në formë origjinale","k=0","F=0"],ans:1},
  {q:"Dy spirale k1=100 N/m dhe k2=200 N/m shformohen njëlloj. Cila ka Fe më të madhe?",opts:["k1 (100N/m)","k2 (200N/m)","Të dyja njëlloj","Varet nga masa"],ans:1}
];
let qi=0,score=0;
function loadQ() {
  const q=questions[qi];
  document.getElementById('question').textContent=(qi+1)+'. '+q.q;
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('qnum').textContent=qi+1;
  document.getElementById('progress').style.width=(qi/questions.length*100)+'%';
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=String.fromCharCode(65+i)+'. '+o;
    btn.onclick=()=>checkAns(i,btn);
    opts.appendChild(btn);
  });
}
function checkAns(i,btn) {
  const q=questions[qi];
  document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
  const fb=document.getElementById('feedback');
  if(i===q.ans){
    btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;
    fb.className='feedback ok show';fb.innerHTML='<i class="fas fa-check-circle"></i> Saktë!';
  }else{
    btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';
    fb.className='feedback bad show';fb.innerHTML='<i class="fas fa-times-circle"></i> Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];
  }
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQ() { qi++; if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ(); }
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
