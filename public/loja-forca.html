<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja e Forcës</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: transparent; }
        #root { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { useState } from 'react';
        import { generateBuildFormula, generateFillBlanks, generateMatchPairs, generateMcqs, generateTrueFalse } from './src/data/dinamikaGames';
        import BuildFormula from './src/components/minigames/BuildFormula';
        import FillBlank from './src/components/minigames/FillBlank';
        import MatchPairs from './src/components/minigames/MatchPairs';
        import McqGame from './src/components/minigames/McqGame';
        import TrueFalseGame from './src/components/minigames/TrueFalseGame';
        import UnitsGame from './src/components/minigames/UnitsGame';
        import { ALL_PHYSICS_DATA } from './src/constants';

        const term = ALL_PHYSICS_DATA["Dinamika"][0]; // 1. Forca

        const GameContainer = () => {
            const [stage, setStage] = useState(0);

            const nextStage = () => setStage(s => s + 1);

            const games = [
                <UnitsGame units={[{ symbol: "F", variable: "Forca", unit: "Njuton (N)", measuringTool: "Dinamometri" }]} termName={term.name} formula={term.form} onComplete={nextStage} />,
                <BuildFormula data={generateBuildFormula(term)} onComplete={nextStage} />,
                <FillBlank questions={generateFillBlanks(term)} onComplete={nextStage} />,
                <MatchPairs pairs={generateMatchPairs(term)} onComplete={nextStage} />,
                <McqGame questions={generateMcqs(term)} onComplete={nextStage} />,
                <TrueFalseGame questions={generateTrueFalse(term)} onComplete={nextStage} />
            ];

            if (stage >= games.length) {
                return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',color:'#4a4e69'}}>
                    <h2 style={{fontSize:'2rem',fontWeight:'bold',marginBottom:'1rem'}}>Urime!</h2>
                    <p>E përfundove me sukses sfidën e Forcës.</p>
                </div>;
            }

            return <div style={{padding:'2rem',height:'100%',boxSizing:'border-box',overflowY:'auto'}}>{games[stage]}</div>;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<GameContainer />);
    </script>
</body>
</html>
