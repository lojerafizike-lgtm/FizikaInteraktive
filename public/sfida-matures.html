<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sfida e Maturës - Fizika</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfbfb;
            --card: #ffffff;
            --primary: #8ab4f8;
            --secondary: #ffb7b2;
            --accent: #a8e6cf;
            --success: #88d49e;
            --error: #ff9aa2;
            --text: #4a4a4a;
            --border: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 180, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 183, 178, 0.15) 0%, transparent 40%);
        }

        .game-container {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
            padding: 20px;
        }

        @media (max-width: 900px) {
            .game-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                height: auto;
                overflow-y: auto;
            }
        }

        /* --- HEADER --- */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 20px 30px;
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .stats-row {
            display: flex;
            gap: 20px;
        }

        .stat-pill {
            background: rgba(0, 0, 0, 0.03);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .level-card {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .level-card.active {
            border-color: var(--primary);
            background: rgba(138, 180, 248, 0.1);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-card.locked::after {
            content: '🔒';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .level-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .level-desc {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* --- MAIN AREA --- */
        .main-area {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .question-box {
            width: 100%;
            max-width: 700px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 40px;
            line-height: 1.4;
            font-family: 'Space Grotesk', sans-serif;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: rgba(136, 212, 158, 0.2);
            border-color: var(--success);
            color: #2e7d32;
        }

        .option-btn.wrong {
            background: rgba(255, 154, 162, 0.2);
            border-color: var(--error);
            color: #c62828;
        }

        .option-btn.disabled {
            cursor: default;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- VICTORY SCREEN --- */
        .victory-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 40px;
        }

        .victory-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(138, 180, 248, 0.5);
        }

        .btn-restart {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--primary);
        }

        .hidden { display: none; }

        /* --- DECORATIONS --- */
        .floating-particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>Sfida e Maturës</h1>
            <div class="stats-row">
                <div class="stat-pill">🚀 <span id="score">0</span> Pikë</div>
                <div class="stat-pill">⚡ <span id="streak">0</span> Combo</div>
            </div>
        </div>

        <div class="sidebar" id="level-list">
            <!-- Levels will be generated here -->
        </div>

        <div class="main-area">
            <div class="question-box" id="question-box">
                <div class="question-text" id="q-text">Zgjidh një sektor për të filluar sfidën!</div>
                <div class="options-grid" id="options">
                    <!-- Options will be generated here -->
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
        </div>
    </div>

    <div class="victory-overlay" id="victory">
        <div style="font-size: 5rem; margin-bottom: 20px;">🎓</div>
        <h1 class="victory-title">Maturant i Shkëlqyer!</h1>
        <p style="font-size: 1.5rem; opacity: 0.8;">Ti ke kaluar të gjitha sfidat e fizikës me sukses.</p>
        <div style="margin-top: 30px; font-size: 2rem; font-weight: 700; color: var(--accent);">
            Pikët Totale: <span id="final-score">0</span>
        </div>
        <button class="btn-restart" onclick="location.reload()">Rinis Sfidën</button>
    </div>

    <script>
        const levels = [
            {
                id: 1,
                title: "Kinematika",
                desc: "Lëvizja dhe Zhvendosja",
                questions: [
                    { q: "Çfarë paraqet zhvendosja (S ose Δx)?", options: ["Gjatësinë totale të rrugës", "Një madhësi skalare", "Vektor që bashkon fillimin me fundin", "Shpejtësinë mesatare"], correct: 2 },
                    { q: "Cila është formula në lëvizje të njëtrajtshme?", options: ["Δx = v0t + at²/2", "Δx = v * t", "v² = v0² + 2aS", "h = v0t + gt²"], correct: 1 },
                    { q: "Njësia matëse e zhvendosjes në SI:", options: ["Sekonda", "Metër", "m/s", "Njuton"], correct: 1 }
                ]
            },
            {
                id: 2,
                title: "Dinamika I",
                desc: "Forcat dhe Ligjet e Njutonit",
                questions: [
                    { q: "Forca me të cilën Toka tërheq trupin quhet:", options: ["Forca e fërkimit", "Forca e rëndesës", "Forca e elasticitetit", "Forca e tensionit"], correct: 1 },
                    { q: "Ku zbatohet forca e rëndesës?", options: ["Në sipërfaqen e trupit", "Në qendër të trupit", "Në pikën e mbështetjes", "Në skajet e trupit"], correct: 1 },
                    { q: "Drejtimi i forcës së rëndesës është:", options: ["Horizontal", "Vertikalisht lart", "Pingul me sipërfaqen e Tokës", "Paralel me lëvizjen"], correct: 2 }
                ]
            },
            {
                id: 3,
                title: "Dinamika II",
                desc: "Fërkimi dhe Elasticiteti",
                questions: [
                    { q: "Formula e Ligjit të Hukut është:", options: ["F = m*a", "Fe = -k*x", "F_f = μN", "P = m*g"], correct: 1 },
                    { q: "Forca e fërkimit ka gjithmonë kah:", options: ["Të njëjtë me lëvizjen", "Të kundërt me lëvizjen", "Pingul me lëvizjen", "Të rastësishëm"], correct: 1 },
                    { q: "Formula e forcës së fërkimit është:", options: ["F = m*g", "F = k*x", "F_f = μN", "F = G/R"], correct: 2 }
                ]
            },
            {
                id: 4,
                title: "Graviteti",
                desc: "Ligji i Tërheqjes së Gjithësishme",
                questions: [
                    { q: "Formula e Ligjit të tërheqjes së gjithësishme është:", options: ["F = m*g", "F = k*x", "F = G * (m1*m2)/R²", "F_f = μN"], correct: 2 },
                    { q: "Me rritjen e lartësisë (h) nga Toka, nxitimi g:", options: ["Rritet", "Zvogëlohet", "Nuk ndryshon", "Bëhet zero"], correct: 1 }
                ]
            },
            {
                id: 5,
                title: "Matura Shtetërore",
                desc: "Pyetje nga provimet e maturës",
                questions: [
                    { q: `Një sfere hidhet vertikalisht lart. Rezistenca e ajrit nuk merret parasysh. Si kah pozitiv i lëvizjes merret kahu i drejtuar vertikalisht lart. Cilët nga grafikët e mëposhtem paraqet shpejtësine në funksion të kohës.<br><svg viewBox="0 0 400 300" width="100%" height="200" xmlns="http://www.w3.org/2000/svg" style="background:white; border-radius:8px; margin-top:20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker></defs><g transform="translate(20, 20)"><rect x="60" y="0" width="40" height="40" rx="10" fill="white" stroke="#ccc"/><text x="80" y="28" font-size="24" font-weight="bold" text-anchor="middle" fill="black">1</text><line x1="20" y1="100" x2="20" y2="10" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="100" x2="150" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><polyline points="20,100 70,40 120,100" fill="none" stroke="black" stroke-width="2"/><text x="5" y="20" font-size="14" fill="black">v</text><text x="140" y="115" font-size="14" fill="black">t</text></g><g transform="translate(220, 20)"><rect x="60" y="0" width="40" height="40" rx="10" fill="white" stroke="#ccc"/><text x="80" y="28" font-size="24" font-weight="bold" text-anchor="middle" fill="black">2</text><line x1="20" y1="100" x2="20" y2="10" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="100" x2="150" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><path d="M20,100 Q70,0 120,100" fill="none" stroke="black" stroke-width="2"/><text x="5" y="20" font-size="14" fill="black">v</text><text x="140" y="115" font-size="14" fill="black">t</text></g><g transform="translate(20, 160)"><rect x="60" y="0" width="40" height="40" rx="10" fill="white" stroke="#ccc"/><text x="80" y="28" font-size="24" font-weight="bold" text-anchor="middle" fill="black">3</text><line x1="20" y1="120" x2="20" y2="10" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="65" x2="150" y2="65" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="30" x2="110" y2="100" stroke="black" stroke-width="2"/><text x="5" y="20" font-size="14" fill="black">v</text><text x="140" y="80" font-size="14" fill="black">t</text></g><g transform="translate(220, 160)"><rect x="60" y="0" width="40" height="40" rx="10" fill="white" stroke="#ccc"/><text x="80" y="28" font-size="24" font-weight="bold" text-anchor="middle" fill="black">4</text><line x1="20" y1="100" x2="20" y2="10" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="100" x2="150" y2="100" stroke="black" stroke-width="2" marker-end="url(#arrow)"/><polyline points="20,40 70,100 120,40" fill="none" stroke="black" stroke-width="2"/><text x="5" y="20" font-size="14" fill="black">v</text><text x="140" y="115" font-size="14" fill="black">t</text></g></svg>`, options: ["1", "2", "3", "4"], correct: 3 },
                    { q: "Një trup me masë 1t lëviz me nxitim 3m/s². Sa eshtë moduli i tensionit të kavos që ngre trupin (g=10m/s²)?", options: ["13000N", "10000N", "1300N", "700N"], correct: 0 },
                    { q: "Nje force horizontale 5N ushtrohet mbi nje kuti me mase 10kg, si ne figure. Kutia léviz me nxitim 2m/s². Sa do te jete vlera e koeficientit te ferkimit ndermjet kutise dhe dyshemese (g=10m/s²)?", options: ["0.5", "0.25", "0.05", "0.15"], correct: 1 },
                    { q: "Karroca me rëre, me masë 20kg, léviz me shpejtësi vk=3m/s në nje sipërfaqe horizontale te lemuar. Perballe karrocës lëviz sfera me masë 5kg dhe shpejtësi vs=5m/s. Sfera godet karrocën dhe mbetet në të. Shpejtësia e karrocës pas goditjes me sferën do të jetë:", options: ["2m/s", "1,4m/s", "0,8m/s", "0,5m/s"], correct: 1 },
                    { q: "Nje sfere me mase 3kg ngjesh me 5cm susten me koeficient elasticiteti k=1200N/m. Pasi susta lihet e lire sfera leviz pa ferkim ne rafshin OA dhe pastaj ngjitet ne rafshin e pjerrrët AB. Lartësia h e ngjitjes se sferes ne rrafshin e pjcrret do te jete: (g=10m/s²)", options: ["15cm", "10cm", "5cm", "3cm"], correct: 2 },
                    { q: "Nje trup me masë m qe léviz me shpejtësi v e rrit shpejtësië tri herë. Energjia kinetike e trupit nê këtë rast:", options: ["rritet 3 herë", "zvogëlohet tri herë", "rritet 9 herë", "zvogëlohet 9 herë"], correct: 2 },
                    { q: "Sasia e nxehtësisë qe merr një gaz ideal është 700J. Forcat jashtme kryejnë pune 200J. Ndryshimi i energjisë së brendshme t gazit do te jetë:", options: ["900J", "500J", "-500J", "350J"], correct: 1 },
                    { q: "Një bateri me f.e.m.=6V është e lidhur me një rezistencë prej 3Ω. Ngarkesa qe kalon nepër rezistencë gjate 20s do të jetë:", options: ["5C", "10C", "20C", "40C"], correct: 3 }
                ]
            }
        ];

        let currentLevelIdx = 0;
        let currentQuestionIdx = 0;
        let score = 0;
        let streak = 0;
        let unlockedLevels = [1];

        const levelListEl = document.getElementById('level-list');
        const qTextEl = document.getElementById('q-text');
        const optionsEl = document.getElementById('options');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const progressEl = document.getElementById('progress');
        const victoryEl = document.getElementById('victory');
        const finalScoreEl = document.getElementById('final-score');

        function init() {
            renderLevels();
            createParticles();
        }

        function renderLevels() {
            levelListEl.innerHTML = '';
            levels.forEach((lvl, idx) => {
                const isLocked = !unlockedLevels.includes(lvl.id);
                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''} ${currentLevelIdx === idx ? 'active' : ''}`;
                card.onclick = () => !isLocked && selectLevel(idx);
                
                card.innerHTML = `
                    <div class="level-title">${lvl.title}</div>
                    <div class="level-desc">${lvl.desc}</div>
                `;
                levelListEl.appendChild(card);
            });
        }

        function selectLevel(idx) {
            currentLevelIdx = idx;
            currentQuestionIdx = 0;
            renderLevels();
            loadQuestion();
        }

        function loadQuestion() {
            const level = levels[currentLevelIdx];
            const q = level.questions[currentQuestionIdx];
            
            qTextEl.innerHTML = q.q;
            optionsEl.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}</span> ${opt}`;
                btn.onclick = () => checkAnswer(idx, q.correct, btn);
                optionsEl.appendChild(btn);
            });

            const progress = (currentQuestionIdx / level.questions.length) * 100;
            progressEl.style.width = `${progress}%`;
        }

        function checkAnswer(idx, correct, btn) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));

            if (idx === correct) {
                btn.classList.add('correct');
                score += 100 + (streak * 10);
                streak++;
                scoreEl.innerText = score;
                streakEl.innerText = streak;
                
                setTimeout(() => {
                    nextQuestion();
                }, 1000);
            } else {
                btn.classList.add('wrong');
                allBtns[correct].classList.add('correct');
                streak = 0;
                streakEl.innerText = streak;
                
                setTimeout(() => {
                    loadQuestion(); // Retry or stay
                }, 1500);
            }
        }

        function nextQuestion() {
            const level = levels[currentLevelIdx];
            currentQuestionIdx++;

            if (currentQuestionIdx < level.questions.length) {
                loadQuestion();
            } else {
                // Level Complete
                progressEl.style.width = '100%';
                if (currentLevelIdx < levels.length - 1) {
                    const nextLvlId = levels[currentLevelIdx + 1].id;
                    if (!unlockedLevels.includes(nextLvlId)) {
                        unlockedLevels.push(nextLvlId);
                    }
                    setTimeout(() => {
                        selectLevel(currentLevelIdx + 1);
                    }, 1000);
                } else {
                    showVictory();
                }
            }
        }

        function showVictory() {
            finalScoreEl.innerText = score;
            victoryEl.style.display = 'flex';
        }

        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'floating-particle';
                const size = Math.random() * 4 + 2;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.animation = `float ${Math.random() * 10 + 5}s infinite alternate`;
                document.body.appendChild(p);
            }
        }

        init();
    </script>
</body>
</html>
