<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misioni: Rruga e Përshkuar</title>
    <style>
        :root {
            --robot: #34495e;
            --path: #3498db;
            --target: #e67e22;
            --bg: #f5f6fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 2px;
            background: #dcdde1;
            padding: 5px;
            border-radius: 8px;
            margin: 15px auto;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
        }

        .cell {
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 5vw, 1.5rem);
            border-radius: 4px;
        }

        .path-active { background: #dff9fb; border: 1px solid var(--path); }
        .robot { font-size: 1.8rem; }
        .target { background: #ffeaa7; border: 2px solid var(--target); }

        .controls { margin-top: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background: var(--path);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Rruga e Robotit</h2>
    <p id="instruction">Llogarit rrugën totale që duhet të përshkojë roboti për te karikuesi (në njësi).</p>
    
    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <label>Sa njësi është rruga totale?</label>
        <input type="number" id="userAnswer" placeholder="Shëno rrugën (p.sh. 7)">
        <button onclick="checkAnswer()">KONTROLLO RRUGËN</button>
    </div>

    <div class="stats">
        <span>Niveli: <strong id="lvlDisplay">1</strong></span>
        <span id="feedback">Gati?</span>
    </div>
</div>

<script>
    let currentLevel = 1;
    let correctAnswer = 0;

    function generateLevel() {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';
        const size = 6;
        let start = {x: 0, y: 0};
        let end = {x: 0, y: 0};

        if(currentLevel === 1) {
            start = {x: 1, y: 4};
            end = {x: 4, y: 4};
            // Rruga: Vetëm horizontale (4-1 = 3 hapa)
            correctAnswer = 3;
        } else if(currentLevel === 2) {
            start = {x: 1, y: 1};
            end = {x: 3, y: 4};
            // Rruga: 2 hapa djathtas + 3 hapa poshtë = 5 hapa
            correctAnswer = 5;
        } else {
            start = {x: 0, y: 5};
            end = {x: 5, y: 0};
            // Rruga: 5 djathtas + 5 lart = 10 hapa
            correctAnswer = 10;
        }

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if(x === start.x && y === start.y) {
                    cell.innerHTML = '🤖';
                } else if(x === end.x && y === end.y) {
                    cell.className = 'cell target';
                    cell.innerHTML = '⚡';
                }
                
                // Vizualizimi i rrugës (për t'i ndihmuar)
                if ((x >= Math.min(start.x, end.x) && x <= Math.max(start.x, end.x) && y === start.y) ||
                    (y >= Math.min(start.y, end.y) && y <= Math.max(start.y, end.y) && x === end.x)) {
                    if(!(x === start.x && y === start.y)) cell.classList.add('path-active');
                }

                grid.appendChild(cell);
            }
        }
    }

    function checkAnswer() {
        const val = parseInt(document.getElementById('userAnswer').value);
        const feedback = document.getElementById('feedback');

        if(val === correctAnswer) {
            feedback.innerText = "Saktë! 🌟";
            feedback.style.color = "green";
            setTimeout(() => {
                if(currentLevel < 3) {
                    currentLevel++;
                    document.getElementById('lvlDisplay').innerText = currentLevel;
                    document.getElementById('userAnswer').value = '';
                    generateLevel();
                } else {
                    alert("Kampion! I kalove të gjitha sfidat e rrugës!");
                }
            }, 1000);
        } else {
            feedback.innerText = "Gabim! Provo sërish.";
            feedback.style.color = "red";
        }
    }

    generateLevel();
</script>

</body>
</html>
