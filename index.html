
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Interaktive - WOW Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcf9ff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* HYRJA: AURORA E QETË */
        .galactic-aurora {
            background: linear-gradient(-45deg, #fce4ec, #f3e5f5, #e3f2fd, #e1f5fe, #fce4ec);
            background-size: 400% 400%;
            animation: auroraGradient 15s ease-in-out infinite;
        }

        @keyframes auroraGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ATOM ANIMATION WOW */
        .atom-wrap {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .nucleus-cluster {
            position: relative;
            width: 60px;
            height: 60px;
            z-index: 10;
        }

        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), 0 0 10px rgba(255,255,255,0.4);
            animation: particleFloat 1s infinite alternate ease-in-out;
        }

        .proton { background: radial-gradient(circle at 30% 30%, #ff80ab, #f06292); }
        .neutron { background: radial-gradient(circle at 30% 30%, #90caf9, #42a5f5); }

        @keyframes particleFloat {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(3px, -3px) scale(1.05); }
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 35%;
            border: 1px solid rgba(144, 202, 249, 0.4);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .orbit-1 { transform: rotateX(65deg) rotateY(20deg); }
        .orbit-2 { transform: rotateX(65deg) rotateY(-20deg) rotateZ(60deg); }
        .orbit-3 { transform: rotateX(65deg) rotateY(-20deg) rotateZ(-60deg); }

        .electron {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff, 0 0 5px #90caf9;
            top: 50%;
            left: 0;
            margin-top: -6px;
            animation: moveElectron var(--duration) linear infinite;
        }

        @keyframes moveElectron {
            from { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }

        .btn-vazhdo {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #4a4e69;
            box-shadow: 0 10px 30px rgba(189, 224, 254, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-vazhdo:hover {
            background: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(189, 224, 254, 0.5);
            letter-spacing: 0.1em;
        }

        .warp-out {
            animation: warpMove 1s cubic-bezier(0.7, 0, 0.3, 1) forwards;
        }

        @keyframes warpMove {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(15); opacity: 0; filter: blur(100px); }
        }

        /* SEARCH BAR STYLES */
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 60px;
        }

        .search-input {
            width: 100%;
            padding: 20px 30px 20px 70px;
            background: white;
            border: 3px solid transparent;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a4e69;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: all 0.4s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffafcc;
            box-shadow: 0 20px 45px rgba(255, 175, 204, 0.2);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffafcc;
            font-size: 1.5rem;
        }

        /* CARDS */
        .card-fusha {
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .card-fusha:hover {
            transform: translateY(-15px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.06);
        }
    </style>

</script>
</head>

</body>
</html>
