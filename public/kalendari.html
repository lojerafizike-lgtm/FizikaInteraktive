<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendari i Fizikës - Cute Edition</title>
    <style>
        :root {
            --pastel-pink: #ffd6e0;
            --baby-blue: #cff0ff;
            --hot-pink: #ff7494;
            --text-dark: #594146;
            --white-glass: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--pastel-pink) 0%, var(--baby-blue) 100%);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        .floating-icon {
            position: absolute;
            font-size: 3rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        .icon-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .icon-2 { bottom: 15%; right: 10%; animation-delay: 2s; font-size: 4rem;}
        .icon-3 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem;}
        .icon-4 { bottom: 20%; left: 15%; animation-delay: 3s; font-size: 2rem;}

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .main-container {
            display: flex;
            flex-direction: row;
            width: 98%;
            max-width: 1400px;
            height: 95vh;
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(255, 116, 148, 0.3);
            z-index: 10;
            position: relative;
            border: 5px solid white;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 5px;
            }
            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                border-radius: 20px;
                margin-top: 10px;
                margin-bottom: 10px;
                width: 100%;
            }
            .calendar-section {
                border-right: none;
                border-bottom: 2px dashed var(--pastel-pink);
                flex: none;
                height: auto;
                max-height: 60vh;
                padding: 15px;
            }
            .fact-section {
                padding: 20px;
                flex: none;
                height: auto;
            }
            .month-header {
                font-size: 1.5rem;
                margin: 20px 0 10px 0;
            }
            .days-grid {
                gap: 5px;
            }
            .day-node {
                font-size: 0.9rem;
            }
            .notebook-page {
                padding: 30px 20px 30px 45px;
            }
            .date-badge {
                font-size: 1.1rem;
            }
            .fact-desc {
                font-size: 1rem;
                line-height: 1.5rem;
            }
        }

        .calendar-section {
            flex: 1.2;
            padding: 30px;
            overflow-y: auto;
            border-right: 2px dashed var(--pastel-pink);
        }

        .calendar-section::-webkit-scrollbar { width: 8px; }
        .calendar-section::-webkit-scrollbar-thumb { background: var(--hot-pink); border-radius: 10px; }

        .month-header {
            color: var(--hot-pink);
            font-size: 2.2rem;
            margin: 30px 0 20px 0;
            text-align: center;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-node {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.2rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .day-node:hover {
            transform: scale(1.15) rotate(-5deg);
            border-color: var(--hot-pink);
            color: var(--hot-pink);
        }

        .is-today {
            background: var(--hot-pink);
            color: white !important;
            box-shadow: 0 0 15px var(--hot-pink);
            transform: scale(1.1);
        }

        .fact-section {
            flex: 1;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            position: relative;
            perspective: 1000px;
        }

        .notebook-page {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px 40px 40px 60px;
            border-radius: 5px 15px 15px 5px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.08);
            position: relative;
            border-left: 2px solid #eee;
        }

        .notebook-page::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 20px;
            bottom: 20px;
            width: 15px;
            background-image: radial-gradient(circle, #333 40%, transparent 45%);
            background-size: 100% 30px;
        }

        .notebook-page::after {
            content: '';
            position: absolute;
            top: 0; left: 45px; right: 0; bottom: 0;
            background-image: linear-gradient(#f9f9f9 1px, transparent 1px);
            background-size: 100% 2rem;
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
        }

        .date-badge {
            display: inline-block;
            background: var(--baby-blue);
            color: var(--text-dark);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 20px;
            transform: rotate(-2deg);
            border: 2px dashed #fff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .fact-desc {
            font-size: 1.25rem;
            line-height: 2rem;
            font-weight: 500;
        }

        @keyframes tearOff {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(150px) rotate(-15deg); opacity: 0; }
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .tearing {
            animation: tearOff 0.5s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        .dropping {
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

    </style>
</head>
<body>

<div class="floating-icon icon-1">⚛️</div>
<div class="floating-icon icon-2">🧲</div>
<div class="floating-icon icon-3">🍎</div>
<div class="floating-icon icon-4">✨</div>

<div class="main-container">
    <div class="calendar-section" id="calendarBody">
        <h2 style="text-align: center; color: var(--hot-pink); font-size: 2.2rem; margin-top: 0;">Fizika Interaktive 365</h2>
    </div>

    <div class="fact-section">
        <div class="notebook-page" id="factPage">
            <div class="content-wrapper">
                <div class="date-badge" id="dateBadge">Data</div>
                <p class="fact-desc" id="factDesc">Zgjidhni një datë për të zbuluar fizikën...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const months = ["Janar", "Shkurt", "Mars", "Prill", "Maj", "Qershor", "Korrik", "Gusht", "Shtator", "Tetor", "Nëntor", "Dhjetor"];
    const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    const physicsData = {
        "1-1": "1894 – Vdiq fizikani gjerman Heinrich Hertz, i cili provoi eksperimental ekzistencën e valëve elektromagnetike.",
        "1-8": "1942 – Stephen Hawking, një nga fizikantët më të njohur të kozmologjisë moderne, lindi në këtë datë.",
        "2-11": "2016 – Observatori LIGO njoftoi zbulimin e parë të valëve gravitacionale.",
        "3-14": "1879 – Lindi Albert Einstein, fizikani që zhvilloi teorinë e relativitetit.",
        "7-4": "2012 – CERN njoftoi zbulimin e grimcës Higgs Boson.",
        "12-14": "1900 – Max Planck prezantoi teorinë kuantike.",
        "3-17": "Sot po eksploroni fizikën interaktive!"
    };

    const calendarBody = document.getElementById('calendarBody');
    const today = new Date();
    const tDay = today.getDate();
    const tMonth = today.getMonth() + 1;

    months.forEach((month, mIndex) => {
        const title = document.createElement('h3');
        title.className = 'month-header';
        title.innerText = month;
        calendarBody.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'days-grid';

        for (let d = 1; d <= daysInMonth[mIndex]; d++) {
            const dayNode = document.createElement('div');
            dayNode.className = 'day-node';
            dayNode.innerText = d;
            dayNode.id = `node-${mIndex + 1}-${d}`;

            if (d === tDay && (mIndex + 1) === tMonth) {
                dayNode.classList.add('is-today');
            }

            dayNode.onclick = () => showFact(mIndex + 1, d, month);
            grid.appendChild(dayNode);
        }
        calendarBody.appendChild(grid);
    });

    function showFact(m, d, monthName) {
        const key = `${m}-${d}`;
        const fact = physicsData[key] || "Zbulime fantastike ndodhin çdo ditë në botën e fizikës!";
        
        const page = document.getElementById('factPage');
        const badge = document.getElementById('dateBadge');
        const desc = document.getElementById('factDesc');

        page.classList.remove('dropping');
        page.classList.add('tearing');

        setTimeout(() => {
            badge.innerText = `${d} ${monthName}`;
            desc.innerText = fact;
            page.classList.remove('tearing');
            page.classList.add('dropping');
            
            document.querySelectorAll('.day-node').forEach(n => {
                if(!n.classList.contains('is-today')) {
                    n.style.background = "";
                    n.style.color = "";
                    n.style.borderColor = "transparent";
                }
            });
            const selectedNode = document.getElementById(`node-${m}-${d}`);
            if(!selectedNode.classList.contains('is-today')) {
                selectedNode.style.background = "var(--pastel-pink)";
                selectedNode.style.color = "var(--text-dark)";
                selectedNode.style.borderColor = "var(--hot-pink)";
            }
        }, 500);
    }

    window.onload = () => {
        const todayNode = document.getElementById(`node-${tMonth}-${tDay}`);
        if (todayNode) {
            todayNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('dateBadge').innerText = `${tDay} ${months[tMonth-1]}`;
            document.getElementById('factDesc').innerText = physicsData[`${tMonth}-${tDay}`] || "Zbulime fantastike ndodhin çdo ditë!";
        }
    };
</script>
</body>
</html>
