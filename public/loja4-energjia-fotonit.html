<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Krijuesi i Fotonit – Energjia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');

:root {
  --bg: #fdfaf0;
  --bg2: #fcf4e0;
  --card: #ffffff;
  --border: #e8d8b0;
  --text: #2a2010;
  --text2: #5a4830;
  --text3: #907858;
  --yellow: #e8a020;
  --yellowL: #fff3d0;
  --orange: #e07030;
  --orangeL: #ffe8d8;
  --red: #d84050;
  --redL: #ffe0e4;
  --blue: #3a80d8;
  --blueL: #ddeeff;
  --green: #3ab870;
  --greenL: #d6f5e6;
  --purple: #7a50d8;
  --purpleL: #ede8ff;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  background: var(--card);
  border-bottom: 2px solid var(--border);
  flex-shrink: 0; gap: 6px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(160,120,60,0.08);
}

.logo {
  font-family: 'Baloo 2', sans-serif;
  font-size: 0.95rem; font-weight: 800; color: var(--orange);
}

.stats { display: flex; gap: 6px; flex-wrap: wrap; }

.pill {
  display: flex; align-items: center; gap: 4px;
  border-radius: 20px; padding: 3px 9px;
  font-size: 0.78rem; font-weight: 800;
  white-space: nowrap; border: 1.5px solid;
}
.pill.sc { border-color:#e8c080; background:#fff8e8; color:#805010; }
.pill.tr { border-color:#b0d0f8; background:#e8f2ff; color:#204080; }

.main {
  display: flex; flex: 1; overflow: hidden; min-height: 0;
}

canvas {
  flex: 1; min-width: 0; display: block;
  background: var(--bg);
}

.side {
  width: 240px; background: var(--card);
  border-left: 2px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
@media(max-width:600px){
  .side { width: 100%; border-left: none; border-top: 2px solid var(--border); max-height: 280px; }
  .main { flex-direction: column; }
}

.sec {
  padding: 10px 12px;
  border-bottom: 1.5px solid var(--border);
}

.sec-title {
  font-size: 0.65rem; font-weight: 800;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 7px;
}

.formula {
  background: var(--orangeL); border: 1.5px solid #f0b898;
  border-radius: 9px; padding: 8px 10px;
  font-size: 0.72rem; line-height: 1.8;
  color: var(--orange); font-weight: 700;
}
.formula .big { font-size: 1rem; font-weight: 900; display: block; margin-bottom: 2px; }

.target-box {
  background: var(--bg2); border: 2px dashed var(--orange);
  border-radius: 10px; padding: 12px; text-align: center;
  margin-bottom: 8px;
}
.tb-lbl { font-size: 0.7rem; font-weight: 800; color: var(--text2); text-transform: uppercase; }
.tb-val { font-family: 'Baloo 2', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--orange); line-height: 1.2; }
.tb-sub { font-size: 0.65rem; font-weight: 700; color: var(--text3); }

.controls {
  display: flex; flex-direction: column; gap: 12px;
}
.slider-wrap {
  display: flex; flex-direction: column; gap: 4px;
}
.sl-lbl {
  display: flex; justify-content: space-between;
  font-size: 0.75rem; font-weight: 800; color: var(--text2);
}
.sl-val { color: var(--blue); }
input[type=range] {
  -webkit-appearance: none; width: 100%; background: transparent;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; height: 18px; width: 18px;
  border-radius: 50%; background: var(--blue);
  cursor: pointer; margin-top: -6px; box-shadow: 0 2px 6px rgba(58,128,216,0.3);
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%; height: 6px; cursor: pointer;
  background: var(--blueL); border-radius: 3px;
}

.btn-fire {
  width: 100%; padding: 10px; background: var(--orange); border: none;
  border-radius: 11px; color: white;
  font-family: 'Baloo 2', sans-serif; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 0 4px 12px rgba(224,112,48,0.3); margin-top: 4px;
}
.btn-fire:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(224,112,48,0.3); }

.fb-msg {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  font-size: 0.75rem; font-weight: 700; line-height: 1.4; display: none;
}
.fb-msg.on  { display: block; }
.fb-msg.ok  { background: var(--greenL); color: #1a6040; border: 1.5px solid #80d8a8; }
.fb-msg.bad { background: var(--redL);   color: #801020; border: 1.5px solid #f0a0a8; }

/* End screen */
.end {
  position: fixed; inset: 0;
  background: rgba(253,250,240,0.96);
  display: none; align-items: center; justify-content: center;
  z-index: 300; flex-direction: column; gap: 13px;
  padding: 20px; text-align: center;
}
.end.on { display: flex; }
.end-em { font-size: 3.5rem; }
.end-title { font-family: 'Baloo 2', sans-serif; font-size: 1.8rem; font-weight: 800; }
.end-title.win  { color: var(--green); }
.end-title.lose { color: var(--red); }
.end-sub { font-size: 0.9rem; color: var(--text2); font-weight: 600; max-width: 380px; line-height: 1.6; }
.rbtn {
  padding: 11px 30px; background: var(--orange); border: none;
  border-radius: 13px; color: white;
  font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 14px rgba(224,112,48,0.3);
  transition: transform 0.15s;
}
.rbtn:hover { transform: scale(1.04); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⚡ Krijuesi i Fotonit</div>
  <div class="stats">
    <div class="pill sc">⭐ <span id="SC">0</span>/3 Nivele</div>
    <div class="pill tr">🎯 <span id="TR">5</span> gjuajtje</div>
  </div>
</div>

<div class="main">
  <canvas id="c"></canvas>

  <div class="side">
    <div class="sec">
      <div class="sec-title">Formula</div>
      <div class="formula">
        <span class="big">E = h · f</span>
        h = 6.63×10⁻³⁴ J·s<br>
        E(eV) = E(J) / 1.6×10⁻¹⁹<br>
        1 eV ≈ 2.418×10¹⁴ Hz
      </div>
    </div>

    <div class="sec">
      <div class="target-box">
        <div class="tb-lbl">Objektivi: Energjia</div>
        <div class="tb-val" id="TVAL">2.0 eV</div>
        <div class="tb-sub">Gjej frekuencën e duhur!</div>
      </div>
    </div>

    <div class="sec">
      <div class="controls">
        <div class="slider-wrap">
          <div class="sl-lbl">
            <span>Frekuenca (f)</span>
            <span class="sl-val"><span id="FVAL">4.8</span> ×10¹⁴ Hz</span>
          </div>
          <input type="range" id="FSLIDER" min="1.0" max="10.0" step="0.1" value="4.8" oninput="updateF()">
        </div>
        <button class="btn-fire" onclick="firePhoton()">⚡ Lësho Fotonin</button>
        <div class="fb-msg" id="FB"></div>
      </div>
    </div>
  </div>
</div>

<!-- End -->
<div class="end" id="END">
  <div class="end-em" id="EE"></div>
  <div class="end-title" id="ET"></div>
  <div class="end-sub" id="ES"></div>
  <button class="rbtn" onclick="restart()">↻ Rifillo</button>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const h_P = 6.63e-34, eV_J = 1.6e-19;
// E(eV) = (h * f * 1e14) / eV_J
// 1 eV = 1.6e-19 / (6.63e-34 * 1e14) = 2.413 Hz (x10^14)
const HZ_PER_EV = 2.413;

const LEVELS = [
  { targetEv: 2.0, tol: 0.15 },
  { targetEv: 3.1, tol: 0.15 },
  { targetEv: 1.8, tol: 0.15 }
];

let W, H;
let lvl = 0, score = 0, tries = 5;
let currentF = 4.8;
let frame = 0;
let photons = [];
let parts = [];
let targetHit = false;

function resize(){
  cv.width = cv.offsetWidth;
  cv.height = cv.offsetHeight;
  W = cv.width; H = cv.height;
}

function updateF(){
  currentF = parseFloat(document.getElementById('FSLIDER').value);
  document.getElementById('FVAL').textContent = currentF.toFixed(1);
}

function getEv(f){ return f / HZ_PER_EV; }
function getWl(f){ return 3e8 / (f * 1e14) * 1e9; } // nm

function firePhoton(){
  if(tries<=0 || targetHit) return;
  tries--;
  document.getElementById('TR').textContent = tries;

  const ev = getEv(currentF);
  const wl = getWl(currentF);
  const hue = Math.max(200, Math.min(360, 360 - (wl-400)*0.5)); // rough color mapping
  const col = `hsl(${hue}, 80%, 55%)`;

  photons.push({
    x: W*.1, y: H*.5, vx: 8, ev: ev, col: col, wl: wl, active: true
  });

  // Check hit
  const tgt = LEVELS[lvl];
  if(Math.abs(ev - tgt.targetEv) <= tgt.tol){
    targetHit = true;
    setTimeout(()=>{
      showFb(`✓ Saktë! E = h·f ≈ ${ev.toFixed(2)} eV.`, true);
      score++; document.getElementById('SC').textContent = score;
      if(score >= LEVELS.length) setTimeout(()=>endGame(true), 1500);
      else setTimeout(nextLevel, 1800);
    }, 800);
  } else {
    const msg = ev < tgt.targetEv ? 'Energji e ulët. Rrit frekuencën!' : 'Energji e lartë. Ul frekuencën!';
    setTimeout(()=>{
      showFb(`✗ ${ev.toFixed(2)} eV. ${msg}`, false);
      if(tries<=0) setTimeout(()=>endGame(false), 1500);
    }, 800);
  }
}

function showFb(msg, ok){
  const el = document.getElementById('FB');
  el.className = 'fb-msg on ' + (ok?'ok':'bad');
  el.textContent = msg;
}

function nextLevel(){
  lvl++; targetHit = false;
  document.getElementById('TVAL').textContent = LEVELS[lvl].targetEv.toFixed(1) + ' eV';
  document.getElementById('FB').className = 'fb-msg';
  photons = [];
}

function burst(x, y, col, n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:40+Math.random()*20,r:2+Math.random()*3});
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#fdfaf0'); bg.addColorStop(1,'#f4ebd8');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle = 'rgba(200,180,140,0.15)'; ctx.lineWidth = 1;
  for(let x=0; x<W; x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<H; y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Emitter
  ctx.fillStyle = '#d8c8a8'; ctx.strokeStyle = '#a89068'; ctx.lineWidth = 2;
  ctx.fillRect(W*.02, H*.4, W*.08, H*.2); ctx.strokeRect(W*.02, H*.4, W*.08, H*.2);
  ctx.fillStyle = '#a89068'; ctx.beginPath(); ctx.arc(W*.1, H*.5, 8, 0, Math.PI*2); ctx.fill();

  // Target
  const tgt = LEVELS[lvl];
  if(tgt){
    const tx = W*.8, ty = H*.5, tr = 40;
    ctx.save();
    ctx.shadowColor = targetHit ? '#3ab870' : '#e07030';
    ctx.shadowBlur = 15 + Math.sin(frame*.1)*5;
    ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2);
    ctx.fillStyle = targetHit ? 'rgba(58,184,112,0.15)' : 'rgba(224,112,48,0.1)'; ctx.fill();
    ctx.strokeStyle = targetHit ? '#3ab870' : '#e07030'; ctx.lineWidth = 3;
    ctx.setLineDash([8,6]); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = targetHit ? '#3ab870' : '#e07030';
    ctx.font = 'bold 16px Baloo 2'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tgt.targetEv.toFixed(1)+' eV', tx, ty);
    ctx.restore();
  }

  // Photons (Wave packets)
  photons.forEach(p=>{
    ctx.save();
    ctx.strokeStyle = p.col; ctx.lineWidth = 2;
    ctx.shadowColor = p.col; ctx.shadowBlur = 8;
    ctx.beginPath();
    const freq = p.ev * 0.3; // visual freq
    for(let i=0; i<40; i++){
      const px = p.x - i*2;
      const py = p.y + Math.sin(i*freq - frame*.3) * 12 * Math.exp(-i*0.05);
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.stroke();
    // Head
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.restore();
  });

  // Particles
  parts.forEach(p=>{
    ctx.globalAlpha = p.life/60; ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Real-time wave preview
  const ev = getEv(currentF);
  const hue = Math.max(200, Math.min(360, 360 - (getWl(currentF)-400)*0.5));
  ctx.strokeStyle = `hsla(${hue}, 70%, 60%, 0.4)`; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let x=W*.02; x<W*.1; x+=2){
    const y = H*.5 + Math.sin(x*ev*0.3 - frame*.1)*8;
    x===W*.02 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function update(){
  frame++;
  photons.forEach(p=>{
    if(!p.active) return;
    p.x += p.vx;
    if(p.x > W*.8){
      p.active = false;
      burst(W*.8, H*.5, p.col, 20);
    }
  });
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=.92; p.vy*=.92; p.life--; });
  parts = parts.filter(p=>p.life>0);
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

function endGame(win){
  document.getElementById('EE').textContent = win ? '🎉' : '💀';
  const t = document.getElementById('ET');
  t.className = 'end-title ' + (win?'win':'lose');
  t.textContent = win ? 'Sukses!' : 'Game Over!';
  document.getElementById('ES').textContent = win
    ? `Krijove fotonet e duhura!\nE = h·f u zbatua saktë.`
    : `Të mbaruan gjuajtjet.\nKujto: E = h·f (Rrit f për E më të madhe).`;
  document.getElementById('END').classList.add('on');
}

function restart(){
  lvl = 0; score = 0; tries = 5; targetHit = false;
  photons = []; parts = [];
  document.getElementById('SC').textContent = 0;
  document.getElementById('TR').textContent = 5;
  document.getElementById('TVAL').textContent = LEVELS[0].targetEv.toFixed(1) + ' eV';
  document.getElementById('FB').className = 'fb-msg';
  document.getElementById('END').classList.remove('on');
}

window.addEventListener('resize', resize);
resize(); updateF(); loop();
</script>
</body>
</html>
