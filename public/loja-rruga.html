<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rruga e Robotit</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FEF6EC;--bg2:#FFF9F2;
  --card:rgba(255,255,255,0.85);--card-h:rgba(255,255,255,0.97);
  --t1:#2E2A25;--t2:#6B635A;--t3:#A89F96;
  --sage:#6A9E82;--sage-l:#A0D4B8;--sage-d:#4E7E62;
  --blue:#8BACC8;--blue-l:#B8D0E2;--blue-d:#6A8EAA;
  --pink:#CC9494;--pink-l:#E4C0C0;
  --lav:#A894C4;--lav-l:#CFC0E0;
  --peach:#EABC8C;--peach-l:#F5D8B8;
  --gold:#D4B04C;--gold-l:#E8CC72;
  --red-s:#C48080;
  --border:rgba(106,158,130,0.22);--border-s:rgba(106,158,130,0.45);
  --sh-s:0 2px 10px rgba(46,42,37,0.07);
  --sh-m:0 6px 20px rgba(46,42,37,0.09);
  --sh-l:0 10px 36px rgba(46,42,37,0.13);
  --sh-xl:0 16px 56px rgba(46,42,37,0.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;min-height:100dvh;overflow:hidden;position:relative}

/* ===== FONDI ===== */
#pCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgG{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 10%,rgba(160,212,184,0.2) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 85%,rgba(168,148,196,0.15) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(234,188,140,0.1) 0%,transparent 55%),
    linear-gradient(180deg,#FEF6EC 0%,#FDF0E0 100%);
}
.bgD{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgD svg{position:absolute;opacity:0.1;animation:flt 22s ease-in-out infinite}
.bgD svg:nth-child(1){top:5%;left:3%;animation-delay:0s;animation-duration:24s}
.bgD svg:nth-child(2){top:55%;right:5%;animation-delay:-6s;animation-duration:19s}
.bgD svg:nth-child(3){bottom:10%;left:12%;animation-delay:-11s;animation-duration:26s}
.bgD svg:nth-child(4){top:25%;right:15%;animation-delay:-4s;animation-duration:21s;opacity:0.07}
.bgD svg:nth-child(5){bottom:25%;right:3%;animation-delay:-9s;animation-duration:23s;opacity:0.08}
@keyframes flt{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-14px) rotate(2deg)}50%{transform:translateY(-7px) rotate(-1.5deg)}75%{transform:translateY(-16px) rotate(1deg)}}

/* ===== APLIKACIONI ===== */
#app{position:relative;z-index:1;width:100%;max-width:500px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden}
.scr{position:absolute;inset:0;opacity:0;transform:translateY(18px) scale(0.97);pointer-events:none;transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);overflow-y:auto;overflow-x:hidden;padding:20px 16px 36px;-webkit-overflow-scrolling:touch}
.scr.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.scr::-webkit-scrollbar{width:4px}.scr::-webkit-scrollbar-thumb{background:var(--sage-l);border-radius:4px}

/* ===== TIPOGRAFIA ===== */
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.2;color:var(--t1);margin-bottom:4px}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.15rem,4vw,1.45rem);color:var(--t1)}
p{color:var(--t2);line-height:1.65;font-size:.93rem}
.sm{font-size:.8rem;color:var(--t3)}.ts{color:var(--sage-d)}.tg{color:#B8942C}.tc{text-align:center}

/* ===== KARTA ===== */
.cd{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--sh-m);position:relative;transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.cd::before{content:'';position:absolute;inset:-5px;border:2px solid rgba(106,158,130,0.08);border-radius:26px;pointer-events:none}
.cd::after{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,0.25),transparent);border-radius:20px 20px 0 0;pointer-events:none}
.cdH:hover{transform:translateY(-4px);box-shadow:var(--sh-l);border-color:var(--border-s)}
.cdS{padding:14px 16px;border-radius:17px}

/* ===== BUTONAT ===== */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;border:none;border-radius:15px;padding:14px 26px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;letter-spacing:.01em}
.bt::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,0.18),transparent);pointer-events:none;border-radius:15px 15px 0 0}
.bt:active{transform:scale(0.95)!important}
.btS{background:linear-gradient(135deg,var(--sage),var(--sage-d));color:#fff;box-shadow:0 5px 16px rgba(106,158,130,0.35)}
.btS:hover{background:linear-gradient(135deg,var(--sage-d),#3E6E50);transform:translateY(-2px);box-shadow:0 8px 24px rgba(106,158,130,0.4)}
.btP{background:linear-gradient(135deg,var(--peach),#D4A86C);color:var(--t1);box-shadow:0 5px 16px rgba(234,188,140,0.35)}
.btP:hover{background:linear-gradient(135deg,#D4A86C,#C49860);transform:translateY(-2px)}
.btL{background:linear-gradient(135deg,var(--lav),#8E7CB0);color:#fff;box-shadow:0 5px 16px rgba(168,148,196,0.3)}
.btL:hover{background:linear-gradient(135deg,#8E7CB0,#7A6AA0);transform:translateY(-2px)}
.btG{background:transparent;color:var(--t2);border:2px solid var(--border);box-shadow:none}
.btG:hover{border-color:var(--border-s);background:rgba(106,158,130,0.05)}
.btF{width:100%}
.bt:disabled{opacity:0.45;pointer-events:none;filter:saturate(0.5)}

/* ===== XP BAR ===== */
.xpW{width:100%;height:11px;background:rgba(106,158,130,0.12);border-radius:11px;overflow:hidden;position:relative}
.xpF{height:100%;border-radius:11px;background:linear-gradient(90deg,var(--sage-l),var(--sage),var(--sage-d));transition:width .9s cubic-bezier(.4,0,.2,1);position:relative}
.xpF::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.35) 50%,transparent 100%);animation:shm 2.2s ease-in-out infinite}
@keyframes shm{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}

/* ===== YLLIZET ===== */
.sts{display:flex;gap:5px;justify-content:center}
.st{width:30px;height:30px;transition:transform .3s ease}
.st.f svg{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(212,176,76,0.5))}
.st.e svg{fill:var(--peach-l);opacity:0.4}
.st.f{animation:stP .45s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes stP{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}

/* ===== MENU ===== */
.mHd{tc;margin-bottom:18px;padding-top:6px}
.mTt{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.7rem,6.5vw,2.3rem);background:linear-gradient(135deg,var(--sage-d),var(--sage));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px;animation:tF 4.5s ease-in-out infinite}
@keyframes tF{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mSb{color:var(--t3);font-size:.85rem;font-weight:600}
.pC{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pAv{width:54px;height:54px;flex-shrink:0;background:linear-gradient(145deg,var(--sage-l),var(--lav-l));border-radius:17px;border:2px solid var(--border-s);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-s);animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pI{flex:1;min-width:0}
.pN{font-weight:800;font-size:1.02rem;color:var(--t1)}
.pL{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;background:linear-gradient(135deg,var(--sage),var(--sage-d));color:#fff;padding:2px 11px;border-radius:20px;margin-top:2px}
.pX{margin-top:6px}
.pXt{font-size:.68rem;color:var(--t3);margin-bottom:3px;font-weight:600}
.stkB{display:inline-flex;align-items:center;gap:4px;font-size:.73rem;font-weight:700;background:linear-gradient(135deg,var(--peach),#D4A86C);color:var(--t1);padding:3px 10px;border-radius:20px;animation:br 2.2s ease-in-out infinite}
.gC{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.gCd{display:flex;align-items:center;gap:16px;cursor:pointer}
.gCi{width:76px;height:76px;flex-shrink:0;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gCi::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,0.22),transparent);pointer-events:none}
.gCi svg{width:44px;height:44px;position:relative;z-index:1}
.gcR{background:linear-gradient(145deg,var(--sage-l),#88CCA8)}
.gcT{background:linear-gradient(145deg,var(--peach),var(--gold-l))}
.gCf{flex:1;min-width:0}
.gCt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.08rem;color:var(--t1);margin-bottom:2px}
.gCdsc{font-size:.78rem;color:var(--t3);line-height:1.4}
.gCa{color:var(--t3);flex-shrink:0;transition:transform .3s ease,color .3s ease}
.gCd:hover .gCa{transform:translateX(5px);color:var(--sage)}

/* ===== G1 NIVELLET ===== */
.lP{padding:10px 0 24px}
.lR{display:flex;align-items:center;justify-content:center;gap:0}
.lN{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.lN.lk{background:rgba(168,159,150,0.1);color:var(--t3);cursor:default}
.lN.ul{background:var(--card-h);color:var(--t1);border:2px solid var(--border-s);box-shadow:var(--sh-s)}
.lN.ul:hover{transform:scale(1.1);box-shadow:var(--sh-m);border-color:var(--sage)}
.lN.cr{background:linear-gradient(145deg,var(--sage-l),var(--sage));color:#fff;border:2px solid var(--sage-d);box-shadow:0 5px 18px rgba(106,158,130,0.4);animation:nP 2.2s ease-in-out infinite}
@keyframes nP{0%,100%{box-shadow:0 5px 18px rgba(106,158,130,0.4)}50%{box-shadow:0 5px 28px rgba(106,158,130,0.6)}}
.lN.dn{background:linear-gradient(145deg,var(--gold-l),var(--gold));color:#fff;border:2px solid #B8942C;box-shadow:0 3px 12px rgba(212,176,76,0.3)}
.lC{width:22px;height:3px;background:var(--border);flex-shrink:0;border-radius:2px}
.lC.ok{background:var(--gold-l)}
.lSt{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.lSt .ms{width:10px;height:10px}
.lRv{flex-direction:row-reverse}.lCrv{order:-1}

/* ===== PRAPA ===== */
.bkR{margin-bottom:16px;display:flex;align-items:center;gap:10px}
.bkB{width:38px;height:38px;border-radius:13px;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s ease;flex-shrink:0}
.bkB:hover{border-color:var(--sage);background:var(--card-h);transform:translateX(-2px)}
.bkB svg{width:18px;height:18px;color:var(--t2)}

/* ===== G1 LOJA ===== */
.g1W{position:relative;width:100%;max-width:330px;margin:16px auto;aspect-ratio:1}
.g1G{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:3px;width:100%;height:100%;background:rgba(106,158,130,0.06);padding:5px;border-radius:18px;border:2px solid var(--border);box-shadow:inset 0 1px 4px rgba(0,0,0,0.03)}
.c1{background:var(--card-h);border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .3s ease,transform .3s ease,box-shadow .3s ease}
.c1.ph{background:rgba(160,212,184,0.18)}
.c1.ph::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--sage-l);opacity:0.45;animation:pD 2.2s ease-in-out infinite}
@keyframes pD{0%,100%{opacity:0.25;transform:scale(0.75)}50%{opacity:0.55;transform:scale(1.15)}}
.c1 .ci{width:72%;height:72%;position:relative;z-index:2}
.c1.rb{animation:rI 2.2s ease-in-out infinite}
@keyframes rI{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.c1.tg{background:rgba(234,188,140,0.2);box-shadow:inset 0 0 0 2px var(--peach)}
.c1.tg .ci{animation:tG 2.2s ease-in-out infinite}
@keyframes tG{0%,100%{filter:drop-shadow(0 0 3px rgba(234,188,140,0.35))}50%{filter:drop-shadow(0 0 10px rgba(234,188,140,0.7))}}
.c1.av{background:rgba(160,212,184,0.3)!important;transform:scale(1.06);box-shadow:0 0 14px rgba(106,158,130,0.3)}
.g1I{margin-top:16px}
.g1In{width:100%;padding:15px 20px;border:2px solid var(--border);border-radius:15px;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:700;color:var(--t1);background:var(--card-h);outline:none;text-align:center;transition:border-color .3s ease,box-shadow .3s ease;-moz-appearance:textfield}
.g1In::-webkit-inner-spin-button,.g1In::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.g1In:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(106,158,130,0.14)}
.g1Lb{font-weight:700;font-size:.9rem;color:var(--t2);margin-bottom:8px;display:block;text-align:center}
.g1Fb{margin-top:12px;padding:12px 16px;border-radius:13px;font-weight:700;font-size:.9rem;text-align:center;transition:all .3s ease;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
.g1Fb.ok{background:rgba(106,158,130,0.1);color:var(--sage-d)}
.g1Fb.no{background:rgba(196,128,128,0.1);color:var(--red-s);animation:shk .5s ease}
.g1Fb.nt{background:rgba(168,159,150,0.07);color:var(--t3)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.g1Bg{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--sage-l),var(--sage));color:#fff;padding:5px 14px;border-radius:20px;font-weight:700;font-size:.8rem}

/* ===== REZULTATET ===== */
.rIc{width:84px;height:84px;margin:0 auto 14px;animation:rB .65s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes rB{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.rTt{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.65rem;text-align:center;margin-bottom:5px}
.rSb{tc;font-size:.9rem;color:var(--t3);margin-bottom:16px}
.rRw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.rBx{tc;padding:13px 8px;background:rgba(106,158,130,0.05);border-radius:15px}
.rVl{font-weight:900;font-size:1.35rem;color:var(--t1)}
.rLb{font-size:.67rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.rSt{margin:12px 0 18px}
.rBt{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* ===== ARRITJET ===== */
.aG{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.aC{padding:14px 12px;text-align:center;background:var(--card);border:2px solid var(--border);border-radius:17px;transition:all .3s ease;position:relative;overflow:hidden}
.aC.u{border-color:var(--gold-l);background:rgba(232,204,114,0.06)}
.aC.u::after{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(212,176,76,0.07),transparent 70%);pointer-events:none}
.aC.lk{opacity:0.45}
.aIc{width:38px;height:38px;margin:0 auto 6px}
.aNm{font-weight:800;font-size:.78rem;color:var(--t1);margin-bottom:2px}
.aDs{font-size:.67rem;color:var(--t3);line-height:1.3}
.aCt{margin-top:14px;tc;font-size:.83rem;color:var(--t3);font-weight:600}
.aCt span{color:var(--gold);font-weight:800}

/* ===== OVERLAY ===== */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(46,42,37,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s ease;padding:20px}
.ov.on{opacity:1;pointer-events:auto}
.ovC{background:var(--bg2);border:2px solid var(--border-s);border-radius:26px;padding:34px 26px;max-width:370px;width:100%;text-align:center;box-shadow:var(--sh-xl);transform:scale(0.88);transition:transform .45s cubic-bezier(.175,.885,.32,1.275)}
.ov.on .ovC{transform:scale(1)}
.luN{font-family:'Fredoka',sans-serif;font-weight:700;font-size:3.8rem;background:linear-gradient(135deg,var(--sage),var(--sage-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;animation:luP .65s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes luP{0%{transform:scale(0) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.apI{width:58px;height:58px;margin:0 auto 10px;animation:apS .55s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes apS{0%{transform:translateY(34px) scale(0);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}

/* ===== KONFETI ===== */
#cf{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden}
.cfP{position:absolute;top:-12px;border-radius:3px;animation:cfF linear forwards}
@keyframes cfF{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}75%{opacity:1}100%{transform:translateY(108vh) rotate(800deg) scale(0.4);opacity:0}}

/* ===== TOAST ===== */
#ts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:92%;max-width:420px}
.tst{padding:12px 18px;border-radius:15px;background:var(--bg2);border:2px solid var(--border-s);box-shadow:var(--sh-l);font-weight:700;font-size:.85rem;color:var(--t1);display:flex;align-items:center;gap:10px;animation:tsI .4s cubic-bezier(.175,.885,.32,1.275) both;pointer-events:auto}
.tst.ou{animation:tsO .3s ease both}
.tstI{width:24px;height:24px;flex-shrink:0}
@keyframes tsI{0%{transform:translateY(-22px) scale(0.88);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes tsO{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-22px);opacity:0}}

/* ===== FLY ===== */
.xf{position:fixed;z-index:160;font-weight:900;font-size:1.05rem;color:var(--sage-d);pointer-events:none;animation:xfU 1.3s ease-out both}
@keyframes xfU{0%{transform:translateY(0) scale(0.5);opacity:0}18%{transform:translateY(-12px) scale(1.15);opacity:1}100%{transform:translateY(-65px) scale(0.75);opacity:0}}
.cf2{position:fixed;z-index:160;pointer-events:none;animation:cf2F .85s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes cf2F{0%{transform:scale(0.5);opacity:0}35%{transform:scale(1.25);opacity:1}100%{transform:scale(0.8) translateY(-32px);opacity:0}}
.cmb{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;pointer-events:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.2rem;color:var(--gold);text-shadow:0 3px 14px rgba(212,176,76,0.5);animation:cmF .85s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes cmF{0%{transform:translate(-50%,-50%) scale(0.25) rotate(-12deg);opacity:0}28%{transform:translate(-50%,-50%) scale(1.35) rotate(3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(0.85) rotate(0);opacity:0}}

/* ===== RESPONSIVE ===== */

const Pt={

  init(){

/* ============================================================
   GAME 1: NIVELLET
   ============================================================ */
const GN=15;
let g1D=null,g1T=0,g1Lv=1;

function g1Gen(lv){
  const sz=6;let sx,sy,ex,ey,ans;
  if(lv===1){sx=1;sy=4;ex=4;ey=4;ans=3}
  else if(lv===2){sx=1;sy=1;ex=3;ey=4;ans=5}
  else if(lv===3){sx=0;sy=5;ex=5;ey=0;ans=10}
  else if(lv===4){sx=0;sy=0;ex=5;ey=5;ans=10}
  else if(lv===5){sx=2;sy=0;ex=2;ey=5;ans=5}
  else{
    sx=Math.floor(Math.random()*sz);sy=Math.floor(Math.random()*sz);
    ex=Math.floor(Math.random()*sz);ey=Math.floor(Math.random()*sz);
    while(Math.abs(ex-sx)+Math.abs(ey-sy)<Math.min(lv,11)||((sx===ex)&&(sy===ey))){
      ex=Math.floor(Math.random()*sz);ey=Math.floor(Math.random()*sz);
    }
    ans=Math.abs(ex-sx)+Math.abs(ey-sy);
  }
  return{sz,sx,sy,ex,ey,ans,sp:lv<=5};
}

function g1Path(d){
  const p=[];let cx=d.sx,cy=d.sy;
  /* Rrugë L-forme: së pari horizontale, pastaj vertikale */
  while(cx!==d.ex){p.push({x:cx,y:cy});cx+=cx<d.ex?1:-1}
  while(cy!==d.ey){p.push({x:cx,y:cy});cy+=cy<d.ey?1:-1}
  p.push({x:d.ex,y:d.ey});return p;
}

function rLv(){
  const w=document.getElementById('lPath');let h='';
  const pr=5,rows=Math.ceil(GN/pr);
  for(let r=0;r<rows;r++){
    const rev=r%2===1;
    h+=`<div class="lR${rev?' lRv':''}">`;
    for(let c=0;c<pr;c++){
      const lv=r*pr+c+1;if(lv>GN)break;
      const dn=S.g1.stars[lv]!==undefined;
      const op=lv<=S.g1.current;
      const cr=lv===S.g1.current&&!dn;
      let cls='lk';if(dn)cls='dn';else if(cr)cls='cr';else if(op)cls='ul';
      let stH='';
      if(dn){const s=S.g1.stars[lv];stH='<div class="lSt">';
      for(let i=0;i<3;i++)stH+=`<span class="ms" style="color:${i<s?'#E8CC72':'#F5D8B8'};opacity:${i<s?1:0.35}">${I.star}</span>`;
      stH+='</div>';}
      const conn=c<pr-1&&lv<GN?`<div class="lC${rev?' lCrv':''}${dn&&S.g1.stars[lv+1]!==undefined?' ok':''}"></div>`:'';
      if(rev)h+=conn;
      h+=`<div class="lN ${cls}" ${cls!=='lk'?`onclick="g1St(${lv})" role="button" tabindex="0"`:''} aria-label="Niveli ${lv}">${cr?I.lock:lv}${stH}</div>`;
      if(!rev)h+=conn;
    }
    h+='</div>';
  }
  w.innerHTML=h;
}

function g1St(lv){
  Au.ck();g1Lv=lv;g1D=g1Gen(lv);g1T=0;
  document.getElementById('g1Bg').textContent=`Niveli ${lv}`;
  document.getElementById('g1A').value='';
  document.getElementById('g1Fb').className='g1Fb nt';
  document.getElementById('g1Fb').textContent='Vërejtuni rrugën dhe llogaritni gjatësinë';
  document.getElementById('g1Bt').disabled=false;
  g1Rg();go('s-g1pl');
}

function g1Rg(){
  const g=document.getElementById('g1G'),d=g1D;
  const path=d.sp?g1Path(d):[];
  const ps=new Set(path.map(p=>`${p.x},${p.y}`));
  let h='';
  for(let y=0;y<d.sz;y++)for(let x=0;x<d.sz;x++){
    let cls='c1',ct='';
    if(x===d.sx&&y===d.sy){cls+=' rb';ct=`<span class="ci" id="robI">${I.robot}</span>`}
    else if(x===d.ex&&y===d.ey){cls+=' tg';ct=`<span class="ci">${I.charger}</span>`}
    else if(ps.has(`${x},${y}`))cls+=' ph';
    h+=`<div class="${cls}" data-x="${x}" data-y="${y}">${ct}</div>`;
  }
  g.innerHTML=h;
}

    if((S.g1.stars[g1Lv]||0)<stars)S.g1.stars[g1Lv]=stars;
