<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Capacitor Master - Fizika Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-ui {
            background: var(--surface);
            padding: 20px;
            border: 4px solid var(--border);
            margin-bottom: 20px;
            width: 600px;
            display: flex;
            justify-content: space-between;
            box-shadow: 8px 8px 0px var(--border);
        }

        canvas {
            background: var(--bg);
            border: 4px solid var(--border);
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1), 8px 8px 0px var(--border);
        }

        .stat-box { 
            text-align: center; 
            background: var(--bg);
            padding: 10px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            flex: 1;
            margin: 0 10px;
        }
        .stat-box div:first-child {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            text-transform: uppercase;
        }
        .stat-value { 
            font-family: 'VT323', monospace;
            font-size: 2.5rem; 
            font-weight: bold; 
            color: var(--accent2); 
            text-shadow: 1px 1px 0px var(--border);
        }
        
        .controls { 
            margin-top: 20px; 
            color: var(--text); 
            font-family: 'VT323', monospace;
            font-size: 1.5rem; 
            background: var(--surface);
            padding: 15px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            text-align: center;
        }
        
        #message {
            position: absolute;
            top: 20%;
            font-family: 'VT323', monospace;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--surface), -2px -2px 0px var(--surface), 2px -2px 0px var(--surface), -2px 2px 0px var(--surface);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div class="stat-box">
            <div>Kapaciteti (C)</div>
            <div id="cap-val" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div>Ngarkesa (Q)</div>
            <div id="charge-val" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div>Energjia (W)</div>
            <div id="energy-val" class="stat-value">0</div>
        </div>
    </div>

    <div id="message"></div>
    <canvas id="capCanvas" width="700" height="400"></canvas>

    <div class="controls">
        <i class="fas fa-mouse"></i> Lëviz MIUN lart/poshtë për të ndryshuar distancën (d) | Mbaj shtypur BUTONIN e miut për të shtuar dielektrikun (ε)
    </div>

    <script>
        const canvas = document.getElementById('capCanvas');
        const ctx = canvas.getContext('2d');
        const capDisp = document.getElementById('cap-val');
        const qDisp = document.getElementById('charge-val');
        const wDisp = document.getElementById('energy-val');
        const msgDisp = document.getElementById('message');

        let d = 100; // Distanca mes pllakave
        let epsilon = 1; // Dielektriku
        let area = 200; // Sipërfaqja e pllakave
        let charge = 0;
        let isPressing = false;

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            let mouseY = e.clientY - rect.top;
            // Ndryshimi i distancës d bazuar në lartësinë e miut
            d = Math.max(20, Math.min(180, mouseY - 100));
        });

        window.addEventListener('mousedown', () => isPressing = true);
        window.addEventListener('mouseup', () => isPressing = false);

        function update() {
            // Formula: C = ε * (A / d)
            if (isPressing) epsilon = Math.min(5, epsilon + 0.05);
            else epsilon = Math.max(1, epsilon - 0.05);

            let C = (epsilon * area) / d;
            
            // Ngarkesa rritet gradualisht nëse kapaciteti është i lartë
            charge += C * 0.01;
            
            // Energjia: W = 0.5 * Q^2 / C
            let W = 0.5 * (charge * charge) / C;

            // UI Update
            capDisp.innerText = C.toFixed(1) + " μF";
            qDisp.innerText = charge.toFixed(0) + " nC";
            wDisp.innerText = W.toFixed(0) + " J";

            // Kushti i humbjes (Mbingarkesa)
            if (W > 5000) {
                msgDisp.innerText = "KONDENSATORI SHPËRTHEU! 💥";
                msgDisp.style.color = "#ffb3ba";
                charge = 0;
                setTimeout(() => msgDisp.innerText = "", 2000);
            } else if (W > 3000) {
                msgDisp.innerText = "QYTETI U NDEZ! ⚡🏙️";
                msgDisp.style.color = "#baffc9";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let centerY = canvas.height / 2;
            let plateWidth = 300;
            let startX = (canvas.width - plateWidth) / 2;

            // Vizatimi i Dielektrikut (mushkëria mes pllakave)
            ctx.fillStyle = `rgba(162, 210, 255, ${epsilon / 5})`; // accent2 color with opacity
            ctx.fillRect(startX, centerY - d/2, plateWidth, d);
            
            if(epsilon > 1) {
                ctx.strokeStyle = "#4a4e69";
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(startX, centerY - d/2, plateWidth, d);
                ctx.setLineDash([]);
            }

            // Pllaka e sipërme (Pozitive)
            ctx.fillStyle = "#ffafcc";
            ctx.fillRect(startX, centerY - d/2 - 15, plateWidth, 15);
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 4;
            ctx.strokeRect(startX, centerY - d/2 - 15, plateWidth, 15);

            // Pllaka e poshtme (Negative)
            ctx.fillStyle = "#a2d2ff";
            ctx.fillRect(startX, centerY + d/2, plateWidth, 15);
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 4;
            ctx.strokeRect(startX, centerY + d/2, plateWidth, 15);
            
            // Vizatimi i ngarkesave (Grimcat që lëvizin)
            ctx.fillStyle = "#4a4e69";
            for(let i=0; i < charge/10; i++) {
                let rx = startX + (Math.random() * plateWidth);
                let ry = (centerY - d/2 - 8) + (Math.random() > 0.5 ? 0 : d + 15);
                ctx.beginPath();
                ctx.arc(rx, ry, 3, 0, Math.PI*2);
                ctx.fill();
            }

            // Etiketat e formulës
            ctx.fillStyle = "#4a4e69";
            ctx.font = "bold 20px VT323";
            ctx.fillText("Distanca (d): " + d.toFixed(0) + "px", 20, 380);
            ctx.fillText("Permitiviteti (ε): " + epsilon.toFixed(1), 200, 380);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
