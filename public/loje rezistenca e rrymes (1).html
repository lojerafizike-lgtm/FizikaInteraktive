<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Resistance Guard - Loja e Rezistencës</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            color: var(--accent);
            text-shadow: 3px 3px 0px var(--border);
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        p {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 20px;
        }

        #game-box {
            background: var(--surface);
            padding: 30px;
            border: 4px solid var(--border);
            box-shadow: 8px 8px 0px var(--border);
            text-align: center;
            width: 600px;
            max-width: 90%;
        }

        #levelDisplay {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--text);
            font-weight: bold;
            text-align: left;
            margin-bottom: 10px;
        }

        .status {
            font-family: 'VT323', monospace;
            font-size: 2.5rem;
            margin: 10px 0;
            color: var(--accent2);
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--border);
            background: var(--bg);
            border: 4px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
        }

        #currentR {
            color: var(--accent);
        }

        canvas {
            background: var(--bg);
            border: 4px solid var(--border);
            margin: 20px 0;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1);
            width: 100%;
            height: 150px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: var(--bg);
            padding: 20px;
            border: 4px solid var(--border);
            box-shadow: 4px 4px 0px var(--border);
            margin-top: 20px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .slider-group label {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 8px;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            -webkit-appearance: none;
            height: 12px;
            border: 2px solid var(--border);
            background: #e2e8f0;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid var(--border);
            cursor: pointer;
        }

        select {
            padding: 10px;
            border: 4px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border);
            outline: none;
        }

        button {
            grid-column: span 2;
            padding: 15px;
            background: var(--green);
            border: 4px solid var(--border);
            color: var(--border);
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 4px 4px 0px var(--border);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 10px;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border);
        }

        .formula-card {
            margin-top: 20px;
            padding: 15px;
            background: var(--surface);
            border: 4px solid var(--border);
            text-align: center;
            box-shadow: 4px 4px 0px var(--border);
            width: 600px;
            max-width: 90%;
        }

        .math-fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--accent);
            text-shadow: 1px 1px 0px var(--border);
        }

        .frac-top { border-bottom: 2px solid var(--border); padding: 0 5px; }
        .frac-bottom { padding: 0 5px; }
    </style>
</head>
<body>

    <h1><i class="fas fa-shield-alt"></i> RESISTANCE GUARD</h1>
    <p>Rregullo parametrat e telit për të arritur <b>Rezistencën Target</b>!</p>

    <div id="game-box">
        <div id="levelDisplay">Niveli: 1</div>
        <div class="status" id="targetDisplay">Target R: 15.00 Ω</div>
        
        <canvas id="wireCanvas" width="550" height="150"></canvas>
        
        <div class="status" id="currentR">R aktuale: 0.00 Ω</div>

        <div class="controls">
            <div class="slider-group">
                <label>Materiali (ρ):</label>
                <select id="materialSelect" onchange="updateWire()">
                    <option value="0.017">Bakër (Bakër)</option>
                    <option value="0.016">Argjend (Më pak rezistent)</option>
                    <option value="0.024">Ar (Mesatar)</option>
                    <option value="0.10">Hekur (Më shumë rezistent)</option>
                </select>
            </div>
            <div class="slider-group">
                <label>Gjatësia (l): <span id="lVal">10</span>m</label>
                <input type="range" id="lInput" min="1" max="100" value="10" oninput="updateWire()">
            </div>
            <div class="slider-group" style="grid-column: span 2;">
                <label>Trashësia/Prerja (S): <span id="sVal">1.0</span> mm²</label>
                <input type="range" id="sInput" min="0.1" max="5.0" step="0.1" value="1.0" oninput="updateWire()">
            </div>
            <button onclick="checkResult()"><i class="fas fa-bolt"></i> TESTO QARKUN</button>
        </div>
    </div>

    <div class="formula-card">
        <span style="font-family: 'VT323', monospace; font-size: 1.5rem; color: var(--text);">Formula:</span>
        <div class="math-fraction">
            R = ρ · 
            <div style="display: inline-block; vertical-align: middle;">
                <div class="frac-top">l</div>
                <div class="frac-bottom">S</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wireCanvas');
        const ctx = canvas.getContext('2d');
        
        let level = 1;
        let targetR = 8.5;

        function updateWire() {
            const rho = parseFloat(document.getElementById('materialSelect').value);
            const l = parseFloat(document.getElementById('lInput').value);
            const s = parseFloat(document.getElementById('sInput').value);
            
            // Formula: R = rho * (l / s)
            // (Shënim: Multiplikojmë me 100 për ta bërë vlerën më "lojë")
            const r = (rho * (l / s) * 100).toFixed(2);
            
            document.getElementById('lVal').innerText = l;
            document.getElementById('sVal').innerText = s;
            document.getElementById('currentR').innerText = `R aktuale: ${r} Ω`;

            drawWire(l, s, rho);
            return r;
        }

        function drawWire(l, s, rho) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Ngjyra sipas materialit
            if(rho == 0.017) ctx.fillStyle = "#ffafcc"; // Baker
            else if(rho == 0.016) ctx.fillStyle = "#a2d2ff"; // Argjend
            else if(rho == 0.024) ctx.fillStyle = "#ffc8dd"; // Ar
            else ctx.fillStyle = "#94a3b8"; // Hekur

            const wireHeight = s * 15;
            const wireWidth = l * 5;
            
            const x = 275 - wireWidth/2;
            const y = 75 - wireHeight/2;

            ctx.fillRect(x, y, wireWidth, wireHeight);
            
            ctx.strokeStyle = "#4a4e69";
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, wireWidth, wireHeight);
            
            // Shkëlqimi i telit
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.fillRect(x, y, wireWidth, wireHeight/3);
        }

        function checkResult() {
            const currentR = parseFloat(updateWire());
            const diff = Math.abs(currentR - targetR);

            if (diff < 0.5) {
                alert("SUKSES! Rezistenca është e saktë për pajisjen.");
                level++;
                targetR = (Math.random() * 40 + 5).toFixed(2);
                document.getElementById('levelDisplay').innerText = `Niveli: ${level}`;
                document.getElementById('targetDisplay').innerText = `Target R: ${targetR} Ω`;
            } else {
                alert("Kujdes! Rryma nuk është e duhura. Provo përsëri.");
            }
        }

        // Initialize
        document.getElementById('targetDisplay').innerText = `Target R: ${targetR} Ω`;
        updateWire();
    </script>
</body>
</html>
