<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Kopshti Magjik i Nxitimit ✨</title>
    <style>
        :root {
            --bg: #fff0f6;
            --primary: #ff85a2;
            --secondary: #fbb1bd;
            --accent: #9b5de5;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(#ffc2d1 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            cursor: url('https://cur.cursors-4u.net/others/oth-9/oth824.cur'), auto;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(255, 133, 162, 0.2);
            width: 450px;
            text-align: center;
            border: 6px solid white;
            position: relative;
        }

        h2 { color: var(--primary); font-size: 1.8rem; margin-top: 0; text-shadow: 2px 2px white; }

        .formula {
            font-size: 1.5rem;
            color: var(--accent);
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 20px;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(155, 93, 229, 0.1);
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            margin: 0 5px;
        }
        .fraction span:first-child { border-bottom: 3px solid var(--accent); padding: 0 10px; }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            gap: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            flex: 1;
            border: 2px solid var(--secondary);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: scale(1.05); }
        .stat-card label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .stat-card b { font-size: 1.4rem; color: var(--primary); }

        .track {
            height: 100px;
            background: linear-gradient(to right, #e0f7fa, #fce4ec);
            border-radius: 50px;
            position: relative;
            margin: 30px 0;
            border: 4px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
        }

        #fairy { position: absolute; left: 20px; font-size: 3rem; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 0 10px gold); }
        #flower { position: absolute; right: 20px; font-size: 3rem; transition: transform 0.5s; }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        input {
            width: 120px;
            padding: 15px;
            border-radius: 25px;
            border: 3px solid var(--secondary);
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent);
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary); }

        button {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(155, 93, 229, 0.3);
            transition: 0.3s;
        }
        button:hover { transform: translateY(-5px); box-shadow: 0 15px 25px rgba(155, 93, 229, 0.4); }

        #msg { margin-top: 20px; font-weight: bold; font-size: 1.1rem; color: var(--accent); min-height: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nxitimi Magjik ✨</h2>
    
    <div class="formula">
        a = 
        <div class="fraction">
            <span>v - v₀</span>
            <span>t</span>
        </div>
    </div>

    <div class="track">
        <div id="fairy">🧚‍♀️</div>
        <div id="flower">🌸</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <label>Nisja (v₀)</label>
            <b id="v0Display">0</b> <small>m/s</small>
        </div>
        <div class="stat-card">
            <label>Arritja (v)</label>
            <b id="vFDisplay">12</b> <small>m/s</small>
        </div>
        <div class="stat-card">
            <label>Koha (t)</label>
            <b id="tDisplay">3</b> <small>s</small>
        </div>
    </div>

    <div class="input-group">
        <input type="number" id="ansInput" placeholder="?">
        <button onclick="valido()">Përdor Magjinë! ✨</button>
    </div>

    <div id="msg">Shkruaj nxitimin që lulja të rritet!</div>
</div>

<script>
    let v0, vF, t, aSakte;

    function krijoNivel() {
        // Sigurohemi që (vF - v0) / t të dalë gjithmonë numër i plotë
        t = Math.floor(Math.random() * 3) + 2; // Koha 2, 3, ose 4 sekonda
        aSakte = Math.floor(Math.random() * 4) + 1; // Nxitimi 1 deri në 4
        v0 = Math.floor(Math.random() * 5); // v0 midis 0 dhe 4
        
        vF = v0 + (aSakte * t); // Llogaritja e saktë e shpejtësisë finale

        document.getElementById('v0Display').innerText = v0;
        document.getElementById('vFDisplay').innerText = vF;
        document.getElementById('tDisplay').innerText = t;
        document.getElementById('ansInput').value = "";
        document.getElementById('msg').innerText = "Shkruaj nxitimin dhe kliko butonin!";
        document.getElementById('msg').style.color = "#9b5de5";
        
        // Reset vizual
        document.getElementById('fairy').style.left = "20px";
        document.getElementById('flower').innerText = "🌸";
        document.getElementById('flower').style.transform = "scale(1)";
    }

    function valido() {
        // Marrim vlerën direkt nga inputi
        const pergjigja = document.getElementById('ansInput').value;
        const msg = document.getElementById('msg');
        const fairy = document.getElementById('fairy');
        const flower = document.getElementById('flower');

        // Kontrollojmë nëse inputi nuk është bosh
        if (pergjigja === "") {
            msg.innerText = "Ju lutem shkruani një numër! ✨";
            return;
        }

        if (parseInt(pergjigja) === aSakte) {
            msg.innerText = "MREKULLI! Nxitimi është saktë! 💖";
            msg.style.color = "#ff85a2";
            fairy.style.left = "80%";
            
            setTimeout(() => {
                flower.innerText = "💐";
                flower.style.transform = "scale(1.5)";
                setTimeout(krijoNivel, 2500);
            }, 800);
        } else {
            msg.innerText = "Provo përsëri! Zbrit " + vF + "-" + v0 + " dhe pjesëtoje me " + t;
            msg.style.color = "#ff4d6d";
            // Lëvizje e shkurtër gabimi
            fairy.style.left = "60px";
            setTimeout(() => { fairy.style.left = "20px"; }, 300);
        }
    }

    // Nisja e lojës
    krijoNivel();
</script>

</body>
</html>
