<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Potential Master - Final Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #10b981;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 24px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #ui {
            width: 380px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: var(--shadow);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);
        }

        .level-card {
            background: #f8fafc;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            text-align: center;
        }

        #lvlNum {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 700;
        }

        #lvlGoal {
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 10px;
            color: var(--muted);
        }

        #game-area { flex-grow: 1; position: relative; background: #f8fafc; }
        canvas { width: 100%; height: 100%; cursor: crosshair; }

        .btn {
            padding: 12px;
            border: none;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .active-q { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)) !important;
            color: white !important;
            border-color: transparent !important;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3) !important;
        }
        #posBtn.active-q { 
            background: linear-gradient(135deg, var(--danger), #dc2626) !important; 
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3) !important;
        }

        .formula-footer {
            margin-top: auto;
            padding: 20px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            font-size: 1rem;
            color: var(--muted);
            font-weight: 600;
        }

        .math-fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin: 10px 0;
        }

        .fraction-top { border-bottom: 2px solid var(--primary); padding: 0 5px; }
        .fraction-bottom { padding: 0 5px; }

        #multimeter {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
        }

        .success-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            color: var(--text);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: none;
            text-align: center;
            border: 1px solid var(--border);
            z-index: 30;
        }
        .success-overlay h3 {
            font-size: 2.5rem;
            margin-top: 0;
            color: var(--secondary);
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }
        
        .success-overlay .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 12px 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2><i class="fas fa-bolt"></i> POTENTIAL LAB</h2>
        
        <div class="level-card">
            <div id="lvlNum">Niveli 1</div>
            <div id="lvlGoal">Synimi: V > <span style="color: var(--warning); font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 1.4rem;">100</span>V</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button id="posBtn" class="btn active-q" onclick="setQ(1)"><i class="fas fa-plus-circle"></i> Pozitive</button>
            <button id="negBtn" class="btn" onclick="setQ(-1)"><i class="fas fa-minus-circle"></i> Negative</button>
            <button class="btn" onclick="resetLevel()" style="margin-top: 10px; background: #f8fafc;"><i class="fas fa-undo"></i> Reset</button>
        </div>

        <div class="formula-footer">
            <div style="font-weight: 800; font-size: 1.1rem; color: var(--muted); text-transform: uppercase;">Formula</div>
            <div class="math-fraction">
                V = 
                <div style="display: inline-block; vertical-align: middle;">
                    <div class="fraction-top">E<sub>p</sub></div>
                    <div class="fraction-bottom">q</div>
                </div>
            </div>
            <br>
            <p style="font-size: 0.95rem; color: var(--muted); margin-bottom: 0;">Shtyp mbi fushë për të vendosur burimin.</p>
        </div>
    </div>

    <div id="main-view">
        <canvas id="canvas"></canvas>
        <div id="multimeter">V: 0.00V</div>
        <div id="success" class="success-overlay">
            <h3><i class="fas fa-check-circle"></i> NIVELI U KALUA!</h3>
            <button class="btn" onclick="nextLevel()">VAZHDO <i class="fas fa-arrow-right"></i></button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const multi = document.getElementById('multimeter');
    const successDiv = document.getElementById('success');

    let currentLevel = 0;
    let charges = [];
    let qType = 1;
    let width, height;

    const levels = [
        { goalV: 100, target: {x: 0.7, y: 0.5}, walls: [] },
        { goalV: -150, target: {x: 0.8, y: 0.2}, walls: [{x: 0.5, y: 0, w: 0.02, h: 0.7}] },
        { goalV: 200, target: {x: 0.5, y: 0.5}, walls: [{x: 0.3, y: 0.3, w: 0.4, h: 0.02}, {x: 0.3, y: 0.7, w: 0.4, h: 0.02}] }
    ];

    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function setQ(v) {
        qType = v;
        document.getElementById('posBtn').classList.toggle('active-q', v > 0);
        document.getElementById('negBtn').classList.toggle('active-q', v < 0);
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        multi.style.display = 'block';
        multi.style.left = (mx + 15) + 'px';
        multi.style.top = (my + 15) + 'px';
        let V = calculatePotential(mx, my);
        multi.innerText = `V: ${V.toFixed(1)}V`;
    });

    canvas.addEventListener('mousedown', (e) => {
        if(successDiv.style.display === 'block') return;
        const rect = canvas.getBoundingClientRect();
        charges.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, q: qType * 200 });
    });

    function calculatePotential(px, py) {
        let V = 0;
        charges.forEach(c => {
            let r = Math.hypot(px - c.x, py - c.y) + 20;
            V += (c.q * 10) / (r * 0.1);
        });
        return V;
    }

    function resetLevel() { charges = []; successDiv.style.display = 'none'; }

    function nextLevel() {
        currentLevel++;
        if(currentLevel >= levels.length) { alert("Urime! Keni fituar."); currentLevel = 0; }
        document.getElementById('lvlNum').innerText = "Niveli " + (currentLevel + 1);
        document.getElementById('lvlGoal').innerHTML = `Synimi: V > <span style="color: var(--warning); font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 1.4rem;">${levels[currentLevel].goalV}</span>V`;
        resetLevel();
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        const lvl = levels[currentLevel];
        
        // Draw walls
        ctx.fillStyle = "#cbd5e1";
        lvl.walls.forEach(w => {
            ctx.beginPath();
            ctx.roundRect(w.x * width, w.y * height, w.w * width, w.h * height, 8);
            ctx.fill();
        });

        const tx = lvl.target.x * width;
        const ty = lvl.target.y * height;
        const currentV = calculatePotential(tx, ty);
        const reached = Math.abs(currentV) >= Math.abs(lvl.goalV);
        
        // Draw target area
        ctx.beginPath();
        ctx.arc(tx, ty, 35, 0, Math.PI*2);
        ctx.strokeStyle = reached ? "#10b981" : "#f59e0b";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = reached ? "rgba(16, 185, 129, 0.2)" : "rgba(245, 158, 11, 0.2)";
        ctx.fill();
        
        ctx.fillStyle = "#64748b";
        ctx.font = "bold 16px Nunito";
        ctx.textAlign = "center";
        ctx.fillText(`SENSOR: ${currentV.toFixed(0)}V`, tx, ty - 45);
        
        // Draw charges
        charges.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 15, 0, Math.PI*2);
            
            if (c.q > 0) {
                ctx.fillStyle = "linear-gradient(135deg, #ef4444, #dc2626)";
                ctx.fill();
                ctx.fillStyle = "#ef4444";
                ctx.fill();
                ctx.shadowColor = "rgba(239, 68, 68, 0.4)";
            } else {
                ctx.fillStyle = "linear-gradient(135deg, #3b82f6, #2563eb)";
                ctx.fill();
                ctx.fillStyle = "#3b82f6";
                ctx.fill();
                ctx.shadowColor = "rgba(59, 130, 246, 0.4)";
            }
            
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Nunito";
            ctx.textBaseline = "middle";
            ctx.fillText(c.q > 0 ? "+" : "-", c.x, c.y);
        });
        
        if (reached && successDiv.style.display !== 'block') successDiv.style.display = 'block';
        requestAnimationFrame(draw);
    }
    
    draw();
</script>
</body>
</html>
