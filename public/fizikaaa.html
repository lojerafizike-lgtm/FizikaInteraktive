<!DOCTYPE html>
<html lang="sq">
<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkiva e 50 Gjigantëve të Fizikës</title>
    <style>
        :root {
            --bg: #fcf9ff;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #ffafcc;
            --accent-hover: #fbafcc;
            --border: #fce4ec;
        }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: linear-gradient(-45deg, #fce4ec, #f3e5f5, #e3f2fd, #e1f5fe, #fce4ec);
            background-size: 400% 400%;
            animation: auroraGradient 15s ease-in-out infinite;
            margin: 0; 
            color: var(--text-primary); 
            line-height: 1.5;
            min-height: 100vh;
        }
        @keyframes auroraGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        header { 
            padding: 60px 20px 40px; 
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { 
            font-size: 2.5rem; 
            font-weight: 800; 
            letter-spacing: -0.025em; 
            margin: 0;
            color: var(--text-primary);
        }
        header p {
            color: var(--text-secondary);
            font-size: 1.125rem;
            margin-top: 12px;
        }
        .search-box { 
            max-width: 600px; 
            margin: 0 auto 40px; 
            padding: 0 20px;
        }
        #searchInput { 
            width: 100%; 
            padding: 12px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            background: var(--card-bg);
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 175, 204, 0.2);
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 24px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 60px; 
        }
        .card { 
            background: var(--card-bg); 
            padding: 32px 24px; 
            border-radius: 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(255, 175, 204, 0.1);
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 12px 20px -8px rgba(255, 175, 204, 0.3);
            border-color: var(--accent);
        }
        .card img { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 20px; 
            background: #f1f5f9;
            transition: transform 0.3s;
        }
        .card:hover img {
            transform: scale(1.05);
        }
        .card h3 { 
            margin: 0 0 4px; 
            font-size: 1.25rem; 
            font-weight: 700; 
            color: var(--text-primary);
        }
        .card p { 
            font-size: 0.875rem; 
            color: var(--text-secondary); 
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0;
            z-index: 1000; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(12px); 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .modal-content { 
            background: #fffafa; 
            width: 100%; 
            max-width: 900px; 
            padding: 48px; 
            border-radius: 32px; 
            position: relative; 
            max-height: 90vh; 
            overflow-y: auto; 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(251, 175, 204, 0.3);
            border: 1px solid #ffafcc;
        }
        .modal-content img { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 32px; 
            box-shadow: 0 8px 16px rgba(251, 175, 204, 0.2);
            border: 4px solid #fff;
        }
        .close { 
            position: absolute; 
            top: 24px; 
            right: 24px; 
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f1f5f9;
            font-size: 24px; 
            cursor: pointer; 
            color: var(--text-secondary); 
            transition: all 0.2s; 
        }
        .close:hover { 
            background: #e2e8f0;
            color: var(--text-primary);
            transform: rotate(90deg); 
        }
        .bio-title { 
            font-size: 2rem; 
            font-weight: 800; 
            letter-spacing: -0.025em;
            margin-bottom: 24px;
            color: var(--text-primary);
        }
        .bio-text { 
            line-height: 1.75; 
            text-align: left; 
            font-size: 1.125rem; 
            color: #475569; 
        }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 3rem; font-weight: 900; color: var(--primary); margin: 0;">Gjigantët e Fizikës</h1>
    <p style="font-size: 1.2rem; color: #64748b; margin-top: 10px;">50 mendjet që ndryshuan historinë e njerëzimit</p>
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Kërko shkencëtarin..." onkeyup="filterCards()">
</div>

<div class="grid" id="physicistGrid"></div>

<div id="bioModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="" alt="" referrerpolicy="no-referrer">
        <h2 id="modalTitle" class="bio-title"></h2>
        <div id="modalBody" class="bio-text"></div>
    </div>
</div>

<script>
const imgProxy = "https://wsrv.nl/?url=";

// Funksion për të trajtuar imazhet që dështojnë
function handleImageError(img) {
    const originalUrl = img.getAttribute('data-original');
    if (img.src.includes('wsrv.nl')) {
        // Nëse edhe proxy dështon, vendos një avatar
        img.onerror = null;
        const name = img.alt || "Physicist";
        img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=ffafcc&color=fff&size=128`;
    } else if (originalUrl) {
        // Nëse dështon URL direkte, provo me proxy
        img.src = `${imgProxy}${encodeURIComponent(originalUrl)}&w=300&h=300&fit=cover&error=404`;
    }
}

const physicists = [
    { name: "Isaac Newton", tag: "Graviteti", bio: "Isaac Newton lindi në Angli në vitin 1643 dhe konsiderohet një nga shkencëtarët më të mëdhenj në histori. Ai formuloi tre ligjet e lëvizjes, të cilat u bënë themeli i mekanikës klasike. Newton zhvilloi ligjin e gravitetit universal, duke shpjeguar se si trupat tërhiqen nga njëri-tjetri në varësi të masës dhe distancës. Ai botoi veprën e famshme Philosophiæ Naturalis Principia Mathematica në vitin 1687, ku përmblodhi teoritë e tij mbi lëvizjen dhe gravitetit. Kontributet e tij në optikë ishin gjithashtu të rëndësishme, pasi ai provoi se drita e bardhë përbëhet nga ngjyrat e spektrit. Newton zhvilloi një formë të hershme të kalkulusit (njëkohësisht me Leibniz). Zbulimet e tij ndikuan fuqishëm në shkencën për më shumë se dy shekuj. Ai shërbeu edhe si president i Royal Society. Për kontributet e tij, ai u nderua me titullin “Sir”. Trashëgimia e tij mbetet themelore në fizikë dhe matematikë.", img: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Portrait_of_Sir_Isaac_Newton%2C_1689.jpg" },
    { name: "Albert Einstein", tag: "Relativiteti", bio: "Albert Einstein lindi në Gjermani në vitin 1879 dhe revolucionarizoi fizikën moderne. Në vitin 1905, ai publikoi teorinë e relativitetit special, ku paraqiti formulën e famshme E=mc². Kjo formulë tregoi lidhjen midis masës dhe energjisë. Në vitin 1915, ai zhvilloi teorinë e relativitetit të përgjithshëm, e cila shpjegon gravitetin si përkulje të hapësirë-kohës. Einstein dha kontribute të rëndësishme edhe në shpjegimin e efektit fotoelektrik, për të cilin fitoi Çmimin Nobel në vitin 1921. Punimet e tij ndikuan në zhvillimin e fizikës kuantike. Ai ndryshoi mënyrën se si kuptohet universi në shkallë të mëdha. Einstein u bë simbol i gjeniut shkencor në mbarë botën. Ai emigroi në SHBA për shkak të nazizmit. Idetë e tij vazhdojnë të jenë bazë e kozmologjisë moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg" },
    { name: "Galileo Galilei", tag: "Astronomia", bio: "Galileo Galilei lindi në Itali në vitin 1564 dhe konsiderohet babai i shkencës moderne eksperimentale. Ai përmirësoi teleskopin dhe realizoi vëzhgime të rëndësishme astronomike. Galileo zbuloi katër satelitët kryesorë të Jupiterit, duke mbështetur teorinë heliocentrike. Ai përkrahu sistemin e Kopernikut, sipas të cilit Toka rrotullohet rreth Diellit. Studimet e tij mbi rënien e lirë dhe lëvizjen hodhën bazat e mekanikës. Galileo theksoi rëndësinë e eksperimentit dhe matjes në shkencë. Për shkak të pikëpamjeve të tij, ai u përball me Inkuizicionin dhe u dënua me arrest shtëpiak. Megjithatë, idetë e tij triumfuan me kalimin e kohës. Ai ndikoi drejtpërdrejt në punën e Newtonit. Kontributet e tij shënuan fillimin e revolucionit shkencor.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d4/Justus_Sustermans_-_Portrait_of_Galileo_Galilei%2C_1636.jpg" },
    { name: "Marie Curie", tag: "Radioaktiviteti", bio: "Marie Curie lindi në Poloni në vitin 1867 dhe ishte një nga shkencëtaret më të shquara të shekullit XX. Ajo studioi fenomenin e radioaktivitetit, term që ajo vetë e përhapi. Së bashku me bashkëshortin e saj, Pierre Curie, zbuloi elementet polonium dhe radium. Ajo ishte gruaja e parë që fitoi Çmimin Nobel. Madje fitoi dy Çmime Nobel, në fizikë dhe në kimi. Hulumtimet e saj hapën rrugën për përdorimin e rrezatimit në mjekësi. Ajo kontribuoi në zhvillimin e radiografisë gjatë Luftës së Parë Botërore. Puna e saj ndihmoi në kuptimin e strukturës atomike. Curie përballoi shumë vështirësi si grua në shkencë. Ajo mbetet simbol i përkushtimit dhe sakrificës për shkencën.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Marie_Curie_c._1920s.jpg/960px-Marie_Curie_c._1920s.jpg" },
    { name: "Nikola Tesla", tag: "Rryma AC", bio: "Nikola Tesla lindi në vitin 1856 dhe ishte një shpikës dhe fizikant me ndikim të madh në elektroteknikë. Ai zhvilloi sistemin e rrymës alternative (AC), që sot përdoret globalisht për furnizimin me energji elektrike. Tesla kontribuoi në zhvillimin e motorëve elektrikë dhe transformatorëve. Ai punoi për një periudhë me Thomas Edison, por më vonë u bë rival i tij në “luftën e rrymave”. Tesla shpiku bobinën Tesla, e cila përdoret në eksperimente me tension të lartë. Ai bëri eksperimente me transmetimin pa tela të energjisë. Idetë e tij ishin shumë përpara kohës. Edhe pse pati vështirësi financiare, ndikimi i tij në teknologji është i jashtëzakonshëm. Ai kontribuoi në zhvillimin e radios dhe elektromagnetizmit. Sot konsiderohet një nga figurat më inovative në historinë e shkencës.", img: "https://upload.wikimedia.org/wikipedia/commons/7/79/Tesla_circa_1890.jpeg" },
    { name: "James Clerk Maxwell", tag: "Elektromagnetizmi", bio: "James Clerk Maxwell lindi në Skoci në vitin 1831 dhe ishte një nga themeluesit e elektromagnetizmit modern. Ai formuloi ekuacionet e famshme të Maxwell-it, të cilat bashkuan elektricitetin dhe magnetizmin në një teori të vetme. Kjo ekuacion treguan se drita është një valë elektromagnetike. Maxwell zhvilloi teorie kinetike të gazeve, duke shpjeguar sjelljen mikroskopike të molekulave. Ai kontribuoi në analizën matematikore të fushave elektrike dhe magnetike. Puna e tij hapi rrugën për zhvillimin e radios dhe komunikimit pa tela. Idetë e tij ndikuan drejtpërdrejt në punën e Einstein-it. Maxwell ishte gjithashtu pionier në fotografinë me ngjyra. Ai konsiderohet një nga fizikantët më të mëdhenj teorikë të shekullit XIX. Trashëgimia e tij mbetet themel i fizikës moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/b/b0/James-Clerk-Maxwell-1831-1879.jpg" },
    { name: "Niels Bohr", tag: "Atomi", bio: "Niels Bohr lindi në Danimarkë në vitin 1885 dhe dha kontribute vendimtare në zhvillimin e mekanikës kuantike. Ai propozoi modelin e atomit të Bohr-it në vitin 1913, ku elektronet lëvizin në orbita të përcaktuara rreth bërthamës. Ky model shpjegoi spektrin e emetimit të hidrogjenit. Bohr zhvilloi parimin e komplementaritetit, që thekson natyrën duale të grimcave. Ai kontribuoi në interpretimin filozofik të mekanikës kuantike. Për punën e tij mbi strukturën atomike, fitoi Çmimin Nobel në vitin 1922. Instituti i tij në Kopenhagë u bë qendër kryesore e fizikës kuantike. Ai ndihmoi shkencëtarët hebrenj gjatë Luftës së Dytë Botërore. Idetë e tij ndikuan thellësisht në fizikën e shekullit XX. Bohr mbetet figurë kyçe në kuptimin e strukturës së atomit.", img: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Niels_Bohr.jpg" },
    { name: "Max Planck", tag: "Kuantet", bio: "Max Planck lindi në Gjermani në vitin 1858 dhe konsiderohet themeluesi i teorisë kuantike. Në vitin 1900 ai propozoi idenë se energjia emetohet në sasi të vogla të quajtura “kuanta”. Kjo ide revolucionarizoi fizikën klasike. Konstanta e Planck-ut u bë një nga konstantet themelore të natyrës. Puna e tij shpjegoi rrezatimin e trupit të zi. Fillimisht, ai vetë ishte skeptik për implikimet e teorisë së tij. Zbulimi i tij hapi rrugën për zhvillimin e mekanikës kuantike. Ai fitoi Çmimin Nobel në Fizikë në vitin 1918. Planck luajti rol të rëndësishëm në mbështetjen e Einstein-it. Ai përjetoi periudha të vështira gjatë regjimit nazist. Kontributi i tij ndryshoi përgjithmonë kuptimin e energjisë në fizikë.", img: "https://upload.wikimedia.org/wikipedia/commons/a/a7/Max_Planck_%281858-1947%29.jpg" },
    { name: "Stephen Hawking", tag: "Vrimat e Zeza", bio: "Stephen Hawking lindi në Mbretërinë e Bashkuar në vitin 1942 dhe ishte një nga kozmologët më të njohur modernë. Ai studioi vrimat e zeza dhe strukturën e universit. Hawking propozoi se vrimat e zeza mund të lëshojnë rrezatim, i njohur si “Rrezatimi Hawking”. Ky zbulim bashkoi relativitetin e përgjithshëm me mekanikën kuantike. Ai vuante nga sëmundja ALS, por vazhdoi punën shkencore për dekada. Libri i tij A Brief History of Time u bë bestseller ndërkombëtar. Ai kontribuoi në teorinë e singulariteteve me Roger Penrose. Hawking promovoi shkencën në publikun e gjerë. Ai ishte profesor në Universitetin e Kembrixhit. Trashëgimia e tij mbetet e rëndësishme në kozmologji dhe fizikë teorike.", img: "https://upload.wikimedia.org/wikipedia/commons/e/eb/Stephen_Hawking.StarChild.jpg" },
    { name: "Richard Feynman", tag: "QED", bio: "Richard Feynman lindi në SHBA në vitin 1918 dhe ishte një nga fizikantët më karizmatikë të shekullit XX. Ai dha kontribute thelbësore në elektrodinamikën kuantike (QED). Feynman zhvilloi diagramet e Feynman-it, të cilat lehtësojnë llogaritjen e ndërveprimeve mes grimcave. Për punën e tij fitoi Çmimin Nobel në vitin 1965. Ai mori pjesë në Projektin Manhattan gjatë Luftës së Dytë Botërore. Feynman ishte i njohur për stilin e tij të thjeshtë dhe të qartë të mësimdhënies. Ligjëratat e tij në Caltech u bënë shumë të famshme. Ai kontribuoi edhe në hetimin e aksidentit të anijes hapësinore Challenger. Feynman theksoi rëndësinë e kuriozitetit dhe mendimit kritik. Ai mbetet një figurë frymëzuese në fizikë dhe arsim.", img: "https://upload.wikimedia.org/wikipedia/en/thumb/4/42/Richard_Feynman_Nobel.jpg/250px-Richard_Feynman_Nobel.jpg" },
    { name: "Werner Heisenberg", tag: "Pasiguria", bio: "Werner Heisenberg lindi në Gjermani në vitin 1901 dhe ishte një nga themeluesit e mekanikës kuantike. Në vitin 1925 ai zhvilloi mekanikën matricore, një nga formulimet e para matematikore të teorisë kuantike. Ai formuloi Parimin e Pasigurisë në vitin 1927, sipas të cilit është e pamundur të dihen njëkohësisht me saktësi pozicioni dhe momenti i një grimce. Ky parim ndryshoi rrënjësisht kuptimin klasik të realitetit fizik. Heisenberg fitoi Çmimin Nobel në Fizikë në vitin 1932. Ai kontribuoi në teorinë e strukturës së atomit dhe në fizikën bërthamore. Gjatë Luftës së Dhjetë Botërore, ai drejtoi programin bërthamor gjerman. Puna e tij pati ndikim të madh në zhvillimin e fizikës moderne. Ai ishte profesor dhe studiues aktiv për shumë vite. Kontributet e tij mbeten themelore në mekanikën kuantike.", img: "https://upload.wikimedia.org/wikipedia/commons/f/f8/Bundesarchiv_Bild183-R57262%2C_Werner_Heisenberg.jpg" },
    { name: "Erwin Schrödinger", tag: "Valët Kuantike", bio: "Erwin Schrödinger lindi në Austri në vitin 1887 dhe ishte një nga figurat kryesore të mekanikës kuantike. Në vitin 1926 ai formuloi ekuacionin e Schrödinger-it, i cili përshkruan evolucionin e funksionit valor të një sistemi kuantik. Ky ekuacion u bë bazë e fizikës kuantike teorike. Ai propozoi eksperimentin e mendimit të famshëm “macja e Schrödinger-it”, për të ilustruar paradokset e teorisë kuantike. Schrödinger fitoi Çmimin Nobel në Fizikë në vitin 1933. Puna e tij shpjegoi strukturën e atomeve dhe molekulave. Ai kontribuoi edhe në filozofinë e shkencës. Schrödinger dha mësim në universitete të ndryshme evropiane. Idetë e tij ndikuan thellësisht në biologjinë molekulare përmes librit What Is Life?. Ai mbetet një nga mendjet më të mëdha të fizikës teorike.", img: "https://www.nobelprize.org/images/schrodinger-12988-content-portrait-mobile-tiny.jpg" },
    { name: "Paul Dirac", tag: "Antimateria", bio: "Paul Dirac lindi në Mbretërinë e Bashkuar në vitin 1902 dhe ishte një nga pionierët e mekanikës kuantike dhe teorisë së fushës. Ai formuloi ekuacionin e Dirac-ut në vitin 1928, i cili bashkoi mekanikën kuantike me relativitetin special. Ky ekuacion parashikoi ekzistencën e antimateries. Zbulimi i pozitronit më vonë konfirmoi parashikimin e tij teorik. Dirac fitoi Çmimin Nobel në Fizikë në vitin 1933. Ai kontribuoi në zhvillimin e elektrodinamikës kuantike. Dirac ishte i njohur për stilin e tij shumë të saktë matematikor. Ai theksoi bukurinë matematikore si kriter për teoritë fizike. Puna e tij ndikoi në zhvillimin e fizikës së grimcave elementare. Ai konsiderohet një nga teoricienët më të mëdhenj të shekullit XX.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Paul_Dirac%2C_1933.jpg/250px-Paul_Dirac%2C_1933.jpg" },
    { name: "Michael Faraday", tag: "Induksioni", bio: "Michael Faraday lindi në Angli në vitin 1791 dhe ishte një nga eksperimentuesit më të mëdhenj në histori. Ai zbuloi induksionin elektromagnetik në vitin 1831, duke treguar se një fushë magnetike mund të gjenerojë rrymë elektrike. Ky zbulim çoi në shpikjen e gjeneratorëve elektrikë. Faraday zhvilloi konceptin e vijave të fushës magnetike. Ai kontribuoi në studimin e elektrolizës dhe formuloi ligjet e saj. Puna e tij hodhi bazat për zhvillimin e motorëve elektrikë. Edhe pse kishte pak arsim formal, ai u bë anëtar i Royal Society. Faraday ndikoi drejtpërdrejt në Maxwell-in. Ai ishte i njohur për demonstrimet publike shkencore. Kontributet e tij janë themel i teknologjisë moderne elektrike.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Michael_Faraday_sitting_crop.jpg/960px-Michael_Faraday_sitting_crop.jpg" },
    { name: "Enrico Fermi", tag: "Energjia Bërthamore", bio: "Enrico Fermi lindi në Itali në vitin 1901 dhe ishte një nga fizikantët më të rëndësishëm të shekullit XX. Ai njihet si 'arkitekti i epokës bërthamore'. Fermi zhvilloi reaktorin e parë bërthamor në Çikago në vitin 1942. Ai dha kontribute thelbësore në fizikën bërthamore dhe mekanikën statistikore (statistika Fermi-Dirac). Për punën e tij fitoi Çmimin Nobel në Fizikë në vitin 1938. Ai mori pjesë në Projektin Manhattan. Fermi ishte i njohur për aftësinë e tij për të bërë llogaritje të shpejta dhe të sakta. Ai kontribuoi në zbulimin e elementeve të reja radioaktive. Puna e tij hodhi bazat për përdorimin e energjisë bërthamore. Ai mbetet një nga shkencëtarët më të gjithanshëm të kohës moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d4/Enrico_Fermi_1943-49_crop.jpg" },
    { name: "Wolfgang Pauli", tag: "Përjashtimi", bio: "Wolfgang Pauli lindi në Austri në vitin 1900 dhe ishte një nga themeluesit e mekanikës kuantike. Ai formuloi Parimin e Përjashtimit të Paulit në vitin 1925, i cili thotë se dy elektrone nuk mund të kenë të njëjtat numra kuantikë brenda një atomi. Ky parim shpjegon strukturën e tabelës periodike dhe stabilitetin e materies. Pauli kontribuoi në zhvillimin e teorisë së spin-it të elektronit. Ai parashikoi ekzistencën e neutrinos për të ruajtur ligjin e ruajtjes së energjisë në zbërthimin beta. Më vonë, zbulimi eksperimental i neutrinos konfirmoi parashikimin e tij. Pauli fitoi Çmimin Nobel në Fizikë në vitin 1945. Ai ishte i njohur për mendimin e tij kritik dhe analizën e thellë teorike. Kontributet e tij ndikuan fuqishëm në fizikën atomike dhe bërthamore. Ai mbetet figurë kyçe në zhvillimin e teorisë kuantike.", img: "https://upload.wikimedia.org/wikipedia/commons/4/43/Pauli.jpg" },
    { name: "Louis de Broglie", tag: "Dualiteti", bio: "Louis de Broglie lindi në Francë në vitin 1892 dhe dha kontribute themelore në mekanikën kuantike. Në vitin 1924 ai propozoi hipotezën se grimcat materiale kanë natyrë valore. Ai sugjeroi se çdo grimcë me moment ka një gjatësi vale të lidhur me të. Kjo ide u konfirmua më vonë nga eksperimente mbi difraksionin e elektroneve. Teoria e tij ndihmoi në zhvillimin e mekanikës valore të Schrödinger-it. De Broglie fitoi Çmimin Nobel në Fizikë në vitin 1929. Ai kontribuoi në kuptimin e dualitetit valë-grimcë. Idetë e tij ndryshuan mënyrën se si kuptohet materia në nivel mikroskopik. Ai luajti rol të rëndësishëm në zhvillimin e fizikës teorike franceze. Trashëgimia e tij mbetet thelbësore në fizikën kuantike.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d2/Broglie_Big.jpg" },
    { name: "Ernest Rutherford", tag: "Bërthama", bio: "Ernest Rutherford lindi në Zelandën e Re në vitin 1871 dhe konsiderohet babai i fizikës bërthamore. Ai zbuloi se radioaktiviteti përbëhet nga rreze alfa dhe beta. Në eksperimentun e famshëm me fletën e arit, ai tregoi se atomi ka një bërthamë të vogël dhe të dendur. Ky zbulim çoi në modelin bërthamor të atomit. Rutherford realizoi transformimin e parë artificial të një elementi kimik. Ai kontribuoi në studimin e strukturës së bërthamës atomike. Rutherford fitoi Çmimin Nobel në Kimi në vitin 1908. Ai udhëhoqi shumë shkencëtarë të rinj që u bënë të famshëm. Puna e tij hapi rrugën për zhvillimin e fizikës bërthamore. Ai mbetet një nga figurat më të rëndësishme në historinë e shkencës", img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Ernest_Rutherford_LOC.jpg" },
    { name: "J. J. Thomson", tag: "Elektroni", bio: "J. J. Thomson lindi në Angli në vitin 1856 dhe ishte zbuluesi i elektronit. Në vitin 1897 ai tregoi se rrezet katodike përbëhen nga grimca me ngarkesë negative. Ky zbulim ndryshoi konceptin klasik të atomit si një njësi e pandashme. Ai propozoi modelin “puding me rrush të thatë” të atomit. Thomson studioi gjithashtu izotopet dhe kontribuoi në zhvillimin e spektrometrisë së masës. Ai fitoi Çmimin Nobel në Fizikë në vitin 1906. Thomson ishte profesor në Kembrixh dhe mentor i shumë shkencëtarëve të rinj. Puna e tij hapi rrugën për modelin bërthamor të Rutherford-it. Ai ndikoi fuqishëm në zhvillimin e fizikës atomike. Kontributet e tij shënuan fillimin e epokës së fizikës së grimcave.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c1/J.J_Thomson.jpg" },
    { name: "Robert Oppenheimer", tag: "Bomba Atomike", bio: "Robert Oppenheimer lindi në SHBA në vitin 1904 dhe ishte një fizikant teorik me ndikim të madh. Ai dha kontribute në mekanikën kuantike dhe fizikën e grimcave. Oppenheimer drejtoi Projektin Manhattan gjatë Luftës së Dytë Botërore. Nën udhëheqjen e tij u zhvillua bomba e parë atomike. Pas luftës, ai u bë zë kritik për kontrollin ndërkombëtar të armëve bërthamore. Ai përjetoi hetime politike gjatë periudhës së Luftës së Ftohtë. Oppenheimer kontribuoi në studimin e vrimave të zeza dhe kolapsit gravitacional. Ai ishte profesor në Institutin për Studime të Avancuara në Princeton. Figura e tij mbetet komplekse, mes shkencës dhe etikës. Ai konsiderohet një nga figurat më të diskutueshme dhe me ndikim të shekullit XX.", img: "https://upload.wikimedia.org/wikipedia/commons/8/85/Oppenheimer_%28cropped%29.jpg" },
    { name: "Johannes Kepler", tag: "Orbitat", bio: "Johannes Kepler lindi në Gjermani në vitin 1571 dhe ishte një nga figurat kyçe të revolucionit shkencor. Ai formuloi tre ligjet e lëvizjes së planetëve, të cilat përshkruajnë orbitat eliptike rreth Diellit. Ligjet e tij përshkruan saktësisht shpejtësinë dhe periudhën orbitale të planetëve. Kepler u mbështet në të dhënat e sakta të Tycho Brahe. Zbulimet e tij konfirmuan modelin heliocentrik të Kopernikut. Ai kontribuoi edhe në optikë dhe në përmirësimin e teleskopit. Puna e tij ndikoi drejtpërdrejt në teorinë e gravitetit të Newton-it. Kepler përdori matematikën si mjet kryesor për të kuptuar natyrën. Ai përballoi vështirësi fetare dhe personale gjatë jetës. Kontributet e tij janë themelore në astronominë moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/7/74/JKepler.jpg" },
    { name: "Christiaan Huygens", tag: "Optika", bio: "Christiaan Huygens lindi në Holandë në vitin 1629 dhe ishte një shkencëtar me kontribute të shumta në fizikë dhe astronomi. Ai zhvilloi teorinë valore të dritës, duke argumentuar se drita përhapet si valë. Kjo teori ishte në kundërshtim me teorinë korpuskulare të Newton-it. Huygens përmirësoi ndjeshëm teleskopët dhe zbuloi unazat e Saturnit. Ai zbuloi gjithashtu satelitin Titan të Saturnit. Në mekanikë, ai studioi lëvizjen rrethore dhe forcën centrifugale. Huygens shpiku orën me lavjerrës, duke përmirësuar matjen e kohës. Ai kontribuoi në zhvillimin e teorisë së probabilitetit. Idetë e tij në optikë u konfirmuan më vonë nga eksperimente të tjera. Ai mbetet një nga mendjet më të ndritura të shekullit XVII.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Christiaan_Huygens-painting.jpg/800px-Christiaan_Huygens-painting.jpg" },
    { name: "André-Marie Ampère", tag: "Elektrodinamika", bio: "André-Marie Ampère lindi në Francë në vitin 1775 dhe ishte një nga themeluesit e elektrodinamikës. Ai zbuloi se rrymat elektrike krijojnë fusha magnetike dhe formuloi ligjin e Ampère-it. Ai ishte i pari që përdori termin “rrymë elektrike”. Ampère zhvilloi një teori matematike për të shpjeguar elektromagnetizmin. Njësia e rrymës elektrike, amperi, mban emrin e tij. Ampère kontribuoi në zhvillimin e telegrafit elektrik. Puna e tij hodhi bazat për fizikën moderne të elektromagnetizmit. Ai ishte profesor në Paris dhe anëtar i shumë akademive shkencore. Kontributet e tij mbeten thelbësore për inxhinierinë elektrike.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c0/Ampere_Andre_1825.jpg" },
    { name: "Georg Ohm", tag: "Rezistenca", bio: "Georg Ohm lindi në Gjermani në vitin 1789 dhe është i njohur për formulimin e Ligjit të Ohm-it. Ky ligj përshkruan marrëdhënien midis tensionit, rrymës dhe rezistencës elektrike. Fillimisht, puna e tij nuk u pranua gjerësisht nga komuniteti shkencor. Megjithatë, më vonë u vlerësua si themelore për elektroteknikën. Njësia e rezistencës elektrike, ohmi, mban emrin e tij. Ohm kontribuoi në kuptimin e përçueshmërisë elektrike. Puna e tij ndihmoi në zhvillimin e qarqeve elektrike moderne. Ai dha mësim në shkolla dhe universitete gjermane. Ligji i tij përdoret ende sot në çdo sistem elektrik. Kontributet e tij janë bazë e inxhinierisë elektrike.", img: "https://upload.wikimedia.org/wikipedia/commons/e/e6/Georg_Simon_Ohm_%281789-1854%29.jpg" },
    { name: "Blaise Pascal", tag: "Presioni", bio: "Blaise Pascal lindi në Francë në vitin 1623 dhe ishte një mendimtar i shquar në matematikë dhe fizikë. Ai kontribuoi në studimin e presionit dhe hidrodinamikës. Pascal formuloli ligjin e presionit në lëngje, i njohur si Ligji i Pascal-it. Ai provoi ekzistencën e vakumit përmes eksperimenteve me barometër. Njësia e presionit në SI, paskali, mban emrin e tij. Pascal dha kontribute të rëndësishme edhe në teorinë e probabilitetit. Ai ndërtoi një nga makinat e para llogaritëse mekanike. Puna e tij ndikoi në zhvillimin e mekanikës së lëngjeve. Ai ishte gjithashtu filozof dhe autor i veprës Pensées. Kontributet e tij mbeten të rëndësishme në shkencë dhe matematikë.", img: "https://upload.wikimedia.org/wikipedia/commons/9/98/Blaise_Pascal_Versailles.JPG" },
    { name: "Pierre Curie", tag: "Magnetizmi", bio: "Pierre Curie lindi në Francë në vitin 1859 dhe ishte një fizikant i shquar në fushën e magnetizmit dhe radioaktivitetit. Ai studioi vetitë magnetike të materialeve dhe formuloi ligjin e Curie-t mbi temperaturën kritike të magnetizmit. Së bashku me bashkëshorten e tij, Marie Curie, ai hulumtoi fenomenin e radioaktivitetit. Çifti Curie zbuloi elementet polonium dhe radium. Ai kontribuoi në zhvillimin e teknikave për izolimin e substancave radioaktive. Pierre Curie fitoi Çmimin Nobel në Fizikë në vitin 1903 së bashku me Marie Curie dhe Henri Becquerel. Puna e tij ndihmoi në kuptimin e strukturës atomike. Ai ishte profesor në Sorbonë. Vdekja e tij e parakohshme ishte një humbje e madhe për shkencën. Kontributet e tij mbeten thelbësore në fizikën bërthamore.", img: "https://upload.wikimedia.org/wikipedia/commons/0/09/Pierre_Curie_by_Dujardin_photogravure.jpg" },
    { name: "Lise Meitner", tag: "Fisioni", bio: "Lise Meitner lindi në Austri në vitin 1878 dhe ishte një nga fizikantet më të rëndësishme të shekullit XX. Ajo kontribuoi në zbulimin e procesit të ndarjes bërthamore (fisionit). Së bashku me Otto Hahn, ajo studioi reaksionet e uraniumit. Interpretimi teorik i Meitner-it shpjegoi se bërthama mund të ndahet duke çliruar energji të madhe. Ky zbulim hapi rrugën për zhvillimin e energjisë bërthamore. Megjithëse nuk e mori Çmimin Nobel, kontributi i saj ishte thelbësor. Ajo u detyrua të largohej nga Gjermania për shkak të nazizmit. Meitner kundërshtoi përdorimin e armëve bërthamore. Ajo vazhdoi punën shkencore në Suedi. Sot konsiderohet figurë e rëndësishme në historinë e fizikës bërthamore.", img: "https://upload.wikimedia.org/wikipedia/commons/a/af/Lise_Meitner_1928.jpg" },
    { name: "Chien-Shiung Wu", tag: "Bërthama", bio: "Chien-Shiung Wu lindi në Kinë në vitin 1912 dhe u bë një fizikante eksperimentale me ndikim të madh. Ajo kontribuoi në Projektin Manhattan gjatë Luftës së Dytë Botërore. Wu realizoi eksperimentin që konfirmoi shkeljen e paritetit në ndërveprimin e dobët. Ky zbulim rrëzoi bindjen se ligjet fizike janë gjithmonë simetrike. Puna e saj konfirmoi teorinë e Lee dhe Yang, të cilët fituan Çmimin Nobel. Ajo u vlerësua si “Zonja e Parë e Fizikës”. Wu dha mësim në Universitetin Columbia. Ajo kontribuoi në zhvillimin e fizikës bërthamore. Puna e saj theksoi rëndësinë e eksperimentit në verifikimin e teorisë. Ajo mbetet figurë frymëzuese për gratë në shkencë.", img: "https://upload.wikimedia.org/wikipedia/commons/8/8e/Chien-Shiung_Wu_%281912-1997%29_in_1958.jpg" },
    { name: "Abdus Salam", tag: "Elektrodobët", bio: "Abdus Salam lindi në Pakistan në vitin 1926 dhe ishte një fizikant teorik me ndikim global. Ai kontribuoi në zhvillimin e teorisë së unifikimit elektrodobët. Së bashku me Weinberg dhe Glashow, ai formuloi modelin që bashkon forcat elektromagnetike dhe të dobëta. Për këtë punë fitoi Çmimin Nobel në Fizikë në vitin 1979. Salam ishte fizikanti i parë pakistanez që mori Nobel. Ai themeloi Qendrën Ndërkombëtare për Fizikë Teorike në Trieste. Salam promovoi zhvillimin shkencor në vendet në zhvillim. Puna e tij ndikoi në modelin standard të fizikës së grimcave. Ai ishte mbështetës i arsimit dhe kërkimit shkencor. Trashëgimia e tij mbetet e rëndësishme në fizikën teorike.", img: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Abdus_Salam_1987.jpg" },
    { name: "S. Chandrasekhar", tag: "Yjet", bio: "Subrahmanyan Chandrasekhar lindi në Indi në vitin 1910 dhe ishte një astrofizikan i shquar. Ai zhvilloi teorinë mbi evolucionin e yjeve. Në moshë të re ai llogariti kufirin maksimal të masës së një xhuxhi të bardhë, i njohur si “Kufiri Chandrasekhar”. Ky zbulim tregoi se yjet mbi një masë të caktuar mund të kolapsojnë në yje neutronikë ose vrima të zeza. Fillimisht, puna e tij u kundërshtua, por më vonë u pranua gjerësisht. Ai fitoi Çmimin Nobel në Fizikë në vitin 1983. Chandrasekhar dha kontribute edhe në dinamikën e lëngjeve dhe relativitetin. Ai ishte profesor në Universitetin e Çikagos për shumë vite. Puna e tij ndikoi thellësisht në astrofizikën moderne. Ai konsiderohet një nga mendjet më të mëdha në studimin e strukturës së yjeve.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d4/Chandrasekhar_Subrahmanyan.jpg" },
    { name: "Edwin Hubble", tag: "Kozmologjia", bio: "Edwin Hubble lindi në SHBA në vitin 1889 dhe ishte astronomi që ndryshoi kuptimin e universit. Ai provoi se galaktikat ekzistojnë jashtë Rrugës së Qumështit. Hubble zbuloi se universi po zgjerohet, duke analizuar zhvendosjen drejt të kuqes të dritës nga galaktikat. Ky zbulim çoi në formulimin e Ligjit të Hubble-it. Puna e tij mbështeti teorinë e Big Bengut. Ai përdori teleskopin Hooker në Observatorin Mount Wilson për vëzhgimet e tij. Zbulimet e tij zgjeruan ndjeshëm shkallën e universit të njohur. Emri i tij iu dha teleskopit hapësinor Hubble. Ai kontribuoi në klasifikimin e galaktikave. Hubble mbetet figurë qendrore në kozmologjinë moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/d/df/Edwin_Hubble.jpg" },
    { name: "Lev Landau", tag: "Superfluiditeti", bio: "Lev Landau lindi në Azerbajxhan në vitin 1908 dhe ishte një fizikant teorik sovjetik me ndikim të madh. Ai dha kontribute në fizikën e lëndës së kondensuar. Landau zhvilloi teorinë e superfluiditetit të heliumit. Ai kontribuoi në teorinë e tranzicioneve fazore. Landau bashkëpunoi me Lifshitz në hartimin e një serie librash klasikë të fizikës teorike. Ai fitoi Çmimin Nobel në Fizikë në vitin 1962. Puna e tij ndikoi në fizikën bërthamore dhe plazmatike. Landau ishte profesor dhe mentor i shumë fizikantëve sovjetikë. Ai përjetoi edhe burgosje gjatë regjimit stalinist. Kontributet e tij mbeten themelore në fizikën teorike.", img: "https://upload.wikimedia.org/wikipedia/commons/6/60/Lev_Landau.jpg" },
    { name: "Satyendra Nath Bose", tag: "Bozonët", bio: "Satyendra Nath Bose lindi në Indi në vitin 1894 dhe ishte një fizikant teorik i shquar. Ai zhvilloi statistikat kuantike për grimcat që sot quhen bozone. Puna e tij u dërgua te Einstein, i cili e përkrahu dhe e zhvilloi më tej. Statistika Bose–Einstein shpjegon sjelljen e grimcave me spin të plotë. Koncepti i kondensatit Bose–Einstein rrjedh nga puna e tij. Ai kontribuoi në zhvillimin e mekanikës kuantike. Emri i tij u përjetësua në termin “bozon”. Bose ishte profesor dhe promovues i shkencës në Indi. Ai ndikoi në zhvillimin e fizikës moderne indiane. Kontributet e tij janë thelbësore në fizikën kuantike.", img: "https://upload.wikimedia.org/wikipedia/commons/c/cb/S_N_Bose_1930s.jpg" },
    { name: "Arthur Compton", tag: "Rrezet X", bio: "Arthur Compton lindi në SHBA në vitin 1892 dhe ishte një fizikant eksperimental i rëndësishëm. Ai zbuloi efektin Compton në vitin 1923. Ky efekt tregoi se rrezet X sillen si grimca kur përplasen me elektrone. Zbulimi konfirmoi natyrën grimcore të dritës. Ai fitoi Çmimin Nobel në Fizikë në vitin 1927. Compton kontribuoi në Projektin Manhattan. Ai studioi gjithashtu rrezet kozmike. Puna e tij forcoi teorinë kuantike të rrezatimit. Ai ishte profesor dhe drejtues universitar. Kontributet e tij janë të rëndësishme në fizikën atomike.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Arthur_Compton.jpg" },
    { name: "Hideki Yukawa", tag: "Mezonet", bio: "Hideki Yukawa lindi në Japoni në vitin 1907 dhe ishte fizikanti i parë japonez që fitoi Çmimin Nobel. Ai propozoi teorinë e mezonit si grimca që ndërmjetëson forcën bërthamore të fortë. Kjo teori shpjegoi lidhjen midis protoneve dhe neutroneve. Zbulimi i mezonit konfirmoi idetë e tij teorike. Yukawa fitoi Çmimin Nobel në Fizikë në vitin 1949. Ai kontribuoi në zhvillimin e fizikës së grimcave. Puna e tij ndikoi në modelin standard. Ai ishte profesor në universitete japoneze. Yukawa promovoi kërkimin shkencor pas Luftës së Dytë Botërore. Ai mbetet figurë qendrore në fizikën bërthamore.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Hideki_Yukawa_1950.jpg" },
    { name: "Murray Gell-Mann", tag: "Kuarket", bio: "Murray Gell-Mann lindi në SHBA në vitin 1929 dhe ishte një fizikant teorik i shquar. Ai propozoi modelin e kuarkeve për strukturën e hadroneve. Koncepti i kuarkeve revolucionarizoi fizikën e grimcave. Ai fitoi Çmimin Nobel në Fizikë në vitin 1969. Gell-Mann kontribuoi në zhvillimin e kromodinamikës kuantike. Ai ishte profesor në Caltech. Puna e tij ndihmoi në ndërtimin e modelit standard. Ai ishte gjithashtu i interesuar për kompleksitetin dhe sistemet komplekse. Gell-Mann bashkëthemeloi Institutin Santa Fe. Kontributet e tij janë thelbësore në fizikën moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/1/1d/Murray_Gell-Mann_at_Le_Web_2011.jpg" },
    { name: "Peter Higgs", tag: "Masa", bio: "Peter Higgs lindi në Mbretërinë e Bashkuar në vitin 1929. Ai propozoi mekanizmin Higgs për t’i dhënë masë grimcave elementare. Teoria e tij parashikoi ekzistencën e bozonit Higgs. Grimca u zbulua eksperimentalisht në CERN në vitin 2012. Higgs fitoi Çmimin Nobel në Fizikë në vitin 2013. Puna e tij është pjesë qendrore e modelit standard. Ai ishte profesor në Universitetin e Edinburgut. Zbulimi i bozonit Higgs ishte arritje madhore e fizikës moderne. Kontributi i tij lidhet me kuptimin e origjinës së masës. Higgs mbetet figurë historike në fizikën e grimcave.", img: "https://upload.wikimedia.org/wikipedia/commons/d/d1/Higgs%2C_Peter_%281929%29.jpg" },
    { name: "Carlo Rubbia", tag: "Grimcat W dhe Z", bio: "Carlo Rubbia lindi në Itali në vitin 1934 dhe është fizikant i grimcave. Ai kontribuoi në zbulimin e grimcave W dhe Z. Ky zbulim konfirmoi teorinë elektrodobët. Rubbia fitoi Çmimin Nobel në Fizikë në vitin 1984. Ai punoi në CERN në projekte madhore eksperimentale. Puna e tij forcoi modelin standard. Ai shërbeu si drejtor i përgjithshëm i CERN. Rubbia kontribuoi edhe në kërkime mbi energjinë. Ai ishte profesor universitar. Kontributet e tij janë të rëndësishme në fizikën eksperimentale.", img: "https://upload.wikimedia.org/wikipedia/commons/0/05/Carlo_Rubbia_CERN.jpg" },
    { name: "Steven Weinberg", tag: "Modeli Standart", bio: "Steven Weinberg lindi në SHBA në vitin 1933 dhe ishte fizikant teorik me ndikim global. Ai bashkëformuloi teorinë e unifikimit elektrodobët. Për këtë punë fitoi Çmimin Nobel në vitin 1979. Weinberg kontribuoi në kozmologji dhe teori kuantike të fushës. Ai shkroi libra të njohur mbi historinë e shkencës. Puna e tij është themel i modelit standard. Ai ishte profesor në Universitetin e Teksasit. Weinberg ndikoi në zhvillimin e fizikës moderne. Ai ishte zë i fortë për racionalizmin shkencor. Kontributet e tij janë të qëndrueshme në fizikë.", img: "https://upload.wikimedia.org/wikipedia/commons/a/ae/Steven_Weinberg_cropped.jpg" },
    { name: "Kip Thorne", tag: "Graviteti", bio: "Kip Thorne lindi në SHBA në vitin 1940 dhe është astrofizikan teorik. Ai kontribuoi në studimin e vrimave të zeza dhe valëve gravitacionale. Thorne ishte bashkëthemelues i projektit LIGO. Zbulimi i valëve gravitacionale në vitin 2015 konfirmoi parashikimin e Einstein-it. Ai fitoi Çmimin Nobel në Fizikë në vitin 2017. Thorne kontribuoi në popullarizimin e shkencës. Ai ishte këshilltar shkencor për filmin Interstellar. Puna e tij lidhet me relativitetin e përgjithshëm. Ai dha mësim në Caltech. Kontributet e tij janë madhore në astrofizikë.", img: "https://upload.wikimedia.org/wikipedia/commons/3/30/Kip_Thorne_2017.jpg" },
    { name: "Brian Greene", tag: "Stringet", bio: "Brian Greene lindi në SHBA në vitin 1963 dhe është fizikant teorik i specializuar në teorinë e fijeve (string theory). Ai kontribuoi në zhvillimin e koncepteve mbi dimensionet shtesë të hapësirës. Greene u bë i njohur për popullarizimin e fizikës përmes librave si The Elegant Universe. Ai shpjegoi idetë komplekse të teorisë së fijeve për publikun e gjerë. Puna e tij lidhet me përpjekjet për të bashkuar relativitetin me mekanikën kuantike. Ai është profesor në Universitetin Columbia. Greene ka marrë pjesë në dokumentarë shkencorë ndërkombëtarë. Ai promovon edukimin shkencor globalisht. Kontributet e tij janë kryesisht në fizikën teorike dhe kozmologji. Ai mbetet figurë e rëndësishme në komunikimin e shkencës moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/7/77/Brian_Greene_2015.jpg" },
    { name: "Lisa Randall", tag: "Dimensionet", bio: "Lisa Randall lindi në SHBA në vitin 1962 dhe është fizikante teorike me ndikim të madh. Ajo ka kontribuar në modele të reja mbi dimensionet shtesë dhe gravitetin. Randall propozoi modele që shpjegojnë pse graviteti është shumë më i dobët se forcat e tjera themelore. Puna e saj lidhet me teorinë e fijeve dhe kozmologjinë. Ajo është profesore në Universitetin Harvard. Randall ka shkruar libra për publikun mbi universin dhe materien e errët. Ajo është një nga gratë më të njohura në fizikën teorike bashkëkohore. Kontributet e saj ndikojnë në kërkimet mbi grimcat elementare. Ajo promovon përfshirjen e grave në shkencë. Puna e saj mbetet aktive në kërkimin shkencor modern.", img: "https://upload.wikimedia.org/wikipedia/commons/4/47/Lisa_Randall_July_2006.jpg" },
    { name: "Roger Penrose", tag: "Matematika", bio: "Roger Penrose lindi në Mbretërinë e Bashkuar në vitin 1931 dhe është matematikan dhe fizikant teorik. Ai kontribuoi në teorinë e relativitetit të përgjithshëm. Së bashku me Hawking, ai zhvilloi teoremat mbi singularitetet gravitacionale. Puna e tij tregoi se vrimat e zeza janë pasojë e pashmangshme e relativitetit. Penrose kontribuoi në kuptimin e strukturës së hapësirë-kohës. Ai fitoi Çmimin Nobel në Fizikë në vitin 2020. Penrose ka propozuar teori alternative mbi ndërgjegjen dhe universin. Ai dha kontribute edhe në matematikë, si pllakat Penrose. Puna e tij ndikoi në kozmologji dhe gravitet kuantik. Ai mbetet figurë e rëndësishme në shkencën bashkëkohore.", img: "https://upload.wikimedia.org/wikipedia/commons/a/af/Roger_Penrose_at_Festival_della_Scienza.jpg" },
    { name: "Edward Witten", tag: "Teoria M", bio: "Edward Witten lindi në SHBA në vitin 1951 dhe konsiderohet një nga fizikantët teorikë më të shquar të kohës sonë. Ai dha kontribute të thella në teorinë e fijeve dhe teorinë M. Witten bashkoi koncepte nga matematika e avancuar me fizikën teorike. Ai është fitues i Medaljes Fields, një çmim prestigjioz në matematikë. Puna e tij ndikoi në zhvillimin e teorive të unifikimit. Ai është profesor në Institutin për Studime të Avancuara në Princeton. Kontributet e tij lidhen me gravitetin kuantik. Ai konsiderohet një mendje e jashtëzakonshme në fizikë matematikore. Puna e tij ka ndikuar në breza të tërë studiuesish. Ai mbetet figurë qendrore në kërkimet teorike moderne.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c4/Edward_Witten_at_Harvard_University.jpg" },
    { name: "Paul Ehrenfest", tag: "Statistika", bio: "Paul Ehrenfest lindi në Austri në vitin 1880 dhe ishte fizikant teorik me ndikim në mekanikën statistikore. Ai kontribuoi në kuptimin e tranzicioneve fazore. Ehrenfest punoi në interpretimin e mekanikës kuantike. Ai ishte mik dhe bashkëpunëtor i Einstein-it. Ehrenfest dha mësim në Universitetin e Leidenit. Ai ndihmoi në përhapjen e ideve kuantike në Evropë. Kontributet e tij përfshijnë teoremën e Ehrenfest-it. Ai ishte mentor i shumë fizikantëve të rinj. Puna e tij lidhi fizikën klasike me atë kuantike. Ai mbetet figurë e rëndësishme në historinë e fizikës teorike.", img: "https://upload.wikimedia.org/wikipedia/commons/3/35/Paul_Ehrenfest.jpg" },
    { name: "Hendrik Lorentz", tag: "Elektromagnetizmi", bio: "Hendrik Lorentz lindi në Holandë në vitin 1853 dhe ishte fizikant teorik i rëndësishëm. Ai zhvilloi transformimet e Lorentz-it, të cilat përshkruajnë ndryshimet në kohë dhe hapësirë për trupa në lëvizje. Këto transformime u bënë bazë për relativitetin special të Einstein-it. Lorentz kontribuoi në teorinë elektronike të materies. Ai fitoi Çmimin Nobel në Fizikë në vitin 1902. Puna e tij ndikoi në zhvillimin e elektromagnetizmit modern. Ai ishte profesor në Leiden. Lorentz ishte i respektuar për qartësinë matematikore. Kontributet e tij janë themelore në fizikën teorike. Ai mbetet figurë kyçe në historinë e relativitetit.", img: "https://upload.wikimedia.org/wikipedia/commons/a/a2/Hendrik_Antoon_Lorentz_%281853-1928%29.jpg" },
    { name: "Emmy Noether", tag: "Simetria", bio: "Emmy Noether lindi në Gjermani në vitin 1882 dhe ishte matematikane me ndikim të madh në fizikë. Ajo formuloi Teoremën e Noether-it. Kjo teoremë lidh simetritë me ligjet e ruajtjes në fizikë. Puna e saj është themelore në teorinë e fushës dhe mekanikën kuantike. Einstein e vlerësoi si një nga mendjet më të mëdha matematikore. Ajo dha mësim në Gjermani dhe më pas në SHBA. Noether përballoi diskriminim si grua në shkencë. Kontributet e saj ndikojnë drejtpërdrejt në modelin standard. Ajo konsiderohet pionere e algjebrës moderne. Trashëgimia e saj është thelbësore në fizikën teorike.", img: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Noether.jpg" },
    { name: "Alessandro Volta", tag: "Bateria", bio: "Alessandro Volta lindi në Itali në vitin 1745 dhe ishte pionier i elektricitetit. Ai shpiku baterinë e parë elektrike, e njohur si pila e Voltës. Ky shpikje lejoi prodhimin e rrymës së vazhdueshme elektrike. Njësia e tensionit elektrik, volti, mban emrin e tij. Volta kontribuoi në studimin e gazrave dhe elektricitetit statik. Puna e tij ndikoi në zhvillimin e elektrokimisë. Ai ishte profesor në Universitetin e Pavias. Shpikja e tij revolucionarizoi eksperimentet elektrike. Volta u nderua nga Napoleoni. Kontributet e tij janë themel i teknologjisë elektrike.", img: "https://upload.wikimedia.org/wikipedia/commons/c/c2/Alessandro_Volta.jpg" },
    { name: "Gustav Kirchhoff", tag: "Spektroskopia", bio: "Gustav Kirchhoff lindi në Gjermani në vitin 1824 dhe ishte fizikant i njohur për ligjet e qarqeve elektrike. Ai formuloi dy ligjet e Kirchhoff-it për rrymën dhe tensionin. Këto ligje janë bazë e analizës së qarqeve elektrike. Kirchhoff kontribuoi në spektroskopi së bashku me Bunsen. Ai ndihmoi në zbulimin e elementeve të reja përmes analizës së spektrit. Puna e tij ndikoi në zhvillimin e astrofizikës. Ai ishte profesor në Berlin dhe Heidelberg. Kontributet e tij janë thelbësore në elektroteknikë. Ligjet e tij përdoren ende sot. Ai mbetet figurë e rëndësishme në fizikën klasike.", img: "https://upload.wikimedia.org/wikipedia/commons/9/9d/Kirchhoff_Gustav_Robert.jpg" },
    { name: "Max Born", tag: "Mekanika Kuantike", bio: "Max Born lindi në Gjermani në vitin 1882 dhe ishte një nga themeluesit e mekanikës kuantike. Ai propozoi interpretimin probabilistik të funksionit valor. Sipas Born-it, katrori i amplitudës së valës jep probabilitetin e gjetjes së grimcës. Ky interpretim u bë pjesë thelbësore e mekanikës kuantike. Ai fitoi Çmimin Nobel në Fizikë në vitin 1954. Born dha kontribute në fizikën e kristaleve dhe optikë. Ai ishte mentor i shumë fizikantëve të shquar. Born u detyrua të largohej nga Gjermania gjatë nazizmit. Puna e tij ndikoi në zhvillimin e teorisë kuantike moderne. Ai mbetet figurë kyçe në historinë e fizikës.", img: "https://upload.wikimedia.org/wikipedia/commons/f/f7/Max_Born.jpg" }
];

const grid = document.getElementById('physicistGrid');
physicists.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';
    
    // Përdorim URL-në direkte si burim parësor, me referrerpolicy no-referrer
    // Ruajmë URL-në origjinale për fallback në rast dështimi
    const displayImg = p.img;
    
    div.onclick = () => {
        document.getElementById('modalTitle').innerText = p.name;
        document.getElementById('modalBody').innerText = p.bio;
        const modalImg = document.getElementById('modalImg');
        modalImg.alt = p.name;
        modalImg.setAttribute('data-original', p.img);
        modalImg.src = p.img;
        modalImg.onerror = function() { handleImageError(this); };
        document.getElementById('bioModal').style.display = 'flex';
    };
    
    div.innerHTML = `
        <img src="${displayImg}" 
             alt="${p.name}" 
             data-original="${p.img}"
             referrerpolicy="no-referrer" 
             onerror="handleImageError(this)"
             loading="lazy">
        <h3>${p.name}</h3>
        <p>${p.tag}</p>
    `;
    grid.appendChild(div);
});

function closeModal() { document.getElementById('bioModal').style.display = 'none'; }
function filterCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.getElementsByClassName('card');
    for (let c of cards) {
        c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none";
    }
}
window.onclick = (e) => { if(e.target.className == 'modal') closeModal(); }
</script>
