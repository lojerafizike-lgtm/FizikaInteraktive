<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Energjia Potenciale - Animacion</title>
    <style>
        body {
            margin: 0;
            background: #e0f2f1;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            background: white;
            width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Zona e Rënies */
        .sky {
            height: 400px;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            border-radius: 15px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            border-bottom: 10px solid #795548; /* Toka */
        }

        #object {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            z-index: 5;
            /* Ky transition bën animacionin e rënies */
            transition: top 1s cubic-bezier(0.55, 0.055, 0.675, 0.19); 
        }

        .info-panel {
            display: flex;
            justify-content: space-around;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        input {
            padding: 12px;
            border: 2px solid #00bcd4;
            border-radius: 8px;
            width: 150px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #e64a19; }

        /* Efekti i shpërthimit kur godet tokën */
        .hit-effect {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, yellow, orange, transparent);
            border-radius: 50%;
            display: none;
            z-index: 4;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>Eksperimenti i Gravitetit 🌍</h2>
    <p>Gjej <b>Ep = m · g · h</b> (g = 10)</p>

    <div class="info-panel">
        <div>Masa: <span id="m-val">?</span> kg</div>
        <div>Lartësia: <span id="h-val">?</span> m</div>
    </div>

    <div class="sky">
        <div id="object">📦</div>
        <div id="blast" class="hit-effect"></div>
    </div>

    <div class="controls">
        <input type="number" id="userInput" placeholder="Energjia (J)">
        <button onclick="startExperiment()">LËSHO 🚀</button>
    </div>
    
    <p id="msg" style="font-weight:bold; margin-top:15px;"></p>
    <button id="resetBtn" style="display:none;" onclick="init()">Provo përsëri</button>
</div>

<script>
    let m, h, correctEp;
    const g = 10;

    function init() {
        m = Math.floor(Math.random() * 8) + 2; 
        h = Math.floor(Math.random() * 8) + 2; 
        correctEp = m * g * h;

        document.getElementById('m-val').innerText = m;
        document.getElementById('h-val').innerText = h;
        document.getElementById('userInput').value = "";
        document.getElementById('msg').innerText = "";
        document.getElementById('resetBtn').style.display = "none";
        document.getElementById('blast').style.display = "none";

        const obj = document.getElementById('object');
        obj.style.transition = "none"; // Ndalojmë animacionin gjatë reset-it
        obj.style.top = "20px"; // Kthehet lart
        obj.innerText = "📦";
    }

    function startExperiment() {
        const userVal = parseFloat(document.getElementById('userInput').value);
        const obj = document.getElementById('object');
        const blast = document.getElementById('blast');
        const msg = document.getElementById('msg');

        if(isNaN(userVal)) return;

        // 1. Fillojmë animacionin e rënies
        obj.style.transition = "top 1s cubic-bezier(0.55, 0.055, 0.675, 0.19)";
        obj.style.top = "340px"; // Pozicioni i tokës

        // 2. Presim sa të mbarojë rënia (1 sekondë) për të treguar rezultatin
        setTimeout(() => {
            if(userVal === correctEp) {
                blast.style.display = "block"; // Trego shpërthimin
                obj.innerText = "✨";
                msg.innerText = "SUKSES! Llogaritje perfekte.";
                msg.style.color = "green";
            } else {
                obj.innerText = "❌";
                msg.innerText = "GABIM! Energjia duhej të ishte " + correctEp + " J.";
                msg.style.color = "red";
            }
            document.getElementById('resetBtn').style.display = "inline-block";
        }, 1000);
    }

    init();
</script>

</body>
</html>
