<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Field Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #ffafcc;
            --accent2: #a2d2ff;
            --gold: #ffc8dd;
            --text: #4a4e69;
            --muted: #94a3b8;
            --border: #4a4e69;
            --green: #baffc9;
            --red: #ffb3ba;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
            padding: 20px;
        }

        h1 { 
            font-family: 'VT323', monospace; 
            font-size: 3.5rem; 
            color: var(--accent); 
            text-shadow: 3px 3px 0px var(--border); 
            margin-bottom: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        
        #game-container {
            position: relative;
            background: var(--surface); 
            border: 4px solid var(--border); 
            padding: 24px; 
            box-shadow: 8px 8px 0px var(--border); 
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }

        canvas { 
            display: block; 
            background: #e2e8f0; 
            border: 4px solid var(--border); 
            width: 100%;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
            cursor: none; 
        }

        .ui-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
            background: var(--bg);
            border: 4px solid var(--border);
            padding: 10px;
            box-shadow: 4px 4px 0px var(--border);
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            color: var(--text);
        }

        .instructions {
            margin-top: 15px;
            max-width: 650px;
            text-align: center;
            font-size: 1.2rem;
            font-family: 'VT323', monospace;
            color: var(--text);
        }

        #intensity-meter {
            font-weight: bold;
            color: var(--accent);
            text-shadow: 1px 1px 0px var(--border);
        }
        #score {
            color: var(--accent2);
            font-weight: bold;
            text-shadow: 1px 1px 0px var(--border);
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-magnet"></i> Intensiti i Fushës</h1>

    <div id="game-container">
        <div class="ui-panel">
            Pikët: <span id="score">0</span><br>
            Intensiteti (E): <span id="intensity-meter">0</span> N/C
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <div class="instructions">
        <p>Lëviz miun (mouse) për të kontrolluar <b>ngarkesën provë (+q)</b>. 
        Mblidh sferat pastel për pikë, por kujdes: <b>burimi i fushës</b> në qendër të shtyn me forcë më të madhe sa më afër t'i shkosh!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const intensityMeter = document.getElementById('intensity-meter');

        let score = 0;
        let mouse = { x: 300, y: 200 };
        let player = { x: 300, y: 200, radius: 10 };
        
        // Burimi i fushës (ngarkesë e madhe pozitive në qendër)
        const source = { x: 300, y: 200, q: 5000 }; 
        
        let collectibles = [];

        function spawnCollectible() {
            const colors = ['#ffafcc', '#a2d2ff', '#ffc8dd', '#baffc9'];
            collectibles.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: Math.random() * (canvas.height - 40) + 20,
                radius: 8,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        // Krijo disa mbledhëse në fillim
        for(let i=0; i<5; i++) spawnCollectible();

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Scale mouse coordinates to match canvas internal resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouse.x = (e.clientX - rect.left) * scaleX;
            mouse.y = (e.clientY - rect.top) * scaleY;
        });

        function update() {
            // Llogarit distancën nga qendra (r)
            let dx = mouse.x - source.x;
            let dy = mouse.y - source.y;
            let r = Math.sqrt(dx*dx + dy*dy);
            if (r < 20) r = 20; // Parandalon forcën pafundësi

            // Formula e Intensitetit: E = k * Q / r^2
            const k = 8987; 
            let E = (k * source.q) / (r * r);
            
            // Shfaq intensitetin në ekran
            intensityMeter.innerText = Math.round(E);

            // "Shtytja" elektrike - e bën kontrollin e vështirë
            // Ngarkesa provë ndjen një forcë që e largon nga qendra
            let pushX = (dx / r) * (E / 100);
            let pushY = (dy / r) * (E / 100);

            player.x = mouse.x + pushX;
            player.y = mouse.y + pushY;

            // Kontrolli i mbledhjes së pikëve
            collectibles.forEach((c, index) => {
                let dist = Math.sqrt((player.x - c.x)**2 + (player.y - c.y)**2);
                if (dist < player.radius + c.radius) {
                    collectibles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                    spawnCollectible();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vizatimi i vijave të fushës (vizuale)
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<360; i+=30) {
                let rad = i * Math.PI / 180;
                ctx.moveTo(source.x, source.y);
                ctx.lineTo(source.x + Math.cos(rad) * 600, source.y + Math.sin(rad) * 600);
            }
            ctx.stroke();

            // Burimi i fushës (+Q)
            ctx.fillStyle = '#ffafcc';
            ctx.beginPath();
            ctx.arc(source.x, source.y, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4a4e69';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.fillStyle = "#4a4e69";
            ctx.font = "bold 20px VT323";
            ctx.fillText("+Q", source.x - 10, source.y + 6);

            // Mbledhëset
            collectibles.forEach(c => {
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#4a4e69';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Lojtari (ngarkesa provë +q)
            ctx.fillStyle = '#a2d2ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4a4e69';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
