<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja - Forca Qendërsynuese</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --accent: #a2d2ff;
    --accent2: #ffafcc;
    --gold: #ffc8dd;
    --text: #4a4e69;
    --muted: #94a3b8;
    --border: #4a4e69;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 {
    font-family: 'VT323', monospace;
    font-size: 3.5rem;
    color: var(--accent);
    text-shadow: 3px 3px 0px var(--border);
    margin-bottom: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }
  .subtitle { color: var(--text); font-size: 1.1rem; margin-bottom: 24px; font-family: 'VT323', monospace; font-size: 1.5rem; text-align: center; }
  .card {
    background: var(--surface);
    border: 4px solid var(--border);
    border-radius: 0;
    padding: 24px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 8px 8px 0px var(--border);
  }
  .scene {
    background: #e2e8f0;
    border-radius: 0;
    height: 260px;
    position: relative;
    margin-bottom: 16px;
    overflow: hidden;
    border: 4px solid var(--border);
    display: flex;
    justify-content: center;
  }
  .formula-box {
    background: #f8fafc;
    border: 4px solid var(--border);
    padding: 16px;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 16px;
    box-shadow: 4px 4px 0px var(--border);
  }
  label { font-size: 1rem; color: var(--text); display: block; margin-bottom: 6px; font-weight: bold; }
  .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 12px;
    border: 2px solid var(--border);
    background: #e2e8f0;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px; height: 24px;
    background: var(--accent);
    border: 3px solid var(--border);
    cursor: pointer;
  }
  .val {
    min-width: 80px;
    text-align: right;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: var(--text);
  }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .result-item {
    background: #f8fafc;
    padding: 12px;
    text-align: center;
    border: 4px solid var(--border);
    box-shadow: 4px 4px 0px var(--border);
  }
  .result-item .rlabel { font-size: 0.85rem; color: var(--text); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
  .result-item .rval {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    color: var(--accent2);
    text-shadow: 1px 1px 0px var(--border);
  }
  .tab-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .tab {
    padding: 10px 24px;
    border: 4px solid var(--border);
    background: #ffffff;
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
  }
  .tab.active {
    background: var(--accent);
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px var(--border);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .question {
    font-size: 1.2rem;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.5;
    font-weight: bold;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn {
    background: #ffffff;
    border: 3px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.1s;
    box-shadow: 4px 4px 0px var(--border);
  }
  .opt-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border); }
  .opt-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
  .opt-btn.correct { background: #a8e6cf; }
  .opt-btn.wrong { background: #ffafcc; }
  .feedback {
    margin-top: 14px;
    padding: 12px;
    border: 3px solid var(--border);
    font-size: 1rem;
    font-weight: bold;
    display: none;
    box-shadow: 4px 4px 0px var(--border);
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #a8e6cf; color: var(--text); }
  .feedback.bad { background: #ffafcc; color: var(--text); }
  .next-btn {
    margin-top: 14px;
    background: var(--accent2);
    border: 4px solid var(--border);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    padding: 12px 24px;
    cursor: pointer;
    display: none;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
    width: 100%;
  }
  .next-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
  .next-btn.show { display: inline-block; }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .score-badge {
    background: #ffffff;
    border: 3px solid var(--border);
    padding: 6px 14px;
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    color: var(--text);
    box-shadow: 3px 3px 0px var(--border);
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: #ffffff;
    border: 3px solid var(--border);
    margin: 0 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-right: 3px solid var(--border);
    transition: width 0.4s;
  }
  .victory { text-align: center; padding: 30px; display: none; }
  .victory.show { display: block; }
  .victory-title {
    font-family: 'VT323', monospace;
    font-size: 3rem;
    color: var(--accent);
    text-shadow: 3px 3px 0px var(--border);
    margin-bottom: 10px;
  }
  .stars { font-size: 3rem; margin: 10px 0; letter-spacing: 10px; }
  .restart-btn {
    margin-top: 16px;
    background: var(--gold);
    border: 4px solid var(--border);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 1.5rem;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 4px 4px 0px var(--border);
    text-transform: uppercase;
  }
  .restart-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border); }
  .info-box {
    background: #ffffff;
    border: 4px solid var(--border);
    padding: 16px;
    font-size: 1rem;
    color: var(--text);
    line-height: 1.6;
    box-shadow: 4px 4px 0px var(--border);
    margin-top: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
<h1><i class="fas fa-sync-alt"></i> FORCA QENDËRSYNUESE</h1>
<p class="subtitle">F_c = mv²/r &nbsp;|&nbsp; Lëvizja Rrethore</p>
<div class="tab-row">
  <button class="tab active" onclick="switchTab('sim',event)"><i class="fas fa-microscope"></i> Simulim</button>
  <button class="tab" onclick="switchTab('quiz',event)"><i class="fas fa-gamepad"></i> Kuiz</button>
</div>

<div class="panel active" id="panel-sim">
  <div class="card">
    <div class="scene">
      <canvas id="orbitCanvas" width="650" height="256" style="width:100%;height:100%;"></canvas>
    </div>
    <div class="formula-box">F_c = m × v² / r</div>
    <div class="slider-row">
      <label style="min-width:80px">Masa m (kg)</label>
      <input type="range" id="massSlider" min="1" max="20" value="5" oninput="updateSim()">
      <span class="val" id="massVal">5 kg</span>
    </div>
    <div class="slider-row">
      <label style="min-width:80px">Shpejtësia v (m/s)</label>
      <input type="range" id="velSlider" min="1" max="20" value="8" oninput="updateSim()">
      <span class="val" id="velVal">8 m/s</span>
    </div>
    <div class="slider-row">
      <label style="min-width:80px">Rrezja r (m)</label>
      <input type="range" id="radSlider" min="1" max="20" value="5" oninput="updateSim()">
      <span class="val" id="radVal">5 m</span>
    </div>
    <div class="results">
      <div class="result-item"><div class="rlabel">F_c (N)</div><div class="rval" id="r1">64 N</div></div>
      <div class="result-item"><div class="rlabel">Nxitimi (m/s²)</div><div class="rval" id="r2">12.8</div></div>
      <div class="result-item"><div class="rlabel">Perioda T (s)</div><div class="rval" id="r3">3.9 s</div></div>
    </div>
    <div class="info-box">
      <i class="fas fa-lightbulb" style="color:var(--accent2)"></i> <strong style="color:var(--text)">Kujdes:</strong> Fc nuk është forcë e re — rolin e Fc mund ta luajë forca e gravitetit (orbita), fërkimi (makina), ose tendosja (litari)!
    </div>
  </div>
</div>

<div class="panel" id="panel-quiz">
  <div class="card">
    <div class="score-row">
      <span class="score-badge"><i class="fas fa-star" style="color:#ffc8dd"></i> <span id="score">0</span></span>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <span class="score-badge"><span id="qnum">1</span>/7</span>
    </div>
    <div id="quiz-content">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">PYETJA TJETËR <i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="victory" id="victory">
      <div class="victory-title">🏆 BRAVO!</div>
      <div class="stars" id="stars"></div>
      <div style="font-family:'VT323',monospace;font-size:2rem;color:var(--text);margin-bottom:20px;">Pikë: <span id="finalScore" style="color:var(--accent);text-shadow:2px 2px 0px var(--border);"></span> / 7</div>
      <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> RISTART</button>
    </div>
  </div>
</div>

<script>
let angle=0, animID=null;

function drawOrbit() {
  const canvas = document.getElementById('orbitCanvas');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2;
  const r = parseFloat(document.getElementById('radSlider').value);
  const v = parseFloat(document.getElementById('velSlider').value);
  const m = parseFloat(document.getElementById('massSlider').value);
  const scaledR = Math.min(r*8, H/2-20);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#e2e8f0'; ctx.fillRect(0,0,W,H);

  // orbit path
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(cx,cy,scaledR,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // center dot
  ctx.fillStyle='#4a4e69'; ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(162, 210, 255, 0.2)'; ctx.beginPath(); ctx.arc(cx,cy,scaledR,0,Math.PI*2); ctx.fill();

  // moving object
  const ox = cx + scaledR*Math.cos(angle);
  const oy = cy + scaledR*Math.sin(angle);

  // centripetal arrow (toward center)
  const Fc = m*v*v/r;
  const arrowLen = Math.min(Fc*0.8, 60);
  const dx = cx-ox, dy = cy-oy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const nx = dx/dist, ny = dy/dist;
  ctx.strokeStyle='#ffafcc'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+nx*arrowLen,oy+ny*arrowLen); ctx.stroke();
  // arrowhead
  const ax=ox+nx*arrowLen, ay=oy+ny*arrowLen;
  const perp1x=-ny*8, perp1y=nx*8;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-nx*10+perp1x,ay-ny*10+perp1y); ctx.lineTo(ax-nx*10-perp1x,ay-ny*10-perp1y); ctx.closePath(); ctx.fillStyle='#ffafcc'; ctx.fill();

  // velocity arrow (tangential)
  const tvx=-Math.sin(angle)*30, tvy=Math.cos(angle)*30;
  ctx.strokeStyle='#a2d2ff'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+tvx,oy+tvy); ctx.stroke();

  // object
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(ox,oy,12,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#4a4e69'; ctx.lineWidth=4; ctx.stroke();

  // labels
  ctx.fillStyle='#ffafcc'; ctx.font='bold 14px VT323'; ctx.textAlign='left';
  ctx.fillText('Fc='+Fc.toFixed(1)+'N',ax+nx*5+8,ay+ny*5);
  ctx.fillStyle='#a2d2ff'; ctx.fillText('v='+v+'m/s',ox+tvx+5,oy+tvy-5);

  // angular velocity
  const omega = v / (r); // rad/s
  angle += omega * 0.016;
  animID = requestAnimationFrame(drawOrbit);
}

function updateSim() {
  const m = parseFloat(document.getElementById('massSlider').value);
  const v = parseFloat(document.getElementById('velSlider').value);
  const r = parseFloat(document.getElementById('radSlider').value);
  document.getElementById('massVal').textContent = m + ' kg';
  document.getElementById('velVal').textContent = v + ' m/s';
  document.getElementById('radVal').textContent = r + ' m';
  const Fc = m*v*v/r;
  const ac = v*v/r;
  const T = 2*Math.PI*r/v;
  document.getElementById('r1').textContent = Fc.toFixed(1) + ' N';
  document.getElementById('r2').textContent = ac.toFixed(2);
  document.getElementById('r3').textContent = T.toFixed(1) + ' s';
}

cancelAnimationFrame(animID);
drawOrbit();
updateSim();

const questions=[
  {q:"Formula e forcës qendërsynuese është:",opts:["Fc=mv/r","Fc=mv²/r","Fc=m²v/r","Fc=mgr"],ans:1},
  {q:"Drejtimi i Fc është gjithmonë:",opts:["Tangencial (përgjatë orbitës)","Drejt qendrës (radial)","Lart","Poshtë"],ans:1},
  {q:"Nëse shpejtësia dyfishohet, Fc:",opts:["Dyfishohet","Katërshohet","Mbetet e njëjtë","Përgjysmohet"],ans:1},
  {q:"Nëse rrezja dyfishohet (v,m të njëjta), Fc:",opts:["Dyfishohet","Katërshohet","Përgjysmohet","Mbetet e njëjtë"],ans:2},
  {q:"Cila forcë luan rolin e Fc për planetin që orbikon Diellin?",opts:["Forca e fërkimit","Forca elastike","Forca gravitacionale","Forca normale"],ans:2},
  {q:"m=2kg, v=10m/s, r=5m. Sa është Fc?",opts:["4 N","20 N","40 N","100 N"],ans:2},
  {q:"Fc nuk është forcë e re sepse:",opts:["Nuk ka drejtim","Rolin e saj e luan një forcë ekzistuese","Varet nga masa","Është zero"],ans:1}
];
let qi=0,score=0;
function loadQ() {
  const q=questions[qi];
  document.getElementById('question').textContent=(qi+1)+'. '+q.q;
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('qnum').textContent=qi+1;
  document.getElementById('progress').style.width=(qi/questions.length*100)+'%';
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=String.fromCharCode(65+i)+'. '+o;
    btn.onclick=()=>checkAns(i,btn);
    opts.appendChild(btn);
  });
}
function checkAns(i,btn) {
  const q=questions[qi];
  document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
  const fb=document.getElementById('feedback');
  if(i===q.ans){
    btn.className='opt-btn correct';score++;document.getElementById('score').textContent=score;
    fb.className='feedback ok show';fb.innerHTML='<i class="fas fa-check-circle"></i> Saktë!';
  }else{
    btn.className='opt-btn wrong';document.querySelectorAll('.opt-btn')[q.ans].className='opt-btn correct';
    fb.className='feedback bad show';fb.innerHTML='<i class="fas fa-times-circle"></i> Jo! Saktë: '+String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans];
  }
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQ() { qi++; if(qi>=questions.length){document.getElementById('quiz-content').style.display='none';document.getElementById('victory').className='victory show';document.getElementById('finalScore').textContent=score;document.getElementById('stars').textContent=score>=6?'⭐⭐⭐':score>=4?'⭐⭐':'⭐';}else loadQ(); }
function restartQuiz(){qi=0;score=0;document.getElementById('score').textContent=0;document.getElementById('victory').className='victory';document.getElementById('quiz-content').style.display='block';loadQ();}
function switchTab(t,e){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));e.target.classList.add('active');document.getElementById('panel-'+t).classList.add('active');}
loadQ();
</script>
</body>
</html>
